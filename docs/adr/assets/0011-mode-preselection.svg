<svg width="100%" viewBox="0 0 680 462" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Skizze 2 — Voreinstellung des Modus, wenn noch nichts gespeichert ist</title>
<desc>Beim ersten Öffnen entscheidet ein gespeicherter Wert bzw. ein Wire-Scan, welcher Zielquellen-Modus vorausgewählt wird; danach gilt die gespeicherte Absicht. Wire-Ausgang ist kräftig blau, Route-Ausgang kräftig lila.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
 text{font-family:ui-sans-serif,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
 .t{font-size:14px;fill:#2c2c2a}.ts{font-size:12px;fill:#5f5e5a}.th{font-size:14px;font-weight:500;fill:#2c2c2a}
 .twh{fill:#fff;font-size:14px;font-weight:500}.tws{fill:#eef0ff;font-size:12px}
 .box-n{fill:#f4f2ec;stroke:#cbc8be;stroke-width:.5}
 .arr{stroke:#5f5e5a;stroke-width:1.5;fill:none}
 @media (prefers-color-scheme:dark){
  .t,.th{fill:#e9e7e0}.ts{fill:#b4b2a9}.box-n{fill:#2f2f2b;stroke:#5f5e5a}.arr{stroke:#b4b2a9}
 }
</style>
<text class="th" x="40" y="30">Skizze 2 — Voreinstellung des Modus (nur wenn noch nichts gespeichert)</text>

<rect class="box-n" x="250" y="50" width="200" height="44" rx="6"/>
<text class="t" x="350" y="77" text-anchor="middle">Panel geöffnet</text>
<line class="arr" x1="350" y1="94" x2="350" y2="118" marker-end="url(#arrow)"/>

<rect class="box-n" x="250" y="120" width="200" height="44" rx="6"/>
<text class="t" x="350" y="147" text-anchor="middle">targetMode schon gespeichert?</text>

<line class="arr" x1="450" y1="142" x2="486" y2="142" marker-end="url(#arrow)"/>
<text class="ts" x="468" y="134" text-anchor="middle">ja</text>
<rect class="box-n" x="488" y="112" width="152" height="60" rx="6"/>
<text class="ts" x="564" y="136" text-anchor="middle">Gespeicherte Absicht gilt.</text>
<text class="ts" x="564" y="152" text-anchor="middle">Canvas-Wire-Änderung</text>
<text class="ts" x="564" y="166" text-anchor="middle">schaltet NICHT um.</text>

<line class="arr" x1="350" y1="164" x2="350" y2="194" marker-end="url(#arrow)"/>
<text class="ts" x="364" y="183" text-anchor="start">nein</text>

<rect class="box-n" x="250" y="196" width="200" height="58" rx="6"/>
<text class="t" x="350" y="219" text-anchor="middle">Wire-Scan</text>
<text class="ts" x="350" y="237" text-anchor="middle">ausgehende Wires transitiv folgen</text>
<line class="arr" x1="350" y1="254" x2="350" y2="278" marker-end="url(#arrow)"/>

<rect class="box-n" x="250" y="280" width="200" height="44" rx="6"/>
<text class="t" x="350" y="307" text-anchor="middle">≥ 1 ui-route erreichbar?</text>

<line class="arr" x1="300" y1="324" x2="216" y2="376" marker-end="url(#arrow)"/>
<text class="ts" x="240" y="352" text-anchor="middle">ja</text>
<rect x="100" y="378" width="220" height="60" rx="6" fill="#185FA5"/>
<text class="twh" x="210" y="403" text-anchor="middle">Modus »via Wire«</text>
<text class="tws" x="210" y="423" text-anchor="middle">blau · Stecker-Badge</text>

<line class="arr" x1="400" y1="324" x2="484" y2="376" marker-end="url(#arrow)"/>
<text class="ts" x="460" y="352" text-anchor="middle">nein</text>
<rect x="380" y="378" width="220" height="60" rx="6" fill="#534AB7"/>
<text class="twh" x="490" y="403" text-anchor="middle">Modus »Route«</text>
<text class="tws" x="490" y="423" text-anchor="middle">lila · Ketten-Badge</text>
</svg>
