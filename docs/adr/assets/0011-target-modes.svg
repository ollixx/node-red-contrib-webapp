<svg width="100%" viewBox="0 0 680 256" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Skizze 1 — die drei Zielquellen-Modi von ui-action</title>
<desc>Derselbe ui-action-Knoten in den Modi via Wire (blau), Route (lila) und URL (neutral); immer genau einer ist aktiv, der Modus-Switch zeigt das aktive Segment als kräftige Vollfläche.</desc>
<style>
 text{font-family:ui-sans-serif,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
 .t{font-size:14px;fill:#2c2c2a}.ts{font-size:12px;fill:#5f5e5a}.th{font-size:14px;font-weight:500;fill:#2c2c2a}
 .tw{fill:#fff;font-size:12px}.twh{fill:#fff;font-size:12px;font-weight:500}
 .card{fill:#fff;stroke:#d8d5cc;stroke-width:.5}
 .box-n{fill:#f4f2ec;stroke:#cbc8be;stroke-width:.5}
 .seg{fill:none;stroke:#cbc8be;stroke-width:.5}
 @media (prefers-color-scheme:dark){
  .t,.th{fill:#e9e7e0}.ts{fill:#b4b2a9}
  .card{fill:#26261f;stroke:#4a4a45}.box-n{fill:#2f2f2b;stroke:#5f5e5a}.seg{stroke:#5f5e5a}
 }
</style>
<text class="th" x="40" y="26">Skizze 1 — die drei Zielquellen-Modi (immer genau einer aktiv)</text>

<!-- ============ A: WIRE ============ -->
<rect class="card" x="40" y="46" width="188" height="196" rx="8"/>
<text class="ts" x="54" y="68">ui-action · Navigation</text>
<rect class="seg" x="54" y="80" width="160" height="24" rx="5"/>
<rect x="55.5" y="81.5" width="50.3" height="21" rx="3" fill="#185FA5"/>
<line class="seg" x1="107.3" y1="80" x2="107.3" y2="104"/>
<line class="seg" x1="160.7" y1="80" x2="160.7" y2="104"/>
<text class="twh" x="80.7" y="96" text-anchor="middle">Wire</text>
<text class="ts" x="134" y="96" text-anchor="middle">Route</text>
<text class="ts" x="187.3" y="96" text-anchor="middle">URL</text>
<rect x="54" y="118" width="104" height="22" rx="11" fill="#185FA5"/>
<circle cx="64" cy="129" r="2" fill="#fff"/><line x1="66" y1="129" x2="73" y2="129" stroke="#fff" stroke-width="1.5"/><circle cx="75" cy="129" r="2" fill="#fff"/>
<text class="twh" x="82" y="133">via Wire</text>
<text class="t" x="54" y="164">→ /customers/:id</text>
<text class="ts" x="54" y="184">Param :id ← msg payload.id</text>
<text class="ts" x="54" y="222">Ziel &amp; Werte aus der Verdrahtung</text>

<!-- ============ B: ROUTE ============ -->
<rect class="card" x="246" y="46" width="188" height="196" rx="8"/>
<text class="ts" x="260" y="68">ui-action · Navigation</text>
<rect class="seg" x="260" y="80" width="160" height="24" rx="5"/>
<rect x="314.8" y="81.5" width="50.3" height="21" rx="3" fill="#534AB7"/>
<line class="seg" x1="313.3" y1="80" x2="313.3" y2="104"/>
<line class="seg" x1="366.7" y1="80" x2="366.7" y2="104"/>
<text class="ts" x="286.7" y="96" text-anchor="middle">Wire</text>
<text class="twh" x="340" y="96" text-anchor="middle">Route</text>
<text class="ts" x="393.3" y="96" text-anchor="middle">URL</text>
<rect x="260" y="118" width="104" height="22" rx="11" fill="#534AB7"/>
<ellipse cx="270" cy="129" rx="4" ry="2.6" fill="none" stroke="#fff" stroke-width="1.2"/><ellipse cx="276" cy="129" rx="4" ry="2.6" fill="none" stroke="#fff" stroke-width="1.2"/>
<text class="twh" x="285" y="133">Referenz</text>
<text class="t" x="260" y="164">/customers/:id  (gewählt)</text>
<text class="ts" x="260" y="184">Param :id ← jsonata</text>
<text class="ts" x="260" y="222">Platzhalter fix vorgegeben</text>

<!-- ============ C: URL ============ -->
<rect class="card" x="452" y="46" width="188" height="196" rx="8"/>
<text class="ts" x="466" y="68">ui-action · Navigation</text>
<rect class="seg" x="466" y="80" width="160" height="24" rx="5"/>
<rect x="574.2" y="81.5" width="50.3" height="21" rx="3" fill="#5f5e5a"/>
<line class="seg" x1="519.3" y1="80" x2="519.3" y2="104"/>
<line class="seg" x1="572.7" y1="80" x2="572.7" y2="104"/>
<text class="ts" x="492.7" y="96" text-anchor="middle">Wire</text>
<text class="ts" x="546" y="96" text-anchor="middle">Route</text>
<text class="twh" x="599.3" y="96" text-anchor="middle">URL</text>
<rect x="466" y="118" width="84" height="22" rx="11" fill="#5f5e5a"/>
<circle cx="477" cy="129" r="5" fill="none" stroke="#fff" stroke-width="1"/><line x1="472" y1="129" x2="482" y2="129" stroke="#fff" stroke-width="1"/><ellipse cx="477" cy="129" rx="2.4" ry="5" fill="none" stroke="#fff" stroke-width="1"/>
<text class="twh" x="488" y="133">URL</text>
<text class="t" x="466" y="164">URL per jsonata</text>
<text class="ts" x="466" y="184">"/customers/" &amp; payload.id</text>
<text class="ts" x="466" y="222">— keine Parameter-Sektion —</text>
</svg>
