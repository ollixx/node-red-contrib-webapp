<svg width="100%" viewBox="0 0 680 244" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Skizze 1 — die drei Zielquellen-Modi von ui-action</title>
<desc>Derselbe ui-action-Navigations-Panel in den Modi via Wire (blau), Route (lila) und URL (neutral). Der Panel-Hintergrund trägt die Modus-Farbe; der Modus-Switch zeigt Icon und Label je Button; das aktive Segment ist weiß hervorgehoben. Keine zusätzlichen Badges, nur eine schlichte Überschrift.</desc>
<style>
 text{font-family:ui-sans-serif,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
 .th{font-size:14px;font-weight:500;fill:#2c2c2a}
 .t{font-size:13px;fill:#2c2c2a}.ts{font-size:12px;fill:#5f5e5a}
 .hd{font-size:14px;font-weight:500;fill:#fff}
 .seglbl{font-size:11px}
 .inset{fill:#fff;stroke:none}
 @media (prefers-color-scheme:dark){ .th{fill:#e9e7e0} }
</style>
<text class="th" x="40" y="26">Skizze 1 — drei Modi: Panel-Hintergrund = Modus-Farbe, Icon im Switch</text>

<!-- ============ A: WIRE (blau) ============ -->
<rect x="40" y="44" width="188" height="182" rx="8" fill="#185FA5"/>
<rect x="52" y="55" width="50.7" height="22" rx="4" fill="#fff"/>
<circle cx="60" cy="66" r="1.7" fill="#185FA5"/><line x1="62" y1="66" x2="69" y2="66" stroke="#185FA5" stroke-width="1.4"/><circle cx="71" cy="66" r="1.7" fill="#185FA5"/>
<text class="seglbl" x="75" y="70" fill="#185FA5">Wire</text>
<circle cx="114.7" cy="66" r="1.7" fill="#fff" fill-opacity=".8"/><line x1="116.7" y1="66" x2="123.7" y2="66" stroke="#fff" stroke-width="1.4" stroke-opacity=".8"/><circle cx="125.7" cy="66" r="1.7" fill="#fff" fill-opacity=".8"/>
<text class="seglbl" x="129.7" y="70" fill="#fff" fill-opacity=".8">Route</text>
<circle cx="169.3" cy="66" r="3" fill="none" stroke="#fff" stroke-width="1" stroke-opacity=".8"/><line x1="166.3" y1="66" x2="172.3" y2="66" stroke="#fff" stroke-width="1" stroke-opacity=".8"/>
<text class="seglbl" x="176" y="70" fill="#fff" fill-opacity=".8">URL</text>
<text class="hd" x="52" y="100">Ziel: via Wire</text>
<rect class="inset" x="52" y="110" width="164" height="100" rx="6"/>
<text class="t" x="62" y="134">→ /customers/:id</text>
<text class="ts" x="62" y="156">Param :id</text>
<text class="ts" x="62" y="174">← msg payload.id</text>
<text class="ts" x="62" y="198">Scan füllt vor</text>

<!-- ============ B: ROUTE (lila) ============ -->
<rect x="246" y="44" width="188" height="182" rx="8" fill="#534AB7"/>
<circle cx="266" cy="66" r="1.7" fill="#fff" fill-opacity=".8"/><line x1="268" y1="66" x2="275" y2="66" stroke="#fff" stroke-width="1.4" stroke-opacity=".8"/><circle cx="277" cy="66" r="1.7" fill="#fff" fill-opacity=".8"/>
<text class="seglbl" x="281" y="70" fill="#fff" fill-opacity=".8">Wire</text>
<rect x="306.7" y="55" width="50.7" height="22" rx="4" fill="#fff"/>
<ellipse cx="316" cy="66" rx="3" ry="1.9" fill="none" stroke="#534AB7" stroke-width="1.2"/><ellipse cx="320.5" cy="66" rx="3" ry="1.9" fill="none" stroke="#534AB7" stroke-width="1.2"/>
<text class="seglbl" x="326" y="70" fill="#534AB7">Route</text>
<circle cx="375.3" cy="66" r="3" fill="none" stroke="#fff" stroke-width="1" stroke-opacity=".8"/><line x1="372.3" y1="66" x2="378.3" y2="66" stroke="#fff" stroke-width="1" stroke-opacity=".8"/>
<text class="seglbl" x="382" y="70" fill="#fff" fill-opacity=".8">URL</text>
<text class="hd" x="258" y="100">Ziel: Referenz</text>
<rect class="inset" x="258" y="110" width="164" height="100" rx="6"/>
<text class="t" x="268" y="134">/customers/:id</text>
<text class="ts" x="268" y="156">Param :id</text>
<text class="ts" x="268" y="174">← jsonata</text>
<text class="ts" x="268" y="198">Platzhalter fix</text>

<!-- ============ C: URL (neutral) ============ -->
<rect x="452" y="44" width="188" height="182" rx="8" fill="#5f5e5a"/>
<circle cx="472" cy="66" r="1.7" fill="#fff" fill-opacity=".8"/><line x1="474" y1="66" x2="481" y2="66" stroke="#fff" stroke-width="1.4" stroke-opacity=".8"/><circle cx="483" cy="66" r="1.7" fill="#fff" fill-opacity=".8"/>
<text class="seglbl" x="487" y="70" fill="#fff" fill-opacity=".8">Wire</text>
<ellipse cx="526.7" cy="66" rx="3" ry="1.9" fill="none" stroke="#fff" stroke-width="1.2" stroke-opacity=".8"/><ellipse cx="531.2" cy="66" rx="3" ry="1.9" fill="none" stroke="#fff" stroke-width="1.2" stroke-opacity=".8"/>
<text class="seglbl" x="537" y="70" fill="#fff" fill-opacity=".8">Route</text>
<rect x="561.3" y="55" width="50.7" height="22" rx="4" fill="#fff"/>
<circle cx="571.3" cy="66" r="3" fill="none" stroke="#5f5e5a" stroke-width="1"/><line x1="568.3" y1="66" x2="574.3" y2="66" stroke="#5f5e5a" stroke-width="1"/>
<text class="seglbl" x="578" y="70" fill="#5f5e5a">URL</text>
<text class="hd" x="464" y="100">Ziel: URL</text>
<rect class="inset" x="464" y="110" width="164" height="100" rx="6"/>
<text class="t" x="474" y="134">URL per jsonata</text>
<text class="ts" x="474" y="156">"/customers/"</text>
<text class="ts" x="474" y="174">&amp; payload.id</text>
<text class="ts" x="474" y="198">keine Parameter</text>
</svg>
