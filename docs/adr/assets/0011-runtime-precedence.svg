<svg width="100%" viewBox="0 0 680 400" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Skizze 3 — Laufzeit-Vorrang: empfangende Route gewinnt im Wire-Modus, adressierte Navigation gewinnt sonst</title>
<desc>Im Wire-Modus baut die Route, bei der die Nachricht ankommt, die Location. Im Route/URL-Modus trägt die Nachricht ein explizites Ziel, das eine verdrahtete Route durchreicht statt es zu kapern. ui-action ist je nach Weg kräftig blau oder lila.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>
 text{font-family:ui-sans-serif,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
 .t{font-size:14px;fill:#2c2c2a}.ts{font-size:12px;fill:#5f5e5a}.th{font-size:14px;font-weight:500;fill:#2c2c2a}
 .twh{fill:#fff;font-size:14px;font-weight:500}.tws{fill:#eef0ff;font-size:12px}
 .box-n{fill:#f4f2ec;stroke:#cbc8be;stroke-width:.5}
 .region{fill:none;stroke:#cbc8be;stroke-width:.5;stroke-dasharray:5 4}
 @media (prefers-color-scheme:dark){
  .t,.th{fill:#e9e7e0}.ts{fill:#b4b2a9}.box-n{fill:#2f2f2b;stroke:#5f5e5a}.region{stroke:#5f5e5a}
 }
</style>
<text class="th" x="40" y="28">Skizze 3 — Laufzeit: beide Wege koexistieren wohldefiniert</text>

<!-- Scenario 1: wire -->
<rect class="region" x="40" y="48" width="600" height="150" rx="8"/>
<text class="th" x="56" y="70">Modus »via Wire« — die empfangende Route gewinnt</text>
<rect x="56" y="92" width="130" height="44" rx="6" fill="#185FA5"/>
<text class="twh" x="121" y="113" text-anchor="middle">ui-action</text>
<text class="tws" x="121" y="129" text-anchor="middle">kein Ziel in msg</text>
<rect class="box-n" x="250" y="92" width="90" height="44" rx="6"/>
<text class="t" x="295" y="119" text-anchor="middle">switch</text>
<rect class="box-n" x="430" y="72" width="180" height="38" rx="6"/>
<text class="t" x="520" y="95" text-anchor="middle">ui-route /a  ✓ aktiv</text>
<rect class="box-n" x="430" y="120" width="180" height="38" rx="6"/>
<text class="t" x="520" y="143" text-anchor="middle">ui-route /b</text>
<line x1="186" y1="114" x2="246" y2="114" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="110" x2="426" y2="91" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="120" x2="426" y2="139" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="56" y="184">Die Route, bei der die msg ankommt, baut die Location — Verzweigung = bedingte Navigation.</text>

<!-- Scenario 2: route/url -->
<rect class="region" x="40" y="222" width="600" height="158" rx="8"/>
<text class="th" x="56" y="244">Modus »Route« / »URL« — adressierte Navigation gewinnt</text>
<rect x="56" y="266" width="150" height="56" rx="6" fill="#534AB7"/>
<text class="twh" x="131" y="289" text-anchor="middle">ui-action</text>
<text class="tws" x="131" y="307" text-anchor="middle">Ziel = /customers/42</text>
<rect class="box-n" x="288" y="270" width="150" height="52" rx="6"/>
<text class="t" x="363" y="291" text-anchor="middle">ui-route /other</text>
<text class="ts" x="363" y="309" text-anchor="middle">reicht durch</text>
<rect class="box-n" x="500" y="270" width="120" height="52" rx="6"/>
<text class="t" x="560" y="291" text-anchor="middle">Client</text>
<text class="ts" x="560" y="309" text-anchor="middle">→ /customers/42</text>
<line x1="206" y1="294" x2="284" y2="294" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="245" y="286" text-anchor="middle">msg: Ziel</text>
<line x1="438" y1="296" x2="496" y2="296" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="56" y="360">Explizites Ziel gewinnt; die verdrahtete Route kapert es nicht (setzt keinen eigenen Pfad darauf).</text>
</svg>
