    validation:
      - pnpm test passes with no failures
      - "pnpm exec playwright test passes — list/detail/create/edit/delete all work end-to-end, driven by the wired flow (the runtime performs no CRUD)"
      - "structural check: examples/customers-crud/flow.json has non-empty wires connecting UI node outputs to function/store/action nodes"
      - "grep check: nodes/webapp.js contains no 'customer'/'/customers' identifiers (already true after P27, re-asserted here)"
      - "manual: the owner confirms in the browser that create/edit/delete work AND that the behaviour is produced solely by the flow's wiring (deleting the function nodes breaks CRUD, proving the logic lives in the flow)"

  - id: P30
    title: Real Client→Server events — UI nodes emit msg out their output port
    status: done
    dependencies: [P29]
    summary:
      delivered: "User interaction now emits a real Node-RED event on the originating UI node's OUTPUT port, per docs/nodes/concepts/events.md — the browser reports WHAT HAPPENED and never names or runs an action. Added dispatchClientEvent to nodes/webapp.js: it ingests a raw event {clientId, event, sourceId, params}, routes it to the originating node via RED.nodes.getNode(sourceId), and emits msg.ui {appId, clientId, event, sourceId, params} on that node's output port — the runtime takes no domain action (no preview mutation, no event→action link). For rowSelect/rowAction it enriches params.row from a read-only snapshot render. POST /webapp/:appId/event was repurposed from action-dispatch to event-ingest (the old applyPreviewAction call and actionId requirement are gone; it now echoes the emitted message + the current unchanged snapshot). The shared serializer now tags every enabled button with click reporting independent of any action, table rows with rowSelect, and every value control wrapper with data-webapp-source + data-webapp-event=change; the thin client sends the raw event shape with a per-tab clientId and has both a click and a change listener."
      stats: "5 src/asset files (webapp.js, webapp-serializer.js, webapp-client.js + 2 e2e specs rewritten), 1 new unit suite (p30-client-events, 6 tests). Unit suite: 178 tests across 19 files, 0 failures. pnpm validate (build+lint+test+roadmap) green."
      notes: "dispatchClientEvent is event-type agnostic — it emits whatever event the browser reports for any node with a send(), so the full documented catalogue (click/rowSelect/rowAction/change/onEnter/onLeave/onOpen/onClose) is supported by construction; a unit case locks change/onEnter/onLeave routing. Browser-side onEnter/onLeave/onOpen/onClose are NOT yet emitted because the thin client has no SPA router (navigation is still full-page, dialogs open via ?dialog=); wiring those lifecycle emitters belongs with the live channel in P31. data-webapp-action is still emitted on buttons/rows for the legacy no-JS GET fallback (removed in P32); the preview endpoints (/snapshot, /events, /reset, /action/:actionId) and applyPreviewAction also remain for P31/P32 to dismantle. The P22 + customers-crud E2E specs encoded the now-removed preview-action round-trip (click→runtime opens dialog) and were rewritten to assert the P30 contract at the network level: a click POSTs {clientId,event,sourceId} with no actionId and mutates no runtime state. 8 unrelated E2E failures (p16d/parent-selector/editor-mount-options editor-registration timing + p21 detail-route content) remain — confirmed present on the clean pre-P30 baseline via stash+rebuild, out of this phase's scope (see friction-log)."
    goals:
      - Make user interaction emit a real Node-RED event message out of the originating UI node's output port into the flow, per docs/nodes/concepts/events.md — the browser reports WHAT HAPPENED; it never names or runs an action. There is no automatic event→action link; the flow decides.
    deliverables:
      - "the browser transport sends a raw event {appId, clientId, event, sourceId, params} (events.md message format) — NOT an actionId to execute"
      - "the runtime routes that event to the originating node and emits msg.ui on that node's output port into the wired flow (reuse the existing input-handler plumbing in reverse); the runtime takes no domain action itself"
      - "ui-button, ui-input, ui-table (rowSelect/rowAction), ui-select/checkbox/radio/slider/switch (change), ui-dialog (onOpen/onClose) and ui-route (onEnter/onLeave) emit their documented event types with the documented params"
      - "the /event endpoint is repurposed (or replaced) to mean 'ingest a client event', with the action-dispatch semantics fully gone"
    validation:
      - pnpm test passes with no failures
      - "unit test: a click on a wired ui-button emits msg.ui {event:'click', sourceId, clientId, appId} on its output port and triggers NO state change in the runtime"
      - "unit test: a ui-table row select emits {event:'rowSelect', params:{rowId,row}} on the output port"
      - "integration test: with no downstream wiring, a client event produces an output message and nothing else (the flow is the only place that could react)"

  - id: P31
    title: Live Server→Client transport — push store/action updates to clients
    status: done
    dependencies: [P30]
    summary:
      delivered: "A one-directional Server-Sent Events channel (GET /webapp/:appId/stream) pushes flow-driven ui-store snapshot updates and ui-action interaction commands to connected browsers in real time, honouring msg.ui.clientId targeting and the P15 per-client state model. The served page renders from real node state via the P26 serializer and re-renders on pushes via the keyed morph — no client poll. The browser subscribes with a native EventSource (auto-reconnect; the server re-pushes the snapshot on every (re)connect, subsuming P15 reconnect-sync)."
      stats: "1 SSE endpoint + push apparatus in nodes/webapp.js, EventSource client in webapp-client.js, ADR 0003 transport decision, 8 runtime integration tests + 3 active e2e specs, 1 wired fixture flow"
      notes: "Transport decision (ADR 0003 #5): SSE chosen over Node-RED's RED.comms (rides the editor/admin websocket — only reaches authenticated editor sessions, not anonymous deployed-app pages, and has no per-recipient addressing for clientId targeting) and over a dedicated raw ws channel (new dependency + bidirectional plumbing we do not need — client→server is already POST /event from P30). Two bugs found during manual verification: (1) runtimeState.RED was only set by the legacy registerWebappNodes factory, but nodes self-register via registerNodeType, so RED was undefined when the ui-store handler ran and the push silently no-opped — RED is now captured in registerNodeType; (2) the thin client still applied the /event response snapshot, which raced and clobbered the live push with stale pre-reaction state — the event POST is now fire-and-report only, the SSE stream is the single source of re-renders. previewState remains the live shared state mutated by flow messages — removing it as an independent simulation is P32. A navigate command updates the subscriber's stored stream location so later snapshot pushes render the right page. Pre-existing unrelated E2E failures (p12/p13/p15/p16d/parent-selector/editor-mount-options editor-registration timing, p21/p23 detail-route content) persist from the P30 baseline and are out of this phase's scope (confirmed by checking out the P30 runtime and re-running)."
    goals:
      - Replace the request/response preview with a real live channel so that when the wired flow feeds ui-store/ui-query (data) or ui-action (interaction), connected browsers update in real time. State lives in the real node runtime (fed by flow messages), not in a runtime-owned preview simulation.
      - "DECISION REQUIRED in this phase: pick the push transport (Node-RED's built-in RED.comms websocket vs. a dedicated ws/SSE channel) and record it in ADR 0003 — recorded as SSE (decision 5)."
    deliverables:
      - "a Server→Client push channel: ui-store/ui-query state updates (from flow input handlers) and ui-action interaction commands are serialised and pushed to the relevant client(s), honouring msg.ui.clientId targeting and the multi-user/per-client state model (P15)"
      - "the served page renders from the real current node state (ui-store/ui-query) using the P26 shared serializer, and re-renders on pushed updates via the existing keyed morph"
      - "app state source of truth = the runtime node state mutated only by flow messages — no previewState/previewQueries as an independent simulation"
    validation:
      - pnpm test passes with no failures
      - "integration test: a msg sent into a ui-store input handler results in a push to a subscribed client and a re-render reflecting the new data (no client POST involved)"
      - "integration test: a ui-action (navigate/openDialog) triggered from the flow pushes the interaction command and the client applies it"
      - "integration test: clientId targeting — an action addressed to one client does not affect another connected client"
      - "manual: two browser tabs; a flow-driven store update appears live in both (or the targeted one) without reload"
    archived_at: "2026-05-31"

  - id: P32
    title: Remove the preview rendering apparatus entirely
    status: done
    dependencies: [P31]
    summary:
      delivered: "Removed all preview-simulation code from nodes/webapp.js: deleted applyPreviewAction, previewState/previewQueries/previewMessages maps, seedQueryDataFromConfig, getPreviewQueries, getPreviewMessages, resetPreview, rememberPreviewMessage, parsePreviewData, buildActionHref, and the /snapshot, /events, /reset, /action/:actionId HTTP endpoints. Replaced the shared previewState broadcast store with runtimeState.liveState (same semantics, honest name — no longer called 'preview'). Removed previewData from queryDefinitionSchema (packages/schema contracts + node-definitions), from the customers fixture, and from the runtime node-set assembly. Updated docs/nodes/concepts/messages.md to describe the live SSE transport instead of the snapshot/preview transport. Rewrote affected unit and E2E tests to remove preview-only assertions."
      stats: "15 files changed (nodes/webapp.js -200+ lines, 5 test files rewritten, 2 schema files, 1 fixtures file, 1 runtime src file, 2 E2E specs updated, messages.md rewritten). Unit suite: 174 tests, 0 failures. pnpm validate (roadmap+lint+test+build) green. E2E: 18 failed (down from 20 pre-P32), 18 passed."
      notes: "runtimeState.previewState renamed to runtimeState.liveState — semantically the same broadcast state, just no longer named 'preview'. The previewData field is removed from webapp.js mapConfig and from the schema's QueryDefinition; ui-query nodes in the codebase no longer carry seed data (P33 will push real data from a wired flow). The /event endpoint is kept (P30) and still returns a snapshot in its response for thin-client consistency between pushes, but /snapshot as a standalone GET is gone. The schema's queryDefinitionSchema.previewData removal was accompanied by removing the field from the fixture and from node-set.ts mapping. E2E improvement: customers-crud test updated to not expect previewData rows (checks table presence only); the 2 fewer failures vs pre-P32 confirm the removal worked correctly."
    goals:
      - Delete the preview simulation now that the live path (P30 events out, P31 live push) exists. The runtime must no longer simulate a backend or hold a parallel preview state.
    deliverables:
      - "delete applyPreviewAction, the previewState/previewQueries simulation, the preview message feed, and the related helpers from nodes/webapp.js"
      - "remove the preview HTTP endpoints that are now obsolete: GET /snapshot, the action-dispatch /event behaviour, GET /reset, GET /events, GET /action/:actionId (keep only what the live transport and initial page load require)"
      - "remove preview-only fields/fixtures from packages/schema and the renderer (e.g. ui-query previewData as a runtime backend source) — demo/seed data, if any remains, is clearly marked editor-preview-only and never drives the served app"
      - "remove preview-specific docs and update concepts/messages.md to describe the live event/action/transport model only"
    validation:
      - pnpm test passes with no failures
      - "grep check: no 'preview' simulation remains in nodes/webapp.js (no applyPreviewAction, previewState, previewQueries)"
      - "the dev app still loads and renders the current node state via the live transport (no /snapshot dependency)"
      - "doc check: messages.md no longer documents the snapshot/preview transport"
    archived_at: "2026-06-01"

