  - id: P66
    title: "ui-action/ui-route Navigation — 2 Szenarien (wired-route mit params / pfad-typedInput mit JSONata) + onEnter immer + Mehrdeutigkeits-Validierung + ui-app implizite Root-Route (gleiches Verhalten)"
    status: done
    dependencies: [P60]
    summary:
      delivered: "ui-action navigate redesigned (ADR 0007 Amendment): Scenario 1 (wired to a ui-route/ui-app — params fill the route's own path, no `to`) and Scenario 2 (`to` typedInput str/msg/flow/global/jsonata resolved app-global at the ui-app); onEnter/onLeave emitted on route entry/leave in BOTH scenarios; ui-app gains onEnter/onLeave for its implicit root route and treats a wired navigate-action like a ui-route (navigate to '/'); deploy-time cross-validation in webapp.js (ambiguous = wired AND `to` set / no-destination / dead static link to a non-existent route); ui-route and ui-app share one navigate code path (DRY)."
      stats: "14 files changed (2 new tests) +782/-20; schema 152→159, runtime 276→294 (+18 P66 tests); ADR 0007 + ui-action.md + ui-app.md updated; new E2E p66-navigation.spec.ts. Plus follow-up P66-fix: typedInput-aware E2E helpers (tests/helpers/node-editor-page.ts) + behavior-state.spec.ts update."
      notes: >
        `to`+`toType`+`params` added to schema/mapConfig; JSONata context is the full msg
        (RED.util.prepareJSONataExpression/evaluateJSONataExpression; msg/flow/global via
        evaluateNodeProperty). ADR 0007 extended with a P66 Amendment (not a new ADR). Renderer needed no change
        (runtime owns navigate; existing route-param resolution already covered). Latent ui-app.html bug fixed
        incidentally (registerNodeTypeWithEvents was called with no availableEvents). gen:example produced a
        byte-identical flow.json (new fields unused by the example). ORCHESTRATOR VERIFICATION: first post-merge
        E2E showed 6 stale-dist failures (dist is gitignored — must pnpm build after merge), then a deterministic
        behavior-state:17 regression because P66 made `to` a typedInput and that older test drove it as a plain
        input — fixed via phase/P66-fix (typedInput-aware helpers, no editor bug; editor persists the value
        correctly). The p12/p13/p15/parent-selector editor-registration failures seen transiently were
        PRE-EXISTING shared-server parallel-run flakiness (pass in isolation; clean on full re-run), not P66.
        Final full E2E on develop: 267 passed / 0 failed.
      cost: "session ~28m (impl) + P66-fix session a088cefb6b3fe503a ~3m; orchestrator: merge + rebuild + full E2E (267) + diagnosis of stale-dist & flakiness"
    goals:
      - "Two navigate usage scenarios: (1) ui-action wired to a ui-route via output port, params fill the route's own path; (2) unwired, `to` typedInput resolved app-global at the ui-app."
      - "onEnter emitted on every route entry (both scenarios), decoupled from the navigation mechanism; ui-app implicit root route gets the same behaviour incl. onEnter/onLeave."
      - "Ambiguity/dead-link validation at compile/deploy time (the wire is invisible to per-node editor validation)."
    deliverables:
      - "schema: ui-action `to`/`toType` (typedInput) + `params`; ui-app events enum +onEnter/onLeave; validation refinement (contracts.ts/node-definitions.ts)."
      - "nodes/behavior/ui-action.html: `to` typedInput (str/msg/flow/global/jsonata) + params key/value editor + navigate-conditional UI; ui-app.html events list."
      - "webapp.js: resolveActionTo/resolveNavigateLocation/performTargetNavigate/validateNavigationFlow; shared ui-route+ui-app navigate path; deploy-time cross-checks."
      - "ADR 0007 P66 Amendment; ui-action.md + ui-app.md updated; ui-navigation deprecation continued."
      - "Tests: schema, editor, runtime (S1 wired-route, S2 app-global, validation errors), E2E p66-navigation.spec.ts; typedInput-aware E2E helpers."
    validation:
      - "pnpm validate green (schema 159 / runtime 294)."
      - "Full E2E on develop after rebuild: 267 passed / 0 failed (incl. p66-navigation Scenario 1/2 + onEnter-with-params, and the fixed behavior-state ui-action editor test)."
      - "Deploy-time validation rejects ambiguous (wired + `to`), no-destination, and dead-static-link navigate configs."

  - id: P68
    title: "Einheitlicher Node-Picker-Dialog (Scroll + Contains-Suche über Name/ID/Typ, Default-Filter-Presets) für ALLE ui-*-Auswahlen (parents, references, mount, stores, routes, actions)"
    status: done
    dependencies: [P19]
    summary:
      delivered: "One reusable node-picker dialog in resources/lib/editor-common.js for every ui-* node selection — a 'list' button injected next to each bound <select> opens an admin-UI modal (no Shoelace) with a scrollable candidate list and case-insensitive contains-search over name, id AND node type; the per-field DEFAULT filter is a pure preset (apps/routes/actions/stores). Picking writes the id back to the <select>; values stay IDs, save round-trip unchanged, zero per-node HTML churn."
      stats: "1 source file (resources/lib/editor-common.js, +~292 lines) + 1 new E2E spec (tests/e2e/nodes/editor/node-picker.spec.ts, 3 tests); ~5 new public exports (nodePickerMatch, nodePickerPresets, nodePickerOptionsForPreset, openNodePickerDialog, enhanceSelectWithPicker); no new node types, no schema change, no gen:example."
      notes: >
        In-place <select> enhancement (enhanceSelectWithPicker) wired into installParentAppSelector +
        installReferenceSelectors (route/action/store) — installer signatures kept, so no node HTML edits and
        the bound select stays the round-trip source of truth. Open design points resolved per the phase plan:
        mount stays the existing slot-tree (setSelectOptionsTree), and the P60 canvas picker
        (RED.view.selectNodes) coexists unchanged. Editor-only UX → no schema/contract change → no gen:example.
