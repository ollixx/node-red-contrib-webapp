      - nodes/webapp.js server render and resources/lib/webapp-client.js client render both consume that shared module instead of two hand-maintained copies (account for the resources/ static-serving constraint in CLAUDE.md — the shared code must be loadable both in Node and in the browser)
      - the keyed morph compares like-for-like markup so a hydrate / re-render no longer swaps element kinds (no sl-button → button downgrade) and input focus / scroll survive updates
      - remove the dead branch in regionContainsInput (resources/lib/webapp-client.js:69, `return region.regions ? false : false`)
    validation:
      - pnpm test passes with no failures
      - "unit test: for a fixture snapshot mounting one of each interactive kind, the shared serializer output is byte-identical whether invoked on the server or via the client code path"
      - "unit/jsdom test: after hydrate() runs against a fixture, the live DOM contains the sl-* elements (e.g. querySelector('sl-button') is non-null) — NOT native <button>/<input>"
      - "regression test: a button rendered by the server and then re-rendered by the client keeps tag sl-button across the morph (no element-kind swap)"
      - "manual: the human confirms in the browser (dev app on :1881) that /customers shows real Shoelace buttons/inputs after the page settles, matching the pre-hydration frame"

