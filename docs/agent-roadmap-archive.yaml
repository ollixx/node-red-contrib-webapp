  - id: P36
    title: App shell — a token-themed application chrome for the `app` layout preset
    status: done
    dependencies: [P34]
    summary:
      delivered: "Implemented a complete application shell for apps using the `app` layout preset. The shell is rendered entirely through the existing app layout (header/navbar/content/footer slots) plus design tokens—no new dependencies or components. The server now renders a top app bar with the ui-app title, themed via the --wa-color-primary token (no hard-coded colors). All slot regions are frameless: the .webapp-slot CSS rule carries no border or background, with structure derived from whitespace and type hierarchy instead. The navbar collapses sensibly on narrow viewports (stacked above content on mobile, sidebar on desktop). Updated customers-crud example: its routes now use app layout (not vertical), and a navbar button mounts to the app-level navbar slot. Added 12 unit tests and 6 E2E tests validating shell structure, token-driven styling, frameless design, and responsive behavior. Updated ADR 0002 documentation with the shell contract."
      stats: "5 files modified (nodes/webapp.js: CSS + app bar rendering; scripts/gen-example.js: layout updates + navbar node; examples/customers-crud/flow.json regenerated; tests/e2e/p35-gen-hygiene.spec.ts layout expectations updated; ADR 0002 extended). 2 new test files: packages/runtime/test/p36-app-shell.test.ts (12 tests), tests/e2e/p36-app-shell.spec.ts (6 tests). Unit suite: 186 tests, 0 failures. E2E: 6 P36 tests, 0 failures (plus 50 other tests passing). pnpm validate green."
      notes: "No new node types, no new packages. The app bar is rendered as a sibling to the webapp-grid root, so the thin client's morph() never touches it—the server's initial app bar is always visible, never overwritten by hydrate(). App-level navbar components must use the explicit layout:app/navbar mount syntax (not appId.navbar) to be discovered by the renderer's mount matcher. P35 test expectations updated: routes are now app layout, not vertical, so placement prop validation was adjusted accordingly. All P36 tests pass individually and as part of the full test suite."
    goals:
      - Give the app a proper, basic-but-intentional visual frame via the existing `app` layout preset (header/navbar/content/footer slots) and design tokens—not a new dependency.
      - Modern, minimal, clean design: no frames or borders around slots, just whitespace and type hierarchy.
      - Token-driven shell styling so ui-app tokens visibly restyle the chrome.
    deliverables:
      - "remove the bordered-box chrome from layout slots; structure from whitespace/typography/alignment"
      - "render a route with layout app as a styled shell: top app bar (with ui-app title, --wa-color-primary token), side navbar region, main content, optional footer"
      - "shell chrome driven entirely by design tokens; no hard-coded colors"
      - "navbar slot renders mounted nav nodes as frameless stacked links with hover/active states"
      - "customers example uses app shell (with navbar primary nav); flows regenerated"
      - "extend ADR 0002 documenting shell delivered via app layout preset + tokens; list 4 slots as shell contract"
    validation:
      - pnpm test passes with no failures
      - "unit test: route with layout app emits shell structure (app bar with title, navbar/content/footer regions, mounted components placed correctly)"
      - "unit test: ui-app token (e.g. colorPrimary) changes app-bar color via --wa-* custom property (no hard-coded color)"
      - "E2E test: dev app renders recognizable chrome (header + navbar + content), not bordered boxes, modern/minimal/clean"
      - "CSS check: .webapp-slot carries no border or background-color; region separation is whitespace-based"
      - "responsive check: navbar collapses on narrow viewports, content usable at 600px width"
    archived_at: "2026-06-02"
    cost: "session 635e8f3d-9e2a-4f8c-9c44-... approximately 35m"

  - id: P35
    title: Generator prop hygiene — emit only layout-appropriate props, clean editor validation
    status: done
    dependencies: [P34]
    summary:
      delivered: "Made scripts/gen-example.js layout-aware: each node now receives only the placement props valid for its parent layout. Grid-layout nodes get row/col/colSize/rowSize; absolute-layout nodes get layoutX/layoutY; vertical/horizontal/app-layout nodes get none. Implemented via a getPlacementProps() helper that filters placement data based on the mount target's layout type. Regenerated examples/customers-crud/flow.json and .node-red-dev/flows.json — all vertical/app-layout nodes now have zero stray placement props."
      stats: "1 file modified (scripts/gen-example.js with helper + mount-to-layout mapping), 2 files regenerated (.json flows), 1 unit test file (scripts/gen-example.test.js with 10 test cases), 1 E2E test file (p35-gen-hygiene.spec.ts with structural validation). Unit suite: 178 tests, 0 failures. E2E: 48 tests, 0 failures (added 1 new test to the suite). pnpm validate green."
      notes: "Editor validation stance: rather than having the editor ignore stray props (permissive), P35 follows the 'fix at source' approach — the generator never emits layout-inappropriate props in the first place, so the editor validation has nothing to ignore. No changes to packages/editor were needed. The helper is small (50 lines) and localized to the generator, making it easy to maintain and understand."
    goals:
      - Stop scripts/gen-example.js from dumping layout-placement props that the node's actual parent layout does not use. A node only carries grid props when mounted under grid layout, absolute props when mounted under absolute layout, and no placement props under vertical/horizontal/app.
    deliverables:
      - "make scripts/gen-example.js layout-aware: each node receives placement props only for the layout preset of the slot/route it is mounted in"
      - "regenerate examples/customers-crud/flow.json and .node-red-dev/flows.json — the customers example uses vertical/app layouts, so its nodes should carry no grid row/col/colSize props after this"
      - "decide and document the editor's stance on stray layout props: the generator simply never emits them (preferred — fix the source)"
    validation:
      - pnpm test passes with no failures
      - "structural check: in examples/customers-crud/flow.json, no node mounted under a vertical/horizontal/app layout carries grid (row/col/colSize/rowSize) or absolute (layoutX/layoutY) placement props"
      - "unit test: gen-example's placement helper emits grid props only for grid-mounted nodes and absolute props only for absolute-mounted nodes"
      - "E2E test: opening the regenerated flow in Node-RED shows no red node-validation badges"
    archived_at: "2026-06-02"

  - id: P33
    title: Rebuild Customers CRUD as a REAL wired Node-RED flow (zero framework logic)
    status: done
    dependencies: [P32]
    summary:
      delivered: "Rewrote scripts/gen-example.js so examples/customers-crud/flow.json (and .node-red-dev/flows.json) is a REAL wired Node-RED flow: ui-button/ui-table outputs are wired into plain `function` nodes that hold every create/read/update/delete decision, and those function nodes are wired back into ui-store (data) and ui-action (navigate)/ui-store (dialog open) nodes. The customers list + selected customer live in a new `customersStore` (statePath `customers`); the table binds rows to state `customers.list` and the detail badge to `customers.current.status` (no query data path). A `dialogStore` (statePath `ui.dialogs.customerEditor`) lets a function node open/close the editor via state, since the live transport renders dialogs from snapshot state, not action commands. A seed inject populates flow context AND re-pushes the store, and is re-triggerable via POST /inject/seedCustomers for E2E isolation. All domain logic is in the flow's function nodes — nodes/webapp.js contains zero customer identifiers (re-asserted by grep)."
      stats: "4 files changed (scripts/gen-example.js, examples/customers-crud/flow.json, .node-red-dev/flows.json, tests/e2e/customers-crud.spec.ts) + 3 structural wiring tests in packages/schema/test/schema.test.ts. Unit suite: 276 tests, 0 failures. customers-crud.spec.ts: 5/5 green (list/create/read/delete). pnpm validate (roadmap+lint+test+build) green."
      notes: "Single-owner CRM demo: all store ops and navigate commands are BROADCAST (no clientId) so data survives a full-page navigation — required because the client mints a fresh random clientId per page load AND buildAppSnapshot picks per-client OR broadcast state without merging (logged in friction-log as a transport gap). The example proves the thesis: deleting the function nodes stops CRUD. E2E baseline was already red (21 specs) BEFORE this phase — editor-template-registration timing (p12/p13/p15/p16d/parent-selector/editor-mount-options) and pre-existing p21 detail (stale link-role; affordance is sl-button/role=button) + p21 ?dialog= vs SSE-snapshot + p23 — all confirmed identical on the stashed pre-P33 baseline via isolated reruns; none introduced by P33. validation.md step 1 still lacks a known-red-baseline carve-out (recurring since P21)."
    goals:
      - Prove the whole thesis: build a working Customers CRUD app purely by wiring generic UI nodes to stock Node-RED nodes — events out, function/storage nodes do the domain logic, ui-store/ui-query + ui-action feed results back. No business logic anywhere in our nodes or runtime, and the example flow has real wires.
    deliverables:
      - "rewrite scripts/gen-example.js so examples/customers-crud/flow.json contains the WIRING: ui-button(click)/ui-table(rowSelect) outputs → function node(s) doing create/update/delete against Node-RED context (flow/global) or a store → ui-store/ui-query updates + ui-action (close dialog / navigate) back to the client"
      - "all domain logic (the CRUD) lives in plain Node-RED function nodes in the example flow, NOT in any ui-* node or in nodes/webapp.js"
      - "regenerate examples/customers-crud/flow.json AND .node-red-dev/flows.json via pnpm gen:example"
