        store.id and collectReferenceNodes never captured the ui-store node's name, so searching a store by its
        canvas name returned 0 rows; fixed by capturing name:node.name for ui-store and using it as the
        searchable name + label prefix (id still searchable, id save round-trip unchanged).
        ORCHESTRATOR VERIFICATION: pnpm validate green (schema/runtime; 294 unit tests, lint clean, build clean).
        node-picker.spec.ts 3/3 pass. The full-suite editor-registration failures (p12/p13/p15/parent-selector,
        9-14 across runs) are the SAME PRE-EXISTING shared-server flakiness documented in P66 — proven NOT
        P68-caused: (a) baseline with pre-P68 editor-common.js fails MORE (14) than with P68 (9-10); (b) those 4
        editor specs pass 13/13 in isolation and 16/16 with the picker spec running first (picker does not
