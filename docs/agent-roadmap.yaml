  # ════════════════════════════════════════════════════════════════════════
  # Test-Strategie: Knoten-Verhalten in klassische Tests, E2E nur Editor+Render
  # (Audit 2026-06-08, P81–P86)
  #
  # Policy (Owner): Jedes Knoten-FEATURE (Input-Message-Handling, Validierung,
  # Output/Event-Emission, Store/Query/Action/Navigation, Interaktions-Verben,
  # Pass-Through) gehört möglichst vollständig in SCHNELLE klassische Tests
  # (vitest in packages/*/test/*, die die registrierten Handler aus webapp.js
  # über die runtimeNodeRegistry treiben + SSE-Pushes/Output-Messages prüfen —
  # Muster wie p59/p56/p30/p38). E2E (Playwright) deckt NUR das Editor-Panel und
  # das korrekte Client-Rendering ab.
  #
  # Audit-Befund: Verhaltens-Abdeckung ist heute großflächig E2E-only oder fehlt
  # (msg.payload→Primärfeld, Interaktions-Verb→SSE-Push, Output-Event-Dispatch,
  # Pass-Through). Es fehlt ein GETEILTER klassischer Verhaltens-Test-Harness.
  #
  # WICHTIG: Beim Schreiben der klassischen Tests treten voraussichtlich echte
  # Bugs zutage (verifizieren, dann fixen oder als Bug-Phase abspalten), u.a.:
  #   • ui-empty-state: Handler ist componentStateInputHandler, Spec verlangt
  #     msg.ui.patch-Feld-Updates → vermutlicher Handler-Mismatch.
  #   • ui-breadcrumb / ui-pagination: kein Eintrag in INTERACTION_VERBS_BY_TYPE
  #     → dokumentiertes show/hide nicht registriert.
  #   • ui-icon: show/hide erzeugt keinen SSE-Push; kein Rendering-Test vorhanden.
  #   • ui-divider: msg.ui.patch wird nicht angewandt (componentStateInputHandler).
  #   • ui-stepper: stepChange-Payload — E2E prüft params.value (Index), Spec sagt
  #     params.stepId (+previousStepId); `complete`-Event ungetestet.
  #   • (überlappt teils mit den Bug-Phasen P72–P80 — dort referenzieren.)
  # ════════════════════════════════════════════════════════════════════════

