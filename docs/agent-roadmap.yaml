  # ════════════════════════════════════════════════════════════════════════
  # Action-Delivery-Modell vereinheitlichen (P58–P60) — ADR 0007
  #
  # Aufgedeckt bei der ui-action Editor-Review (2026-06-06): die Verdrahtung ist
  # für Owner & Nutzer unverständlich. Das "Ziel"-Feld ist ein Freitext-Knoten-ID
  # zum Copy-Pasten; der Hinweis "sonst via Output-Port" ist irreführend, denn der
  # Output-Port liefert die Action gar nicht — er reicht msg nur durch. Der echte
  # Liefer-Weg ist ein ZENTRALER SSE-Push in ui-action selbst.
  #
  # Zwei Kern-Inkohärenzen (siehe ADR 0007 Context):
  #   • actions.md §1 verspricht "Output-Port-Wiring → Runtime liest die Topologie
  #     und leitet an den Component" — der Code liest die Topologie NIE; er pusht
  #     aus dem Config-Feld `target`. Doku ↔ Impl driften (ADR-0005-Stop-Klasse 5).
  #   • Zwei Dinge heißen "target": command.target (gerenderte Component, per SSE)
  #     und msg.ui.action.targetId (Flow-Knoten, per node.send — das injiziert
  #     fälschlich am OUTPUT statt am Input; korrekt wäre node.receive).
  #
  # Owner-Entscheidung (ADR 0007):
  #   1. msg.ui.action wird ein öffentlicher, schema-validierter Message-Contract;
  #      fremde msg.*-Teile werden durchgereicht, nicht ersetzt ("Message
  #      anreichern"). JEDER Knoten (inject/trigger/function/…) kann ihn schicken
  #      — ui-action ist nur der bequeme, typisierte Emitter, kein Gatekeeper.
  #   2. Der SSE-Push WANDERT aus ui-action in den ZIELKNOTEN (per-node input
  #      handler, verallgemeinert aus dem ui-toast-Muster). Der Zielknoten kennt
  #      seine Verben, pusht für seine eigene Component und reicht msg durch;
  #      unbekanntes Verb → Pass-Through (kein stilles Schlucken).
  #   3. Adressierung = der Wire. ui-action emittiert die Message am Output-Port;
  #      optional ("wireless") ein Multi-Select-Knoten-Picker via
  #      RED.view.selectNodes (wie catch/status/complete), Zustellung per
  #      receive() — identischer Pfad wie ein Wire. receive() statt send() fixt
  #      den Injektions-Bug.
  #   4. App-globale Verben (navigate/reset) verdrahtet/picked man zu ui-app /
  #      ui-route (ui-route bekommt inputs:1) — keine Sonderbehandlung. Folge: ein
  #      inject an ui-app mit {ui:{action:{type:navigate,to:"/"}}} springt heim.
  # ════════════════════════════════════════════════════════════════════════

  - { id: P58, title: "ADR 0007 — action-message Contract (Schema) + Vorgehensentscheidung", status: done, dependencies: [P57], archive: "docs/agent-roadmap-archive.yaml#P58" }

