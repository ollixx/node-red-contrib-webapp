  # ════════════════════════════════════════════════════════════════════════
  # Error-Handling & Logging (P54–P57) — ADR 0006
  #
  # Aufgedeckt bei der Knoten-Review (2026-06-06): Error-Handling ist nicht
  # bedacht. Ist-Zustand ist sogar das GEGENTEIL der Anforderung:
  #   • Client (resources/lib/webapp-client.js): jeder catch-Block SCHLUCKT den
  #     Fehler still ("ignore a malformed frame", "nothing to apply"). Kein
  #     einziges console.*-Logging. Bricht etwas, sieht niemand etwas.
  #   • Runtime (nodes/webapp.js): nur vereinzelt node.error ohne Kontext; die
  #     meisten Fehlerpfade sind bare. Kein strukturiertes Fehler-Modell.
  #   • Kein Transport Backend→Frontend, kein Log-Surfacing, kein Log-Node.
  #
  # Owner-Anforderung:
  #   1. Alles was schiefläuft wird SINNVOLL geloggt (mit Kontext, nicht nur ein
  #      Exception-Code).
  #   2. Client: Fehler standardmäßig in die Konsole, gut verständlich für
  #      Menschen — nie stilles Schlucken.
  #   3. Backend-Fehler gehen KONFIGURIERBAR ans Frontend und werden dort
  #      geloggt.
  #   4. Ein ui-debug/ui-error/ui-log-Knoten zeigt das Log konfigurierbar als
  #      UI-Element.
  #
  # Fehler-/Log-Modell (im ADR final):
  #   { severity, code, message (menschenlesbar), context:{appId,nodeId,op},
  #     timestamp, origin: "client" | "server" }
  #   severity = debug | info | warn | error → console.debug/info/warn/error.
  #   Message-Tracing (Owner-Wunsch): ALLE ein- und ausgehenden Messages im
  #   Client als DEBUG loggen (ausgehend: /event-POSTs; eingehend: SSE snapshot/
  #   command/toast/error). Lifecycle (Connected/Disconnected/Reconnect) als
  #   INFO. DEBUG → console.debug, in DevTools filterbar, flutet die Default-
  #   Konsole nicht.
  #   Abgrenzung: ui-toast = flüchtige User-Notification; ui-log = persistenter,
  #   inspizierbarer Log. Kein Duplikat.
  #   SICHERHEIT: Server-Fehler ans Frontend zu leiten kann Interna leaken →
  #   opt-in pro ui-app, mit Severity-Schwelle und Redaktions-Option.
  # ════════════════════════════════════════════════════════════════════════

  - { id: P54, title: "ADR 0006 Error-Handling + gemeinsames Fehler-Modell (Contract)", status: done, dependencies: [P47], archive: "docs/agent-roadmap-archive.yaml#P54" }

