  # Web Component rendering migration — see docs/adr/0002-web-component-rendering-and-theming.md
  # Goal: unify on the framework-agnostic RenderSnapshot, ship a Web Component
  # default adapter, and lock the theme = tokens + adapter (no node injection) model.
