  # ════════════════════════════════════════════════════════════════════════
  # Editor-Feld-Konsolidierung + Varianten-Vokabular (P49–P51)
  #
  # Aufgedeckt bei der Knoten-Review (2026-06-06): das `variant`-Feld soll im
  # Editor als SelectBox erscheinen. Die Analyse legte zwei Probleme frei.
  #
  # PROBLEM 1 — Varianten-Vokabular fehlt / ist semantisch vermischt:
  #   • Varianten sind EBENE 2 in theming.md (semantische Rollen wie primary,
  #     danger, ghost, card …) — NICHT Tokens (Ebene 1) und NICHT vom
  #     Renderer-Backend (Ebene 3) injizierbar.
  #   • Entscheidung des Owners: festes, PORTABLES Vokabular (kleinster
  #     gemeinsamer Nenner, ADR 0002 Snapshot-Naht) — ABER bewusst GROSSZÜGIG
  #     ausgelegt. Ein Backend darf mehrere Varianten auf dieselbe konkrete
  #     Implementierung mappen (z.B. Shoelace bildet `ghost` und `link` evtl.
  #     beide auf dasselbe ab). So bleibt der Contract ausdrucksstark, ohne
  #     dass jedes Backend jede Variante optisch unterscheiden muss.
  #   • `variant` steht NICHT im Schema (packages/schema/src/contracts.ts);
  #     im Serializer (resources/lib/webapp-serializer.js) ist es ad-hoc: nur
  #     ui-button hat ein echtes Mapping, ui-alert nutzt `severity`, ui-badge
  #     `severity || variant`. Die Ebene-2-Listen aus theming.md sind nirgends
  #     codifiziert.
  #   • ACHTUNG semantische Vermischung: einige Knoten nennen ein Feld
  #     `variant`, das in Wahrheit ein ANZEIGE-TYP ist, keine Ebene-2-Rolle —
  #     z.B. ui-progress `bar/spinner/circular`, ui-list/ui-menu Darstellungs-
  #     modi. Diese müssen von echten Varianten getrennt werden (eigenes Feld,
  #     z.B. `displayType`), sonst wird das SelectBox-Vokabular bedeutungslos.
  #
  # PROBLEM 2 — gemeinsame Editor-Felder sind dupliziert, nicht zentral:
  #   • editor-common.js (von allen 36 Knoten geladen) teilt nur die LOGIK
  #     (SelectBox, Mount-Tree, installLayoutChildPropRows-Sichtbarkeit).
  #   • Das MARKUP gemeinsamer Felder ist dupliziert: die 7 Platzierungs-Zeilen
  #     (order/row/col/colSize/rowSize/layoutX/layoutY) sind byte-identisch in
  #     28 HTML-Dateien einkopiert; `variant` ist 6× handgestrickt (5× <select>
  #     mit je eigener Optionsliste, 1× freies Textfeld).
  #   • Würde man P50/P51 naiv umsetzen, zementierte man diese Duplikation
  #     (variant: 7. Sonderfall; grid: 28 Dateien editieren). Deshalb baut
  #     P49a zuerst eine ZENTRALE, schema-gespeiste Feld-Injektion, auf die
  #     P50 (variant) und P51 (grid) dann aufsetzen.
  #
  # Reihenfolge & Abhängigkeiten:
  #   P49  Vokabular + Serializer-Mapping + Entmischung variant/displayType
  #        (Single Source of Truth im Schema).            [dep P48]
  #   P49a Zentrale Editor-Feld-Injektion + Migration der Grid-Platzierungs-
  #        Zeilen (reiner Refactor, kein Verhaltenswechsel). [dep P48]
  #   P50  Variant-SelectBox über alle Knoten, gespeist aus P49-Vokabular,
  #        gebaut mit der P49a-Infrastruktur.              [dep P49, P49a]
  #   P51  Grid-Props als positive Integer (Schema + zentraler Helper).
  #                                                        [dep P49a]
  # Die SelectBox darf NIE aus dem aktiven Backend gespeist werden.
  # ════════════════════════════════════════════════════════════════════════

  - id: P49
    title: "Varianten-Vokabular im Schema + einheitliches Serializer-Mapping"
    status: in_progress
    dependencies: [P48]
    # Architecture-sensitive: defines a new shared contract (the variant
    # vocabulary) that sits ABOVE the backend seam, and consolidates the
    # ad-hoc variant/severity handling in the serializer. Use opus.
    goal: |
      Codify a single, portable variant vocabulary per node type in the schema
      and route ALL variant rendering through one consistent mapping in the
      serializer. This is the prerequisite for the editor SelectBox (P50).

      Principle (theming.md Ebene 2 + owner decision):
        - The variant vocabulary is FIXED and PORTABLE — it belongs to the
          component contract, not to the active backend.
        - It is deliberately GENEROUS: offer the full sensible semantic set per
          node. A backend may map several variants to the same concrete output
          (many-to-one is allowed) and must degrade gracefully (unknown →
          sensible default) — it must NEVER add its own variants.
    scope: |
      1. packages/schema/src/contracts.ts
         - Define a per-node-type variant vocabulary as exported constants
           (e.g. BUTTON_VARIANTS, TEXT_VARIANTS, CONTAINER_VARIANTS,
           INPUT_VARIANTS, BADGE_VARIANTS, ALERT_VARIANTS, …). Seed from the
           theming.md Ebene-2 lists and EXPAND to a generous sensible set:
             button:    primary, secondary, success, danger, warning, neutral,
                        ghost, text/link
             text:      heading-1, heading-2, heading-3, body, caption, label,
                        code, muted
             container: card, panel, section, transparent
             input:     default, filled, outlined
             badge/alert: primary, success, warning, danger, neutral (+info as
                        alias of primary)
           (The implementing agent finalises the lists from each node's spec;
           err on the side of MORE variants, not fewer.)
         - Add a `variant` field (z.enum of the node's vocabulary, optional,
           with a documented default) to the relevant component schemas.
         - UNTANGLE the semantic conflation: audit every node that currently
           has a `variant` field in its HTML and decide per node whether it is
           a true Ebene-2 semantic variant (keep as `variant`) or a DISPLAY
           TYPE (e.g. ui-progress bar/spinner/circular, ui-list/ui-menu render
           modes). Display types move to a separate field (e.g. `displayType`)
           and are NOT part of the variant vocabulary. Record the per-node
           decision so P50 only puts true variants in the SelectBox.
         - Export the vocabularies so both the editor and the serializer import
           the SAME source of truth.
         - Rebuild: pnpm build.

      2. resources/lib/webapp-serializer.js
         - Replace the ad-hoc BUTTON_VARIANT_TO_SHOELACE / severity / mixed
           `severity || variant` handling with ONE variant→Shoelace mapping
           layer that covers every node's vocabulary. Many-to-one mappings are
           expected and fine (e.g. ghost+text → Shoelace text button).
         - Unknown variant → graceful default, never a crash, never raw
           pass-through of an unmapped token.
         - Keep server and thin-client output byte-identical (the shared
           serializer is used by both — P26 invariant).

      3. docs/nodes/concepts/theming.md
         - Replace the illustrative Ebene-2 lists with the now-authoritative
           per-node vocabularies (point to the schema constants as the source
           of truth).
         - State the many-to-one mapping rule and the "backends never add
           variants" rule explicitly.

      4. Per-node spec docs (docs/nodes/**/<node>.md)
         - For each node that gains a `variant` field: list its variant values
           under Optionale Felder and note the default.
    validation: |
      - pnpm build passes (schema compiles; vocabularies exported).
      - pnpm test passes (207+ unit tests). Add unit tests asserting:
          * each exported vocabulary is non-empty and contains the documented
            core values;
          * the serializer maps every vocabulary value to a valid Shoelace
            output and falls back gracefully for an unknown value.
      - `pnpm exec playwright test` passes — existing variant E2E assertions
        (ui-button primary/danger, ui-badge, ui-alert) still hold; server and
        thin-client render parity is preserved.
      - A flow setting a NON-button variant (e.g. ui-text variant "heading-2",
        ui-container variant "card") renders the mapped Shoelace output.

  - id: P49a
    title: "Zentrale Editor-Feld-Injektion + Migration der Grid-Platzierungs-Zeilen"
    status: pending
    dependencies: [P48]
    # Architecture-sensitive: establishes the shared editor-field pattern every
    # later editor phase builds on, and touches the single canonical
    # editor-common.js + all node HTML. Pure refactor (no behaviour change).
    # Use opus.
    goal: |
      Remove the duplicated editor-field MARKUP. Today editor-common.js shares
      only the LOGIC; the markup of common fields is copy-pasted into node HTML
      (the 7 placement rows live byte-identically in 28 files; `variant` is
      hand-rolled 6×). Establish ONE central, schema-fed field-injection helper
      and prove it by migrating the grid placement rows. This is the
      infrastructure P50 (variant) and P51 (grid validation) both build on.

      Constraint: this phase is a PURE REFACTOR — the rendered editor panels and
      the deployed node configs must be unchanged. No new validation, no new
      fields, no behaviour change. (P51 adds the positive-integer rule on top;
      P50 adds the variant rollout on top.)
    scope: |
      - resources/lib/editor-common.js
          Add a field-injection helper that BUILDS the shared placement-row
          markup (order/row/col/colSize/rowSize/layoutX/layoutY) and inserts it
          into a node's edit panel, replacing the per-file copy. Keep the
          existing installLayoutChildPropRows() visibility logic working against
          the injected rows (same data-layout-child-prop-row contract).
          Design the helper so a second field family (the variant SelectBox in
          P50) can reuse the same injection mechanism — i.e. a small generic
          "inject this shared field group" primitive, not a one-off.
      - nodes/**/*.html (the 28 files carrying the placement rows)
          Remove the duplicated placement-row markup; call the central helper
          in oneditprepare instead. The per-node `defaults` entries for these
          fields stay (Node-RED needs them), but their markup is no longer
          hand-written per file.
      - Do NOT change which fields show for which layout — that mapping
          (layoutChildFieldsByVariant) already lives centrally and stays.
    validation: |
      - pnpm validate passes (lint + build + unit + roadmap check).
      - `pnpm exec playwright test tests/e2e/nodes/editor` passes UNCHANGED —
        the placement fields still appear/hide per layout exactly as before
        (this is the regression guard for a pure refactor).
      - A diff check / spot check: at least two migrated nodes (e.g. ui-text,
        ui-table) no longer contain the literal placement-row <div> markup but
        their editor panels still render those rows when mounted into a grid.
      - No deployed-config change: opening + saving a migrated node without
        edits produces an identical node definition.

  - id: P50
    title: "Editor-SelectBox für `variant` — gespeist aus dem Schema-Vokabular"
    status: pending
