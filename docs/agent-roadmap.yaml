  # ════════════════════════════════════════════════════════════════════════
  # Demo-Deployment des Beispiel-Apps für Remote-Reviews (P65)
  #
  # Owner-Bedarf (2026-06-07): für Reviews von unterwegs soll das Beispiel-App
  # (examples/customers-crud) irgendwo erreichbar deployed sein. Ziel: Hetzner-
  # Server, via GitHub Action, Docker.
  #
  # Owner-Entscheidungen (2026-06-07):
  #   • Topologie: ERST SPÄTER ENTSCHEIDEN. Jetzt minimal IN-REPO (gegateter
  #     Workflow + deploy/-Verzeichnis); Auslagerung in ein privates Deploy-Repo
  #     erst zum Veröffentlichungszeitpunkt. Repo ist aktuell privat, später public.
  #   • Klarstellung (verifiziert): npm-Publish ist UNBERÜHRT — .github/ ist nicht
  #     im files-Whitelist, GitHub Actions landen nie im npm-Tarball. Die Sorge
  #     "Deploy-Code im veröffentlichten Paket" trifft nur die GitHub-Repo-
  #     Sichtbarkeit, nicht npm.
  #   • Deploy-Mechanik: GHCR-Image → per SSH "docker compose up -d" auf Hetzner;
  #     Caddy als Reverse-Proxy mit Auto-HTTPS + Basic-Auth (öffentliche Node-RED-
  #     Editor-URL MUSS geschützt sein).
  #
  # Build-Fakten (verifiziert):
  #   • Nodes laden Workspace-Pakete über RELATIVE Pfade, z.B. nodes/webapp.js:12
  #     require("../packages/renderer/dist/index.js"); einzige Runtime-Dep: zod.
  #   • Lokales Vorbild: package.json script example:start legt ein node-red-userDir
  #     an, kopiert examples/customers-crud/flow.json → flows.json und SYMLINKT das
  #     ganze Repo als node_modules/node-red-contrib-webapp.
  #   • Daher im Image NICHT pnpm pack (spiegelt den files-Whitelist-Stand, dem
  #     packages/renderer/dist fehlt → kaputt), sondern den GEBAUTEN Repo-Stand
  #     kopieren (nodes/, resources/, packages/*/dist, package.json) + zod
  #     installieren. (files-Whitelist-Lücke wird separat vor dem ersten Publish
  #     gefixt — nicht Teil dieser Phase.)
  #
  # Umfang (alles unter deploy/ + EINE Workflow-Datei → spätere Extraktion billig):
  #   • deploy/Dockerfile: multi-stage. Stage 1 (node + corepack pnpm):
  #     pnpm install --frozen-lockfile && pnpm build. Stage 2 (nodered/node-red):
  #     gebauten Repo-Stand nach /data/node_modules/node-red-contrib-webapp kopieren,
  #     zod installieren, examples/customers-crud/flow.json → /data/flows.json seeden.
  #   • deploy/settings.js: FRISCH erstellen. .node-red-dev/settings.js ist owner-
  #     privat und OFF-LIMITS — nicht kopieren/lesen. Demo-taugliche settings ohne
  #     Credential-Leak.
  #   • deploy/docker-compose.yml: services node-red (GHCR-Image) + caddy
  #     (reverse_proxy node-red:1880, basicauth, Auto-TLS). Node-RED-Daten EPHEMER
  #     → jeder Deploy reseedet den Beispiel-Flow (immer sauberer Stand für Reviewer).
  #   • deploy/Caddyfile: Domain, reverse_proxy :1880, basicauth (gehashtes Passwort
  #     aus Env/Secret).
  #   • .github/workflows/deploy-demo.yml: Trigger NUR workflow_dispatch + push auf
  #     develop (NIE pull_request_target / Fork-PRs → Secrets sicher). Job: Image
  #     bauen + nach GHCR pushen (GITHUB_TOKEN, packages:write), dann SSH →
  #     docker compose pull && up -d. Secrets im GitHub-Environment "demo":
  #     HETZNER_SSH_HOST/USER/KEY, DEMO_DOMAIN, DEMO_BASIC_AUTH_HASH.
  #   • deploy/README.md: (a) einmalige Server-Voraussetzungen (Docker + compose,
  #     DNS-A-Record, CI-SSH-User/Key, compose+Caddyfile auf dem Server) und
  #     (b) EXTRAKTIONS-Anleitung für den Publish-Zeitpunkt: deploy/ + Workflow in
  #     privates Repo verschieben, Workflow auf actions/checkout@ref dieses Repos +
  #     repository_dispatch-Trigger umstellen.
  #
  # Risiken/Notes: Basic-Auth zwingend (sonst offener Node-RED-Editor); Workflow-
  # Trigger streng gaten; Base-Images möglichst per Digest pinnen; linux/amd64
  # genügt (Hetzner x86); pnpm-Workspace-Build VOR dem Kopieren; Verifikation, dass
  # das Image in nacktem node-red wirklich lädt (relative require-Pfade auflösbar).
  # ════════════════════════════════════════════════════════════════════════

