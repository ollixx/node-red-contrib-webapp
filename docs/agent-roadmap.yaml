project:
  name: node-red-contrib-webapp
  source_prd: prd.md
  plan: docs/implementation-plan.md
  execution_rule: Pick the first phase whose dependencies are done and whose status is pending.
  review_rule: Every phase must pass its validation checks before status can become done.
  stop_rule: Stop for human input on unresolved architecture decisions or repeated validation failure.
  current_phase: P13
  # current_phase is the next phase to implement. Update it whenever a phase starts or completes.

phases:
  - id: P0
    title: ADRs and scaffold
    status: done
    dependencies: []
    goals:
      - Create the TypeScript workspace scaffold and package layout.
      - Record ADRs for renderer choice, schema validation strategy, and package boundaries.
      - Establish install, build, lint, and test commands.
    deliverables:
      - package manager workspace files
      - root TypeScript configuration
      - baseline lint and test configuration
      - ADR document
    validation:
      - dependencies install in one command
      - workspace validation command succeeds
      - ADR answers renderer and schema questions from the PRD

  - id: P1
    title: Shared UI model
    status: done
    dependencies: [P0]
    goals:
      - Define the shared component, route, layout, slot, and event contracts.
      - Implement mount parsing and validation.
      - Add fixtures that represent realistic app models.
    deliverables:
      - schema package with exported types and validators
      - mount parser and validation tests
      - fixture app models
    validation:
      - invalid definitions fail with readable errors
      - fixtures cover routes, dialogs, and nested mount targets

  - id: P2
    title: Runtime registry core
    status: done
    dependencies: [P1]
    goals:
      - Register node contributions into a central registry.
      - Compile registrations into a normalized app model.
      - Expose the compiled model through a runtime API.
    deliverables:
      - registry service
      - model compiler
      - runtime API endpoint
      - duplicate ID and invalid mount diagnostics
    validation:
      - compiled model is deterministic from the same inputs
      - duplicate IDs and invalid mounts are reported

  - id: P3
    title: Renderer MVP
    status: done
    dependencies: [P2]
    goals:
      - Render routes, layouts, slots, and core view components from the compiled model.
      - Bridge UI events back to Node-RED.
      - Bind client-side state to rendered components.
    deliverables:
      - renderer app shell
      - route and slot rendering
      - text, button, table, container, input, and dialog components
      - event bridge
    validation:
      - multi-page fixture renders end to end
      - button and submit events emit the standard msg.ui shape

  - id: P4
    title: Node set MVP
    status: done
    dependencies: [P3]
    goals:
      - Expose the MVP concepts as Node-RED nodes.
      - Validate required node properties in the editor.
      - Keep node definitions schema-aligned.
    deliverables:
      - ui-app node
      - ui-route node
      - ui-text node
      - ui-button node
      - ui-table node
      - ui-container node
      - ui-input node
      - ui-dialog node
      - ui-store node
      - ui-query node
      - ui-action node
      - ui-navigation node
    validation:
      - each node emits or registers a valid definition
      - editor validation blocks incomplete required fields

  - id: P5
    title: State and event integration
    status: done
    dependencies: [P4]
    goals:
      - Support CRUD-oriented state updates, query flows, navigation, and dialog actions.
      - Keep event payloads standardized across components.
    deliverables:
      - store update flow
      - query lifecycle handling
      - navigation and dialog action handlers
      - visibility and enabled rules
    validation:
      - CRUD example supports list, open dialog, submit, and refresh
      - event payload shape is consistent across interactive nodes

  - id: P6
    title: Editor structure view
    status: done
    dependencies: [P5]
    goals:
      - Add a structure sidebar that mirrors the compiled UI model.
      - Sync selection and surface structural diagnostics.
    deliverables:
      - sidebar tree
      - selection sync
      - structural validation warnings
    validation:
      - users can inspect hierarchy without reading wiring as DOM structure

  - id: P7
    title: Example app and hardening
    status: done
    dependencies: [P6]
    goals:
      - Ship a complete customer CRUD example and baseline documentation.
      - Add focused tests for schema, registry, runtime, and renderer.
    deliverables:
      - example flow
      - getting started guide
      - architecture overview
      - baseline automated tests
    validation:
      - a contributor can run the example from docs alone
      - the example demonstrates the full MVP journey

  - id: P8
    title: Browser E2E validation and preview hardening
    status: done
    dependencies: [P7]
    goals:
      - Add browser-level validation for the shipped CRUD example.
      - Align the Node-RED preview runtime with the CRUD behavior already covered by renderer tests.
      - Surface preview event messages for interactive nodes so user journeys can be verified end to end.
    deliverables:
      - Playwright configuration and E2E test for the CRUD journey
      - preview runtime fixes for create, save, refresh, navigation, and delete
      - observable event log for emitted UI messages
    validation:
      - Playwright passes against the local Node-RED instance
      - saving a customer adds it to the list in the preview
      - interactive preview actions emit inspectable UI event messages

  - id: P9
    title: Structured node contract alignment (ui-app, ui-route, ui-container)
    status: done
    dependencies: [P8]
    goals:
      - Align documented required fields for ui-app, ui-route, and ui-container across editor, schema, and runtime mapping.
      - Consolidate shared layout-related contract handling without introducing speculative future features.
      - Keep backward compatibility for existing flows while enforcing the updated required fields for new definitions.
    deliverables:
      - updated node definition schemas for the three nodes
      - updated Node-RED editor fields and defaults
      - updated runtime mapConfig handling
      - focused regression tests for the updated contracts
    validation:
      - schema validation accepts updated ui-app/ui-route/ui-container definitions
      - editor dialogs expose the documented required fields
      - runtime mapConfig produces schema-valid definitions from deployed flow nodes

  - id: P10
    title: Layout preset expansion and child prop injection
    status: done
    dependencies: [P9]
    goals:
      - Extend the standard layout presets with grid and absolute variants.
      - Inject layout-specific child properties into direct mounts inside the editor.
      - Keep schema, editor, runtime, tests, and docs aligned for the new layout behavior.
    deliverables:
      - updated layout preset definitions
      - schema and editor support for order, grid, and absolute child props
      - editor helpers and dialogs that show layout-specific fields based on mount
      - focused browser coverage for mount options and injected child props
      - updated layout and node documentation
    validation:
      - schema and editor tests accept the extended mountable node contracts
      - Playwright verifies layout-specific child fields for direct mounts
      - runtime and preview render grid and absolute layouts as modeled

  - id: P11a
    title: Parent field — schema and runtime
    status: done
    dependencies: [P10]
    goals:
      - Add parent field to schema for all nodes that require app or slot scoping.
      - Update runtime mapConfig to derive app scoping from parent instead of uiId.
    deliverables:
      - parent field added to node definition schemas for ui-route, ui-dialog, ui-store, ui-action, ui-query, ui-navigation (app-scoped) and ui-button, ui-input, ui-text, ui-table, ui-container (slot-scoped)
      - runtime mapConfig reads parent field; uiId kept as fallback for existing flows
      - unit tests for parent-based compilation for each node type
    validation:
      - pnpm test passes with no failures
      - unit test: compiling a node-set where ui-button has parent=<appId>/<routeId>/content produces a valid AppModel with button mounted in the correct slot
      - unit test: compiling a node-set where ui-store has parent=<appId> scopes the store to that app
      - unit test: node with missing parent field fails compilation with a readable diagnostic
      - unit test: node with uiId but no parent still compiles (backward compatibility)

  - id: P11b
    title: Parent field — node editors and name defaults
    status: done
    dependencies: [P11a]
    goals:
      - Replace free-text uiId and mount fields with structured parent SelectBox in all node editors.
      - Implement name defaults ("Button N" etc.) on node creation.
    deliverables:
      - parent SelectBox in ui-route, ui-dialog, ui-store, ui-action, ui-query, ui-navigation editors (shows ui-app nodes)
      - parent slot selector in ui-button, ui-input, ui-text, ui-table, ui-container editors (hierarchical: app → route/dialog → container)
      - name default logic in editor-common.js for all node types
      - E2E tests for SelectBox population and name defaults
    validation:
      - pnpm test passes with no failures
      - Playwright: opening a ui-button editor shows a populated parent SelectBox with at least one entry matching an existing ui-route
      - Playwright: creating a new ui-button node shows name default "Button 1" (or next N) pre-filled
      - docs check: every node file in docs/nodes/ that lists a parent field matches the implementation — read each doc and verify the corresponding editor HTML contains a parent input

  - id: P12
    title: Configurable event system
    status: done
    dependencies: [P11b]
    goals:
      - Add checkbox-based event selection to ui-app, ui-route, ui-dialog, ui-container, ui-table.
      - Each active event produces a dynamic out-port on the node.
      - Implement component state message handling (show/hide/enable/disable/focus/reset) for all view nodes.
      - Implement ui-dialog open/close via direct message in addition to store state.
    deliverables:
      - configurable events on ui-app (clientConnected, clientDisconnected)
      - configurable events on ui-route (onEnter, onLeave)
      - configurable events on ui-dialog (onOpen, onClose) plus message-based open/close
      - configurable events on ui-container (onShow, onHide)
      - component state message handler in runtime for show/hide/enable/disable/focus/reset
      - dynamic out-port generation in node editors
      - msg format aligned with messages.md
      - unit tests for all new runtime handlers
      - E2E tests for event checkbox UI and dynamic out-port rendering
    validation:
      - pnpm test passes with no failures
      - unit test: ui-app node with events=[clientConnected] produces outputs:1 in the compiled definition
      - unit test: ui-route node with events=[onEnter, onLeave] produces outputs:2
      - unit test: runtime dispatches msg.ui.component.op=hide to correct node and marks it hidden in state
      - unit test: msg.ui.dialog.op=open triggers dialog open state without a store update
      - Playwright: opening a ui-app editor shows event checkboxes for clientConnected and clientDisconnected
      - Playwright: enabling onEnter on a ui-route node adds a visible out-port on the canvas
      - docs check: messages.md op table matches the set of ops handled in runtime — verify each op in the table has a corresponding handler in webapp.js

  - id: P13
    title: ui-table enhancements
    status: pending
    dependencies: [P12]
    goals:
      - Replace string-only columns with structured column definitions.
      - Add optional footer slot.
      - Replace selectAction with configurable row events (rowSelect, rowAction, checkboxChange, cellSelect).
    deliverables:
      - structured column definition schema (key, label, type, sortable, filterable, width)
      - backward-compatible column parsing (plain string still valid)
      - footer slot activated by footer flag
      - events field with multi-select in editor replacing selectAction
      - dynamic out-ports per active event
      - selectAction marked deprecated, still functional
      - unit tests for structured column parsing and footer slot compilation
      - E2E tests for column editor UI and row event out-ports
    validation:
      - pnpm test passes with no failures
      - unit test: table with columns=["name","email"] (plain strings) renders header cells "name" and "email"
      - unit test: table with columns=[{key:"firstName",label:"Vorname"}] renders header cell "Vorname" and reads row.firstName
      - unit test: table with footer=true exposes a footer slot in the compiled component
      - unit test: table with events=[rowSelect] produces outputs:1; with events=[rowSelect,rowAction] produces outputs:2
      - unit test: existing flow with selectAction still compiles without error (deprecated but functional)
      - Playwright: ui-table editor shows events multi-select and footer checkbox
      - docs check: ui-table.md column type list matches the type values accepted by the schema

  - id: P14
    title: ui-query enhancements
    status: pending
    dependencies: [P11b]
    goals:
      - Remove unused source field.
      - Add ETag-based caching to avoid redundant pushes to the client.
      - Add params binding from ui-store for reactive filtering, sorting, and paging.
    deliverables:
      - source field removed from schema, editor, runtime, and fixtures
      - etag field in query input message; runtime skips push when etag matches
      - params field on ui-query node referencing a ui-store
      - runtime re-triggers query when referenced store changes
      - unit tests for ETag caching logic and store-param reactivity
    validation:
      - pnpm test passes with no failures
      - unit test: flow with a ui-query node that has source field set still compiles without error (graceful ignore)
      - unit test: sending msg.ui.query with etag="v1" twice only pushes to client once
      - unit test: sending msg.ui.query with etag="v1" then etag="v2" pushes to client twice
      - unit test: updating the store referenced by ui-query.params emits a query refresh message
      - docs check: ui-query.md queryPath description matches the client-state path structure in runtime

  - id: P15
    title: Multi-user and client persistence
    status: pending
    dependencies: [P12]
    goals:
      - Route store and query updates to specific clients via clientId.
      - Add persist flag to ui-store for localStorage-backed state.
      - Implement reconnect sync (server state wins on conflict).
    deliverables:
      - clientId routing in store update and query push handlers
      - persist flag on ui-store node
      - client sends local state snapshot on reconnect
      - server compares timestamps and pushes winner to client
      - unit tests for clientId routing and reconnect sync logic
      - E2E tests for persist flag behavior across page reload
    validation:
      - pnpm test passes with no failures
      - unit test: store update with msg.ui.clientId="c1" only emits notification to client c1, not c2
      - unit test: store update without clientId emits notification to all connected clients
      - unit test: reconnect with client timestamp older than server timestamp results in server state being sent to client
      - unit test: reconnect with client timestamp newer than server timestamp results in client state being accepted
      - Playwright: ui-store editor shows persist checkbox
      - Playwright: page reload with persist=true shows last known store value immediately (before server responds)
      - docs check: multi-user.md sync strategy description matches the reconnect handler in runtime

  - id: P16a
    title: Core node expansion — input controls
    status: pending
    dependencies: [P12]
    goals:
      - Add the missing input control nodes to the core lib.
      - All nodes follow the established parent/name/events pattern.
      - Schema, runtime, editor, and renderer aligned for each node.
    deliverables:
      - ui-select: dropdown / combobox with options binding
      - ui-checkbox: single checkbox with value binding
      - ui-radio: radio group with options binding
      - ui-switch: toggle/boolean input
      - ui-textarea: multi-line text input
      - ui-datepicker: date and datetime input
      - ui-slider: numeric range input
      - unit and E2E tests per node
    validation:
      - pnpm test passes with no failures
      - unit test: each node compiles to a valid schema definition
      - unit test: each node emits a change event with correct payload on value change
      - Playwright: each node editor shows parent selector and name default
      - docs check: each node doc's Pflichtfelder match the schema and editor HTML

  - id: P16b
    title: Core node expansion — feedback and status
    status: pending
    dependencies: [P12]
    goals:
      - Add feedback and status nodes for loading states, notifications, and empty states.
    deliverables:
      - ui-alert: info/warn/error/success message band
      - ui-toast: temporary notification (auto-dismiss)
      - ui-progress: progress bar and spinner variants
      - ui-skeleton: loading placeholder matching component shape
      - ui-badge: count or status indicator attached to another element
      - ui-empty-state: structured placeholder for empty lists or views
      - unit and E2E tests per node
    validation:
      - pnpm test passes with no failures
      - unit test: each node compiles to a valid schema definition
      - unit test: ui-toast with duration fires dismiss event after timeout
      - unit test: ui-progress with value binding renders correct fill percentage
      - Playwright: each node editor shows parent selector and name default
      - docs check: each node doc's Pflichtfelder match the schema and editor HTML

  - id: P16c
    title: Core node expansion — navigation and structure
    status: pending
    dependencies: [P12]
    goals:
      - Add navigation and structural nodes for multi-step and hierarchical UIs.
    deliverables:
      - ui-tabs: tab bar with slot per tab
      - ui-accordion: collapsible sections
      - ui-breadcrumb: path display with route bindings
      - ui-menu: navigation menu (sidebar or topbar variant)
      - ui-pagination: page controls connected to ui-query params
      - ui-stepper: multi-step process indicator
      - unit and E2E tests per node
    validation:
      - pnpm test passes with no failures
      - unit test: each node compiles to a valid schema definition
      - unit test: ui-tabs with 3 tabs exposes 3 slots in compiled model
      - unit test: ui-pagination emits page-change event with correct page number
      - Playwright: each node editor shows parent selector and name default
      - docs check: each node doc's Pflichtfelder match the schema and editor HTML

  - id: P16d
    title: Core node expansion — display
    status: pending
    dependencies: [P12]
    goals:
      - Add display nodes for images, icons, lists, and avatars.
    deliverables:
      - ui-image: image with src binding, alt text, fallback
      - ui-icon: icon by name, icon-set-agnostic (name maps to SVG or font icon)
      - ui-list: structured list with item slot
      - ui-avatar: user image or initials with fallback
      - ui-divider: visual separator (horizontal/vertical)
      - unit and E2E tests per node
    validation:
      - pnpm test passes with no failures
      - unit test: each node compiles to a valid schema definition
      - unit test: ui-image with missing src renders fallback slot
      - Playwright: each node editor shows parent selector and name default
      - docs check: each node doc's Pflichtfelder match the schema and editor HTML

  - id: P17
    title: Theming system
    status: pending
    dependencies: [P16a, P16b, P16c, P16d]
    goals:
      - Implement Design-Token system on ui-app node.
      - Implement component variants across all core nodes.
      - Ship webapp-default renderer backend consuming tokens.
      - Define backend extension interface for community backends.
    deliverables:
      - design token fields on ui-app (colors, typography, spacing, radii)
      - CSS Custom Properties injected from tokens at runtime
      - variant field on all view nodes with validated enum per node type
      - webapp-default backend implementing all core nodes against tokens
      - backend interface spec documented in theming.md
      - unit tests for token injection and variant rendering
    validation:
      - pnpm test passes with no failures
      - unit test: ui-app with custom primary color injects correct CSS custom property
      - unit test: ui-button with variant=danger renders with danger token class
      - unit test: ui-button with unknown variant fails schema validation
      - Playwright: changing primary color token in ui-app editor updates preview
      - docs check: theming.md token list matches the fields accepted by ui-app schema