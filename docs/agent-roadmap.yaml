project:
  name: node-red-contrib-webapp
  source_prd: prd.md
  plan: docs/implementation-plan.md
  execution_rule: Pick the first phase whose dependencies are done and whose status is pending.
  review_rule: Every phase must pass its validation checks before status can become done.
  stop_rule: Stop for human input on unresolved architecture decisions or repeated validation failure.
  current_phase: P16d
  # current_phase is the next phase to implement. Update it whenever a phase starts or completes.

phases:
  # Abgeschlossene Phasen — vollständige Details in docs/agent-roadmap-archive.yaml
  - { id: P0,  title: "ADRs and scaffold",                                    status: done, dependencies: [],    archive: "docs/agent-roadmap-archive.yaml#P0"  }
  - { id: P1,  title: "Shared UI model",                                      status: done, dependencies: [P0],  archive: "docs/agent-roadmap-archive.yaml#P1"  }
  - { id: P2,  title: "Runtime registry core",                                status: done, dependencies: [P1],  archive: "docs/agent-roadmap-archive.yaml#P2"  }
  - { id: P3,  title: "Renderer MVP",                                         status: done, dependencies: [P2],  archive: "docs/agent-roadmap-archive.yaml#P3"  }
  - { id: P4,  title: "Node set MVP",                                         status: done, dependencies: [P3],  archive: "docs/agent-roadmap-archive.yaml#P4"  }
  - { id: P5,  title: "State and event integration",                          status: done, dependencies: [P4],  archive: "docs/agent-roadmap-archive.yaml#P5"  }
  - { id: P6,  title: "Editor structure view",                                status: done, dependencies: [P5],  archive: "docs/agent-roadmap-archive.yaml#P6"  }
  - { id: P7,  title: "Example app and hardening",                            status: done, dependencies: [P6],  archive: "docs/agent-roadmap-archive.yaml#P7"  }
  - { id: P8,  title: "Browser E2E validation and preview hardening",         status: done, dependencies: [P7],  archive: "docs/agent-roadmap-archive.yaml#P8"  }
  - { id: P9,  title: "Structured node contract alignment",                   status: done, dependencies: [P8],  archive: "docs/agent-roadmap-archive.yaml#P9"  }
  - { id: P10, title: "Layout preset expansion and child prop injection",      status: done, dependencies: [P9],  archive: "docs/agent-roadmap-archive.yaml#P10" }

  - id: P11a
    title: Parent field — schema and runtime
    status: done
    dependencies: [P10]
    goals:
      - Add parent field to schema for all nodes that require app or slot scoping.
      - Update runtime mapConfig to derive app scoping from parent instead of uiId.
    deliverables:
      - parent field added to node definition schemas for ui-route, ui-dialog, ui-store, ui-action, ui-query, ui-navigation (app-scoped) and ui-button, ui-input, ui-text, ui-table, ui-container (slot-scoped)
      - runtime mapConfig reads parent field; uiId kept as fallback for existing flows
      - unit tests for parent-based compilation for each node type
    validation:
      - pnpm test passes with no failures
      - unit test: compiling a node-set where ui-button has parent=<appId>/<routeId>/content produces a valid AppModel with button mounted in the correct slot
      - unit test: compiling a node-set where ui-store has parent=<appId> scopes the store to that app
      - unit test: node with missing parent field fails compilation with a readable diagnostic
      - unit test: node with uiId but no parent still compiles (backward compatibility)

  - id: P11b
    title: Parent field — node editors and name defaults
    status: done
    dependencies: [P11a]
    goals:
      - Replace free-text uiId and mount fields with structured parent SelectBox in all node editors.
      - Implement name defaults ("Button N" etc.) on node creation.
    deliverables:
      - parent SelectBox in ui-route, ui-dialog, ui-store, ui-action, ui-query, ui-navigation editors (shows ui-app nodes)
      - parent slot selector in ui-button, ui-input, ui-text, ui-table, ui-container editors (hierarchical: app → route/dialog → container)
      - name default logic in editor-common.js for all node types
      - E2E tests for SelectBox population and name defaults
    validation:
      - pnpm test passes with no failures
      - Playwright: opening a ui-button editor shows a populated parent SelectBox with at least one entry matching an existing ui-route
      - Playwright: creating a new ui-button node shows name default "Button 1" (or next N) pre-filled
      - docs check: every node file in docs/nodes/ that lists a parent field matches the implementation — read each doc and verify the corresponding editor HTML contains a parent input

  - id: P12
    title: Configurable event system
    status: done
    dependencies: [P11b]
    goals:
      - Add checkbox-based event selection to ui-app, ui-route, ui-dialog, ui-container, ui-table.
      - Each active event produces a dynamic out-port on the node.
      - Implement component state message handling (show/hide/enable/disable/focus/reset) for all view nodes.
      - Implement ui-dialog open/close via direct message in addition to store state.
    deliverables:
      - configurable events on ui-app (clientConnected, clientDisconnected)
      - configurable events on ui-route (onEnter, onLeave)
      - configurable events on ui-dialog (onOpen, onClose) plus message-based open/close
      - configurable events on ui-container (onShow, onHide)
      - component state message handler in runtime for show/hide/enable/disable/focus/reset
      - dynamic out-port generation in node editors
      - msg format aligned with messages.md
      - unit tests for all new runtime handlers
      - E2E tests for event checkbox UI and dynamic out-port rendering
    validation:
      - pnpm test passes with no failures
      - unit test: ui-app node with events=[clientConnected] produces outputs:1 in the compiled definition
      - unit test: ui-route node with events=[onEnter, onLeave] produces outputs:2
      - unit test: runtime dispatches msg.ui.component.op=hide to correct node and marks it hidden in state
      - unit test: msg.ui.dialog.op=open triggers dialog open state without a store update
      - Playwright: opening a ui-app editor shows event checkboxes for clientConnected and clientDisconnected
      - Playwright: enabling onEnter on a ui-route node adds a visible out-port on the canvas
      - docs check: messages.md op table matches the set of ops handled in runtime — verify each op in the table has a corresponding handler in webapp.js

  - id: P13
    title: ui-table enhancements
    status: done
    dependencies: [P12]
    goals:
      - Replace string-only columns with structured column definitions.
      - Add optional footer slot.
      - Replace selectAction with configurable row events (rowSelect, rowAction, checkboxChange, cellSelect).
    deliverables:
      - structured column definition schema (key, label, type, sortable, filterable, width)
      - backward-compatible column parsing (plain string still valid)
      - footer slot activated by footer flag
      - events field with multi-select in editor replacing selectAction
      - dynamic out-ports per active event
      - selectAction marked deprecated, still functional
      - unit tests for structured column parsing and footer slot compilation
      - E2E tests for column editor UI and row event out-ports
    validation:
      - pnpm test passes with no failures
      - unit test: table with columns=["name","email"] (plain strings) renders header cells "name" and "email"
      - unit test: table with columns=[{key:"firstName",label:"Vorname"}] renders header cell "Vorname" and reads row.firstName
      - unit test: table with footer=true exposes a footer slot in the compiled component
      - unit test: table with events=[rowSelect] produces outputs:1; with events=[rowSelect,rowAction] produces outputs:2
      - unit test: existing flow with selectAction still compiles without error (deprecated but functional)
      - Playwright: ui-table editor shows events multi-select and footer checkbox
      - docs check: ui-table.md column type list matches the type values accepted by the schema

  - { id: P14, title: "ui-query enhancements", status: done, dependencies: [P11b], archive: "docs/agent-roadmap-archive.yaml#P14" }

  - { id: P15, title: "Multi-user and client persistence", status: done, dependencies: [P12], archive: "docs/agent-roadmap-archive.yaml#P15" }

  - { id: P16a, title: "Core node expansion — input controls", status: done, dependencies: [P12], archive: "docs/agent-roadmap-archive.yaml#P16a" }

  - { id: P16b, title: "Core node expansion — feedback and status", status: done, dependencies: [P12], archive: "docs/agent-roadmap-archive.yaml#P16b" }

  - { id: P16c, title: "Core node expansion — navigation and structure", status: done, dependencies: [P12], archive: "docs/agent-roadmap-archive.yaml#P16c" }

  - id: P16d
    title: Core node expansion — display
    status: in_progress
    dependencies: [P12]
    goals:
      - Add display nodes for images, icons, lists, and avatars.
    deliverables:
      - ui-image: image with src binding, alt text, fallback
      - ui-icon: icon by name, icon-set-agnostic (name maps to SVG or font icon)
      - ui-list: structured list with item slot
      - ui-avatar: user image or initials with fallback
      - ui-divider: visual separator (horizontal/vertical)
      - unit and E2E tests per node
    validation:
      - pnpm test passes with no failures
      - unit test: each node compiles to a valid schema definition
      - unit test: ui-image with missing src renders fallback slot
      - Playwright: each node editor shows parent selector and name default
      - docs check: each node doc's Pflichtfelder match the schema and editor HTML

  - id: P17
    title: Theming system
    status: pending
    dependencies: [P16a, P16b, P16c, P16d]
    goals:
      - Implement Design-Token system on ui-app node.
      - Implement component variants across all core nodes.
      - Ship webapp-default renderer backend consuming tokens.
      - Define backend extension interface for community backends.
    deliverables:
      - design token fields on ui-app (colors, typography, spacing, radii)
      - CSS Custom Properties injected from tokens at runtime
      - variant field on all view nodes with validated enum per node type
      - webapp-default backend implementing all core nodes against tokens
      - backend interface spec documented in theming.md
      - unit tests for token injection and variant rendering
    validation:
      - pnpm test passes with no failures
      - unit test: ui-app with custom primary color injects correct CSS custom property
      - unit test: ui-button with variant=danger renders with danger token class
      - unit test: ui-button with unknown variant fails schema validation
      - Playwright: changing primary color token in ui-app editor updates preview
      - docs check: theming.md token list matches the fields accepted by ui-app schema

  - id: P18
    title: Example flow generator
    status: pending
    dependencies: [P11b]
    goals:
      - Generate examples/customers-crud/flow.json from the typed schema fixture instead of maintaining it by hand.
      - Eliminate manual flow migration after every schema change.
      - Provide a one-command way to refresh the human-inspectable dev project.
    deliverables:
      - generator script that converts an AppModel fixture into a Node-RED flows.json (node configs, ids, z/flow refs, wiring)
      - pnpm script "gen:example" that writes examples/customers-crud/flow.json and copies it to .node-red-dev/flows.json
      - the generator derives node field names from the current schema so a renamed field breaks the TypeScript build, not the runtime
      - generator covers all node types present in the fixture
      - unit test asserting generated flow.json validates against the current schema
      - documentation in AGENTS.md / architecture.md: run gen:example after any schema change
    validation:
      - pnpm test passes with no failures
      - unit test: generated flow.json parses and every node maps to a valid schema definition
      - unit test: every node in the generated flow has an id and a z reference to an existing flow tab
      - manual check: gen:example produces a flow that loads in the dev Node-RED without migration warnings
      - docs check: the generated example covers the same node types as the customersCrudAppModelFixture
    notes: >
      Re-run gen:example as the final step of any phase that renames or adds node fields
      (P12, P13, P14, P16x, P17). This keeps the human-inspectable example current without
      hand migration. Backward-compat fallbacks in the runtime are only for deployed user
      flows, never for the dev example.