  # ════════════════════════════════════════════════════════════════════════
  # COURSE CORRECTION (2026-05-31) — kill the preview, restore the live model.
  #
  # The owner's verdict after seeing the running app: the whole "render a
  # preview backend inside the runtime" idea was a mistake and must be removed
  # entirely. The core product principle, already written down before any of
  # this drift, is non-negotiable:
  #
  #   • docs/nodes/concepts/events.md:96 — "Der Flow ist der einzige Ort für
  #     Logik." (The flow is the ONLY place for logic.)
  #   • docs/nodes/concepts/actions.md:11,238 — actions change INTERACTION
  #     state only (navigate / openDialog / show / enable / focus / reset),
  #     NEVER business data. A ui-action never writes a store/collection.
  #
  # Nodes must be 100% domain-agnostic. ZERO business logic in any node or in
  # the runtime. You assemble ANY app (not just a customer CRM) out of generic
  # nodes; all domain logic lives in the wired Node-RED flow (function/db/http
  # nodes). The app IS its wiring.
  #
  # What drifted (to be reverted):
  #   • P20a invented action types `submit` / `remove` with a `collection`
  #     field — these ARE CRUD. applySubmitAction / applyRemoveAction in
  #     nodes/webapp.js insert/update/delete records (business data) inside the
  #     runtime. Forbidden by actions.md.
  #   • P22 "snapshot transport / thin client" + the preview endpoints turned
  #     the runtime into a fake backend: the browser POSTs an actionId and the
  #     runtime executes it (incl. CRUD) against in-memory previewState /
  #     previewQueries, with NO flow and NO wiring involved. This contradicts
  #     events.md (no auto event→action link; the flow decides).
  #   • P27 "de-hardcoded" by GENERALISING the CRUD into the runtime instead of
  #     REMOVING it. A generic CRUD engine is still business logic in the
  #     framework. Wrong target.
  #   • P28 produced an example with ZERO wires — only possible because the CRUD
  #     was faked in the runtime. A real app in this model is DEFINED by wires.
  #
  # Reusable / kept: the renderer, the Shoelace adapter + design tokens, and
  # the P26 shared serializer (rendering is fine — only the STATE SOURCE and
  # the transport are wrong). P29 writes ADR 0003 to supersede the transport
  # slice of ADR 0002; the rendering/theming slice of 0002 stays valid.
  #
  # Superseded phases (kept as historical 'done', corrected by P29–P33):
  #   P20a (partial: submit/remove), P22, P27, P28.
  # ════════════════════════════════════════════════════════════════════════

  - { id: P29, title: "ADR 0003 + revert in-runtime business logic (kill submit/remove CRUD)", status: done, dependencies: [P28], archive: "docs/agent-roadmap-archive.yaml#P29" }

