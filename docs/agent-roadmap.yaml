  # ════════════════════════════════════════════════════════════════════════
  # Icon-System — backend-neutraler Wert + global registrierbare Libs +
  # Icon-Picker-Dialog (P69)
  #
  # Owner-Wunsch (2026-06-07): Wir brauchen Icons für ui-avatar, ui-button,
  # ui-icon etc. Die Theme-Backends bringen Icons über übliche Icon-Sets mit.
  # Zusätzlich soll man — UNABHÄNGIG vom Backend — weitere Icon-Libs einbinden
  # können (korrekt registriert). Für die Auswahl braucht es im Editor einen
  # Dialog, der alle Icons anzeigt, mit Filter, Scrollbars und Filter nach Lib.
  #
  # Ist-Stand (verifiziert):
  #   • Icon-Felder sind heute Freitext-Strings: ui-icon.icon (Pflicht,
  #     node-definitions.ts:595), ui-empty-state.icon (optional), menu/list-items
  #     .icon (optional). KEIN Picker, KEIN Lib/Prefix-Konzept.
  #   • Gerendert als <sl-icon name="…"> → Shoelaces Default-Set Bootstrap Icons,
  #     2052 SVGs lokal vendored unter resources/shoelace/assets/icons/ (ADR 0008).
  #     Autoloader ermittelt Base-Path selbst, kein setBasePath nötig.
  #   • ui-button und ui-avatar haben HEUTE KEIN Icon-Feld → muss ergänzt werden
  #     (sl-button prefix/suffix-Slots; sl-avatar icon-Fallback).
  #   • ADR 0002: Props semantisch & backend-agnostisch, Adapter mappt aufs
  #     Framework. Heute ist der Icon-Wert an Shoelace/Bootstrap-Icons gekoppelt.
  #   • Editor-Palette-Icons (font-awesome/... in den .html) sind ein SEPARATES
  #     System (Node-RED-Editor) — NICHT anfassen, nicht verwechseln.
  #
  # Owner-Entscheidungen (2026-06-07):
  #   • Icon-Wert BACKEND-NEUTRAL als { library, name } (bzw. "library:name",
  #     Default-Lib wenn weggelassen). Adapter rendert <sl-icon library name>;
  #     anderes Backend kann eigenes Mapping machen (ADR-0002-konform).
  #   • Zusätzliche Icon-Libraries auf GLOBALER / MODUL-Ebene registrierbar
  #     (einmal registrieren, überall verfügbar), LOKAL ausgeliefert und
  #     client-seitig via Shoelace registerIconLibrary() registriert — unabhängig
  #     vom Backend. Default-Lib = das vendorte Bootstrap-Set.
  #   • Icon-Feld ist typedInput: meist literal via Picker, ABER auch dynamisch
  #     bindbar (state/msg/jsonata/store …) — konsistent mit P67.
  #   • Icon-Picker-Dialog im Editor: nutzt die P68-Dialog-Chrome (gleiches
  #     Aussehen), zeigt Icon-VORSCHAU, Contains-Suche über den Icon-Namen,
  #     scrollbar, zusätzlich Filter NACH LIB.
  #
  # Umfang (Dateien):
  #   • schema: Icon-Wert-Typ { library?: string, name: string } (backend-neutral);
  #     icon-Feld binding-fähig (literal {library,name} ODER dynamische Bindung);
  #     icon zu ui-button (prefix, ggf. suffix) und ui-avatar (Fallback) ergänzen;
  #     ui-icon vorhanden; menu/list/empty-state auf neuen Typ migrieren
  #     (Back-Compat: nackter String → Default-Lib).
  #   • renderer/shoelace-adapter: kind "icon" + icon-Slots rendern als
  #     <sl-icon library name>; Bindung auflösen; Default-Lib wenn library leer.
  #   • Icon-Library-Registry (global/Modul): Konfigurationsmechanismus für Libs
  #     { name, lokaler Asset-Pfad/Resolver }; client-seitige Registrierung via
  #     registerIconLibrary in der Client-Bootstrap (nodes/webapp.js <head>).
  #   • Manifest: Server-Endpoint bzw. generiertes Manifest, das die Icon-Namen
  #     pro Library auflistet (Quelle für den Picker).
  #   • editor: Icon-Picker-Dialog (P68-Chrome wiederverwenden) mit Vorschau
  #     (lokale SVGs/Manifest, kein Shoelace im Editor nötig), Namens-Suche,
  #     Lib-Filter; typedInput für das Icon-Feld (literal-Picker + dynamisch).
  #   • webapp.js: mapConfig der Icon-Felder → {library,name}-Bindung; Lib-
  #     Registrierung; Manifest-Endpoint.
  #   • examples nur via scripts/gen-example.js, falls Felder sich ändern.
  #   • Tests: schema (Icon-Wert, Bindung, Back-Compat); renderer (Render mit
  #     Library, Default-Lib, dynamisch); Manifest; E2E Icon-Picker (Suche,
  #     Lib-Filter, Auswahl).
  #
  # Offene Design-Punkte (bei Umsetzung klären):
  #   • Konkreter globaler Konfig-Ort für Libs (Node-RED settings vs. Modul-
  #     Konfigdatei vs. ENV) — entscheiden.
  #   • Editor-Vorschau via <img src=SVG> vs. sl-icon im Editor laden.
  #   • Performance: Picker mit 2000+ Icons → virtualisierte/lazy Liste + Suche.
  #
  # Risiken: Portabilität von {library,name} gilt nur, wenn die Lib im Ziel-
  # Backend registriert ist (dokumentieren); Back-Compat-Migration bestehender
  # Freitext-Icons; registerIconLibrary-Client-Wiring + Base-Path (P63).
  # ════════════════════════════════════════════════════════════════════════

