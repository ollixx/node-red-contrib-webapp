  # ════════════════════════════════════════════════════════════════════════
  # Editor-Feld-Konsolidierung + Varianten-Vokabular (P49–P51)
  #
  # Aufgedeckt bei der Knoten-Review (2026-06-06): das `variant`-Feld soll im
  # Editor als SelectBox erscheinen. Die Analyse legte zwei Probleme frei.
  #
  # PROBLEM 1 — Varianten-Vokabular fehlt / ist semantisch vermischt:
  #   • Varianten sind EBENE 2 in theming.md (semantische Rollen wie primary,
  #     danger, ghost, card …) — NICHT Tokens (Ebene 1) und NICHT vom
  #     Renderer-Backend (Ebene 3) injizierbar.
  #   • Entscheidung des Owners: festes, PORTABLES Vokabular (kleinster
  #     gemeinsamer Nenner, ADR 0002 Snapshot-Naht) — ABER bewusst GROSSZÜGIG
  #     ausgelegt. Ein Backend darf mehrere Varianten auf dieselbe konkrete
  #     Implementierung mappen (z.B. Shoelace bildet `ghost` und `link` evtl.
  #     beide auf dasselbe ab). So bleibt der Contract ausdrucksstark, ohne
  #     dass jedes Backend jede Variante optisch unterscheiden muss.
  #   • `variant` steht NICHT im Schema (packages/schema/src/contracts.ts);
  #     im Serializer (resources/lib/webapp-serializer.js) ist es ad-hoc: nur
  #     ui-button hat ein echtes Mapping, ui-alert nutzt `severity`, ui-badge
  #     `severity || variant`. Die Ebene-2-Listen aus theming.md sind nirgends
  #     codifiziert.
  #   • ACHTUNG semantische Vermischung: einige Knoten nennen ein Feld
  #     `variant`, das in Wahrheit ein ANZEIGE-TYP ist, keine Ebene-2-Rolle —
  #     z.B. ui-progress `bar/spinner/circular`, ui-list/ui-menu Darstellungs-
  #     modi. Diese müssen von echten Varianten getrennt werden (eigenes Feld,
  #     z.B. `displayType`), sonst wird das SelectBox-Vokabular bedeutungslos.
  #
  # PROBLEM 2 — gemeinsame Editor-Felder sind dupliziert, nicht zentral:
  #   • editor-common.js (von allen 36 Knoten geladen) teilt nur die LOGIK
  #     (SelectBox, Mount-Tree, installLayoutChildPropRows-Sichtbarkeit).
  #   • Das MARKUP gemeinsamer Felder ist dupliziert: die 7 Platzierungs-Zeilen
  #     (order/row/col/colSize/rowSize/layoutX/layoutY) sind byte-identisch in
  #     28 HTML-Dateien einkopiert; `variant` ist 6× handgestrickt (5× <select>
  #     mit je eigener Optionsliste, 1× freies Textfeld).
  #   • Würde man P50/P51 naiv umsetzen, zementierte man diese Duplikation
  #     (variant: 7. Sonderfall; grid: 28 Dateien editieren). Deshalb baut
  #     P49a zuerst eine ZENTRALE, schema-gespeiste Feld-Injektion, auf die
  #     P50 (variant) und P51 (grid) dann aufsetzen.
  #
  # Reihenfolge & Abhängigkeiten:
  #   P49  Vokabular + Serializer-Mapping + Entmischung variant/displayType
  #        (Single Source of Truth im Schema).            [dep P48]
  #   P49a Zentrale Editor-Feld-Injektion + Migration der Grid-Platzierungs-
  #        Zeilen (reiner Refactor, kein Verhaltenswechsel). [dep P48]
  #   P50  Variant-SelectBox über alle Knoten, gespeist aus P49-Vokabular,
  #        gebaut mit der P49a-Infrastruktur.              [dep P49, P49a]
  #   P51  Grid-Props als positive Integer (Schema + zentraler Helper).
  #                                                        [dep P49a]
  # Die SelectBox darf NIE aus dem aktiven Backend gespeist werden.
  # ════════════════════════════════════════════════════════════════════════

  - { id: P49, title: "Varianten-Vokabular im Schema + einheitliches Serializer-Mapping", status: done, dependencies: [P48], archive: "docs/agent-roadmap-archive.yaml#P49" }

  - { id: P49a, title: "Zentrale Editor-Feld-Injektion + Migration der Grid-Platzierungs-Zeilen", status: done, dependencies: [P48], archive: "docs/agent-roadmap-archive.yaml#P49a" }

  - { id: P49b, title: "Tech-Debt: severity-Feld-Enum mit SEVERITY_VARIANTS abgleichen", status: done, dependencies: [P49], archive: "docs/agent-roadmap-archive.yaml#P49b" }

  - { id: P50, title: "Editor-SelectBox für `variant` — gespeist aus dem Schema-Vokabular", status: done, dependencies: [P49, P49a], archive: "docs/agent-roadmap-archive.yaml#P50" }

  # ════════════════════════════════════════════════════════════════════════
  # Grid-Platzierung: Validierung & dynamische Werte (P51–P52)
  #
  # Aufgedeckt bei der Knoten-Review (2026-06-06): die Grid-Child-Props
  # row / col / colSize / rowSize werden im Schema aktuell nur als
  # z.number().int().optional() geprüft (packages/schema/src/node-definitions.ts
  # Z. 24–27). Damit sind 0 und negative Werte erlaubt — fachlich falsch:
  # Grid-Spalten/-Zeilen sind 1-basiert, ein Span < 1 ist sinnlos.
  #
  #   • Feste Invariante (über alle Folgephasen): row/col/colSize/rowSize müssen
  #     POSITIVE INTEGER (>= 1) sein. layoutX/layoutY (absolute-Layout) sind NICHT
  #     betroffen — dort ist 0 die legitime obere linke Ecke.
  #   • P51 setzt auf der zentralen Editor-Feld-Injektion aus P49a auf: die
  #     min/step/Validierung der Grid-Zeilen wird dort EINMAL gesetzt, nicht in
  #     28 HTML-Dateien. Deshalb dep [P49a] statt [P48].
  #   • Offene Designfrage (P52): sollen diese Felder dynamisch werden — Update
  #     per Input-Message (auf P39 aufbauend) und/oder typedInput-Bindings
  #     (msg/flow/global, über die heutigen literal/state/query/routeParam-Kinds
  #     hinaus)? Egal wie: validiert wird immer auf positive Integer.
  # ════════════════════════════════════════════════════════════════════════

  - { id: P51, title: "Grid-Child-Props row/col/colSize/rowSize müssen positive Integer sein", status: done, dependencies: [P49a], archive: "docs/agent-roadmap-archive.yaml#P51" }

  - { id: P52, title: "Dynamische Werte für Grid-Platzierung — Evaluation + ggf. Umsetzung", status: done, dependencies: [P51], archive: "docs/agent-roadmap-archive.yaml#P52" }

  # ════════════════════════════════════════════════════════════════════════
  # ui-action: vollständiges Interaktions-Verb-Set + Doc/Impl-Entmischung (P53)
  #
  # Aufgedeckt bei der Knoten-Review (2026-06-06): ein Button wurde mit einer
  # ui-action `show` verdrahtet — es passiert NICHTS. Diagnose:
  #
  #   • Der Pfad an sich stimmt: Button-Klick → Output-Port → ui-action →
  #     pushActionCommandToClients → SSE-"command" → Client applyCommand().
  #     Der Aktions-Effekt reist per SSE an den Browser, NICHT in der Wire-msg
  #     (die durchgereichte msg ist bewusst der unveränderte Klick-Event, damit
  #     der Flow dahinter weiterarbeiten kann — events.md). Das ist korrekt und
  #     bleibt so.
  #   • ABER: der Client-Switch applyCommand() (resources/lib/webapp-client.js)
  #     kennt nur navigate / openDialog / closeDialog / hide. show / enable /
  #     disable / focus / reset fallen in den default-Zweig und sind NO-OPS.
  #     Es gibt keine client-seitige Interaktions-State-Schicht (Sichtbarkeit /
  #     enabled / focus) die ein Command mutiert und die der nächste Snapshot
  #     respektiert. → show/hide/enable/disable/focus/reset für ELEMENTE sind
  #     faktisch nicht implementiert.
  #   • Vokabular-Drift Doc vs. Impl: actions.md definiert show/hide als DIALOG-
  #     Verben (Feld `dialog`) und listet noch submit/remove — beide in P29 als
  #     CRUD gekillt. Die Impl nutzt openDialog/closeDialog mit `target`. `hide`
  #     ist im Client als „Dialog schließen" verdrahtet, nicht „Element
  #     verstecken". Das ist Stop-Condition 5 (Doc widerspricht Impl).
  #
  # Vorgeschlagenes kanonisches Vokabular (im ADR final zu entscheiden) —
  # in drei semantische Klassen getrennt:
  #   • Sichtbarkeit:  show / hide   → beliebiges Element (display an/aus)
  #   • Offenlegung:   open / close  → aufklappbare Elemente, die sichtbar sind
  #       (Dialog-Overlay, Drawer, Accordion-Sektion, Collapse/Details,
  #        Tree-Branch). Ersetzt das alte openDialog/closeDialog — ein Verb,
  #        das `target` sagt was. HTML/Shoelace nutzen durchgängig ein
  #        `open`-Attribut, das passt.
  #   • Einzelauswahl: select        → genau eines aus Geschwistern aktiv
  #       (Tab, Stepper-Schritt, Menü). NICHT open/close. Kandidat-Verb, im
  #        ADR zu bestätigen.
  #   plus: navigate · enable/disable · focus · reset.
  #   submit/remove endgültig raus (P29).
  #   ACHTUNG Abgrenzung: show/hide (Präsenz) ≠ open/close (Offenlegungszustand
  #   eines sichtbaren Elements). Ein Button kann show/hide, nicht open.
  #   open/close braucht Target-GRANULARITÄT: bei Accordion/Tree wird eine
  #   Sektion/Branch geöffnet → Command-Schema = target + optionale Sub-ID.
  # ════════════════════════════════════════════════════════════════════════

