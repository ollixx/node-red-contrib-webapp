  # ────────────────────────────────────────────────────────────────────────
  # Web Component rendering migration — see docs/adr/0002-web-component-rendering-and-theming.md
  # Goal: unify on the framework-agnostic RenderSnapshot, ship a Web Component
  # default adapter, and lock the theme = tokens + adapter (no node injection) model.
  # ────────────────────────────────────────────────────────────────────────

  - { id: P21, title: "Renderer consolidation — webapp.js consumes RenderSnapshot", status: done, dependencies: [P20b], archive: "docs/agent-roadmap-archive.yaml#P21" }

  - { id: P22, title: "Snapshot transport — JSON endpoint and thin client runtime", status: done, dependencies: [P21], archive: "docs/agent-roadmap-archive.yaml#P22" }

  - { id: P23, title: "Web Component default adapter — Shoelace", status: done, dependencies: [P22], archive: "docs/agent-roadmap-archive.yaml#P23" }

  # ────────────────────────────────────────────────────────────────────────
  # Completing the Web Component look — see docs/adr/0002-web-component-rendering-and-theming.md
  # P23 wired Shoelace (CDN, token bridge, adapter) and a follow-up routed
  # button/input through it, but the PAGE itself still renders through the old
  # bespoke <style> block + .webapp-shell/.webapp-slot scaffold in nodes/webapp.js
  # (beige/serif "Runtime Preview" theme). The app therefore still looks like the
  # old design. These phases finish the migration at the page and component level.
  # ────────────────────────────────────────────────────────────────────────

  - { id: P24, title: "Page shell and theme — Shoelace + design tokens", status: done, dependencies: [P23], archive: "docs/agent-roadmap-archive.yaml#P24" }

  - { id: P25, title: "Adapter coverage — remaining component kinds + map corrections", status: done, dependencies: [P24], archive: "docs/agent-roadmap-archive.yaml#P25" }

  # ────────────────────────────────────────────────────────────────────────
  # Closing the runtime gap exposed by the P24/P25 review (2026-05-31).
  # P23–P25 made the SERVER emit Shoelace, but the browser barely shows it:
  #   1. The thin client (resources/lib/webapp-client.js) is still on the P22
  #      plain-HTML markup. On hydrate() it morphs the grid and OVERWRITES the
  #      server's sl-* markup — buttons/inputs become native unstyled elements,
  #      only containers keep an sl-card. All P23–P25 adapter work is invisible
  #      at runtime (it flashes for one frame, then is wiped). → P26.
  #   2. nodes/webapp.js still hard-codes the Customers demo "backend": demo
  #      query data, customerDraftFromRecord/nextCustomerId, the open/close/
  #      save/deleteCustomer handlers (legacy-preview-action branch) and a
  #      hard-coded dialog "Close" link + "/customers" fallbacks. The example's
  #      behaviour is NOT driven by its nodes. → P27.
  #   3. The example flow predates the Shoelace + node-driven-content model:
  #      routeHome renders empty, and content used to lean on hard-coded HTML.
  #      It needs a clean, fully declarative rebuild. → P28.
  # ────────────────────────────────────────────────────────────────────────

  - { id: P26, title: "Render parity — shared serializer for server and thin client", status: done, dependencies: [P25], archive: "docs/agent-roadmap-archive.yaml#P26" }

  - { id: P27, title: "De-hardcode the runtime — node-driven demo behaviour and data", status: done, dependencies: [P26], archive: "docs/agent-roadmap-archive.yaml#P27" }

  - id: P28
    title: Rebuild the Customers CRUD example from scratch — fully declarative
    status: in_progress
    dependencies: [P27]
    goals:
      - Regenerate the Customers CRUD example so EVERY surface is built from nodes under the new Shoelace + node-driven-content model — no empty routes, no reliance on hard-coded HTML or a runtime-baked backend. This is the showcase that the declarative model is complete end-to-end.
    deliverables:
      - "rewrite scripts/gen-example.js so the generated examples/customers-crud/flow.json builds all content as nodes: a populated home route (routeHome currently renders empty — give it real content or a declarative redirect to /customers), the customers list, the customer detail route, and the editor dialog — every region's content comes from mounted nodes"
      - "the example exercises the P23–P25 component coverage where it makes sense (e.g. status as ui-badge, feedback as ui-alert) so the example doubles as a visual catalogue of the Shoelace adapter"
      - "regenerate examples/customers-crud/flow.json AND .node-red-dev/flows.json via pnpm gen:example (per CLAUDE.md these are generated, not hand-edited)"
      - "update docs/nodes / example docs to describe the rebuilt flow if node usage changed"
    validation:
      - pnpm test passes with no failures
      - "pnpm exec playwright test (customers-crud e2e on :1882) passes — list, detail, create, edit, delete flows green against the regenerated flow"
      - "unit test: the home route (location '/') renders non-empty content (regions are not all empty)"
      - "manual: screenshots of /, /customers and the editor dialog on the dev app (:1881) show a complete, styled, node-built app — the human confirms 'the app is clearly visible and looks right'"
      - "consistency check: examples/customers-crud/flow.json and .node-red-dev/flows.json match the gen-example output (no hand edits)"

  # Deferred — only when a concrete need appears (see ADR 0002):
  #   - ui-custom escape-hatch node for framework-specific components (opt-in, non-portable)
  #   - SSR / hydration adapter for any public, search-indexed surface
  #   - additional adapters (Material Web, React+MUI) — additive, below the snapshot seam