  # ════════════════════════════════════════════════════════════════════════
  # Bugfix: Shoelace Token-Bridge erzeugt CSS-Cycles → fehlendes Padding (P62)
  #
  # Aufgedeckt 2026-06-06 (Owner-Report: gerenderter sl-button ohne Padding,
  # sieht nicht aus wie in der Shoelace-Doku). Ursache verifiziert (isolierte
  # Browser-Repro + getComputedStyle):
  #   buildShoelaceTokenBridgeCss() (packages/renderer/src/shoelace-adapter.ts)
  #   emittiert pro Token  --sl-X: var(--wa-Y, var(--sl-X));  — der Fallback
  #   verweist auf DIESELBE Property. Ist --wa-Y gesetzt (Farben/font-family/
  #   radius-md), greift Arm 1 → ok. Ist --wa-Y NICHT gesetzt, triggert der
  #   Fallback var(--sl-X) einen Self-Reference → Dependency-CYCLE → die Property
  #   wird per CSS-Spec guaranteed-invalid (der Shoelace-Default wird NICHT
  #   wiederhergestellt). sl-button::part(label) nutzt padding:0 var(--sl-spacing-
  #   medium) → Padding kollabiert auf 0. Beweis: --sl-spacing-medium = invalid
  #   (buggy) vs 1rem (literal-Fallback); Label-Padding 0px vs 16px; Button 92px
  #   vs 117px.
  #
  #   Ohne --wa-*-Default im <head> :root (nodes/webapp.js) und damit aktuell
  #   STILL kaputt: --sl-spacing-medium (sichtbar), --sl-font-weight-normal/bold,
  #   --sl-line-height-normal, --sl-border-radius-small/large/circle.
  #   (--wa-spacing-unit, --wa-font-weight-*, --wa-line-height-base,
  #   --wa-radius-sm/lg/full sind im Default-:root nicht definiert.)
  #
  # Owner-Entscheidung (2026-06-06): als Phase einplanen (nicht ad-hoc fixen).
  # ════════════════════════════════════════════════════════════════════════

