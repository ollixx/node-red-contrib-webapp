  # ════════════════════════════════════════════════════════════════════════
  # Grid-Platzierung: Validierung & dynamische Werte (P51–P52)
  #
  # Aufgedeckt bei der Knoten-Review (2026-06-06): die Grid-Child-Props
  # row / col / colSize / rowSize werden im Schema aktuell nur als
  # z.number().int().optional() geprüft (packages/schema/src/node-definitions.ts
  # Z. 24–27). Damit sind 0 und negative Werte erlaubt — fachlich falsch:
  # Grid-Spalten/-Zeilen sind 1-basiert, ein Span < 1 ist sinnlos.
  #
  #   • Feste Invariante (über alle Folgephasen): row/col/colSize/rowSize müssen
  #     POSITIVE INTEGER (>= 1) sein. layoutX/layoutY (absolute-Layout) sind NICHT
  #     betroffen — dort ist 0 die legitime obere linke Ecke.
  #   • P51 setzt auf der zentralen Editor-Feld-Injektion aus P49a auf: die
  #     min/step/Validierung der Grid-Zeilen wird dort EINMAL gesetzt, nicht in
  #     28 HTML-Dateien. Deshalb dep [P49a] statt [P48].
  #   • Offene Designfrage (P52): sollen diese Felder dynamisch werden — Update
  #     per Input-Message (auf P39 aufbauend) und/oder typedInput-Bindings
  #     (msg/flow/global, über die heutigen literal/state/query/routeParam-Kinds
  #     hinaus)? Egal wie: validiert wird immer auf positive Integer.
  # ════════════════════════════════════════════════════════════════════════

  - id: P51
    title: "Grid-Child-Props row/col/colSize/rowSize müssen positive Integer sein"
    status: pending
    dependencies: [P49a]
    # Routine schema + editor tightening, built on the P49a central field
    # injection so the editor rule lives in ONE place, not 28 files. Use sonnet.
    goal: |
      Enforce that the grid placement child props are positive integers (>= 1)
      in BOTH the schema and the Node-RED editor. This is the firm, undisputed
      part of the grid-placement review — independent of the dynamic-value
      question (P52).
    scope: |
      1. packages/schema/src/node-definitions.ts (mountableNodeSchema, ~Z. 24–27)
         - row, col, colSize, rowSize: change z.number().int() to
           z.number().int().positive() with clear messages, e.g.
           "Grid columns are 1-based — col must be a positive integer."
         - Do NOT touch layoutX / layoutY: 0 is a valid absolute coordinate.
         - Rebuild: pnpm build.

      2. resources/lib/editor-common.js (the central placement-row injection
         introduced by P49a — edit it ONCE, not per node)
         - In the injected markup for row/col/colSize/rowSize set min="1"
           step="1" and add client-side validation so an out-of-range value
           flags the node (invalid badge) before deploy, consistent with the
           existing editor validation pattern. Because P49a centralised the
           rows, this change applies to all nodes automatically.

      3. docs/nodes/concepts/layout.md
         - Document the positive-integer constraint for grid placement and the
           explicit exception for layoutX/layoutY.

      4. Check fixtures / example generator for any 0-valued grid props that
         would now fail validation; fix them (and regenerate examples via
         pnpm gen:node-examples if the generator emits any).
    validation: |
      - pnpm build passes.
      - pnpm test passes; add a unit test asserting the schema REJECTS 0,
        negative, and non-integer for row/col/colSize/rowSize, and still
        ACCEPTS 0 for layoutX/layoutY.
      - `pnpm exec playwright test` passes; an editor spec asserts a grid
        child node with col=0 is flagged invalid.

  - id: P52
    title: "Dynamische Werte für Grid-Platzierung — Evaluation + ggf. Umsetzung"
    status: pending
    dependencies: [P51]
    # Architecture-sensitive: touches the binding model and the placement
    # resolution path in renderer + thin client. Decision-first. Use opus.
    goal: |
      Evaluate whether the grid placement props (row/col/colSize/rowSize) should
      support dynamic values, and — if the evaluation says yes — implement the
      chosen subset. Decision-first: this phase produces an ADR before any
      implementation.

      Two candidate capabilities (independent; the ADR decides which, if any):
        A) Update via input message — let a flow change placement at runtime
           through the input port (building on P39's msg.payload / msg.ui.patch),
           with positive-integer validation enforced ON THIS PATH too.
        B) typedInput bindings — allow the editor to bind these fields to
           msg / flow / global values (new binding kinds beyond the current
           literal / state / query / routeParam), resolved at render time.
    scope: |
      1. Write docs/adr/0004-dynamic-grid-placement.md:
         - Weigh the value (runtime-reconfigurable layouts) against the cost:
           layout is STRUCTURAL — dynamic placement means the thin client must
           re-place elements on update (reflow), and binding kinds msg/flow/
           global are a broader concept than the current render-time bindings.
         - Decide: implement A, A+B, or neither-now (with rationale). If the
           decision is "neither now", record it and STOP — the firm validation
           from P51 already stands.
      2. If A is chosen: route placement-prop updates through the input handler,
         validate the resolved value as a positive integer (reuse P51's rule),
         reject/ignore invalid updates with a clear node error, and push a
         snapshot so the element re-places.
      3. If B is chosen: extend the binding model + editor typedInput, resolve
         placement bindings in the renderer/serializer, and validate the
         resolved value as a positive integer at render time.
    validation: |
      - ADR 0004 committed and referenced from this phase's archive entry.
      - INVARIANT regardless of the chosen path: any resolved placement value
        that is not a positive integer is rejected/ignored with a clear error —
        unit-tested.
      - If A/B implemented: pnpm validate + `pnpm exec playwright test` pass,
        with an E2E test driving a runtime placement change end to end.
      - If neither: P51's validation tests remain green; the ADR documents the
        deferral and any follow-up trigger.

  # ════════════════════════════════════════════════════════════════════════
  # ui-action: vollständiges Interaktions-Verb-Set + Doc/Impl-Entmischung (P53)
  #
  # Aufgedeckt bei der Knoten-Review (2026-06-06): ein Button wurde mit einer
  # ui-action `show` verdrahtet — es passiert NICHTS. Diagnose:
  #
  #   • Der Pfad an sich stimmt: Button-Klick → Output-Port → ui-action →
  #     pushActionCommandToClients → SSE-"command" → Client applyCommand().
  #     Der Aktions-Effekt reist per SSE an den Browser, NICHT in der Wire-msg
  #     (die durchgereichte msg ist bewusst der unveränderte Klick-Event, damit
  #     der Flow dahinter weiterarbeiten kann — events.md). Das ist korrekt und
  #     bleibt so.
  #   • ABER: der Client-Switch applyCommand() (resources/lib/webapp-client.js)
  #     kennt nur navigate / openDialog / closeDialog / hide. show / enable /
  #     disable / focus / reset fallen in den default-Zweig und sind NO-OPS.
  #     Es gibt keine client-seitige Interaktions-State-Schicht (Sichtbarkeit /
  #     enabled / focus) die ein Command mutiert und die der nächste Snapshot
  #     respektiert. → show/hide/enable/disable/focus/reset für ELEMENTE sind
  #     faktisch nicht implementiert.
  #   • Vokabular-Drift Doc vs. Impl: actions.md definiert show/hide als DIALOG-
  #     Verben (Feld `dialog`) und listet noch submit/remove — beide in P29 als
  #     CRUD gekillt. Die Impl nutzt openDialog/closeDialog mit `target`. `hide`
  #     ist im Client als „Dialog schließen" verdrahtet, nicht „Element
  #     verstecken". Das ist Stop-Condition 5 (Doc widerspricht Impl).
  #
  # Vorgeschlagenes kanonisches Vokabular (im ADR final zu entscheiden) —
  # in drei semantische Klassen getrennt:
  #   • Sichtbarkeit:  show / hide   → beliebiges Element (display an/aus)
  #   • Offenlegung:   open / close  → aufklappbare Elemente, die sichtbar sind
  #       (Dialog-Overlay, Drawer, Accordion-Sektion, Collapse/Details,
  #        Tree-Branch). Ersetzt das alte openDialog/closeDialog — ein Verb,
  #        das `target` sagt was. HTML/Shoelace nutzen durchgängig ein
  #        `open`-Attribut, das passt.
  #   • Einzelauswahl: select        → genau eines aus Geschwistern aktiv
  #       (Tab, Stepper-Schritt, Menü). NICHT open/close. Kandidat-Verb, im
  #        ADR zu bestätigen.
  #   plus: navigate · enable/disable · focus · reset.
  #   submit/remove endgültig raus (P29).
  #   ACHTUNG Abgrenzung: show/hide (Präsenz) ≠ open/close (Offenlegungszustand
  #   eines sichtbaren Elements). Ein Button kann show/hide, nicht open.
  #   open/close braucht Target-GRANULARITÄT: bei Accordion/Tree wird eine
  #   Sektion/Branch geöffnet → Command-Schema = target + optionale Sub-ID.
  # ════════════════════════════════════════════════════════════════════════

  - id: P53
    title: "ui-action — vollständiges Interaktions-Verb-Set client-seitig + Vokabular-Entmischung"
    status: pending
    dependencies: [P48]
    # Architecture-sensitive + product decision: fixes the canonical action
    # vocabulary (doc vs impl drift) and introduces a client-side interaction-
    # state layer the snapshot respects. Decision-first (ADR). Use opus.
    goal: |
      Make every documented ui-action verb actually work end to end, and resolve
      the doc/implementation vocabulary drift. Today only navigate / openDialog /
      closeDialog work; show / hide(element) / enable / disable / focus / reset
      are pushed as SSE commands but the client no-ops them — and actions.md
      still uses show/hide for dialogs and lists the P29-killed submit/remove.

      Constraint (unchanged, do not regress): the action effect travels via the
      SSE "command" channel to the browser. The ui-action OUTPUT port keeps
      passing the incoming msg through UNCHANGED so the flow can chain — the
      action is NOT injected into the wire msg. Actions change INTERACTION state
      only (actions.md); never business data.
    scope: |
      1. docs/adr/0005-ui-action-interaction-vocabulary.md
         - Fix the canonical verb set in three semantic classes:
             * show / hide      — element presence/visibility (any element)
             * open / close     — disclosure state of openable, visible
                                  elements (dialog, drawer, accordion section,
                                  collapse/details, tree branch). Replaces
                                  openDialog/closeDialog with one general pair.
             * select           — single-active-among-siblings (tab, stepper,
                                  menu); NOT open/close. Confirm or defer.
             plus navigate, enable/disable, focus, reset. Drop submit/remove
             (P29). Keep show/hide DISTINCT from open/close.
         - Target model: align on `target` (keep msg.ui.action.targetId
           override). open/close needs GRANULARITY — a target node id PLUS an
           optional sub-id (accordion section / tree branch / tab). Define how
           the command carries it (e.g. target + part).
         - Decide how visibility / open-state / enabled / focus is represented
           client-side so it survives a snapshot re-render (the core
           architectural question) — open/close reuses the same interaction
           overlay as show/hide, just keyed differently.
      2. resources/lib/webapp-client.js — applyCommand()
         - Implement show / hide (element), enable / disable, focus, reset
           against a per-client interaction-state overlay; re-apply it on every
           snapshot render so a ui-store-driven snapshot push does not wipe a
           prior show/hide. Resolve the command `target` to the rendered node.
      3. resources/lib/webapp-serializer.js
         - Ensure the serializer respects the interaction-state overlay
           (visibility/disabled) when (re-)rendering, server and thin client
           byte-identical (P26 invariant).
      4. nodes/webapp.js — buildActionCommand / pushActionCommandToClients
         - Emit the canonical verbs; keep clientId targeting (P15). No business
           logic. (Mind concurrent edits — sequence after P48.)
      5. nodes/behavior/ui-action.html + docs/nodes/behavior/ui-action.md
         - Editor actionType options = the canonical set (SelectBox); remove
           submit/remove. Rewrite actions.md to match the implementation
           (show/hide = elements, openDialog/closeDialog = dialogs, `target`
           field) and drop the stale verbs.
    validation: |
      - ADR 0005 committed and referenced from this phase's archive entry.
      - pnpm validate passes.
      - `pnpm exec playwright test` passes; add E2E per verb:
          * show/hide → target element appears/disappears in the browser;
          * enable/disable → target gets/loses [disabled];
          * open/close → dialog toggles (the former openDialog behaviour, kept);
          * open/close with target granularity → opening one accordion section
            (target + sub-id) opens that section only;
          * a show, FOLLOWED BY a ui-store snapshot push, keeps the element
            shown (interaction overlay survives re-render).
      - The ui-action OUTPUT still passes the incoming msg through unchanged
        (wire chaining intact) — asserted by intercepting the wired output.
      - docs/nodes/behavior/ui-action.md matches the implementation (no
        submit/remove; show/hide documented as element visibility).

  # Deferred — only when a concrete need appears (see ADR 0002):
