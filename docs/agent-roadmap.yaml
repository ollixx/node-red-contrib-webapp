  # So the app's entry path is dead: land on "/", click "Go to customers",
  # nothing happens.
  #
  # The existing tests/e2e/customers-crud.spec.ts passes anyway because it is
  # shaped around the WORKING paths: it deep-links straight to /customers
  # (never visits "/"), never clicks "Go to customers" or "Back" (only asserts
  # Back is visible), and has no UPDATE/edit-in-place test. It also leans on
  # arbitrary page.waitForTimeout(500/800) hacks that paper over live-transport
  # races. Green here proves almost nothing about the app a user actually uses.
  # This is a gen-example.js wiring bug + an E2E coverage hole, not a runtime
  # (webapp.js) bug.
  # ════════════════════════════════════════════════════════════════════════

  - { id: P34, title: "Full-journey CRUD E2E from the home route + dead-control guard, fix to green", status: done, dependencies: [P33], archive: "docs/agent-roadmap-archive.yaml#P34" }

