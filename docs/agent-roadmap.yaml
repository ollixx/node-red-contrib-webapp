  # ════════════════════════════════════════════════════════════════════════
  # ui-action / ui-route Navigation — zwei Szenarien + Validierung (P66)
  #
  # Owner-Report (2026-06-07): Navigation via ui-action/ui-route ist noch nicht
  # fertig konzipiert. Heute muss in ui-action ein roher Pfad (`to`) eingegeben
  # werden, der obsolet/redundant ist, sobald man per Verknüpfung zu einer
  # ui-route navigiert (der Pfad steht schon in ui-route.path → driftet still,
  # wenn die Route umbenannt wird). (URL-)Parameter sind aber in beiden Fällen
  # relevant.
  #
  # Ist-Stand (verifiziert):
  #   • ui-action: actionType "navigate" + rohes Pfad-Feld `to` (contracts.ts:217,
  #     node-definitions.ts:280); mapConfig webapp.js:3025; actionInputHandler
  #     webapp.js:2535; buildActionCommand webapp.js:1882. Navigation ist heute
  #     REIN PFADBASIERT, nicht route-ID-basiert.
  #   • "navigate" ist app-globales Verb (webapp.js:2424) → wird an die zugehörige
  #     ui-app/ui-route geroutet; ui-route nutzt interactionInputHandler
  #     (passThrough) (webapp.js:2675) und führt heute selbst KEINE Navigation
  #     anhand des eigenen path aus.
  #   • ui-route: path mit :param-Platzhaltern + events ["onEnter","onLeave"]
  #     (node-definitions.ts:167/173).
  #   • Renderer: matchRoute (renderer.ts:259) löst Route-Params per Regex;
  #     resolveNavigationTarget (renderer.ts:370) füllt :platzhalter aus
  #     payload.params u.a.; binding kind "routeParam" (renderer.ts:212).
  #   • KEINE Cross-Validierung: dass `to` zu einer existierenden Route passt,
  #     wird nicht geprüft.
  #
  # Owner-Entscheidungen (2026-06-07):
  #   Zwei Usage-Szenarien für actionType "navigate":
  #   • SZENARIO 1 — ui-action ist per OUTPUT-PORT-WIRE mit einer ui-route
  #     verknüpft (Link = Verdrahtung, KEIN routeId-Referenzfeld). Die Message
  #     enthält action.params (benamste Key/Values → URL-Params). KEIN Pfad an der
  #     Action nötig. Die verdrahtete ui-route baut die Location aus IHREM EIGENEN
  #     path + den params und navigiert.
  #   • SZENARIO 2 — ui-action ist NICHT mit einer ui-route verdrahtet. Dann muss
  #     `to` ausgefüllt sein (Pfad-Template inkl. Params); geht app-global an die
  #     ui-app, die die Location auflöst und navigiert.
  #   • onEnter wird IMMER bei Routen-Eintritt emittiert — in BEIDEN Szenarien,
  #     entkoppelt vom Navigations-Mechanismus (onEnter = Folge des Ankommens).
  #   • GLEICHES VERHALTEN FÜR DEN IMPLIZITEN ROOT-PFAD "/" DER ui-app
  #     (Owner 2026-06-07): ui-app besitzt die implizite Root-Route
  #     (createAppRootRoute, id===appId, path "/"); Home-Content mountet direkt in
  #     die ui-app-Slots OHNE eigene ui-route. ui-app muss daher eine an sie
  #     verdrahtete navigate-Action GENAUSO behandeln wie eine ui-route (zur Root
  #     navigieren, params) UND onEnter/onLeave beim Root-Eintritt emittieren.
  #     Heute hat ui-app nur events ["clientConnected","clientDisconnected"]
  #     (node-definitions.ts:142) — onEnter/onLeave müssen ergänzt werden.
  #   • `to` wird ein typedInput mit mehreren Typen (str / msg / flow / global /
  #     JSONATA), damit der Pfad statisch, per Input-Message ODER dynamisch
  #     (JSONata) geliefert werden kann. Params im Pfad-Modus stecken im Pfad.
  #   • Validierung (Fehler bei Mehrdeutigkeit/Ungültigkeit):
  #       - navigate verdrahtet-zu-Route UND `to` gesetzt → Fehler (mehrdeutig).
  #       - navigate ohne Wire-zu-Route UND ohne `to` → Fehler (kein Ziel).
  #       - navigate mit STATISCHEM `to`, das zu KEINER ui-route passt → Fehler
  #         (toter Link; jeder navigierbare Pfad muss eine ui-route haben).
  #       - dynamischer `to` (msg/JSONata) ist zur Edit-Zeit nicht prüfbar →
  #         Laufzeitfehler bei No-Match.
  #
  # Design-Konsequenz: Da der Link per WIRE läuft (für die per-Node-Editor-
  # Validierung unsichtbar), müssen die Cross-Checks (wire-zu-Route, `to`-
  # Mehrdeutigkeit, statischer-Pfad-zu-Route, geforderte :params) zur COMPILE-/
  # DEPLOY-ZEIT in webapp.js laufen (voller Flow-Graph + Routen verfügbar), nicht
  # in packages/editor (per-Node, isoliert).
  #
  # Umfang (Dateien):
  #   • schema: ui-action `to` behält Feld, neue Semantik; `to`/`toType` (Node-RED
  #     typedInput speichert Wert+Typ); neues params-Feld (Objekt/Key-Value) für
  #     Szenario 1; Validierungsverfeinerung (contracts.ts/node-definitions.ts).
  #   • nodes/behavior/ui-action.html: `to` als typedInput (str/msg/flow/global/
  #     jsonata); params Key/Value-Editor; konditionale UI je actionType=navigate.
  #   • ui-route Runtime (webapp.js): bei Empfang einer navigate-Action die
  #     Location aus eigenem path + action.params auflösen und Navigation treiben
  #     (Szenario 1). app-globales navigate löst `to`-Template (+ params) an der
  #     ui-app auf (Szenario 2). Compile-Zeit-Validierung (s.o.).
  #   • ui-app (schema + node + runtime): events-Enum um onEnter/onLeave erweitern
  #     (node-definitions.ts:142 + ui-app.html registerNodeTypeWithEvents-Liste);
  #     ui-app behandelt eine an sie verdrahtete navigate-Action wie ui-route —
  #     zur impliziten Root-Route "/" (createAppRootRoute) navigieren — und
  #     emittiert onEnter/onLeave beim Root-Eintritt. Dieselben Validierungsregeln
  #     gelten für wire-zu-ui-app (Mehrdeutigkeit etc.). Gemeinsame Handler-Logik
  #     von ui-route und ui-app faktorisieren (DRY), nicht duplizieren.
  #   • renderer: Pfad-Template-Füllung aus params vereinheitlichen
  #     (resolveNavigationTarget wiederverwenden); onEnter einheitlich emittieren.
  #   • packages/editor: per-Node-Validierung navigate (z.B. dynamischer vs.
  #     statischer `to`); Cross-Checks bleiben Runtime.
  #   • JSONata: Auswertungskontext definieren (welche Daten sieht der Ausdruck —
  #     msg?).
  #   • ui-navigation: Deprecation fortführen (ui-action navigate ist der Weg).
  #   • examples nur via scripts/gen-example.js, falls Action-Felder sich ändern.
  #   • Tests: schema; renderer (Param-Füllung, onEnter); runtime (S1 wired-route-
  #     Navigation, S2 app-global); Validierungsfehler-Fälle; E2E Navigation mit
  #     Params. Extends ADR 0007 (action-message contract) — ADR-Update prüfen.
  #
  # Risiken: Wire-Link für Editor unsichtbar → Cross-Validierung muss Runtime;
  # dynamischer `to` nicht edit-zeit-validierbar; typedInput braucht `to`+`toType`
  # in Schema/mapConfig; onEnter darf pro Eintritt genau einmal feuern (kein
  # Doppel-Fire bei direkter Route-Navigation); JSONata-Kontext sauber definieren.
  # ════════════════════════════════════════════════════════════════════════

