  # ════════════════════════════════════════════════════════════════════════
  # ui-dialog — nativer <sl-dialog> + First-class Close-Button (P64)
  #
  # Owner-Report (2026-06-07): der "Close"-Button im Dialog ist implizit und
  # hartkodiert. Verifiziert: Dialoge werden NICHT als <sl-dialog> gerendert,
  # sondern als <sl-card> in <div class="webapp-dialog"> mit einem hartkodierten
  # Close-<a>-Link, verdrahtet auf action "closeCustomerEditor"/source
  # "cancelCustomerButton" (P27-Schuld) — in resources/lib/webapp-client.js
  # (~Z.130, Hardcode-Object.assign) UND resources/lib/webapp-serializer.js
  # (renderDialogHtml ~Z.703) sowie der Server-Discovery findDialogCloseAction
  # (nodes/webapp.js ~Z.1248). Shoelaces vendored <sl-dialog> liefert nativ ein
  # X, ESC- und Overlay-Dismissal + Focus-Trap/a11y — heute ungenutzt.
  #   Attrs: open, label, no-header. Slots: label, header-actions, default(body),
  #   footer. Events: sl-request-close (detail.source close-button|keyboard|
  #   overlay), sl-hide, sl-after-hide.
  #
  # Nebenbefund (verifiziert): dispatchClientEvent (nodes/webapp.js:1153) sendet
  # IMMER auf Port 0 — es gibt KEIN per-event-name → Output-Port-Routing. Eine
  # ui-dialog mit events:["onOpen","onClose"] würde onClose falsch auf Port 0
  # emittieren. Wird in dieser Phase positional gefixt (Array nach
  # events.indexOf(event)), für Dialog mind., generell wünschenswert.
  #
  # Owner-Entscheidungen (2026-06-07):
  #   1. NATIVE Shoelace Header/X (kein selbstgebautes Chrome). closable=false
  #      ⇒ natives no-header (entfernt akzeptiertermaßen den ganzen Header inkl.
  #      Titel). Steuerung per nativer Property, NICHT per CSS.
  #   2. Neue Property closable: z.boolean().default(true) + Editor-Checkbox.
  #   3. Schließen (X/ESC/Overlay) MUSS onClose am ui-dialog-Out-Port emittieren
  #      UND Server-State ui.dialogs.{id}.open=false setzen — impliziter Close,
  #      OHNE verdrahtete Close-Action. Hardcode closeCustomerEditor/
  #      cancelCustomerButton + findDialogCloseAction entfernen.
  #   4. Neues Dialog-Layout-Preset "dialog" mit Slots header, header-actions,
  #      content, footer → gemappt auf Shoelace label / header-actions / default
  #      / footer. (header-actions = z.B. Hilfe/Maximieren neben dem nativen X.)
  #
  # Umfang (Dateien):
  #   • schema: node-definitions.ts (uiDialogNodeDefinitionSchema.closable),
  #     contracts.ts (dialogDefinitionSchema.closable), layout-presets.ts
  #     ("dialog" in standardLayoutPresetIds + Preset-Record). regionNameSchema
  #     ist z.string().min(1) → "header-actions" gültig, KEIN Schema-Umbau.
  #   • renderer: RenderedDialog.closable + Durchreichen (renderer.ts).
  #   • serializer: renderDialogHtml → <sl-dialog open label data-webapp-dialog
  #     [no-header wenn !closable]>; Slot-Mapping header→label / header-actions→
  #     header-actions / content→default / footer→footer; Slot-Attr MUSS am
  #     direkten Light-DOM-Kind sitzen (NICHT die webapp-slot/-layout-Wrapper
  #     wiederverwenden). "dialog" in getLayoutVariant (3 Kopien synchron halten:
  #     serializer, webapp-client.js, editor-common.js).
  #   • client (webapp-client.js): sl-after-hide-Listener (X/ESC/Overlay
  #     konvergieren hier) → dispatch onClose + optimistischer lokaler Close;
  #     Hardcode-Object.assign entfernen (Server/Client-Markup byte-identisch, P26).
  #   • webapp.js: mapConfig closable; in dispatchClientEvent bei ui-dialog +
  #     onClose autoritativ open=false + Snapshot-Push (Block ~1704-1721 als
  #     writeDialogOpenState/pushSnapshotToTargets faktorisieren); Out-Port-
  #     Positional-Fix; findDialogCloseAction-Nutzung entfernen.
  #   • editor: ui-dialog.html closable-Checkbox (default checked); editor-common
  #     standardLayoutPresetOptions/Slots um "dialog" ergänzen.
  #   • example: NUR via scripts/gen-example.js — customerEditor layoutId:"dialog",
  #     closable:true; closeCustomerEditor-Action entfernen; Felder→content,
  #     Save/Cancel→footer; danach pnpm gen:example. flow.json NIE handeditieren.
  #   • Tests: schema/renderer/serializer-Units + E2E customers-crud (Selektoren
  #     .webapp-dialog-card→.webapp-dialog; neuer X-/ESC-/Overlay-Close-Test;
  #     Orphan-Action-Test ohne closeCustomerEditor). Validation: pnpm validate;
  #     E2E vom Orchestrator auf develop (Worktree-Subagents können kein Playwright).
  #
  # Risiken: Server/Client-Markup-Parität (P26) — Client-Hardcode + Server-
  # findDialogCloseAction gemeinsam entfernen; Shoelace slottet nur direkte
  # Kinder; no-header entfernt den Titel mit (akzeptiert); getLayoutVariant
  # dreifach; Out-Port-Fix ist allg. Verhaltensänderung für Multi-Event-Knoten.
  # ════════════════════════════════════════════════════════════════════════

