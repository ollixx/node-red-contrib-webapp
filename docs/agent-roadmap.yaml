  - { id: P16b, title: "Core node expansion — feedback and status", status: done, dependencies: [P12], archive: "docs/agent-roadmap-archive.yaml#P16b" }

  - { id: P16c, title: "Core node expansion — navigation and structure", status: done, dependencies: [P12], archive: "docs/agent-roadmap-archive.yaml#P16c" }

