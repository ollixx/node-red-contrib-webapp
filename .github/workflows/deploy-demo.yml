# Deploy the Customers CRUD demo to Hetzner via GHCR + SSH.
#
# Trigger:
#   - Manual dispatch (workflow_dispatch) — run on demand from the GitHub UI.
#   - Push to develop — auto-deploy on every merge to develop.
#
# Deliberately NOT triggered by pull_request_target or any fork-PR event so
# that Secrets are never exposed to untrusted code.
#
# Secrets required in the "demo" GitHub Environment:
#   HETZNER_SSH_HOST      — IP or hostname of the Hetzner server
#   HETZNER_SSH_USER      — SSH user on the server (e.g. deploy)
#   HETZNER_SSH_KEY       — Private SSH key (Ed25519 recommended)
#   DEMO_DOMAIN           — Public hostname for the demo, e.g. demo.example.com
#   DEMO_BASIC_AUTH_HASH  — bcrypt hash from: caddy hash-password --plaintext 'pw'
#   NODE_RED_CREDENTIAL_SECRET  — (optional) stable secret for Node-RED credentials

name: Deploy demo

on:
  workflow_dispatch:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    name: Build image → push GHCR → deploy
    runs-on: ubuntu-latest
    environment: demo
    permissions:
      contents: read
      packages: write   # needed to push to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image name
        id: image
        run: |
          # Lowercase owner/repo for OCI compliance.
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${REPO}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_SSH_HOST }}
          username: ${{ secrets.HETZNER_SSH_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: DEMO_IMAGE,DEMO_DOMAIN,DEMO_BASIC_AUTH_HASH,NODE_RED_CREDENTIAL_SECRET
          script: |
            set -euo pipefail
            cd ~/demo

            # Pull the freshly built image.
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull

            # Restart with the new image (node-red data is ephemeral — always
            # re-seeds the demo flow for a clean reviewer experience).
            docker compose up -d --remove-orphans
        env:
          DEMO_IMAGE: ${{ steps.image.outputs.name }}:${{ github.sha }}
          DEMO_DOMAIN: ${{ secrets.DEMO_DOMAIN }}
          DEMO_BASIC_AUTH_HASH: ${{ secrets.DEMO_BASIC_AUTH_HASH }}
          NODE_RED_CREDENTIAL_SECRET: ${{ secrets.NODE_RED_CREDENTIAL_SECRET }}
