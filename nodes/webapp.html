<script type="text/javascript">
    (function () {
        function labelWithName(fallback) {
            return function () {
                return this.name || this.id || fallback;
            };
        }

        function required(value) {
            return value !== undefined && value !== null && String(value).trim().length > 0;
        }

        function register(type, definition) {
            RED.nodes.registerType(type, definition);
        }

        register("ui-app", {
            category: "webapp",
            color: "#d9efe2",
            defaults: {
                name: { value: "" },
                id: { value: "", required: true },
                title: { value: "", required: true }
            },
            inputs: 0,
            outputs: 0,
            icon: "font-awesome/fa-sitemap",
            label: labelWithName("ui-app")
        });

        register("ui-layout", {
            category: "webapp structure",
            color: "#d9efe2",
            defaults: {
                name: { value: "" },
                appId: { value: "", required: true },
                id: { value: "", required: true },
                title: { value: "" }
            },
            inputs: 0,
            outputs: 0,
            icon: "font-awesome/fa-columns",
            label: labelWithName("ui-layout")
        });

        register("ui-region", {
            category: "webapp structure",
            color: "#d9efe2",
            defaults: {
                name: { value: "", required: true },
                appId: { value: "", required: true },
                id: { value: "", required: true },
                layoutId: { value: "", required: true },
                parentRegionId: { value: "" },
                title: { value: "" },
                order: { value: 0, validate: RED.validators.number() }
            },
            inputs: 0,
            outputs: 0,
            icon: "font-awesome/fa-square-o",
            label: labelWithName("ui-region")
        });

        register("ui-route", {
            category: "webapp structure",
            color: "#d9efe2",
            defaults: {
                name: { value: "" },
                appId: { value: "", required: true },
                id: { value: "", required: true },
                path: { value: "", required: true },
                title: { value: "" },
                layoutId: { value: "", required: true }
            },
            inputs: 0,
            outputs: 0,
            icon: "font-awesome/fa-map-signs",
            label: labelWithName("ui-route")
        });

        register("ui-dialog", {
            category: "webapp structure",
            color: "#d9efe2",
            defaults: {
                name: { value: "" },
                appId: { value: "", required: true },
                id: { value: "", required: true },
                title: { value: "" },
                layoutId: { value: "", required: true },
                routeId: { value: "" },
                modal: { value: true }
            },
            inputs: 0,
            outputs: 0,
            icon: "font-awesome/fa-window-maximize",
            label: labelWithName("ui-dialog")
        });

        register("ui-text", {
            category: "webapp view",
            color: "#f4efcf",
            defaults: {
                name: { value: "" },
                appId: { value: "", required: true },
                id: { value: "", required: true },
                mount: { value: "", required: true },
                text: { value: "", required: true },
                value: { value: { kind: "literal", value: "" } },
                variant: { value: "" },
                order: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } }
            },
            inputs: 0,
            outputs: 0,
            icon: "font-awesome/fa-font",
            label: labelWithName("ui-text")
        });

        register("ui-button", {
            category: "webapp view",
            color: "#f4efcf",
            defaults: {
                name: { value: "" },
                appId: { value: "", required: true },
                id: { value: "", required: true },
                mount: { value: "", required: true },
                label: { value: "", required: true },
                action: { value: "", required: true },
                disabledPath: { value: "" },
                disabled: { value: null },
                order: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } }
            },
            inputs: 0,
            outputs: 1,
            icon: "font-awesome/fa-hand-pointer-o",
            label: labelWithName("ui-button")
        });

        register("ui-table", {
            category: "webapp view",
            color: "#f4efcf",
            defaults: {
                name: { value: "" },
                appId: { value: "", required: true },
                id: { value: "", required: true },
                mount: { value: "", required: true },
                columns: { value: "", validate: required },
                rowsPath: { value: "", required: true },
                rows: { value: null },
                selectAction: { value: "" },
                order: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } }
            },
            inputs: 0,
            outputs: 1,
            icon: "font-awesome/fa-table",
            label: labelWithName("ui-table")
        });

        register("ui-form", {
            category: "webapp view",
            color: "#f4efcf",
            defaults: {
                name: { value: "" },
                appId: { value: "", required: true },
                id: { value: "", required: true },
                mount: { value: "", required: true },
                fields: { value: "", validate: required },
                modelPath: { value: "", required: true },
                model: { value: null },
                submitAction: { value: "", required: true },
                order: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } }
            },
            inputs: 0,
            outputs: 1,
            icon: "font-awesome/fa-list-alt",
            label: labelWithName("ui-form")
        });

        register("ui-store", {
            category: "webapp state",
            color: "#d8e8f8",
            defaults: {
                name: { value: "" },
                appId: { value: "", required: true },
                id: { value: "", required: true },
                statePath: { value: "", required: true },
                initialValue: { value: "" }
            },
            inputs: 1,
            outputs: 1,
            icon: "font-awesome/fa-database",
            label: labelWithName("ui-store")
        });

        register("ui-query", {
            category: "webapp state",
            color: "#d8e8f8",
            defaults: {
                name: { value: "" },
                appId: { value: "", required: true },
                id: { value: "", required: true },
                queryPath: { value: "", required: true },
                source: { value: "" },
                refreshAction: { value: "" }
            },
            inputs: 1,
            outputs: 1,
            icon: "font-awesome/fa-search",
            label: labelWithName("ui-query")
        });

        register("ui-action", {
            category: "webapp behavior",
            color: "#f8ddd0",
            defaults: {
                name: { value: "" },
                appId: { value: "", required: true },
                id: { value: "", required: true },
                description: { value: "" }
            },
            inputs: 1,
            outputs: 1,
            icon: "font-awesome/fa-bolt",
            label: labelWithName("ui-action")
        });

        register("ui-navigation", {
            category: "webapp behavior",
            color: "#f8ddd0",
            defaults: {
                name: { value: "" },
                appId: { value: "", required: true },
                id: { value: "", required: true },
                to: { value: "", required: true }
            },
            inputs: 1,
            outputs: 1,
            icon: "font-awesome/fa-location-arrow",
            label: labelWithName("ui-navigation")
        });
    })();
</script>
