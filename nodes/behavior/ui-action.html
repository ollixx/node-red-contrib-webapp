<script type="text/javascript" src="resources/node-red-contrib-webapp/lib/editor-common.js"></script>
<script type="text/javascript">
    (function () {
        const common = window.WebappEditorCommon;
        common.registerNodeType("ui-action", {
            category: "webapp behavior",
            color: "#f8ddd0",
            defaults: {
                name: { value: "" },
                parent: { value: "" },
                actionType: { value: "" },
                to: { value: "" },
                // P60 / ADR 0007 §3: list of picked target node ids (JSON array)
                // — the optional "wireless" path. Legacy singular `target` kept
                // for backward-compat with pre-P60 flows.
                targets: { value: "[]" },
                target: { value: "" },
                part: { value: "" },
                description: { value: "" }
            },
            inputs: 1,
            outputs: 1,
            icon: "font-awesome/fa-bolt",
            label: common.labelWithName("ui-action"),
            onadd: function () {
                if (!this.name) {
                    this.name = common.getNextNameDefault("ui-action", "Action");
                }
            },
            oneditprepare: function () {
                common.installParentAppSelector().call(this);
                common.installNodePicker({
                    fieldId: "node-input-targets",
                    listContainerId: "node-input-targets-list",
                    buttonId: "node-input-targets-pick"
                }).call(this);
            }
        });
    })();
</script>
<script type="text/html" data-template-name="ui-action">
    <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
    <hr style="margin: 8px 0;">
    <div class="form-row"><label for="node-input-parent">App</label><select id="node-input-parent"></select></div>
    <div class="form-row"><label for="node-input-actionType">Action-Typ</label><select id="node-input-actionType"><option value="">unspezifiziert</option><option value="navigate">navigate</option><option value="show">show</option><option value="hide">hide</option><option value="open">open</option><option value="close">close</option><option value="select">select</option><option value="enable">enable</option><option value="disable">disable</option><option value="focus">focus</option><option value="reset">reset</option></select></div>
    <div class="form-row"><label for="node-input-to">Navigation zu</label><input type="text" id="node-input-to" placeholder="z.B. /customers/:id"></div>
    <div class="form-row">
        <label style="width: auto; vertical-align: top;">Ziel-Knoten (optional)</label>
        <button type="button" id="node-input-targets-pick" class="red-ui-button"><i class="fa fa-crosshairs"></i> Auf Canvas wählen</button>
        <div id="node-input-targets-list" style="margin-top: 6px;"></div>
        <input type="hidden" id="node-input-targets">
        <small class="form-tips" style="display: block; margin-top: 4px;">Sekundärer Weg ("wireless"). Primär: Output-Port mit dem Zielknoten verdrahten.</small>
    </div>
    <div class="form-row"><label for="node-input-part">Teil (Sub-ID)</label><input type="text" id="node-input-part" placeholder="open/close/select: z.B. Accordion-Sektion"></div>
    <div class="form-row"><label for="node-input-description">Beschreibung</label><input type="text" id="node-input-description"></div>
    <input type="hidden" id="node-input-target">
</script>
<script type="text/html"
    data-help-name="ui-action"><p>Typisierter Emitter fuer Interaktions-Aktionen (Interaktionszustand, keine Fachdaten; ADR 0007). Verben: navigate, show/hide (Element-Sichtbarkeit), open/close (Offenlegung: Dialog, Accordion, Tree), select (Einzelauswahl), enable/disable, focus, reset. Bei Eingang baut der Knoten eine schema-valide <code>msg.ui.action</code> aus seiner Konfiguration (msg.ui.action ueberschreibt) und sendet sie am Output-Port. Den SSE-Push fuehrt der <b>verdrahtete Zielknoten</b> aus (nicht ui-action selbst). Zieladressierung primaer ueber das <b>Wiring des Output-Ports</b>. Alternativ (sekundaer, "wireless") lassen sich Zielknoten ueber den Picker <b>"Auf Canvas waehlen"</b> auswaehlen (RED.view.selectNodes, gefiltert auf interaktionsfaehige webapp-Knoten); die Aktion wird dann an jeden gewaehlten Knoten via <code>receive()</code> zugestellt — derselbe Input-Pfad wie ein Wire. open/close/select nutzen "Teil" (bzw. msg.ui.action.part) fuer die Sub-Granularitaet.</p></script>
