<script type="text/javascript" src="resources/node-red-contrib-webapp/lib/editor-common.js"></script>
<script type="text/javascript">
    (function () {
        const common = window.WebappEditorCommon;
        common.registerNodeType("ui-action", {
            category: "webapp behavior",
            color: "#f8ddd0",
            defaults: {
                name: { value: "" },
                app: { value: "" },
                actionType: { value: "" },
                // P118/P119 (ADR 0011): the navigate target SOURCE mode (wire | route
                // | url). Empty until the panel resolves it (wire-scan pre-select).
                targetMode: { value: "" },
                // P118/P119: referenced ui-route id (route mode; P259/ADR 0038:
                // canonical bare name `route`, ex-`routeId` — legacy flows migrate
                // on open→save). Its validator back-stops the whole navigate
                // config (ADR 0011 §3): route mode requires a resolvable route
                // reference + a value for each :placeholder.
                route: { value: "", validate: function () { return window.WebappEditorCommon.validateNavigateConfig(this); } },
                // P66 (ADR 0007): navigate `to` is a typedInput — `to` holds the
                // value, `toType` the type (str = literal path, or msg/flow/global/
                // jsonata). Only meaningful in url mode (the URL is built whole).
                to: { value: "" },
                toType: { value: "str" },
                // P118/P119: typed navigate params — a JSON array string of
                // { name, value, valueType } rows (route mode; wire mode where the
                // scan detected a single route). Migrates from the legacy object form.
                params: { value: "" },
                // P60 / ADR 0007 §3: list of picked target node ids (JSON array)
                // — the optional "wireless" path. Legacy singular `target` kept
                // for backward-compat with pre-P60 flows.
                targets: { value: "[]" },
                target: { value: "" },
                part: { value: "" },
                description: { value: "" }
            },
            inputs: 1,
            outputs: 1,
            icon: "font-awesome/fa-bolt",
            label: common.labelWithName("ui-action"),
            onadd: function () {
                if (!this.name) {
                    this.name = common.getNextNameDefault("ui-action", "Action");
                }
            },
            oneditprepare: function () {
                common.installParentAppSelector().call(this);
                common.installNodePicker({
                    fieldId: "node-input-targets",
                    listContainerId: "node-input-targets-list",
                    buttonId: "node-input-targets-pick"
                }).call(this);

                const nodeId = this.id;

                // P119 (ADR 0011): legacy params migration — an old `{k: "v"}` object
                // string becomes a typed-row JSON array so installNavigateTargetMode
                // can seed its mapping table from it.
                try {
                    const raw = this.params ? String(this.params).trim() : "";
                    if (raw && !raw.startsWith("[")) {
                        const obj = JSON.parse(raw);
                        if (obj && typeof obj === "object" && !Array.isArray(obj)) {
                            const rows = Object.keys(obj).map(function (k) {
                                return { name: k, value: String(obj[k]), valueType: "str" };
                            });
                            $("#node-input-params").val(rows.length > 0 ? JSON.stringify(rows) : "");
                        }
                    }
                } catch (_e) { /* leave as-is on parse error */ }

                // P66/P119: `to` as a typedInput (url mode — str / msg / flow / global
                // / jsonata). The mode UI relocates its form-row into the panel.
                $("#node-input-to").typedInput({
                    default: "str",
                    typeField: $("#node-input-toType"),
                    types: ["str", "msg", "flow", "global", "jsonata"]
                });

                // P119 (ADR 0011): the three-mode navigate target switch + wire-scan
                // assistance + parameter-mapping table. Central helper.
                // (P243/ADR 0040: ui-navigation retired — ui-action is the sole user.)
                let navMode = null;
                this.__navMode = null;
                const self = this;
                function buildNavMode() {
                    navMode = common.installNavigateTargetMode({
                        nodeId: nodeId,
                        onChange: function () { RED.editor.validateNode && RED.editor.validateNode(self); }
                    });
                    self.__navMode = navMode;
                }

                // P66/P119: only show navigation fields when actionType === navigate,
                // and only show "Teil" for the granularity verbs.
                const actionTypeSelect = $("#node-input-actionType");
                function updateConditionalFields() {
                    const type = actionTypeSelect.val();
                    const isNavigate = type === "navigate";
                    $(".ui-action-navigate-field").toggle(isNavigate);
                    if (isNavigate && !navMode) {
                        buildNavMode();
                    }
                    // The `to` row is relocated into the URL-mode panel by the
                    // controller; for non-navigate verbs it stays hidden there.
                    const isPartVerb = type === "open" || type === "close" || type === "select";
                    $(".ui-action-part-field").toggle(isPartVerb);
                }
                actionTypeSelect.on("change", updateConditionalFields);
                updateConditionalFields();
            },
            oneditsave: function () {
                // P119: let the navigate mode controller persist mode + exclusive
                // carriers (route/params XOR to). No-op for non-navigate verbs.
                if (this.__navMode && $("#node-input-actionType").val() === "navigate") {
                    this.__navMode.oneditsave();
                } else if ($("#node-input-actionType").val() !== "navigate") {
                    // Non-navigate: clear navigate-only carriers so they never leak.
                    $("#node-input-targetMode").val("");
                }
            }
        });
    })();
</script>
<script type="text/html" data-template-name="ui-action">
    <div class="form-row"><label for="node-input-name" data-i18n="node-red:common.label.name">Name</label><input type="text" id="node-input-name"></div>
    <hr style="margin: 8px 0;">
    <div class="form-row"><label for="node-input-app" data-i18n="ui-action.label.app">App</label><select id="node-input-app"></select></div>
    <div class="form-row"><label for="node-input-actionType" data-i18n="ui-action.label.actionType">Action-Typ</label><select id="node-input-actionType"><option value="" data-i18n="ui-action.option.actionType.">unspezifiziert</option><option value="navigate">navigate</option><option value="show">show</option><option value="hide">hide</option><option value="open">open</option><option value="close">close</option><option value="select">select</option><option value="enable">enable</option><option value="disable">disable</option><option value="focus">focus</option><option value="reset">reset</option></select></div>
    <!-- P119 (ADR 0011): navigate target-source mode UI (built by
         installNavigateTargetMode into .webapp-navigate-target-mode). The `to`
         row is relocated into the URL-mode body; route/params/targetMode are
         hidden carriers Node-RED binds + saves. -->
    <div class="form-row ui-action-navigate-field" style="display:block;">
        <label style="display:block; margin-bottom:6px;">Ziel</label>
        <div class="webapp-navigate-target-mode"></div>
    </div>
    <div class="form-row" id="node-input-to-row" style="display:none;"><label for="node-input-to" data-i18n="ui-action.label.to">Navigation zu</label><input type="text" id="node-input-to" style="width: 70%;" placeholder="z.B. /customers/:id" data-i18n="[placeholder]ui-action.placeholder.to"><input type="hidden" id="node-input-toType"></div>
    <div class="form-row" id="node-input-route-row" style="display:none;"><label for="node-input-route" data-i18n="ui-action.label.route">Ziel-Route</label><input type="text" id="node-input-route"></div>
    <input type="hidden" id="node-input-targetMode">
    <input type="hidden" id="node-input-params">
    <div class="form-row">
        <label style="width: auto; vertical-align: top;" data-i18n="ui-action.label.targets">Ziel-Knoten (optional)</label>
        <button type="button" id="node-input-targets-pick" class="red-ui-button"><i class="fa fa-crosshairs"></i> Auf Canvas wählen</button>
        <div id="node-input-targets-list" style="margin-top: 6px;"></div>
        <input type="hidden" id="node-input-targets">
        <small class="form-tips" style="display: block; margin-top: 4px;">Sekundärer Weg ("wireless"). Primär: Output-Port mit dem Zielknoten verdrahten.</small>
    </div>
    <div class="form-row ui-action-part-field"><label for="node-input-part" data-i18n="ui-action.label.part">Teil (Sub-ID)</label><input type="text" id="node-input-part" placeholder="open/close/select: z.B. Accordion-Sektion" data-i18n="[placeholder]ui-action.placeholder.part"></div>
    <div class="form-row"><label for="node-input-description" data-i18n="ui-action.label.description">Beschreibung</label><input type="text" id="node-input-description"></div>
    <input type="hidden" id="node-input-target">
</script>
<!-- P267 (ADR 0042): help + labels are locale-migrated. Help lives in
     nodes/behavior/locales/{en-US,de}/ui-action.html; form-row labels carry
     data-i18n keys resolved from nodes/behavior/locales/{en-US,de}/ui-action.json.
     No inline data-help-name block here. -->
