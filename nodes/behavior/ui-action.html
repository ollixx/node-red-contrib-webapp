<script type="text/javascript" src="resources/node-red-contrib-webapp/lib/editor-common.js"></script>
<script type="text/javascript">
    (function () {
        const common = window.WebappEditorCommon;
        common.registerNodeType("ui-action", {
            category: "webapp behavior",
            color: "#f8ddd0",
            defaults: {
                name: { value: "" },
                uiId: { value: "", required: true },
                actionType: { value: "" },
                targetMode: { value: "" },
                target: { value: "" },
                to: { value: "" },
                description: { value: "" }
            },
            inputs: 1,
            outputs: 1,
            icon: "font-awesome/fa-bolt",
            label: common.labelWithName("ui-action")
        });
    })();
</script>
<script type="text/html" data-template-name="ui-action">
    <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
    <div class="form-row"><label for="node-input-uiId">Action ID</label><input type="text" id="node-input-uiId"></div>
    <div class="form-row"><label for="node-input-actionType">Action-Typ</label><select id="node-input-actionType"><option value="">Legacy/unspezifiziert</option><option value="navigate">navigate</option><option value="show">show</option><option value="hide">hide</option><option value="enable">enable</option><option value="disable">disable</option><option value="trigger">trigger</option></select></div>
    <div class="form-row"><label for="node-input-targetMode">Zielmodus</label><select id="node-input-targetMode"><option value="">unspezifiziert</option><option value="out-port">out-port</option><option value="path">path</option></select></div>
    <div class="form-row"><label for="node-input-target">Ziel</label><input type="text" id="node-input-target" placeholder="z.B. app oder dialog:customerEditor"></div>
    <div class="form-row"><label for="node-input-to">Navigation zu</label><input type="text" id="node-input-to" placeholder="z.B. /customers/:id"></div>
    <div class="form-row"><label for="node-input-description">Beschreibung</label><input type="text" id="node-input-description"></div>
</script>
<script type="text/html"
    data-help-name="ui-action"><p>Beschreibt eine wiederverwendbare UI-Aktion. Typed Actions koennen Verhalten wie Navigation oder Dialog-Sichtbarkeit modellieren.</p></script>
