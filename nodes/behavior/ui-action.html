<script type="text/javascript" src="resources/node-red-contrib-webapp/lib/editor-common.js"></script>
<script type="text/javascript">
    (function () {
        const common = window.WebappEditorCommon;
        common.registerNodeType("ui-action", {
            category: "webapp behavior",
            color: "#f8ddd0",
            defaults: {
                name: { value: "" },
                parent: { value: "" },
                actionType: { value: "" },
                // P66 (ADR 0007): navigate `to` is a typedInput — `to` holds the
                // value, `toType` the type (str = literal path, or msg/flow/global/
                // jsonata). Empty for Scenario 1 (wired to a ui-route).
                to: { value: "" },
                toType: { value: "str" },
                // P66: named URL params (Scenario 1: wired to a ui-route). Stored as
                // a JSON object string (key/value rows).
                params: { value: "" },
                // P60 / ADR 0007 §3: list of picked target node ids (JSON array)
                // — the optional "wireless" path. Legacy singular `target` kept
                // for backward-compat with pre-P60 flows.
                targets: { value: "[]" },
                target: { value: "" },
                part: { value: "" },
                description: { value: "" }
            },
            inputs: 1,
            outputs: 1,
            icon: "font-awesome/fa-bolt",
            label: common.labelWithName("ui-action"),
            onadd: function () {
                if (!this.name) {
                    this.name = common.getNextNameDefault("ui-action", "Action");
                }
            },
            oneditprepare: function () {
                common.installParentAppSelector().call(this);
                common.installNodePicker({
                    fieldId: "node-input-targets",
                    listContainerId: "node-input-targets-list",
                    buttonId: "node-input-targets-pick"
                }).call(this);

                // P66: `to` as a typedInput (str / msg / flow / global / jsonata).
                const toInput = $("#node-input-to");
                toInput.typedInput({
                    default: "str",
                    typeField: $("#node-input-toType"),
                    types: ["str", "msg", "flow", "global", "jsonata"]
                });

                // P66: params key/value editor (editableList). Serialised to the
                // hidden #node-input-params field as a JSON object on save.
                const paramsList = $("#node-input-params-list");
                paramsList.editableList({
                    addButton: "Parameter hinzufügen",
                    header: $("<div>").css({ "padding-left": "8px" }).append($("<span>").text("URL-Parameter (Name → Wert)")),
                    addItem: function (row, _index, data) {
                        const entry = data || {};
                        const keyInput = $("<input type='text' class='node-input-param-key' placeholder='Name'>")
                            .css({ width: "40%", "margin-right": "6px" }).val(entry.key || "");
                        const valInput = $("<input type='text' class='node-input-param-value' placeholder='Wert'>")
                            .css({ width: "50%" }).val(entry.value || "");
                        $(row).append(keyInput).append(valInput);
                    }
                });
                let initialParams = {};
                try {
                    initialParams = this.params ? JSON.parse(this.params) : {};
                }
                catch (_e) {
                    initialParams = {};
                }
                Object.keys(initialParams).forEach(function (key) {
                    paramsList.editableList("addItem", { key: key, value: String(initialParams[key]) });
                });

                // P66: only show navigation fields when actionType === navigate, and
                // only show "Teil" for the granularity verbs.
                const actionTypeSelect = $("#node-input-actionType");
                function updateConditionalFields() {
                    const type = actionTypeSelect.val();
                    const isNavigate = type === "navigate";
                    $(".ui-action-navigate-field").toggle(isNavigate);
                    const isPartVerb = type === "open" || type === "close" || type === "select";
                    $(".ui-action-part-field").toggle(isPartVerb);
                }
                actionTypeSelect.on("change", updateConditionalFields);
                updateConditionalFields();
            },
            oneditsave: function () {
                // P66: serialise the params key/value rows into a JSON object string.
                const params = {};
                $("#node-input-params-list").editableList("items").each(function () {
                    const key = $(this).find(".node-input-param-key").val();
                    const value = $(this).find(".node-input-param-value").val();
                    if (key && String(key).trim().length > 0) {
                        params[String(key).trim()] = value === undefined || value === null ? "" : String(value);
                    }
                });
                $("#node-input-params").val(Object.keys(params).length > 0 ? JSON.stringify(params) : "");
            }
        });
    })();
</script>
<script type="text/html" data-template-name="ui-action">
    <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
    <hr style="margin: 8px 0;">
    <div class="form-row"><label for="node-input-parent">App</label><select id="node-input-parent"></select></div>
    <div class="form-row"><label for="node-input-actionType">Action-Typ</label><select id="node-input-actionType"><option value="">unspezifiziert</option><option value="navigate">navigate</option><option value="show">show</option><option value="hide">hide</option><option value="open">open</option><option value="close">close</option><option value="select">select</option><option value="enable">enable</option><option value="disable">disable</option><option value="focus">focus</option><option value="reset">reset</option></select></div>
    <div class="form-row ui-action-navigate-field"><label for="node-input-to">Navigation zu</label><input type="text" id="node-input-to" style="width: 70%;" placeholder="z.B. /customers/:id"><input type="hidden" id="node-input-toType"></div>
    <div class="form-row ui-action-navigate-field" style="margin-bottom: 0;"><label style="width: auto; vertical-align: top;">Parameter</label></div>
    <div class="form-row ui-action-navigate-field"><ol id="node-input-params-list"></ol><input type="hidden" id="node-input-params"><small class="form-tips" style="display: block; margin-top: 4px;">Bei Verdrahtung mit einer ui-route: das "Navigation zu" leer lassen — die Route liefert den Pfad; die Parameter füllen ihre <code>:platzhalter</code>.</small></div>
    <div class="form-row">
        <label style="width: auto; vertical-align: top;">Ziel-Knoten (optional)</label>
        <button type="button" id="node-input-targets-pick" class="red-ui-button"><i class="fa fa-crosshairs"></i> Auf Canvas wählen</button>
        <div id="node-input-targets-list" style="margin-top: 6px;"></div>
        <input type="hidden" id="node-input-targets">
        <small class="form-tips" style="display: block; margin-top: 4px;">Sekundärer Weg ("wireless"). Primär: Output-Port mit dem Zielknoten verdrahten.</small>
    </div>
    <div class="form-row ui-action-part-field"><label for="node-input-part">Teil (Sub-ID)</label><input type="text" id="node-input-part" placeholder="open/close/select: z.B. Accordion-Sektion"></div>
    <div class="form-row"><label for="node-input-description">Beschreibung</label><input type="text" id="node-input-description"></div>
    <input type="hidden" id="node-input-target">
</script>
<script type="text/html"
    data-help-name="ui-action"><p>Typisierter Emitter fuer Interaktions-Aktionen (Interaktionszustand, keine Fachdaten; ADR 0007). Verben: navigate, show/hide (Element-Sichtbarkeit), open/close (Offenlegung: Dialog, Accordion, Tree), select (Einzelauswahl), enable/disable, focus, reset. Bei Eingang baut der Knoten eine schema-valide <code>msg.ui.action</code> aus seiner Konfiguration (msg.ui.action ueberschreibt) und sendet sie am Output-Port. Den SSE-Push fuehrt der <b>verdrahtete Zielknoten</b> aus (nicht ui-action selbst). Zieladressierung primaer ueber das <b>Wiring des Output-Ports</b>.</p>
    <h4>Navigation (P66)</h4>
    <p>Zwei Wege fuer <code>navigate</code>:</p>
    <ul>
        <li><b>Szenario 1 — verdrahtet mit einer ui-route</b> (oder der ui-app fuer die Root "/"): "Navigation zu" LEER lassen; die Route baut die Location aus ihrem EIGENEN Pfad + den hier gesetzten <b>Parametern</b> (fuellen die <code>:platzhalter</code> der Route). Kein Pfad-Drift bei Route-Umbenennung.</li>
        <li><b>Szenario 2 — nicht verdrahtet</b>: "Navigation zu" als Pfad-Template setzen. Der typedInput erlaubt <code>str</code> (statischer Pfad), <code>msg</code>/<code>flow</code>/<code>global</code> (dynamisch aus Kontext) oder <code>jsonata</code> (Ausdruck gegen die eingehende Nachricht). App-global an die ui-app, die die Location aufloest.</li>
    </ul>
    <p><code>onEnter</code> wird bei jedem Routen-Eintritt emittiert (beide Szenarien). Mehrdeutigkeit (verdrahtet UND "Navigation zu" gesetzt), fehlendes Ziel oder ein statischer toter Link werden zur Deploy-Zeit geprueft.</p>
    <p>open/close/select nutzen "Teil" (bzw. msg.ui.action.part) fuer die Sub-Granularitaet.</p></script>
