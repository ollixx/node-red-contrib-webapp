<script type="text/javascript" src="resources/node-red-contrib-webapp/lib/editor-common.js"></script>
<script type="text/javascript">
    (function () {
        const common = window.WebappEditorCommon;
        common.registerNodeType("ui-navigation", {
            category: "webapp behavior",
            color: "#f8ddd0",
            defaults: {
                name: { value: "" },
                parent: { value: "" },
                // P119 (ADR 0011): ui-navigation gets the same target-source mode as
                // ui-action navigate — wire | route | url. Same central helper.
                targetMode: { value: "" },
                // P119: referenced ui-route id (route mode). Validator back-stops the
                // whole config: route mode needs a resolvable routeId + every
                // :placeholder filled.
                routeId: { value: "", validate: function () { return window.WebappEditorCommon.validateNavigateConfig(this); } },
                // P66/P119: url-mode destination typedInput (str/msg/flow/global/jsonata).
                to: { value: "" },
                toType: { value: "str" },
                // P119: typed navigate params — JSON array of {name,value,valueType}.
                params: { value: "" }
            },
            inputs: 1,
            outputs: 1,
            icon: "font-awesome/fa-location-arrow",
            label: common.labelWithName("ui-navigation"),
            onadd: function () {
                if (!this.name) {
                    this.name = common.getNextNameDefault("ui-navigation", "Navigation");
                }
            },
            oneditprepare: function () {
                common.installParentAppSelector().call(this);
                const self = this;

                // P119: legacy `to`-only configs migrate to url mode on first open;
                // legacy params object → typed rows (mirrors ui-action).
                try {
                    const raw = this.params ? String(this.params).trim() : "";
                    if (raw && !raw.startsWith("[")) {
                        const obj = JSON.parse(raw);
                        if (obj && typeof obj === "object" && !Array.isArray(obj)) {
                            const rows = Object.keys(obj).map(function (k) {
                                return { name: k, value: String(obj[k]), valueType: "str" };
                            });
                            $("#node-input-params").val(rows.length > 0 ? JSON.stringify(rows) : "");
                        }
                    }
                } catch (_e) { /* leave as-is */ }

                $("#node-input-to").typedInput({
                    default: "str",
                    typeField: $("#node-input-toType"),
                    types: ["str", "msg", "flow", "global", "jsonata"]
                });

                this.__navMode = common.installNavigateTargetMode({
                    nodeId: this.id,
                    onChange: function () { RED.editor.validateNode && RED.editor.validateNode(self); }
                });
            },
            oneditsave: function () {
                if (this.__navMode) {
                    this.__navMode.oneditsave();
                }
            }
        });
    })();
</script>
<script type="text/html" data-template-name="ui-navigation">
    <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
    <hr style="margin: 8px 0;">
    <div class="form-row"><label for="node-input-parent">App</label><select id="node-input-parent"></select></div>
    <!-- P119 (ADR 0011): the same three-mode navigate target switch as ui-action. -->
    <div class="form-row" style="display:block;">
        <label style="display:block; margin-bottom:6px;">Ziel</label>
        <div class="webapp-navigate-target-mode"></div>
    </div>
    <div class="form-row" id="node-input-to-row" style="display:none;"><label for="node-input-to">Zielpfad</label><input type="text" id="node-input-to" style="width:70%;" placeholder="z.B. /customers/:id"><input type="hidden" id="node-input-toType"></div>
    <div class="form-row" id="node-input-routeId-row" style="display:none;"><label for="node-input-routeId">Ziel-Route</label><input type="text" id="node-input-routeId"></div>
    <input type="hidden" id="node-input-targetMode">
    <input type="hidden" id="node-input-params">
</script>
<script type="text/html"
    data-help-name="ui-navigation"><p>Beschreibt eine deklarative Navigation zu einer Route. Drei Zielquellen-Modi wie bei ui-action navigate (via Wire, Route-Referenz, URL). Deprecated: bevorzugt ui-action vom Typ navigate.</p></script>
