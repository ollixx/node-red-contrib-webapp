<script type="text/javascript" src="resources/node-red-contrib-webapp/lib/editor-common.js"></script>
<script type="text/javascript">
    (function () {
        const common = window.WebappEditorCommon;
        common.registerNodeType("ui-route", {
            category: "webapp structure",
            color: "#d9efe2",
            defaults: {
                name: { value: "" },
                uiId: { value: "", required: true },
                parent: { value: "" },
                path: { value: "", required: true },
                title: { value: "" },
                layoutId: { value: "", required: true }
            },
            inputs: 0,
            outputs: 0,
            icon: "font-awesome/fa-map-signs",
            label: common.labelWithName("ui-route"),
            onadd: function () {
                if (!this.name) {
                    this.name = common.getNextNameDefault("ui-route", "Route");
                }
            },
            oneditprepare: function () {
                common.installParentAppSelector().call(this);
                common.installLayoutSelector({
                    valueSelector: "#node-input-layoutId",
                    presetSelector: "#node-input-layout-preset",
                    getValue: function () {
                        return this.layoutId;
                    }
                }).call(this);
            }
        });
    })();
</script>
<script type="text/html" data-template-name="ui-route">
    <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
    <div class="form-row"><label for="node-input-uiId">Route ID</label><input type="text" id="node-input-uiId"></div>
    <div class="form-row"><label for="node-input-parent">App</label><select id="node-input-parent"></select></div>
    <div class="form-row"><label for="node-input-path">Pfad</label><input type="text" id="node-input-path"></div>
    <div class="form-row"><label for="node-input-title">Titel</label><input type="text" id="node-input-title"></div>
    <input type="hidden" id="node-input-layoutId">
    <div class="form-row"><label for="node-input-layout-preset">Parent Layout</label><select id="node-input-layout-preset"></select></div>
    <div class="form-tips">Dieses Layout wird fuer die Seite gerendert.</div>
</script>
<script type="text/html" data-help-name="ui-route"><p>Definiert eine Route und bindet sie an ein Layout.</p></script>
