<script type="text/javascript" src="resources/node-red-contrib-webapp/lib/editor-common.js"></script>
<script type="text/javascript">
    (function () {
        const common = window.WebappEditorCommon;
        common.registerNodeTypeWithEvents("ui-dialog", {
            category: "webapp structure",
            color: "#d9efe2",
            defaults: {
                name: { value: "" },
                app: { value: "", required: true, validate: common.validateAppRef },
                title: { value: "" },
                // P259 (ADR 0038): canonical bare reference name `layout` (was
                // `layoutId`); the legacy value migrates on open→save.
                layout: { value: "", required: true, validate: common.validateRefWithLegacy("layoutId") },
                // P259 (ADR 0038): canonical bare reference name `route` (was
                // `routeId`); the legacy value migrates on open→save.
                route: { value: "" },
                modal: { value: true },
                closable: { value: true },
                // P262 (ADR 0041 §4): declarative authz guard — comma-separated
                // group names (visible plain input, tolerant parsing server-side).
                // Empty ⇒ authentication only; set ⇒ ANY-of the groups required.
                requiresGroup: { value: "" },
                events: { value: "[]" },
                outputs: { value: 0 }
            },
            inputs: 1,
            outputs: 0,
            outputLabels: function (index) {
                try {
                    const events = JSON.parse(this.events || "[]");
                    return events[index] || "";
                }
                catch (_e) {
                    return "";
                }
            },
            icon: "font-awesome/fa-window-maximize",
            label: common.labelWithName("ui-dialog"),
            onadd: function () {
                if (!this.name) {
                    this.name = common.getNextNameDefault("ui-dialog", "Dialog");
                }
            },
            oneditprepare: function () {
                common.installParentAppSelector().call(this);
                common.installLayoutSelector({
                    valueSelector: "#node-input-layout",
                    presetSelector: "#node-input-layout-preset",
                    getValue: function () {
                        return this.layout || this.layoutId;
                    }
                }).call(this);
                common.installReferenceSelectors({ route: true }).call(this);
            }
        }, ["onOpen", "onClose"]);
    })();
</script>
<script type="text/html" data-template-name="ui-dialog">
    <div class="form-row"><label for="node-input-name" data-i18n="node-red:common.label.name">Name</label><input type="text" id="node-input-name"></div>
    <hr style="margin: 8px 0;">
    <div class="form-row"><label for="node-input-app" data-i18n="ui-dialog.label.app">App</label><select id="node-input-app"></select></div>
    <div class="form-row"><label for="node-input-title" data-i18n="ui-dialog.label.title">Titel</label><input type="text" id="node-input-title"></div>
    <input type="hidden" id="node-input-layout">
    <div class="form-row"><label for="node-input-layout-preset" data-i18n="ui-dialog.label.layout">Parent Layout</label><select id="node-input-layout-preset"></select></div>
    <div class="form-row"><label for="node-input-route" data-i18n="ui-dialog.label.route">Parent Route</label><select id="node-input-route"></select></div>
    <div class="form-row"><label for="node-input-modal" data-i18n="ui-dialog.label.modal">Modal</label><input type="checkbox" id="node-input-modal" style="width:auto"></div>
    <div class="form-row"><label for="node-input-closable" data-i18n="ui-dialog.label.closable">Schließbar</label><input type="checkbox" id="node-input-closable" style="width:auto"></div>
    <!-- P262: authz guard - comma-separated group names (ANY-of, server-enforced) -->
    <div class="form-row">
        <label for="node-input-requiresGroup" data-i18n="ui-dialog.label.requiresGroup">Gruppen</label>
        <input type="text" id="node-input-requiresGroup" placeholder="z.B. admins, sales (leer = nur Authentifizierung)" data-i18n="[placeholder]ui-dialog.placeholder.requiresGroup">
    </div>
    <input type="hidden" id="node-input-events">
    <input type="hidden" id="node-input-outputs">
    <div class="form-row"><label data-i18n="ui-dialog.label.events">Events</label></div>
    <div id="node-input-events-container"></div>
</script>
<!-- P267 (ADR 0042): help + labels are locale-migrated. Help lives in
     nodes/structure/locales/{en-US,de}/ui-dialog.html; form-row labels carry
     data-i18n keys resolved from nodes/structure/locales/{en-US,de}/ui-dialog.json.
     No inline data-help-name block here. -->
