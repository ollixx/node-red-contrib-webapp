<script type="text/javascript" src="resources/node-red-contrib-webapp/lib/editor-common.js"></script>
<script type="text/javascript">
    (function () {
        const common = window.WebappEditorCommon;
        common.registerNodeTypeWithEvents("ui-dialog", {
            category: "webapp structure",
            color: "#d9efe2",
            defaults: {
                name: { value: "" },
                app: { value: "", required: true, validate: common.validateAppRef },
                title: { value: "" },
                layoutId: { value: "", required: true },
                routeId: { value: "" },
                modal: { value: true },
                closable: { value: true },
                events: { value: "[]" },
                outputs: { value: 0 }
            },
            inputs: 1,
            outputs: 0,
            outputLabels: function (index) {
                try {
                    const events = JSON.parse(this.events || "[]");
                    return events[index] || "";
                }
                catch (_e) {
                    return "";
                }
            },
            icon: "font-awesome/fa-window-maximize",
            label: common.labelWithName("ui-dialog"),
            onadd: function () {
                if (!this.name) {
                    this.name = common.getNextNameDefault("ui-dialog", "Dialog");
                }
            },
            oneditprepare: function () {
                common.installParentAppSelector().call(this);
                common.installLayoutSelector({
                    valueSelector: "#node-input-layoutId",
                    presetSelector: "#node-input-layout-preset",
                    getValue: function () {
                        return this.layoutId;
                    }
                }).call(this);
                common.installReferenceSelectors({ route: true }).call(this);
            }
        }, ["onOpen", "onClose"]);
    })();
</script>
<script type="text/html" data-template-name="ui-dialog">
    <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
    <hr style="margin: 8px 0;">
    <div class="form-row"><label for="node-input-app">App</label><select id="node-input-app"></select></div>
    <div class="form-row"><label for="node-input-title">Titel</label><input type="text" id="node-input-title"></div>
    <input type="hidden" id="node-input-layoutId">
    <div class="form-row"><label for="node-input-layout-preset">Parent Layout</label><select id="node-input-layout-preset"></select></div>
    <div class="form-row"><label for="node-input-routeId">Parent Route</label><select id="node-input-routeId"></select></div>
    <div class="form-row"><label for="node-input-modal">Modal</label><input type="checkbox" id="node-input-modal" style="width:auto"></div>
    <div class="form-row"><label for="node-input-closable">Schließbar</label><input type="checkbox" id="node-input-closable" style="width:auto"></div>
    <input type="hidden" id="node-input-events">
    <input type="hidden" id="node-input-outputs">
    <div class="form-row"><label>Events</label></div>
    <div id="node-input-events-container"></div>
</script>
<script type="text/html" data-help-name="ui-dialog"><p>Definiert einen <b>Dialog mit eigenem Layout</b> innerhalb einer App. Der Dialog wird über die Action-Verben <code>open</code> / <code>close</code> offengelegt (nicht über <code>show</code>/<code>hide</code>); View-Knoten mounten über <code>dialog:&lt;id&gt;/&lt;slot&gt;</code> in seine Slots.</p>
<p><b>Schließbar</b> (<code>closable</code>): steuert nur das native Nutzer-Dismissal. Bei <code>true</code> ist der Dialog per X / ESC / Overlay-Klick schließbar; bei <code>false</code> entfällt der gesamte Header und der Dialog wird ausschließlich über <code>open</code>/<code>close</code> gesteuert.</p>
<p><b>Modal</b>: Dialoge sind heute <b>immer modal</b> (das Backend <code>sl-dialog</code> ist nativ modal). Das Feld ist ein Platzhalter für einen künftigen nicht-modalen Modus und hat aktuell keine Wirkung.</p>
<p><b>Parent Route</b> (<code>routeId</code>): koppelt den Dialog optional an eine Route — dann ist er nur bei aktiver passender Route darstellbar.</p>
<p><b>Events</b>: <code>onOpen</code> feuert beim Öffnen, <code>onClose</code> beim Schließen (auch bei X / ESC / Overlay). Jedes aktive Event erzeugt einen Output-Port.</p>
<p>Vollständige Doku: <a href="https://github.com/ollixx/node-red-contrib-webapp/blob/develop/docs/nodes/structure/ui-dialog.md" target="_blank">docs/nodes/structure/ui-dialog.md</a></p></script>
