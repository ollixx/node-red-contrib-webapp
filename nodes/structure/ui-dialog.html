<script type="text/javascript" src="resources/node-red-contrib-webapp/lib/editor-common.js"></script>
<script type="text/javascript">
    (function () {
        const common = window.WebappEditorCommon;
        common.registerNodeTypeWithEvents("ui-dialog", {
            category: "webapp structure",
            color: "#d9efe2",
            defaults: {
                name: { value: "" },
                parent: { value: "" },
                title: { value: "" },
                layoutId: { value: "", required: true },
                routeId: { value: "" },
                modal: { value: true },
                events: { value: "[]" },
                outputs: { value: 0 }
            },
            inputs: 1,
            outputs: 0,
            outputLabels: function (index) {
                try {
                    const events = JSON.parse(this.events || "[]");
                    return events[index] || "";
                }
                catch (_e) {
                    return "";
                }
            },
            icon: "font-awesome/fa-window-maximize",
            label: common.labelWithName("ui-dialog"),
            onadd: function () {
                if (!this.name) {
                    this.name = common.getNextNameDefault("ui-dialog", "Dialog");
                }
            },
            oneditprepare: function () {
                common.installParentAppSelector().call(this);
                common.installLayoutSelector({
                    valueSelector: "#node-input-layoutId",
                    presetSelector: "#node-input-layout-preset",
                    getValue: function () {
                        return this.layoutId;
                    }
                }).call(this);
                common.installReferenceSelectors({ route: true }).call(this);
            }
        }, ["onOpen", "onClose"]);
    })();
</script>
<script type="text/html" data-template-name="ui-dialog">
    <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
    <hr style="margin: 8px 0;">
    <div class="form-row"><label for="node-input-parent">App</label><select id="node-input-parent"></select></div>
    <div class="form-row"><label for="node-input-title">Titel</label><input type="text" id="node-input-title"></div>
    <input type="hidden" id="node-input-layoutId">
    <div class="form-row"><label for="node-input-layout-preset">Parent Layout</label><select id="node-input-layout-preset"></select></div>
    <div class="form-row"><label for="node-input-routeId">Parent Route</label><select id="node-input-routeId"></select></div>
    <div class="form-row"><label for="node-input-modal">Modal</label><input type="checkbox" id="node-input-modal" style="width:auto"></div>
    <input type="hidden" id="node-input-events">
    <input type="hidden" id="node-input-outputs">
    <div class="form-row"><label>Events</label></div>
    <div id="node-input-events-container"></div>
</script>
<script type="text/html" data-help-name="ui-dialog"><p>Definiert einen Dialog mit eigenem Layout.</p></script>
