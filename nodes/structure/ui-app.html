<script type="text/javascript" src="resources/node-red-contrib-webapp/lib/editor-common.js"></script>
<script type="text/javascript">
    (function () {
        const common = window.WebappEditorCommon;
        common.registerNodeType("ui-app", {
            category: "webapp",
            color: "#d9efe2",
            defaults: {
                name: { value: "" },
                root: { value: "", required: true }
            },
            inputs: 0,
            outputs: 0,
            icon: "font-awesome/fa-sitemap",
            label: function () {
                return this.name || this.root || "ui-app";
            }
        });
    })();
</script>
<script type="text/html" data-template-name="ui-app">
    <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
    <div class="form-row"><label for="node-input-root">Root</label><input type="text" id="node-input-root"></div>
</script>
<script type="text/html" data-help-name="ui-app"><p>Root-Knoten einer deklarativen Web-App fuer Node-RED.</p></script>
