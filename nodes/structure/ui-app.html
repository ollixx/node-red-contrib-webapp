<script type="text/javascript" src="resources/node-red-contrib-webapp/lib/editor-common.js"></script>
<script type="text/javascript">
    (function () {
        const common = window.WebappEditorCommon;

        common.registerNodeTypeWithEvents("ui-app", {
            category: "webapp",
            color: "#d9efe2",
            defaults: {
                name: { value: "" },
                root: { value: "", required: true },
                layout: { value: "vertical", required: true },
                events: { value: "[]" },
                outputs: { value: 0 }
            },
            inputs: 0,
            outputs: 0,
            outputLabels: function (index) {
                try {
                    const events = JSON.parse(this.events || "[]");
                    return events[index] || "";
                }
                catch (_e) {
                    return "";
                }
            },
            icon: "font-awesome/fa-sitemap",
            oneditprepare: function () {
                const rootInput = $("#node-input-root");
                const link = $("#node-ui-app-url");
                const emptyHint = $("#node-ui-app-url-empty");

                common.installLayoutSelector({
                    valueSelector: "#node-input-layout",
                    presetSelector: "#node-input-layout-preset",
                    getValue: function () {
                        return this.layout;
                    }
                }).call(this);

                function updateAppUrl() {
                    const root = String(rootInput.val() || "").trim();

                    if (!root) {
                        link.attr("href", "#");
                        link.text("");
                        link.hide();
                        emptyHint.show();
                        return;
                    }

                    const appUrl = `${window.location.origin}/webapp/${encodeURIComponent(root)}`;
                    link.attr("href", appUrl);
                    link.text(appUrl);
                    link.show();
                    emptyHint.hide();
                }

                rootInput.on("input change", updateAppUrl);
                updateAppUrl();
            },
            label: function () {
                return this.name || this.root || "ui-app";
            }
        });
    })();
</script>
<script type="text/html" data-template-name="ui-app">
    <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
    <div class="form-row"><label for="node-input-root">Root</label><input type="text" id="node-input-root"></div>
    <input type="hidden" id="node-input-layout">
    <div class="form-row"><label for="node-input-layout-preset">Layout</label><select id="node-input-layout-preset"></select></div>
    <div class="form-row">
        <label>App URL</label>
        <div style="padding-top: 6px;">
            <a id="node-ui-app-url" href="#" target="_blank" rel="noopener" style="display: none;"></a>
            <span id="node-ui-app-url-empty" style="color: #777;">Bitte zuerst Root setzen</span>
        </div>
    </div>
    <input type="hidden" id="node-input-events">
    <input type="hidden" id="node-input-outputs">
    <div class="form-row"><label>Events</label></div>
    <div id="node-input-events-container"></div>
</script>
<script type="text/html" data-help-name="ui-app"><p>Root-Knoten einer deklarativen Web-App fuer Node-RED.</p></script>
