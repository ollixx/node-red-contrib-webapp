<script type="text/javascript" src="resources/node-red-contrib-webapp/lib/editor-common.js"></script>
<script type="text/javascript">
    (function () {
        const common = window.WebappEditorCommon;
        common.registerNodeType("ui-slot", {
            category: "webapp structure",
            color: "#d9efe2",
            defaults: {
                name: { value: "", required: true },
                uiId: { value: "", required: true },
                layoutId: { value: "", required: true },
                title: { value: "" },
                order: { value: 0, validate: RED.validators.number() }
            },
            inputs: 0,
            outputs: 0,
            icon: "font-awesome/fa-square-o",
            label: common.labelWithName("ui-slot"),
            oneditprepare: common.installReferenceSelectors({ layout: true })
        });
    })();
</script>
<script type="text/html" data-template-name="ui-slot">
    <div class="form-row"><label for="node-input-name">Slot</label><input type="text" id="node-input-name"></div>
    <div class="form-row"><label for="node-input-uiId">Slot ID</label><input type="text" id="node-input-uiId"></div>
    <div class="form-row"><label for="node-input-layoutId">Parent Layout</label><select id="node-input-layoutId"></select></div>
    <div class="form-tips">Der Slot lebt direkt in diesem Layout.</div>
    <div class="form-row"><label for="node-input-title">Titel</label><input type="text" id="node-input-title"></div>
    <div class="form-row"><label for="node-input-order">Order</label><input type="number" id="node-input-order"></div>
</script>
<script type="text/html"
    data-help-name="ui-slot"><p>Definiert einen benannten Mount-Slot innerhalb eines Layouts.</p></script>
