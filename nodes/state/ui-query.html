<script type="text/javascript" src="resources/node-red-contrib-webapp/lib/editor-common.js"></script>
<script type="text/javascript">
    (function () {
        const common = window.WebappEditorCommon;
        common.registerNodeType("ui-query", {
            category: "webapp state",
            color: "#d8e8f8",
            defaults: {
                name: { value: "" },
                app: { value: "", required: true, validate: common.validateAppRef },
                queryPath: { value: "", required: true },
                params: { value: "" },
                refreshAction: { value: "" },
                // P161 (ADR 0016 §3): debounce the params-observed out-port refresh
                // (ms). Empty / 0 = immediate.
                debounceMs: { value: "" }
            },
            inputs: 1,
            outputs: 1,
            icon: "font-awesome/fa-search",
            label: common.labelWithName("ui-query"),
            onadd: function () {
                if (!this.name) {
                    this.name = common.getNextNameDefault("ui-query", "Query");
                }
            },
            oneditprepare: function () {
                common.installParentAppSelector().call(this);
                common.installReferenceSelectors({ action: "#node-input-refreshAction", store: "#node-input-params" }).call(this);
            }
        });
    })();
</script>
<script type="text/html" data-template-name="ui-query">
    <div class="form-row"><label for="node-input-name" data-i18n="node-red:common.label.name">Name</label><input type="text" id="node-input-name"></div>
    <hr style="margin: 8px 0;">
    <div class="form-row"><label for="node-input-app" data-i18n="ui-query.label.app">App</label><select id="node-input-app"></select></div>
    <div class="form-row"><label for="node-input-queryPath" data-i18n="ui-query.label.queryPath">Query Path</label><input type="text" id="node-input-queryPath"></div>
    <div class="form-row"><label for="node-input-params" data-i18n="ui-query.label.params">Params Store</label><select id="node-input-params"></select></div>
    <div class="form-row"><label for="node-input-debounceMs" data-i18n="ui-query.label.debounceMs">Debounce (ms)</label><input type="number" id="node-input-debounceMs" min="0" placeholder="0 (sofort)" data-i18n="[placeholder]ui-query.placeholder.debounceMs"></div>
    <div class="form-row"><label for="node-input-refreshAction" data-i18n="ui-query.label.refreshAction">Refresh Action</label><select id="node-input-refreshAction"></select></div>
</script>
<!-- P267 (ADR 0042): help + labels are locale-migrated. Help lives in
     nodes/state/locales/{en-US,de}/ui-query.html; form-row labels carry
     data-i18n keys resolved from nodes/state/locales/{en-US,de}/ui-query.json.
     No inline data-help-name block here. -->
