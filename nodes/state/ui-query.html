<script type="text/javascript" src="resources/node-red-contrib-webapp/lib/editor-common.js"></script>
<script type="text/javascript">
    (function () {
        const common = window.WebappEditorCommon;
        common.registerNodeType("ui-query", {
            category: "webapp state",
            color: "#d8e8f8",
            defaults: {
                name: { value: "" },
                parent: { value: "" },
                queryPath: { value: "", required: true },
                params: { value: "" },
                refreshAction: { value: "" }
            },
            inputs: 1,
            outputs: 1,
            icon: "font-awesome/fa-search",
            label: common.labelWithName("ui-query"),
            onadd: function () {
                if (!this.name) {
                    this.name = common.getNextNameDefault("ui-query", "Query");
                }
            },
            oneditprepare: function () {
                common.installParentAppSelector().call(this);
                common.installReferenceSelectors({ action: "#node-input-refreshAction", store: "#node-input-params" }).call(this);
            }
        });
    })();
</script>
<script type="text/html" data-template-name="ui-query">
    <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
    <hr style="margin: 8px 0;">
    <div class="form-row"><label for="node-input-parent">App</label><select id="node-input-parent"></select></div>
    <div class="form-row"><label for="node-input-queryPath">Query Path</label><input type="text" id="node-input-queryPath"></div>
    <div class="form-row"><label for="node-input-params">Params Store</label><select id="node-input-params"></select></div>
    <div class="form-row"><label for="node-input-refreshAction">Refresh Action</label><select id="node-input-refreshAction"></select></div>
</script>
<script type="text/html" data-help-name="ui-query">
<p>Benannte, <b>server-geladene</b> Datenquelle mit Ladezustand, abgelegt unter
<code>ui.queries.&lt;queryPath&gt;</code>. Im UI <b>read-only</b> — fuer eigenen,
veraenderbaren Zustand nutze einen <code>ui-store</code>.</p>
<p><b>„Leer" ist normal:</b> der Knoten laedt nichts selbst. Daten kommen nur
ueber das <b>Wiring</b> herein: Trigger → ui-query (Pass-Through) → Datenquelle →
zurueck an den In-Port mit <code>msg.ui.query.data</code> (passender
<code>queryPath</code>). Ohne diese Verdrahtung bleibt die Query leer.</p>
<p><b>Push/Refresh</b> ueber <code>msg.ui.query</code> mit <code>queryPath</code>
und <code>data</code> / <code>error</code> / <code>refresh</code>.</p>
<p><b>Lesen:</b> Daten ueber <code>query:&lt;queryPath&gt;</code>; Ladezustand
ueber die reservierten Unterpfade <code>query:&lt;queryPath&gt;.loading</code> /
<code>.error</code> / <code>.updatedAt</code>.</p>
<p>Details:
<a href="https://github.com/ollixx/node-red-contrib-webapp/blob/develop/docs/nodes/state/ui-query.md">ui-query.md</a>.</p>
</script>
