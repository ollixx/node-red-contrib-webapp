<script type="text/javascript" src="resources/node-red-contrib-webapp/lib/editor-common.js"></script>
<script type="text/javascript">
    (function () {
        const common = window.WebappEditorCommon;
        common.registerNodeType("ui-query-action", {
            category: "webapp state",
            color: "#d8e8f8",
            defaults: {
                name: { value: "" },
                app: { value: "", required: true, validate: common.validateAppRef },
                query: { value: "", required: true },
                action: { value: "refresh", required: true },
                mode: { value: "reference", required: true }
            },
            inputs: 1,
            outputs: 1,
            icon: "font-awesome/fa-refresh",
            label: common.labelWithName("ui-query-action"),
            onadd: function () {
                if (!this.name) {
                    this.name = common.getNextNameDefault("ui-query-action", "Query Action");
                }
            },
            oneditprepare: function () {
                common.installParentAppSelector().call(this);
                common.installReferenceSelectors({ query: "#node-input-query" }).call(this);
            }
        });
    })();
</script>
<script type="text/html" data-template-name="ui-query-action">
    <div class="form-row"><label for="node-input-name" data-i18n="node-red:common.label.name">Name</label><input type="text" id="node-input-name"></div>
    <hr style="margin: 8px 0;">
    <div class="form-row"><label for="node-input-app" data-i18n="ui-query-action.label.app">App</label><select id="node-input-app"></select></div>
    <div class="form-row"><label for="node-input-query" data-i18n="ui-query-action.label.query">Query</label><select id="node-input-query"></select></div>
    <div class="form-row"><label for="node-input-action" data-i18n="ui-query-action.label.action">Action</label>
        <select id="node-input-action">
            <option value="refresh">refresh</option>
            <option value="replace">replace</option>
        </select>
    </div>
    <div class="form-row"><label for="node-input-mode" data-i18n="ui-query-action.label.mode">Mode</label>
        <select id="node-input-mode">
            <option value="reference" data-i18n="ui-query-action.option.mode.reference">reference (trigger directly)</option>
            <option value="wire" data-i18n="ui-query-action.option.mode.wire">wire (emit envelope)</option>
        </select>
    </div>
</script>
