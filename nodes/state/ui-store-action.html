<script type="text/javascript" src="resources/node-red-contrib-webapp/lib/editor-common.js"></script>
<script type="text/javascript">
    (function () {
        const common = window.WebappEditorCommon;
        common.registerNodeType("ui-store-action", {
            category: "webapp state",
            color: "#d8e8f8",
            defaults: {
                name: { value: "" },
                app: { value: "", required: true, validate: common.validateAppRef },
                store: { value: "", required: true },
                op: { value: "set", required: true },
                path: { value: "" },
                mode: { value: "reference", required: true }
            },
            inputs: 1,
            outputs: 1,
            icon: "font-awesome/fa-bolt",
            label: common.labelWithName("ui-store-action"),
            onadd: function () {
                if (!this.name) {
                    this.name = common.getNextNameDefault("ui-store-action", "Store Action");
                }
            },
            oneditprepare: function () {
                common.installParentAppSelector().call(this);
                common.installReferenceSelectors({ store: "#node-input-store" }).call(this);
            }
        });
    })();
</script>
<script type="text/html" data-template-name="ui-store-action">
    <div class="form-row"><label for="node-input-name" data-i18n="node-red:common.label.name">Name</label><input type="text" id="node-input-name"></div>
    <hr style="margin: 8px 0;">
    <div class="form-row"><label for="node-input-app" data-i18n="ui-store-action.label.app">App</label><select id="node-input-app"></select></div>
    <div class="form-row"><label for="node-input-store" data-i18n="ui-store-action.label.store">Store</label><select id="node-input-store"></select></div>
    <div class="form-row"><label for="node-input-op" data-i18n="ui-store-action.label.op">Operation</label>
        <select id="node-input-op">
            <option value="set">set</option>
            <option value="patch">patch</option>
            <option value="delete">delete</option>
            <option value="replace">replace</option>
            <option value="reset">reset</option>
        </select>
    </div>
    <div class="form-row"><label for="node-input-path" data-i18n="ui-store-action.label.path">Path</label><input type="text" id="node-input-path" placeholder="(optional sub-path, e.g. name)" data-i18n="[placeholder]ui-store-action.placeholder.path"></div>
    <div class="form-row"><label for="node-input-mode" data-i18n="ui-store-action.label.mode">Mode</label>
        <select id="node-input-mode">
            <option value="reference" data-i18n="ui-store-action.option.mode.reference">reference (apply directly)</option>
            <option value="wire" data-i18n="ui-store-action.option.mode.wire">wire (emit envelope)</option>
        </select>
    </div>
</script>
