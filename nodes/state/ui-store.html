<script type="text/javascript" src="resources/node-red-contrib-webapp/lib/editor-common.js"></script>
<script type="text/javascript">
    (function () {
        const common = window.WebappEditorCommon;
        common.registerNodeType("ui-store", {
            category: "webapp state",
            color: "#d8e8f8",
            defaults: {
                name: { value: "" },
                app: { value: "", required: true },
                statePath: { value: "", required: true },
                initialValue: { value: "" },
                persist: { value: false },
                scope: { value: "any" }
            },
            inputs: 1,
            outputs: 1,
            icon: "font-awesome/fa-database",
            label: common.labelWithName("ui-store"),
            onadd: function () {
                if (!this.name) {
                    this.name = common.getNextNameDefault("ui-store", "Store");
                }
            },
            oneditprepare: common.installParentAppSelector()
        });
    })();
</script>
<script type="text/html" data-template-name="ui-store">
    <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
    <hr style="margin: 8px 0;">
    <div class="form-row"><label for="node-input-app">App</label><select id="node-input-app"></select></div>
    <div class="form-row"><label for="node-input-statePath">State Path</label><input type="text" id="node-input-statePath"></div>
    <div class="form-row"><label for="node-input-initialValue">Initial Value JSON</label><input type="text" id="node-input-initialValue"></div>
    <div class="form-row"><label for="node-input-persist">Persist</label><input type="checkbox" id="node-input-persist" style="width:auto;margin-top:6px;"></div>
    <hr style="margin: 8px 0;">
    <div class="form-row">
        <label for="node-input-scope">Scope</label>
        <select id="node-input-scope">
            <option value="any">Any (default)</option>
            <option value="broadcast-only">Broadcast Only</option>
            <option value="client-only">Client Only</option>
        </select>
    </div>
</script>
<script type="text/html" data-help-name="ui-store">
    <p>Declares a named state slice in the app's client state. Use <strong>Scope</strong> to guard
    the allowed write target:</p>
    <ul>
        <li><strong>Any</strong> (default) — accepts both broadcast and per-client messages.
            Back-compatible with existing flows.</li>
        <li><strong>Broadcast Only</strong> — rejects messages that carry a <code>msg.ui.clientId</code>.
            Prevents accidentally overwriting shared state with a client-specific message.</li>
        <li><strong>Client Only</strong> — rejects messages that have no <code>msg.ui.clientId</code>.
            Prevents accidentally broadcasting a per-client value to all connected clients.</li>
    </ul>
    <p>State is written via <code>msg.ui.store</code> operations (<code>set</code>, <code>patch</code>,
    <code>delete</code>, <code>replace</code>, <code>reset</code>). Scope violations are reported as
    a structured <code>server.store.scope-violation</code> error and wired to any connected
    <em>catch</em> node.</p>
    <p><a href="https://github.com/ollixx/node-red-contrib-webapp/blob/develop/docs/nodes/state/ui-store.md"
        target="_blank">Full documentation</a></p>
</script>
