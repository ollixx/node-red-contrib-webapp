<script type="text/javascript" src="resources/node-red-contrib-webapp/lib/editor-common.js"></script>
<script type="text/javascript">
    (function () {
        const common = window.WebappEditorCommon;
        common.registerNodeType("ui-store", {
            category: "webapp state",
            color: "#d8e8f8",
            defaults: {
                name: { value: "" },
                app: { value: "", required: true, validate: common.validateAppRef },
                statePath: { value: "", required: true },
                initialValue: { value: "" },
                persist: { value: false },
                scope: { value: "any" }
            },
            inputs: 1,
            outputs: 1,
            icon: "font-awesome/fa-database",
            label: common.labelWithName("ui-store"),
            onadd: function () {
                if (!this.name) {
                    this.name = common.getNextNameDefault("ui-store", "Store");
                }
            },
            oneditprepare: common.installParentAppSelector()
        });
    })();
</script>
<script type="text/html" data-template-name="ui-store">
    <div class="form-row"><label for="node-input-name" data-i18n="node-red:common.label.name">Name</label><input type="text" id="node-input-name"></div>
    <hr style="margin: 8px 0;">
    <div class="form-row"><label for="node-input-app" data-i18n="ui-store.label.app">App</label><select id="node-input-app"></select></div>
    <div class="form-row"><label for="node-input-statePath" data-i18n="ui-store.label.statePath">State Path</label><input type="text" id="node-input-statePath"></div>
    <div class="form-row"><label for="node-input-initialValue" data-i18n="ui-store.label.initialValue">Initial Value JSON</label><input type="text" id="node-input-initialValue"></div>
    <div class="form-row"><label for="node-input-persist" data-i18n="ui-store.label.persist">Persist</label><input type="checkbox" id="node-input-persist" style="width:auto;margin-top:6px;"></div>
    <hr style="margin: 8px 0;">
    <div class="form-row">
        <label for="node-input-scope" data-i18n="ui-store.label.scope">Scope</label>
        <select id="node-input-scope">
            <option value="any" data-i18n="ui-store.option.scope.any">Any (default)</option>
            <option value="broadcast-only" data-i18n="ui-store.option.scope.broadcast-only">Broadcast Only</option>
            <option value="client-only" data-i18n="ui-store.option.scope.client-only">Client Only</option>
        </select>
    </div>
</script>
<!-- P267 (ADR 0042): help + labels are locale-migrated. Help lives in
     nodes/state/locales/{en-US,de}/ui-store.html; form-row labels carry
     data-i18n keys resolved from nodes/state/locales/{en-US,de}/ui-store.json.
     No inline data-help-name block here. -->
