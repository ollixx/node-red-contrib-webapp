<script type="text/javascript" src="resources/node-red-contrib-webapp/lib/editor-common.js"></script>
<script type="text/javascript">
    (function () {
        const common = window.WebappEditorCommon;
        common.registerNodeType("ui-store-read", {
            category: "webapp state",
            color: "#d8e8f8",
            defaults: {
                name: { value: "" },
                app: { value: "", required: true, validate: common.validateAppRef },
                store: { value: "", required: true },
                path: { value: "" }
            },
            inputs: 1,
            outputs: 1,
            icon: "font-awesome/fa-download",
            label: common.labelWithName("ui-store-read"),
            onadd: function () {
                if (!this.name) {
                    this.name = common.getNextNameDefault("ui-store-read", "Store Read");
                }
            },
            oneditprepare: function () {
                common.installParentAppSelector().call(this);
                common.installReferenceSelectors({ store: "#node-input-store" }).call(this);
            }
        });
    })();
</script>
<script type="text/html" data-template-name="ui-store-read">
    <div class="form-row"><label for="node-input-name" data-i18n="node-red:common.label.name">Name</label><input type="text" id="node-input-name"></div>
    <hr style="margin: 8px 0;">
    <div class="form-row"><label for="node-input-app" data-i18n="ui-store-read.label.app">App</label><select id="node-input-app"></select></div>
    <div class="form-row"><label for="node-input-store" data-i18n="ui-store-read.label.store">Store</label><select id="node-input-store"></select></div>
    <div class="form-row"><label for="node-input-path" data-i18n="ui-store-read.label.path">Default Path</label><input type="text" id="node-input-path" placeholder="(optional sub-path, e.g. name)" data-i18n="[placeholder]ui-store-read.placeholder.path"></div>
</script>

     nodes/state/locales/{en-US,de}/ui-store-read.html; form-row labels carry
     data-i18n keys resolved from nodes/state/locales/{en-US,de}/ui-store-read.json.
