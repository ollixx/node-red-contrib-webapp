<script type="text/javascript" src="resources/node-red-contrib-webapp/lib/editor-common.js"></script>
<script type="text/javascript">
    (function () {
        const common = window.WebappEditorCommon;

        // P222 (ADR 0015): common base fields. See the applicability table in
        // docs/nodes/concepts/editor.md. `omit` drops a field the node already
        // owns a dedicated control for (avoids duplicate #node-input carrier ids).
        const BASE_FIELDS = {
            visible: true,
            disabled: true,
            color: false,
            size: false,
            variant: false,
            advanced: ["size"],
            omit: ["disabled"],
            // P268 (ADR 0042 §3): N/A hints live in the node's OWN locale catalog
            // (nodes/view/locales/<lang>/ui-slider.json -> `ui-slider.hints.<field>`).
            i18nNode: "ui-slider"
        };
        common.registerNodeType("ui-slider", {
            category: "webapp view",
            color: "#f4efcf",
            defaults: {
                visible: { value: null },
                visibleBinding: { value: "" },
                name: { value: "" },
                app: { value: "" },
                mount: { value: "", required: true },
                // P126 (ADR 0012): `value` persists the binding OBJECT; there is no
                // matching #node-input-value element so Node-RED auto-save cannot
                // clobber it. The typedInput lives on #node-input-valueBinding.
                // Legacy `valuePath` (pre-P126 plain state path) is kept for migration only.
                value: { value: null },
                valueBinding: { value: "" },
                // P146 (ADR 0012): `label` persists the binding OBJECT; the
                // typedInput lives directly on #node-input-label so the
                // minimal-coverage E2E check (`fields:["label"]`) still passes.
                // A legacy plain-string `label` is migrated on open.
                label: { value: { kind: "literal", value: "" } },
                min: { value: "" },
                max: { value: "" },
                step: { value: "" },
                showValue: { value: false },
                // P126 (ADR 0012 / boolean category): `disabled` persists the binding
                // OBJECT; there is no matching #node-input-disabled element so
                // Node-RED auto-save cannot clobber it. The typedInput lives on
                // #node-input-disabledBinding.
                disabled: { value: null },
                disabledBinding: { value: "" },
                // P204 (ADR 0027): `writeTo` — WRITE half (store/flow/global). A
                // slider has no submit gesture → writes on change (drag) regardless
                // of writeTrigger; its value is numeric-as-string. Legacy
                // storeId/path migrate to writeTo=store.
                writeTo: { value: null },
                writeToBinding: { value: "" },
                writeTrigger: { value: "submit" },

                order: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                row: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                col: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                colSize: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                rowSize: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                layoutX: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                layoutY: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } }
            },
            // P229 (ADR 0038): migration-only legacy fields — injected as hidden
            // defaults at registration (see editor-common withMigrationDefaults);
            // migrated to `writeTo` on open, deleted on save, never written anew.
            migrationFields: ["storeId", "path", "valuePath"],
            inputs: 1,
            outputs: 1,
            outputLabels: function () { return "event"; },
            icon: "font-awesome/fa-sliders",
            label: common.labelWithName("ui-slider"),
            onadd: function () {
                if (!this.name) {
                    this.name = common.getNextNameDefault("ui-slider", "Slider");
                }
            },
            oneditprepare: function () {
                common.installReferenceSelectors({ mount: true }).call(this);
                common.installBaseFields(BASE_FIELDS).call(this);
                common.installLayoutChildPropRows().call(this);

                // P146 (ADR 0012 / value category): `label` typedInput.
                // The typedInput lives on #node-input-label (not a separate
                // *Binding element) so the minimal-coverage E2E check passes.
                // Migration: a legacy plain-string `label` opens as a `str` literal.
                const storedLabel = common.parseBindingValue(this.label);
                const labelBinding = storedLabel
                    ? storedLabel
                    : (typeof this.label === "string" && this.label.length > 0
                        ? { kind: "literal", value: this.label }
                        : undefined);
                const labelEditor = common.readValueBinding(labelBinding, "");
                const labelInput = $("#node-input-label");
                labelInput.typedInput({
                    default: labelEditor.type,
                    types: common.valueBindingTypes({ category: "value", currentKind: labelEditor.type })
                });
                labelInput.typedInput("type", labelEditor.type);
                labelInput.typedInput("value", labelEditor.value);

                // P126 (ADR 0012 / value/display category): `value` typedInput — full
                // canonical set with literal default type `num` (slider is numeric).
                // Migration: a legacy `valuePath` plain string becomes a state binding;
                // a stored `value` binding object takes precedence.
                const storedValue = common.parseBindingValue(this.value);
                const valueBinding = storedValue
                    ? storedValue
                    : (this.valuePath ? { kind: "state", path: this.valuePath } : undefined);
                const valueEditor = common.readValueBinding(valueBinding, "");
                // Use "num" as the default type for a numeric slider.
                const valueDefaultType = valueEditor.type !== "str" ? valueEditor.type : "num";
                const valueInput = $("#node-input-valueBinding");
                valueInput.typedInput({
                    default: valueDefaultType,
                    types: common.valueBindingTypes({ category: "value", currentKind: valueEditor.type })
                });
                valueInput.typedInput("type", valueEditor.type !== "str" || valueBinding ? valueEditor.type : "num");
                valueInput.typedInput("value", valueEditor.value);

                // P126 (ADR 0012 / boolean category): `disabled` typedInput.
                // No legacy to migrate (new field).
                const storedDisabled = common.parseBindingValue(this.disabled);
                const disabledBinding = storedDisabled ? storedDisabled : undefined;
                const disabledEditor = common.readValueBinding(disabledBinding, "");
                // P181: use 'bool' default when no binding (avoids store fallback).
                const disabledType = disabledEditor.type !== "str" ? disabledEditor.type : "bool";
                const disabledInput = $("#node-input-disabledBinding");
                disabledInput.typedInput({
                    default: disabledType,
                    types: common.valueBindingTypes({ category: "boolean" })
                });
                disabledInput.typedInput("type", disabledType);
                disabledInput.typedInput("value", disabledEditor.value);
                disabledInput.data("base-field-originally-empty", !disabledBinding);

                // P204 (ADR 0027 / writable category): `writeTo` typedInput.
                common.installWriteToField.call(this);
            },
            oneditsave: function () {
                common.applyBaseFields(BASE_FIELDS).call(this);
                // P204: persist writeTo + writeTrigger; drop legacy storeId/path.
                common.saveWriteToField.call(this);

                // P146: persist label as binding object.
                this.label = common.applyValueBinding(
                    $("#node-input-label").typedInput("type"),
                    $("#node-input-label").typedInput("value")
                );

                // P126: persist value as binding object; clear legacy valuePath.
                this.value = common.applyValueBinding(
                    $("#node-input-valueBinding").typedInput("type"),
                    $("#node-input-valueBinding").typedInput("value")
                );
                common.dropLegacyFields(this, ["valuePath"]);
                // P126: persist disabled as binding object.
                // P181: preserve null when field was originally absent and untouched.
                const $disabledInput = $("#node-input-disabledBinding");
                const disabledResult = common.applyValueBinding(
                    $disabledInput.typedInput("type"),
                    $disabledInput.typedInput("value")
                );
                const disabledOriginEmpty = $disabledInput.data("base-field-originally-empty");
                const disabledIsBoolLiteral = disabledResult && disabledResult.kind === "literal"
                    && disabledResult.value === false;
                this.disabled = (disabledOriginEmpty && disabledIsBoolLiteral) ? null : disabledResult;
            }
        });
    })();
</script>
<!-- P268 (ADR 0042 §3): editor-label i18n. Form-row labels carry data-i18n keys
     per the convention `<node>.label.<field>` (options `<node>.option.<field>.<value>`,
     placeholders `[placeholder]<node>.placeholder.<field>`). Catalogs:
     nodes/view/locales/{en-US,de}/ui-slider.json. The literal texts stay as the en-US
     authoring reference; at edit time the catalog text replaces them. -->
<script type="text/html" data-template-name="ui-slider">
    <div class="form-row"><label for="node-input-name" data-i18n="node-red:common.label.name">Name</label><input type="text" id="node-input-name"></div>
    <hr style="margin: 8px 0;">
    <div class="form-row"><label for="node-input-mount" data-i18n="ui-slider.label.mount">Parent Slot</label><select id="node-input-mount"></select></div>
    <!-- P146 (ADR 0012 / value category): Label binding — typedInput managed in oneditprepare/oneditsave. -->
    <div class="form-row"><label for="node-input-label" data-i18n="ui-slider.label.label">Label</label><input type="text" id="node-input-label"></div>
    <!-- P126 (ADR 0012 / value/display category): Value binding — typedInput managed in oneditprepare/oneditsave. -->
    <div class="form-row"><label for="node-input-valueBinding" data-i18n="ui-slider.label.valueBinding">Value</label><input type="text" id="node-input-valueBinding"></div>
    <!-- P204 (ADR 0027 / writable category): writeTo target (WRITE) — Store/Flow/Global. -->
    <div class="form-row"><label for="node-input-writeToBinding" data-i18n="ui-slider.label.writeToBinding">Write To</label><input type="text" id="node-input-writeToBinding"></div>
    <div class="form-row"><label for="node-input-writeTrigger" data-i18n="ui-slider.label.writeTrigger">Write Trigger</label><select id="node-input-writeTrigger"><option value="submit" data-i18n="ui-slider.option.writeTrigger.submit">submit</option><option value="change" data-i18n="ui-slider.option.writeTrigger.change">change</option><option value="none" data-i18n="ui-slider.option.writeTrigger.none">none</option></select></div>
    <div class="form-row"><label for="node-input-min" data-i18n="ui-slider.label.min">Min</label><input type="number" id="node-input-min"></div>
    <div class="form-row"><label for="node-input-max" data-i18n="ui-slider.label.max">Max</label><input type="number" id="node-input-max"></div>
    <div class="form-row"><label for="node-input-step" data-i18n="ui-slider.label.step">Step</label><input type="number" id="node-input-step" min="0.001"></div>
    <div class="form-row"><label for="node-input-showValue" data-i18n="ui-slider.label.showValue">Show Value</label><input type="checkbox" id="node-input-showValue" style="width:auto"></div>
    <!-- P126 (ADR 0012 / boolean category): Disabled binding — typedInput managed in oneditprepare/oneditsave. -->
    <div class="form-row"><label for="node-input-disabledBinding" data-i18n="ui-slider.label.disabledBinding">Disabled</label><input type="text" id="node-input-disabledBinding"></div>
</script>
<!-- P268 (ADR 0042): help + labels are locale-migrated. Help lives in
     nodes/view/locales/{en-US,de}/ui-slider.html; form-row labels carry
