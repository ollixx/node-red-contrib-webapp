<script type="text/javascript" src="resources/node-red-contrib-webapp/lib/editor-common.js"></script>
<script type="text/javascript">
    (function () {
        const common = window.WebappEditorCommon;

        // P222 (ADR 0015): common base fields. See the applicability table in
        // docs/nodes/concepts/editor.md. `omit` drops a field the node already
        // owns a dedicated control for (avoids duplicate #node-input carrier ids).
        const BASE_FIELDS = {
            visible: true,
            disabled: true,
            color: true,
            size: false,
            variant: false,
            advanced: ["size"],
            omit: [],
            i18nNode: "ui-accordion",
            hints: {
                size: "Dieser Knoten hat keine Größen-Stufen."
            }
        };
        common.registerNodeType("ui-accordion", {
            category: "webapp view",
            color: "#f4efcf",
            defaults: {
                visible: { value: null },
                visibleBinding: { value: "" },
                disabled: { value: null },
                disabledBinding: { value: "" },
                color: { value: null },
                colorBinding: { value: "" },
                name: { value: "" },
                app: { value: "" },
                mount: { value: "", required: true },
                // P169 (ADR 0018/0012): `openSection` (two-way value typedInput)
                // persists the binding OBJECT; the typedInput carrier is
                // #node-input-openSectionBinding so Node-RED auto-save cannot clobber
                // it. Legacy `openSectionPath` (plain state path) migrates on open.
                openSection: { value: null },
                openSectionBinding: { value: "" },
                multiple: { value: false },
                events: { value: "" },
                order: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                row: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                col: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                colSize: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                rowSize: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                layoutX: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                layoutY: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } }
            },
            // P229 (ADR 0038): migration-only legacy fields — injected as hidden
            // defaults at registration (see editor-common withMigrationDefaults);
            // migrated to the canonical binding on open, deleted on save.
            migrationFields: ["openSectionPath"],
            inputs: 1,
            outputs: 1,
            outputLabels: function () { return "event"; },
            icon: "font-awesome/fa-list",
            label: common.labelWithName("ui-accordion"),
            onadd: function () {
                if (!this.name) {
                    this.name = common.getNextNameDefault("ui-accordion", "Accordion");
                }
            },
            oneditprepare: function () {
                common.installReferenceSelectors({ mount: true }).call(this);
                common.installBaseFields(BASE_FIELDS).call(this);
                common.installLayoutChildPropRows().call(this);

                // P169 (ADR 0012 / value category): `openSection` typedInput — full
                // canonical set with literal default type `str` (a section id). This
                // is the TWO-WAY input value (mirror of ui-tabs activeTab). Migration:
                // a legacy `openSectionPath` plain string becomes a state binding; a
                // stored `openSection` binding wins.
                const storedOpen = common.parseBindingValue(this.openSection);
                const openBinding = storedOpen
                    ? storedOpen
                    : (this.openSectionPath ? { kind: "state", path: this.openSectionPath } : undefined);
                const openEditor = common.readValueBinding(openBinding, "");
                const openInput = $("#node-input-openSectionBinding");
                openInput.typedInput({
                    default: openEditor.type,
                    types: common.valueBindingTypes({ category: "value", currentKind: openEditor.type })
                });
                openInput.typedInput("type", openEditor.type);
                openInput.typedInput("value", openEditor.value);
            },
            oneditsave: function () {
                common.applyBaseFields(BASE_FIELDS).call(this);
                // P169: persist openSection as a binding object; clear the legacy path.
                this.openSection = common.applyValueBinding(
                    $("#node-input-openSectionBinding").typedInput("type"),
                    $("#node-input-openSectionBinding").typedInput("value")
                );
                common.dropLegacyFields(this, ["openSectionPath"]);
            }
        });
    })();
</script>
<script type="text/html" data-template-name="ui-accordion">
    <div class="form-row"><label for="node-input-name" data-i18n="node-red:common.label.name">Name</label><input type="text" id="node-input-name"></div>
    <hr style="margin: 8px 0;">
    <div class="form-row"><label for="node-input-mount" data-i18n="ui-accordion.label.mount">Parent Slot</label><select id="node-input-mount"></select></div>
    <!-- P169 (ADR 0012 / value category): Open Section binding (two-way) — typedInput managed in oneditprepare/oneditsave. -->
    <div class="form-row"><label for="node-input-openSectionBinding" data-i18n="ui-accordion.label.openSection">Open Section</label><input type="text" id="node-input-openSectionBinding"></div>
    <div class="form-row"><label for="node-input-multiple" data-i18n="ui-accordion.label.multiple">Allow Multiple Open</label><input type="checkbox" id="node-input-multiple" style="width:auto"></div>
    <div class="form-tips" style="margin-top: 4px;">
        <b>P169 (ADR 0018):</b> Sektionen werden aus den gemounteten
        <code>ui-accordion-section</code>-Kindern abgeleitet — es gibt <b>kein</b>
        Sections-JSON-Feld mehr. Lege je Sektion einen <code>ui-accordion-section</code>
        an und mounte ihn in dieses <code>ui-accordion</code> („Mounten in
        ui-accordion heißt: werde eine Sektion"). Die Sektions-IDs müssen eindeutig
        sein; <b>Open Section</b> trägt die ID der offenen Sektion.
    </div>
</script>
