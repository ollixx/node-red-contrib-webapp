<script type="text/javascript" src="resources/node-red-contrib-webapp/lib/editor-common.js"></script>
<script type="text/javascript">
    (function () {
        const common = window.WebappEditorCommon;

        // P222 (ADR 0015): common base fields. See the applicability table in
        // docs/nodes/concepts/editor.md. `omit` drops a field the node already
        // owns a dedicated control for (avoids duplicate #node-input carrier ids).
        const BASE_FIELDS = {
            visible: true,
            disabled: false,
            color: false,
            size: false,
            variant: false,
            advanced: ["size"],
            omit: [],
            i18nNode: "ui-toast",
            hints: {
                disabled: "Ein Toast hat keinen interaktiven Zustand.",
                color: "Die Farbe des Toasts kommt aus der Severity.",
                size: "Dieser Knoten hat keine Größen-Stufen."
            }
        };
        common.registerNodeType("ui-toast", {
            category: "webapp view",
            color: "#f4efcf",
            defaults: {
                visible: { value: null },
                visibleBinding: { value: "" },
                name: { value: "" },
                app: { value: "" },
                severity: { value: "info" },
                duration: { value: 4000, validate: function (value) { return value === "" || RED.validators.number()(value); } },
                position: { value: "bottom-right" }
            },
            inputs: 1,
            outputs: 1,
            icon: "font-awesome/fa-bell",
            label: common.labelWithName("ui-toast"),
            onadd: function () {
                if (!this.name) {
                    this.name = common.getNextNameDefault("ui-toast", "Toast");
                }
            },
            oneditsave: function () {
                common.applyBaseFields(BASE_FIELDS).call(this);
            },
            oneditprepare: function () {
                // P228: the owning-app field is `app`; the shared App picker
                // binds the #node-input-app carrier (the old
                // `installReferenceSelectors({ parent: … })` config key was a
                // dead branch — the selector never installed a picker for it).
                common.installParentAppSelector().call(this);
                common.installBaseFields(BASE_FIELDS).call(this);
            }
        });
    })();
</script>
<script type="text/html" data-template-name="ui-toast">
    <div class="form-row"><label for="node-input-name" data-i18n="node-red:common.label.name">Name</label><input type="text" id="node-input-name"></div>
    <hr style="margin: 8px 0;">
    <div class="form-row"><label for="node-input-app" data-i18n="ui-toast.label.app">App</label><select id="node-input-app"></select></div>
    <div class="form-row"><label for="node-input-severity" data-i18n="ui-toast.label.severity">Severity</label>
        <select id="node-input-severity">
            <option value="primary" data-i18n="ui-toast.option.severity.primary">Primary</option>
            <option value="info" data-i18n="ui-toast.option.severity.info">Info</option>
            <option value="success" data-i18n="ui-toast.option.severity.success">Success</option>
            <option value="warning" data-i18n="ui-toast.option.severity.warning">Warning</option>
            <option value="danger" data-i18n="ui-toast.option.severity.danger">Danger</option>
            <option value="neutral" data-i18n="ui-toast.option.severity.neutral">Neutral</option>
        </select>
    </div>
    <div class="form-row"><label for="node-input-duration" data-i18n="ui-toast.label.duration">Duration (ms)</label><input type="number" id="node-input-duration" min="0"></div>
    <div class="form-row"><label for="node-input-position" data-i18n="ui-toast.label.position">Position</label>
        <select id="node-input-position">
            <option value="top-right" data-i18n="ui-toast.option.position.top-right">Top Right</option>
            <option value="top-center" data-i18n="ui-toast.option.position.top-center">Top Center</option>
            <option value="bottom-right" data-i18n="ui-toast.option.position.bottom-right">Bottom Right</option>
            <option value="bottom-center" data-i18n="ui-toast.option.position.bottom-center">Bottom Center</option>
        </select>
    </div>
</script>
<!-- P270 (ADR 0042): help + labels are locale-migrated. Help lives in
     nodes/view/locales/{en-US,de}/ui-toast.html; form-row labels carry data-i18n
     keys resolved from nodes/view/locales/{en-US,de}/ui-toast.json. No inline
     data-help-name block here. -->
