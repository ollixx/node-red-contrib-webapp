<script type="text/javascript" src="resources/node-red-contrib-webapp/lib/editor-common.js"></script>
<script type="text/javascript">
    (function () {
        const common = window.WebappEditorCommon;

        // P241 (ADR 0015 §3): common base fields via the shared helper (replaces the
        // hand-built P138/P181/P202 `visible` logic — no more duplicated seeding).
        //   visible  → active (the load-state gate; empty = always visible).
        //   color    → active (ADR 0039): tints the placeholder/shimmer fill.
        //   disabled → N/A: a loading placeholder is not interactive
        //              (rendered-disabled with a node-local hint, ADR 0015 §3).
        const BASE_FIELDS = {
            visible: true,
            disabled: false,
            color: true,
            size: false,
            variant: false,
            advanced: [],
            omit: [],
            i18nNode: "ui-skeleton",
            hints: {
                disabled: "Ein Lade-Platzhalter hat keinen interaktiven Zustand.",
                size: "Dieser Knoten hat keine Größen-Stufen."
            }
        };

        common.registerNodeType("ui-skeleton", {
            category: "webapp view",
            color: "#f4efcf",
            defaults: {
                // P241 (ADR 0015): base fields via installBaseFields/applyBaseFields.
                // `visible` persists the binding OBJECT (DOM-less carrier on
                // #node-input-visibleBinding); legacy `visiblePath` (plain state path)
                // is kept for lossless migration only. `color` mirrors the shape.
                visible: { value: null },
                visibleBinding: { value: "" },
                color: { value: null },
                colorBinding: { value: "" },
                name: { value: "" },
                app: { value: "" },
                mount: { value: "", required: true },
                displayType: { value: "text" },
                // P241 (findings D): `lines` must be a positive integer (≥ 1).
                // Empty is allowed (serializer default 3); 0/negative is a REAL
                // editor validation error (node red, deploy blocked) — no longer
                // deferred to the schema's .int().positive() at deploy time.
                lines: { value: 3, validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                order: { value: "", validate: function (value) { return value == null || value === "" || RED.validators.number()(value); } },
                row: { value: "", validate: function (value) { return value == null || value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                col: { value: "", validate: function (value) { return value == null || value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                colSize: { value: "", validate: function (value) { return value == null || value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                rowSize: { value: "", validate: function (value) { return value == null || value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                layoutX: { value: "", validate: function (value) { return value == null || value === "" || RED.validators.number()(value); } },
                layoutY: { value: "", validate: function (value) { return value == null || value === "" || RED.validators.number()(value); } }
            },
            // P229 (ADR 0038): migration-only legacy fields — injected as hidden
            // defaults at registration (see editor-common withMigrationDefaults);
            // migrated to the canonical binding on open, deleted on save.
            migrationFields: ["visiblePath"],
            inputs: 1,
            outputs: 0,
            icon: "font-awesome/fa-square",
            label: common.labelWithName("ui-skeleton"),
            onadd: function () {
                if (!this.name) {
                    this.name = common.getNextNameDefault("ui-skeleton", "Skeleton");
                }
            },
            oneditprepare: function () {
                common.installReferenceSelectors({ mount: true }).call(this);
                common.installBaseFields(BASE_FIELDS).call(this);
                common.installLayoutChildPropRows().call(this);

                // P138 (retained): conditionally disable `lines` when the selected
                // displayType renders no line count (avatar, card). `text` uses lines
                // for its placeholder lines; `table` uses lines for its row count.
                function updateLinesState() {
                    var dt = $("#node-input-displayType").val();
                    var linesRow = $("#node-input-lines").closest(".form-row");
                    var hintRow = $("#ui-skeleton-lines-hint");
                    if (dt === "text" || dt === "table" || dt === "" || !dt) {
                        $("#node-input-lines").prop("disabled", false);
                        hintRow.hide();
                        linesRow.show();
                    } else {
                        $("#node-input-lines").prop("disabled", true);
                        hintRow.show();
                        linesRow.show();
                    }
                }
                $("#node-input-displayType").on("change", updateLinesState);
                updateLinesState();
            },
            oneditsave: function () {
                // P241 (ADR 0015): persist visible/color via the shared helper
                // (clears legacy visiblePath; preserves neutral-true seeding).
                common.applyBaseFields(BASE_FIELDS).call(this);
            }
        });
    })();
</script>
<script type="text/html" data-template-name="ui-skeleton">
    <div class="form-row"><label for="node-input-name" data-i18n="node-red:common.label.name">Name</label><input type="text" id="node-input-name"></div>
    <hr style="margin: 8px 0;">
    <div class="form-row"><label for="node-input-mount" data-i18n="ui-skeleton.label.mount">Parent Slot</label><select id="node-input-mount"></select></div>
    <hr style="margin: 8px 0;">
    <div class="form-row"><label for="node-input-displayType" data-i18n="ui-skeleton.label.displayType">Display Type</label>
        <select id="node-input-displayType">
            <option value="text" data-i18n="ui-skeleton.option.displayType.text">Text</option>
            <option value="avatar" data-i18n="ui-skeleton.option.displayType.avatar">Avatar</option>
            <option value="card" data-i18n="ui-skeleton.option.displayType.card">Card</option>
            <option value="table" data-i18n="ui-skeleton.option.displayType.table">Table</option>
        </select>
    </div>
    <div class="form-row"><label for="node-input-lines" data-i18n="ui-skeleton.label.lines">Lines</label><input type="number" id="node-input-lines" min="1"></div>
    <!-- P138/P241: hint shown when displayType does not use lines (avatar/card). -->
    <div id="ui-skeleton-lines-hint" data-i18n="ui-skeleton.hints.lines" style="display:none; margin-left:105px; color:#999; font-size:0.85em;">Lines gilt nur für Text und Table</div>
</script>

     keys resolved from nodes/view/locales/{en-US,de}/ui-skeleton.json. No inline
