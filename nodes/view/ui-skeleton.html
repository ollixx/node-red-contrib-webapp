<script type="text/javascript" src="resources/node-red-contrib-webapp/lib/editor-common.js"></script>
<script type="text/javascript">
    (function () {
        const common = window.WebappEditorCommon;
        common.registerNodeType("ui-skeleton", {
            category: "webapp view",
            color: "#f4efcf",
            defaults: {
                name: { value: "" },
                parent: { value: "" },
                mount: { value: "", required: true },
                // P138 (ADR 0012): `visible` persists the binding OBJECT; there is no
                // matching #node-input-visible element so Node-RED auto-save cannot
                // clobber it. The typedInput lives on #node-input-visibleBinding.
                // Legacy: `visiblePath` (plain state path) is kept for migration only.
                visiblePath: { value: "" },
                visible: { value: null },
                visibleBinding: { value: "" },
                displayType: { value: "text" },
                lines: { value: 3, validate: function (value) { return value === "" || RED.validators.number()(value); } },
                order: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                row: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                col: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                colSize: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                rowSize: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                layoutX: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                layoutY: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } }
            },
            inputs: 1,
            outputs: 0,
            icon: "font-awesome/fa-square",
            label: common.labelWithName("ui-skeleton"),
            onadd: function () {
                if (!this.name) {
                    this.name = common.getNextNameDefault("ui-skeleton", "Skeleton");
                }
            },
            oneditprepare: function () {
                common.installReferenceSelectors({ mount: true }).call(this);
                common.installLayoutChildPropRows().call(this);

                // P138 (ADR 0012 / boolean category): `visible` typedInput.
                // Migration: a legacy `visiblePath` plain string becomes a state
                // binding; a stored `visible` binding object takes precedence.
                var storedVisible = common.parseBindingValue(this.visible);
                var visibleBinding = storedVisible
                    ? storedVisible
                    : (this.visiblePath ? { kind: "state", path: this.visiblePath } : undefined);
                var visibleEditor = common.readValueBinding(visibleBinding, "");
                // P181: when the binding is absent, use 'bool' as the default type
                // so Node-RED shows a clean true/false control instead of the first
                // entry of the boolean set (store → empty dropdown + '…').
                var visibleType = visibleEditor.type !== "str" ? visibleEditor.type : "bool";
                var visibleInput = $("#node-input-visibleBinding");
                visibleInput.typedInput({
                    default: visibleType,
                    types: common.valueBindingTypes({ category: "boolean" })
                });
                visibleInput.typedInput("type", visibleType);
                visibleInput.typedInput("value", visibleEditor.value);
                // P181: track original-empty to preserve "no binding" on save.
                visibleInput.data("base-field-originally-empty", !visibleBinding);

                // P138: Conditionally disable the `lines` field when the selected
                // displayType renders no lines (avatar, card, table). Only `text`
                // uses lines. Show a hint when lines is not applicable.
                function updateLinesState() {
                    var dt = $("#node-input-displayType").val();
                    var linesRow = $("#node-input-lines").closest(".form-row");
                    var hintRow = $("#ui-skeleton-lines-hint");
                    if (dt === "text" || dt === "" || !dt) {
                        $("#node-input-lines").prop("disabled", false);
                        hintRow.hide();
                        linesRow.show();
                    } else {
                        $("#node-input-lines").prop("disabled", true);
                        hintRow.show();
                        linesRow.show();
                    }
                }
                $("#node-input-displayType").on("change", updateLinesState);
                updateLinesState();
            },
            oneditsave: function () {
                // P138: persist visible as binding object; clear legacy visiblePath.
                // P181: if the field was originally absent and the user never touched
                // it, keep visible null (no binding = always visible).
                var $visibleInput = $("#node-input-visibleBinding");
                var visibleResult = common.applyValueBinding(
                    $visibleInput.typedInput("type"),
                    $visibleInput.typedInput("value")
                );
                var visibleOriginEmpty = $visibleInput.data("base-field-originally-empty");
                var visibleIsBoolLiteral = visibleResult && visibleResult.kind === "literal"
                    && visibleResult.value === false;
                this.visible = (visibleOriginEmpty && visibleIsBoolLiteral) ? null : visibleResult;
                this.visiblePath = "";
            }
        });
    })();
</script>
<script type="text/html" data-template-name="ui-skeleton">
    <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
    <hr style="margin: 8px 0;">
    <div class="form-row"><label for="node-input-mount">Parent Slot</label><select id="node-input-mount"></select></div>
    <!-- P138 (ADR 0012 / boolean category): Visible binding — typedInput managed in oneditprepare/oneditsave. -->
    <div class="form-row"><label for="node-input-visibleBinding">Visible</label><input type="text" id="node-input-visibleBinding"></div>
    <hr style="margin: 8px 0;">
    <div class="form-row"><label for="node-input-displayType">Display Type</label>
        <select id="node-input-displayType">
            <option value="text">Text</option>
            <option value="avatar">Avatar</option>
            <option value="card">Card</option>
            <option value="table">Table</option>
        </select>
    </div>
    <div class="form-row"><label for="node-input-lines">Lines</label><input type="number" id="node-input-lines" min="1"></div>
    <!-- P138: hint shown when displayType does not use lines (avatar/card/table). -->
    <div id="ui-skeleton-lines-hint" style="display:none; margin-left:105px; color:#999; font-size:0.85em;">Lines gilt nur für den Text-Typ</div>
</script>
<script type="text/html" data-help-name="ui-skeleton">
<p>Animierter Lade-Platzhalter der die Form des eigentlichen Inhalts imitiert.</p>
<p>Solange <b>Visible</b> truthy ist, wird der Skeleton angezeigt (Daten werden geladen). Wird <b>Visible</b> falsy, verschwindet der Skeleton und der echte Inhalt übernimmt.</p>
<h4>Display Type</h4>
<p><b>Text</b> (Standard) — simuliert Textzeilen; <b>Lines</b> bestimmt die Anzahl. <b>Avatar</b>, <b>Card</b> und <b>Table</b> imitieren die Form der entsprechenden Komponente; <b>Lines</b> ist für diese Typen nicht relevant.</p>
<h4>Visible (P138)</h4>
<p>Bindbar über den Boolean-Zustand-Satz (ADR 0012): Store, Query, Route-Param, Reactive, msg, JSONata, boolean, Flow, Global, Env. Leer = immer sichtbar. Ein bestehender <code>visiblePath</code> wird automatisch als <code>state</code>-Binding übernommen.</p>
<p><a href="https://github.com/ollixx/node-red-contrib-webapp/blob/develop/docs/nodes/feedback/ui-skeleton.md">Ausführliche Doku</a></p>
</script>
