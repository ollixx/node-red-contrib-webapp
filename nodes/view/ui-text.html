<script type="text/javascript" src="resources/node-red-contrib-webapp/lib/editor-common.js"></script>
<script type="text/javascript">
    (function () {
        const common = window.WebappEditorCommon;
        common.registerNodeType("ui-text", {
            category: "webapp view",
            color: "#f4efcf",
            defaults: {
                name: { value: "" },
                parent: { value: "" },
                mount: { value: "", required: true },
                text: { value: "", required: true },
                value: { value: { kind: "literal", value: "" } },
                // P111: `style` = typographic role (→ HTML tag); `variant` = colour.
                // The old `size` field was removed (sizing is governed by style).
                style: { value: "body" },
                variant: { value: "default" },
                order: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                row: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                col: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                colSize: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                rowSize: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                layoutX: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                layoutY: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } }
            },
            inputs: 1,
            outputs: 0,
            icon: "font-awesome/fa-font",
            label: common.labelWithName("ui-text"),
            onadd: function () {
                if (!this.name) {
                    this.name = common.getNextNameDefault("ui-text", "Text");
                }
            },
            oneditprepare: function () {
                common.installReferenceSelectors({ mount: true }).call(this);
                // P111: Style (typographic role) first, then Variant (semantic colour).
                common.installTextStyleSelectBox().call(this);
                common.installVariantSelectBox("text").call(this);
                common.installLayoutChildPropRows().call(this);
                const binding = common.bindingValueForEditor(common.parseBindingValue(this.value), this.text || "");
                const textInput = $("#node-input-text");

                // P111: sharpened value sources. Reactive bindings (store/query/
                // routeParam) + server-resolved one-shot values (flow/global/env) +
                // the standard Node-RED `msg` binding. Removed: `jsonata` (never
                // resolved → "?") and `state` (too low-level / not clearly delimited
                // next to `store` — the renderer/schema still support it for other
                // nodes, it is just no longer authorable on ui-text). Added: `store`.
                textInput.typedInput({
                    default: binding.type,
                    types: [
                        { value: "literal", label: "Text", icon: "fa fa-font", hasValue: true },
                        common.storeTypedInputType({ label: "Store" }),
                        {
                            value: "query",
                            label: "Query",
                            icon: "fa fa-search",
                            hasValue: true,
                            validate: function (value) {
                                if (!value || value.trim().length === 0) {
                                    return false;
                                }
                                // Accept dot-bracket notation: e.g. items[2].name, user.address.city, arr[0]
                                return /^[a-zA-Z_$][a-zA-Z0-9_$]*(\.[a-zA-Z_$][a-zA-Z0-9_$]*|\[\d+\])*$/.test(value.trim());
                            }
                        },
                        { value: "routeParam", label: "Route Param", icon: "fa fa-map-signs", hasValue: true },
                        // Standard Node-RED `msg` binding: the value is read from
                        // the configured message property (e.g. payload, payload.label,
                        // topic) of messages sent to this node; held backend-side and
                        // renders empty until the first matching message arrives.
                        "msg",
                        "flow",
                        "global",
                        "env"
                    ]
                });
                textInput.typedInput("type", binding.type);
                textInput.typedInput("value", binding.value);
            },
            oneditsave: function () {
                const textInput = $("#node-input-text");
                const bindingType = textInput.typedInput("type");
                const bindingValue = textInput.typedInput("value");

                if (bindingType === "literal") {
                    this.text = bindingValue;
                    this.value = {
                        kind: "literal",
                        value: bindingValue
                    };
                    return;
                }

                this.text = "";
                this.value = {
                    kind: bindingType,
                    path: bindingValue
                };
                // All dynamic kinds serialise as { kind, path }: reactive
                // (state/store/query/routeParam), server-resolved (flow/global/env),
                // and the standard Node-RED `msg` binding (path = message property,
                // e.g. payload / payload.label). For `store` the path is the ui-store id.
            }
        });
    })();
</script>
<script type="text/html" data-template-name="ui-text">
    <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
    <hr style="margin: 8px 0;">
    <div class="form-row"><label for="node-input-mount">Parent Slot</label><select id="node-input-mount"></select></div>
    <div class="form-row"><label for="node-input-text">Text</label><input type="text" id="node-input-text"></div>
</script>
<script type="text/html" data-help-name="ui-text">
<p>Displays text at a mount point. The value comes from one of three kinds of source.</p>
<h3>Reactive bindings (live, re-render on change)</h3>
<ul>
  <li><b>Store</b> — bind to a ui-store; the text updates whenever the store changes.</li>
  <li><b>Query</b> — read from a query result using a dot-bracket path (see below).</li>
  <li><b>Route Param</b> — read from the current URL route parameter by name.</li>
</ul>
<h3>Static / server-resolved (read once per render)</h3>
<ul>
  <li><b>Text</b> — a static literal string.</li>
  <li><b>flow</b> / <b>global</b> — read once from a flow/global context variable (resolved on the server; not reactive).</li>
  <li><b>env</b> — read once from an environment variable by name.</li>
</ul>
<h3>Message (msg — standard Node-RED binding)</h3>
<ul>
  <li><b>msg</b> — the text is read from the configured message property (e.g. <code>payload</code>, <code>payload.label</code>, <code>topic</code>) of messages sent to this node. It renders empty until the first matching message arrives; the last value is held on the server and shared with all clients.</li>
</ul>
<h3>Query path syntax</h3>
<p>Query paths use dot-bracket notation to address nested data:</p>
<ul>
  <li>Dot access: <code>user.address.city</code></li>
  <li>Array index: <code>items[2].name</code></li>
  <li>Combined: <code>results[0].customer.firstName</code></li>
</ul>
<p>Paths must start with a letter, underscore, or <code>$</code>. Bracket indices must be non-negative integers. An invalid path will be highlighted in the editor.</p>
</script>
