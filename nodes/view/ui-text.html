<script type="text/javascript" src="resources/node-red-contrib-webapp/lib/editor-common.js"></script>
<script type="text/javascript">
    (function () {
        const common = window.WebappEditorCommon;
        common.registerNodeType("ui-text", {
            category: "webapp view",
            color: "#f4efcf",
            defaults: {
                name: { value: "" },
                parent: { value: "" },
                mount: { value: "", required: true },
                text: { value: "", required: true },
                value: { value: { kind: "literal", value: "" } },
                variant: { value: "" },
                order: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                row: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                col: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                colSize: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                rowSize: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                layoutX: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                layoutY: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } }
            },
            inputs: 0,
            outputs: 0,
            icon: "font-awesome/fa-font",
            label: common.labelWithName("ui-text"),
            onadd: function () {
                if (!this.name) {
                    this.name = common.getNextNameDefault("ui-text", "Text");
                }
            },
            oneditprepare: function () {
                common.installReferenceSelectors({ mount: true }).call(this);
                common.installLayoutChildPropRows().call(this);
                const binding = common.bindingValueForEditor(common.parseBindingValue(this.value), this.text || "");
                const textInput = $("#node-input-text");

                textInput.typedInput({
                    default: binding.type,
                    types: [
                        { value: "literal", label: "Text", icon: "fa fa-font", hasValue: true },
                        { value: "state", label: "State", icon: "fa fa-database", hasValue: true },
                        {
                            value: "query",
                            label: "Query",
                            icon: "fa fa-search",
                            hasValue: true,
                            validate: function (value) {
                                if (!value || value.trim().length === 0) {
                                    return false;
                                }
                                // Accept dot-bracket notation: e.g. items[2].name, user.address.city, arr[0]
                                return /^[a-zA-Z_$][a-zA-Z0-9_$]*(\.[a-zA-Z_$][a-zA-Z0-9_$]*|\[\d+\])*$/.test(value.trim());
                            }
                        },
                        { value: "routeParam", label: "Route Param", icon: "fa fa-map-signs", hasValue: true },
                        "msg",
                        "flow",
                        "global",
                        "jsonata",
                        "env"
                    ]
                });
                textInput.typedInput("type", binding.type);
                textInput.typedInput("value", binding.value);
            },
            oneditsave: function () {
                const textInput = $("#node-input-text");
                const bindingType = textInput.typedInput("type");
                const bindingValue = textInput.typedInput("value");

                if (bindingType === "literal") {
                    this.text = bindingValue;
                    this.value = {
                        kind: "literal",
                        value: bindingValue
                    };
                    return;
                }

                this.text = "";
                this.value = {
                    kind: bindingType,
                    path: bindingValue
                };
                // All dynamic binding types (state, query, routeParam, msg, flow, global, jsonata, env)
                // serialise as { kind, path } — the path is the typed-input value string.
            }
        });
    })();
</script>
<script type="text/html" data-template-name="ui-text">
    <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
    <hr style="margin: 8px 0;">
    <div class="form-row"><label for="node-input-mount">Parent Slot</label><select id="node-input-mount"></select></div>
    <div class="form-row"><label for="node-input-text">Text</label><input type="text" id="node-input-text"></div>
    <div class="form-row"><label for="node-input-variant">Variant</label><input type="text" id="node-input-variant"></div>
    <hr style="margin: 8px 0;">
    <div class="form-row" data-layout-child-prop-row="order" style="display: none;"><label for="node-input-order">Order</label><input type="number" id="node-input-order"></div>
    <div class="form-row" data-layout-child-prop-row="row" style="display: none;"><label for="node-input-row">Row</label><input type="number" id="node-input-row"></div>
    <div class="form-row" data-layout-child-prop-row="col" style="display: none;"><label for="node-input-col">Col</label><input type="number" id="node-input-col"></div>
    <div class="form-row" data-layout-child-prop-row="colSize" style="display: none;"><label for="node-input-colSize">Col Size</label><input type="number" id="node-input-colSize"></div>
    <div class="form-row" data-layout-child-prop-row="rowSize" style="display: none;"><label for="node-input-rowSize">Row Size</label><input type="number" id="node-input-rowSize"></div>
    <div class="form-row" data-layout-child-prop-row="layoutX" style="display: none;"><label for="node-input-layoutX">X</label><input type="number" id="node-input-layoutX"></div>
    <div class="form-row" data-layout-child-prop-row="layoutY" style="display: none;"><label for="node-input-layoutY">Y</label><input type="number" id="node-input-layoutY"></div>
</script>
<script type="text/html" data-help-name="ui-text">
<p>Displays text at a mount point. The text content can be a static literal or a dynamic binding.</p>
<h3>Text binding types</h3>
<ul>
  <li><b>Text</b> — static literal string.</li>
  <li><b>State</b> — read from the app's reactive state store using a dot-separated path (e.g. <code>user.name</code>).</li>
  <li><b>Query</b> — read from a query result using a dot-bracket path (see below).</li>
  <li><b>Route Param</b> — read from the current URL route parameter by name.</li>
  <li><b>msg</b> — read from the incoming Node-RED message (e.g. <code>payload</code> or <code>payload.label</code>).</li>
  <li><b>flow</b> — read from a flow context variable.</li>
  <li><b>global</b> — read from a global context variable.</li>
  <li><b>jsonata</b> — evaluate a JSONata expression against the incoming message.</li>
  <li><b>env</b> — read from an environment variable by name.</li>
</ul>
<h3>Query path syntax</h3>
<p>Query paths use dot-bracket notation to address nested data:</p>
<ul>
  <li>Dot access: <code>user.address.city</code></li>
  <li>Array index: <code>items[2].name</code></li>
  <li>Combined: <code>results[0].customer.firstName</code></li>
</ul>
<p>Paths must start with a letter, underscore, or <code>$</code>. Bracket indices must be non-negative integers. An invalid path will be highlighted in the editor.</p>
</script>
