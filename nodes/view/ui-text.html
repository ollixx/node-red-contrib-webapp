<script type="text/javascript" src="resources/node-red-contrib-webapp/lib/editor-common.js"></script>
<script type="text/javascript">
    (function () {
        const common = window.WebappEditorCommon;

        // P222 (ADR 0015): common base fields. See the applicability table in
        // docs/nodes/concepts/editor.md. `omit` drops a field the node already
        // owns a dedicated control for (avoids duplicate #node-input carrier ids).
        const BASE_FIELDS = {
            visible: true,
            disabled: false,
            color: false,
            size: false,
            variant: true,
            // P111: ui-text sizing is governed by `style` (typographic role); the
            // `size` field was removed. OMIT it entirely rather than show a disabled
            // N/A control, so ui-text carries no #node-input-size element.
            omit: ["size"],
            i18nNode: "ui-text",
            hints: {
                disabled: "Ein Text-Knoten hat keinen interaktiven Zustand."
            }
        };
        common.registerNodeType("ui-text", {
            category: "webapp view",
            color: "#f4efcf",
            defaults: {
                visible: { value: null },
                visibleBinding: { value: "" },
                name: { value: "" },
                app: { value: "" },
                mount: { value: "", required: true },
                // P189: type-aware validation replaces the blunt `required: true`.
                // For the scope-local kinds (item/index/prop) an empty path is
                // legitimate (whole element / bare index / whole prop, per P184), so
                // the binding carrier delegates to the selected typedInput kind.
                text: { value: "", validate: common.validateValueBindingField("#node-input-text", "value") },
                value: { value: { kind: "literal", value: "" } },
                // P111: `style` = typographic role (→ HTML tag); `variant` = colour.
                // The old `size` field was removed (sizing is governed by style).
                style: { value: "body" },
                variant: { value: "default" },
                // P221 (ADR 0035): presentation mode. "text" (default) = free
                // display text; "formField" = read-only labelled form row styled
                // like the input controls. Plain native <select> — no hidden
                // carrier, so no ADR-0031 round-trip harness needed.
                display: { value: "text" },
                // P221: the row label used only in formField mode.
                label: { value: "" },
                order: { value: "", validate: function (value) { return value == null || value === "" || RED.validators.number()(value); } },
                row: { value: "", validate: function (value) { return value == null || value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                col: { value: "", validate: function (value) { return value == null || value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                colSize: { value: "", validate: function (value) { return value == null || value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                rowSize: { value: "", validate: function (value) { return value == null || value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                layoutX: { value: "", validate: function (value) { return value == null || value === "" || RED.validators.number()(value); } },
                layoutY: { value: "", validate: function (value) { return value == null || value === "" || RED.validators.number()(value); } }
            },
            inputs: 1,
            outputs: 0,
            icon: "font-awesome/fa-font",
            label: common.labelWithName("ui-text"),
            onadd: function () {
                if (!this.name) {
                    this.name = common.getNextNameDefault("ui-text", "Text");
                }
            },
            oneditprepare: function () {
                common.installReferenceSelectors({ mount: true }).call(this);
                common.installBaseFields(BASE_FIELDS).call(this);
                // P111: Style (typographic role) first, then Variant (semantic colour).
                common.installTextStyleSelectBox().call(this);
                common.installVariantSelectBox("text").call(this);
                common.installLayoutChildPropRows().call(this);
                // P113 (ADR 0012 / ADR 0010): the ONE canonical value-binding type
                // set + serialisation — read/apply come from the shared helper, so
                // the type list and (de)serialisation live in exactly one place.
                // Order: Store, Query, Route-Param, Reactive, msg, JSONata, str,
                // num, bool, json, date (timestamp), Flow, Global, Env. No `state`.
                const binding = common.readValueBinding(this.value, this.text || "");
                const textInput = $("#node-input-text");

                textInput.typedInput({
                    default: binding.type,
                    types: common.valueBindingTypes({ currentKind: binding.type })
                });
                textInput.typedInput("type", binding.type);
                textInput.typedInput("value", binding.value);
                // P165 (ADR 0017): warn when the scope-local item/index kind is
                // selected but this node is not inside a ui-repeat template.
                common.installRepeatScopeHint("#node-input-text");
                // P189: explain the item/prop PATH sub-field — empty = whole element.
                common.installValueBindingPathHint("#node-input-text");

                // P219 (ADR 0034): seed the per-field `onMissing` selector from the
                // stored binding (absent → the default `marker`, today's "?"). Plain
                // native <select>, no hidden carrier — no ADR-0031 harness needed.
                $("#node-input-onMissing").val(common.readOnMissing(this.value));

                // P221 (ADR 0035): the "Field Label" row is only relevant in
                // form-field mode — it depends on `display`. Toggle its
                // visibility from the plain native <select> (no hidden carrier).
                const displaySelect = $("#node-input-display");
                const labelRow = $("#ui-text-label-row");
                // A node saved before P221 (or otherwise without `display`) opens
                // with an empty carrier; show the explicit default mode ("text")
                // rather than a blank selector.
                if (!displaySelect.val()) {
                    displaySelect.val("text");
                }
                const syncLabelRow = function () {
                    if (displaySelect.val() === "formField") {
                        labelRow.show();
                    } else {
                        labelRow.hide();
                    }
                };
                displaySelect.on("change", syncLabelRow);
                syncLabelRow();
            },
            oneditsave: function () {
                common.applyBaseFields(BASE_FIELDS).call(this);
                const textInput = $("#node-input-text");
                const bindingType = textInput.typedInput("type");
                const bindingValue = textInput.typedInput("value");

                this.value = common.applyValueBinding(bindingType, bindingValue);
                // P219 (ADR 0034): merge the per-field missing-value behaviour onto
                // the binding. `marker` (default) is not persisted; only `ignore` is
                // written, so existing/generated flows stay byte-identical.
                common.applyOnMissing(this.value, $("#node-input-onMissing").val());
                // Keep the legacy `text` mirror in sync for the plain-string literal
                // (back-compat); any other kind clears it (the bound value wins).
                this.text = (this.value.kind === "literal" && typeof this.value.value === "string")
                    ? this.value.value
                    : "";
            }
        });
    })();
</script>
<script type="text/html" data-template-name="ui-text">
    <div class="form-row"><label for="node-input-name" data-i18n="node-red:common.label.name">Name</label><input type="text" id="node-input-name"></div>
    <hr style="margin: 8px 0;">
    <div class="form-row"><label for="node-input-mount" data-i18n="ui-text.label.mount">Parent Slot</label><select id="node-input-mount"></select></div>
    <div class="form-row"><label for="node-input-text" data-i18n="ui-text.label.text">Text</label><input type="text" id="node-input-text"></div>
    <div class="form-row">
        <label for="node-input-onMissing" data-i18n="ui-text.label.onMissing">On Missing</label>
        <select id="node-input-onMissing">
            <option value="marker" data-i18n="ui-text.option.onMissing.marker">Marker (show "?")</option>
            <option value="ignore" data-i18n="ui-text.option.onMissing.ignore">Ignore (render empty)</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-display" data-i18n="ui-text.label.display">Display</label>
        <select id="node-input-display">
            <option value="text" data-i18n="ui-text.option.display.text">Text (free display text)</option>
            <option value="formField" data-i18n="ui-text.option.display.formField">Form field (read-only labelled row)</option>
        </select>
    </div>
    <div class="form-row" id="ui-text-label-row">
        <label for="node-input-label" data-i18n="ui-text.label.label">Field Label</label>
        <input type="text" id="node-input-label" placeholder="Label shown left of the value (form-field mode)" data-i18n="[placeholder]ui-text.placeholder.label">
    </div>
</script>

     nodes/view/locales/{en-US,de}/ui-text.html; form-row labels carry data-i18n
     keys resolved from nodes/view/locales/{en-US,de}/ui-text.json. No inline
     data-help-name block here. -->
