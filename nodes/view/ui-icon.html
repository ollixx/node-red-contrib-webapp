<script type="text/javascript" src="resources/node-red-contrib-webapp/lib/editor-common.js"></script>
<script type="text/javascript">
    (function () {
        const common = window.WebappEditorCommon;

        // P222 (ADR 0015): common base fields. See the applicability table in
        // docs/nodes/concepts/editor.md. `omit` drops a field the node already
        // owns a dedicated control for (avoids duplicate #node-input carrier ids).
        const BASE_FIELDS = {
            visible: true,
            disabled: false,
            color: false,
            size: false,
            variant: false,
            advanced: [],
            omit: ["color","size"],
            hints: {
                disabled: "Ein Icon hat keinen interaktiven Zustand."
            }
        };
        // P159: size is now a five-step token SelectBox (xs/sm/md/lg/xl), default
        // "md". Legacy free CSS values (e.g. "24", "1.5rem") round-trip safely —
        // installIconSizeSelectBox prepends a "<value> (bestehend)" option on first
        // open so no data is lost; user can migrate to a token at any time.
        common.registerNodeType("ui-icon", {
            category: "webapp view",
            color: "#f4efcf",
            defaults: {
                visible: { value: null },
                visibleBinding: { value: "" },
                name: { value: "" },
                parent: { value: "" },
                mount: { value: "", required: true },
                icon: { value: "", required: true },
                size: { value: "md" },
                color: { value: "" },
                order: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                row: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                col: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                colSize: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                rowSize: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                layoutX: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                layoutY: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } }
            },
            inputs: 1,
            outputs: 0,
            icon: "font-awesome/fa-star",
            label: common.labelWithName("ui-icon"),
            onadd: function () {
                if (!this.name) {
                    this.name = common.getNextNameDefault("ui-icon", "Icon");
                }
            },
            oneditsave: function () {
                common.applyBaseFields(BASE_FIELDS).call(this);
            },
            oneditprepare: function () {
                common.installReferenceSelectors({ mount: true }).call(this);
                common.installBaseFields(BASE_FIELDS).call(this);
                common.installLayoutChildPropRows().call(this);
                common.installIconField("#node-input-icon", { title: "Icon auswählen" });
                // P159: inject the xs..xl size SelectBox (mirrors installSizeSelectBox
                // mechanism; uses the wider ICON_SIZE_OPTIONS set).
                common.installIconSizeSelectBox().call(this);
            }
        });
    })();
</script>
<script type="text/html" data-template-name="ui-icon">
    <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
    <hr style="margin: 8px 0;">
    <div class="form-row"><label for="node-input-mount">Parent Slot</label><select id="node-input-mount"></select></div>
    <div class="form-row"><label for="node-input-icon">Icon Name</label><input type="text" id="node-input-icon" placeholder="e.g. home, user, check"></div>
    <div class="form-row"><label for="node-input-color">Color</label><input type="text" id="node-input-color" placeholder="e.g. #ff0000 or red"></div>
</script>
<script type="text/html" data-help-name="ui-icon"><p>Zeigt ein Icon anhand seines Namens (icon-set-agnostisch).</p></script>
