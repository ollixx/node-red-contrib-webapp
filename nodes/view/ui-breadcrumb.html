<script type="text/javascript" src="resources/node-red-contrib-webapp/lib/editor-common.js"></script>
<script type="text/javascript">
    (function () {
        const common = window.WebappEditorCommon;

        // P222 (ADR 0015): common base fields. See the applicability table in
        // docs/nodes/concepts/editor.md. `omit` drops a field the node already
        // owns a dedicated control for (avoids duplicate #node-input carrier ids).
        const BASE_FIELDS = {
            visible: true,
            disabled: false,
            color: true,
            size: false,
            variant: false,
            advanced: ["size"],
            omit: [],
            hints: {
                disabled: "Ein Breadcrumb spiegelt die Navigation und hat keinen Deaktiviert-Zustand.",
                size: "Dieser Knoten hat keine Größen-Stufen."
            }
        };

        // P95: breadcrumb typedInput binding helpers (mirrors ui-text / ui-alert pattern).
        // Items can be a literal JSON array or a dynamic binding.
        function makeItemsTypes() {
            return [
                { value: "literal", label: "Items (JSON)", icon: "fa fa-list", hasValue: true },
                { value: "state",   label: "State",        icon: "fa fa-database", hasValue: true },
                { value: "store",   label: "Store",        icon: "fa fa-archive",  hasValue: true },
                { value: "query",   label: "Query",        icon: "fa fa-search",   hasValue: true,
                  validate: function (v) { return v && /^[a-zA-Z_$][a-zA-Z0-9_$]*(\.[a-zA-Z_$][a-zA-Z0-9_$]*|\[\d+\])*$/.test(v.trim()); }
                },
                { value: "routeParam", label: "Route Param", icon: "fa fa-map-signs", hasValue: true },
                "msg", "flow", "global", "jsonata", "env"
            ];
        }

        common.registerNodeType("ui-breadcrumb", {
            category: "webapp view",
            color: "#f4efcf",
            defaults: {
                visible: { value: null },
                visibleBinding: { value: "" },
                color: { value: null },
                colorBinding: { value: "" },
                name:      { value: "" },
                app:    { value: "" },
                mount:     { value: "", required: true },
                // P95/P229: `items` persists the binding object — a literal JSON
                // array persists as {kind:"literal", value:[…]} (the legacy
                // `itemsJson` string carrier is migration-only, see migrationFields).
                items:     { value: undefined },
                // P229 (ADR 0031 pattern): the typedInput carrier lives on
                // #node-input-itemsBinding so Node-RED's post-save auto-copy
                // cannot clobber the `items` binding object with the raw string.
                itemsBinding: { value: "" },
                // P95: optional layout for child-node slot mode (value = "breadcrumb")
                layout:    { value: "" },
                separator: { value: "" },
                order:     { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                row:       { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                col:       { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                colSize:   { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                rowSize:   { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                layoutX:   { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                layoutY:   { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } }
            },
            // P229 (ADR 0038): migration-only legacy fields — injected as hidden
            // defaults at registration (see editor-common withMigrationDefaults);
            // migrated to the canonical `items` binding on open, deleted on save.
            migrationFields: ["itemsJson", "itemsPath"],
            inputs: 1,
            outputs: 1,
            icon: "font-awesome/fa-angle-right",
            label: common.labelWithName("ui-breadcrumb"),
            onadd: function () {
                if (!this.name) {
                    this.name = common.getNextNameDefault("ui-breadcrumb", "Breadcrumb");
                }
            },
            oneditprepare: function () {
                common.installReferenceSelectors({ mount: true }).call(this);
                common.installBaseFields(BASE_FIELDS).call(this);
                common.installLayoutChildPropRows().call(this);

                // Determine current typedInput state from stored node properties.
                // Priority: items binding object → literal JSON from legacy
                // itemsJson → legacy itemsPath (both migration-only, P229).
                let editorType = "literal";
                let editorValue = "[]";
                if (Array.isArray(this.items)) {
                    // Raw array (hand-authored flow) — open as its JSON literal.
                    editorValue = JSON.stringify(this.items);
                } else if (this.items && typeof this.items === "object" && typeof this.items.kind === "string") {
                    if (this.items.kind === "literal") {
                        // Canonical literal binding — the value is the items array.
                        editorValue = typeof this.items.value === "string"
                            ? this.items.value
                            : JSON.stringify(this.items.value === undefined || this.items.value === null ? [] : this.items.value);
                    } else {
                        editorType = this.items.kind;
                        editorValue = this.items.path || this.items.value || "";
                    }
                } else if (this.itemsJson && this.itemsJson !== "[]") {
                    // Legacy raw-JSON string carrier.
                    editorValue = String(this.itemsJson);
                } else if (this.itemsPath) {
                    // Legacy P75 state-path shorthand.
                    editorType = "state";
                    editorValue = this.itemsPath;
                }

                const itemsInput = $("#node-input-itemsBinding");
                itemsInput.typedInput({
                    default: editorType,
                    types: makeItemsTypes()
                });
                itemsInput.typedInput("type", editorType);
                itemsInput.typedInput("value", editorValue);

                // Layout select: "" (items/binding mode) vs "breadcrumb" (child slot mode).
                const layoutSelect = $("#node-input-layout");
                layoutSelect.val(this.layout || "");
                layoutSelect.on("change", function () {
                    const isSlotMode = $(this).val() === "breadcrumb";
                    $("#breadcrumb-items-row").toggle(!isSlotMode);
                });
                // Initial visibility
                const isSlotMode = (this.layout === "breadcrumb");
                $("#breadcrumb-items-row").toggle(!isSlotMode);
            },
            oneditsave: function () {
                common.applyBaseFields(BASE_FIELDS).call(this);
                const itemsInput = $("#node-input-itemsBinding");
                const bindingType = itemsInput.typedInput("type");
                const bindingValue = itemsInput.typedInput("value");

                if (bindingType === "literal") {
                    // P229: a literal items array persists as the canonical
                    // literal binding — never as the legacy itemsJson string.
                    let parsedItems;
                    try {
                        parsedItems = JSON.parse(bindingValue);
                    }
                    catch (_e) {
                        // Invalid JSON is blocked by the typedInput validate;
                        // keep the raw string so nothing is silently lost.
                        parsedItems = bindingValue;
                    }
                    this.items = { kind: "literal", value: parsedItems };
                } else {
                    this.items = { kind: bindingType, path: bindingValue };
                }
                common.dropLegacyFields(this, ["itemsJson", "itemsPath"]);
                this.layout = $("#node-input-layout").val() || "";
                this.separator = $("#node-input-separator").val() || "";
            }
        });
    })();
</script>
<script type="text/html" data-template-name="ui-breadcrumb">
    <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
    <hr style="margin: 8px 0;">
    <div class="form-row"><label for="node-input-mount">Parent Slot</label><select id="node-input-mount"></select></div>
    <div class="form-row">
        <label for="node-input-layout">Mode</label>
        <select id="node-input-layout">
            <option value="">Items / Binding</option>
            <option value="breadcrumb">Child Nodes (Slots)</option>
        </select>
    </div>
    <div class="form-row" id="breadcrumb-items-row">
        <label for="node-input-itemsBinding">Items</label>
        <input type="text" id="node-input-itemsBinding">
    </div>
    <div class="form-row"><label for="node-input-separator">Separator</label><input type="text" id="node-input-separator" placeholder="e.g. /"></div>
</script>
<script type="text/html" data-help-name="ui-breadcrumb">
<p>Renders a horizontal navigation breadcrumb trail. All items emit a <code>click</code> event (output port) with <code>msg.ui.params.action</code>.</p>
<h3>Items</h3>
<p>Items can be configured as a JSON array or as a dynamic binding (State, Store, msg, …).</p>
<p><b>String items:</b> <code>["Home", "Customers", "Details"]</code> — the string is both the label and the click parameter.</p>
<p><b>Object items:</b> <code>[{"label": "Home", "action": "/"}, {"label": "Current", "active": true}]</code></p>
<ul>
  <li><code>label</code> — display text (required)</li>
  <li><code>action</code> — click parameter sent via <code>params.action</code> (defaults to label)</li>
  <li><code>active</code> — marks the current-page item (different rendering); item stays clickable</li>
</ul>
<h3>Child Node Mode</h3>
<p>Set Mode to "Child Nodes (Slots)" to use child nodes as breadcrumb items (mount into slot <code>default</code>).
Each child's node ID is sent as <code>params.action</code> when clicked. A custom separator can be provided in the <code>separator</code> slot.</p>
<h3>Output Events</h3>
<p>Every item click triggers an output message: <code>msg.ui.event = "click"</code>, <code>msg.ui.params.action</code> = item's action value.</p>
<p><a href="https://github.com/ollixx/node-red-contrib-webapp/blob/develop/docs/nodes/navigation/ui-breadcrumb.md" target="_blank">Full documentation</a></p>
</script>
