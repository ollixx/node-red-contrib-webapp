<script type="text/javascript" src="resources/node-red-contrib-webapp/lib/editor-common.js"></script>
<script type="text/javascript">
    (function () {
        const common = window.WebappEditorCommon;
        common.registerNodeType("ui-button", {
            category: "webapp view",
            color: "#f4efcf",
            defaults: {
                name: { value: "" },
                parent: { value: "" },
                mount: { value: "", required: true },
                // P144 (ADR 0012): `label` persists the binding OBJECT; the
                // typedInput lives directly on #node-input-label so the
                // minimal-coverage E2E check (`fields:["label"]`) still passes.
                // A legacy plain-string `label` is migrated on open.
                label: {
                    value: { kind: "literal", value: "" },
                    required: true,
                    validate: function () {
                        var el = $("#node-input-label");
                        if (el.length && typeof el.typedInput === "function") {
                            var v = el.typedInput("value");
                            return v !== undefined && v !== null && String(v).length > 0;
                        }
                        // Pre-open (no typedInput yet): trust the persisted binding.
                        var b = this.label;
                        if (b && typeof b === "object") {
                            return b.value !== undefined && b.value !== null && String(b.value).length > 0
                                ? true
                                : (typeof b.path === "string" && b.path.length > 0);
                        }
                        return typeof b === "string" && b.length > 0;
                    }
                },
                variant: { value: "neutral" },
                size: { value: "" },
                outline: { value: false },
                linkMode: { value: "button" },
                // P122 (ADR 0012): `href` persists the binding OBJECT; there is no
                // matching #node-input-href element so Node-RED auto-save cannot
                // clobber it. The typedInput lives on #node-input-hrefBinding.
                href: { value: null },
                hrefBinding: { value: "" },
                icon: { value: "" },
                // P122 (ADR 0012): `disabled` persists the binding OBJECT; there is
                // no matching #node-input-disabled element so Node-RED auto-save
                // cannot clobber it. The typedInput lives on #node-input-disabledBinding.
                // Legacy: `disabledPath` (plain state path) is kept for migration only.
                disabledPath: { value: "" },
                disabled: { value: null },
                disabledBinding: { value: "" },
                order: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                row: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                col: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                colSize: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                rowSize: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                layoutX: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                layoutY: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } }
            },
            inputs: 1,
            outputs: 1,
            icon: "font-awesome/fa-hand-pointer-o",
            label: common.labelWithName("ui-button"),
            onadd: function () {
                if (!this.name) {
                    this.name = common.getNextNameDefault("ui-button", "Button");
                }
            },
            oneditprepare: function () {
                common.installReferenceSelectors({ mount: true }).call(this);
                common.installVariantSelectBox("button").call(this);
                common.installSizeSelectBox().call(this);
                // P122: installButtonLinkFields injects outline + linkMode and
                // wires visibility of data-button-href-row="hrefBinding".
                common.installButtonLinkFields().call(this);
                common.installLayoutChildPropRows().call(this);
                common.installIconField("#node-input-icon", { title: "Button-Icon auswählen" });

                // P144 (ADR 0012 / value category): `label` typedInput.
                // The typedInput lives on #node-input-label (not a separate
                // *Binding element) so the minimal-coverage E2E check passes.
                // Migration: a legacy plain-string `label` opens as a `str` literal.
                const storedLabel = common.parseBindingValue(this.label);
                const labelBinding = storedLabel
                    ? storedLabel
                    : (typeof this.label === "string" && this.label.length > 0
                        ? { kind: "literal", value: this.label }
                        : undefined);
                const labelEditor = common.readValueBinding(labelBinding, "");
                const labelInput = $("#node-input-label");
                labelInput.typedInput({
                    default: labelEditor.type,
                    types: common.valueBindingTypes({ category: "value" })
                });
                labelInput.typedInput("type", labelEditor.type);
                labelInput.typedInput("value", labelEditor.value);

                // P122 (ADR 0012 / boolean category): `disabled` typedInput.
                // Migration: a legacy `disabledPath` plain string becomes a
                // state binding; a stored `disabled` binding object takes
                // precedence.
                const storedDisabled = common.parseBindingValue(this.disabled);
                const disabledBinding = storedDisabled
                    ? storedDisabled
                    : (this.disabledPath ? { kind: "state", path: this.disabledPath } : undefined);
                const disabledEditor = common.readValueBinding(disabledBinding, "");
                // P181: when the binding is absent, use 'bool' as the default type
                // so Node-RED shows a clean true/false control instead of the first
                // entry of the boolean set (store → empty dropdown + '…').
                const disabledType = disabledEditor.type !== "str" ? disabledEditor.type : "bool";
                const disabledInput = $("#node-input-disabledBinding");
                disabledInput.typedInput({
                    default: disabledType,
                    types: common.valueBindingTypes({ category: "boolean" })
                });
                disabledInput.typedInput("type", disabledType);
                disabledInput.typedInput("value", disabledEditor.value);
                // P181: track original-empty to preserve "no binding" on save.
                disabledInput.data("base-field-originally-empty", !disabledBinding);
                disabledInput.on("change", function () {
                    disabledInput.data("base-field-originally-empty", false);
                });

                // P122 (ADR 0012 / url category): `href` typedInput.
                // Migration: a legacy literal string `href` becomes
                // { kind:"literal", value:<href> }.
                const storedHref = common.parseBindingValue(this.href);
                const hrefBinding = storedHref
                    ? storedHref
                    : (this.href && typeof this.href === "string" && this.href.length > 0
                        ? { kind: "literal", value: this.href }
                        : undefined);
                const hrefEditor = common.readValueBinding(hrefBinding, "");
                const hrefInput = $("#node-input-hrefBinding");
                hrefInput.typedInput({
                    default: hrefEditor.type,
                    types: common.valueBindingTypes({ category: "url" })
                });
                hrefInput.typedInput("type", hrefEditor.type);
                hrefInput.typedInput("value", hrefEditor.value);
            },
            oneditsave: function () {
                // P144: persist label as binding object.
                this.label = common.applyValueBinding(
                    $("#node-input-label").typedInput("type"),
                    $("#node-input-label").typedInput("value")
                );

                // P122: persist disabled as binding object; clear legacy disabledPath.
                // P181: if the field was originally absent and the user never touched
                // it, keep disabled null (no binding = always enabled).
                const $disabledInput = $("#node-input-disabledBinding");
                const disabledResult = common.applyValueBinding(
                    $disabledInput.typedInput("type"),
                    $disabledInput.typedInput("value")
                );
                const disabledOriginEmpty = $disabledInput.data("base-field-originally-empty");
                const disabledIsBoolLiteral = disabledResult && disabledResult.kind === "literal"
                    && typeof disabledResult.value === "boolean";
                this.disabled = (disabledOriginEmpty && disabledIsBoolLiteral) ? null : disabledResult;
                this.disabledPath = "";

                // P122: persist href as binding object.
                const hrefBinding = common.applyValueBinding(
                    $("#node-input-hrefBinding").typedInput("type"),
                    $("#node-input-hrefBinding").typedInput("value")
                );
                // Only store a non-empty literal as href; null for empty.
                const isEmptyLiteral = hrefBinding.kind === "literal"
                    && (hrefBinding.value === undefined || hrefBinding.value === null || hrefBinding.value === "");
                this.href = isEmptyLiteral ? null : hrefBinding;
            }
        });
    })();
</script>
<script type="text/html" data-template-name="ui-button">
    <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
    <hr style="margin: 8px 0;">
    <div class="form-row"><label for="node-input-mount">Parent Slot</label><select id="node-input-mount"></select></div>
    <div class="form-row"><label for="node-input-label">Label</label><input type="text" id="node-input-label"></div>
    <div class="form-row"><label for="node-input-icon">Icon</label><input type="text" id="node-input-icon" placeholder="z. B. plus oder lucide:user"></div>
    <!-- P122 (ADR 0012 / boolean category): Disabled binding — typedInput managed in oneditprepare/oneditsave. -->
    <div class="form-row"><label for="node-input-disabledBinding">Disabled</label><input type="text" id="node-input-disabledBinding"></div>
    <!-- P122 (ADR 0012 / url category): href binding — typedInput managed in oneditprepare/oneditsave.
         data-button-href-row is used by installButtonLinkFields to sync visibility with linkMode. -->
    <div class="form-row" data-button-href-row="hrefBinding"><label for="node-input-hrefBinding">URL / Route</label><input type="text" id="node-input-hrefBinding"></div>
</script>
<script type="text/html" data-help-name="ui-button">
    <p>Mountet einen klickbaren Button. Jeder Klick erzeugt ein <code>click</code>-Event
    auf dem Output-Port; verdrahte ihn z. B. mit einem <code>ui-action</code>.</p>
    <h4>Darstellung</h4>
    <ul>
        <li><b>Variante</b> — semantische Rolle (primary, danger …).</li>
        <li><b>Size</b> — Small / Medium / Large (leer = Standardgröße).</li>
        <li><b>Outline</b> — zeichnet den Button mit Kontur statt Füllung.</li>
    </ul>
    <h4>Disabled (P122)</h4>
    <p>Bindbar über den Boolean-Zustand-Satz (ADR 0012): Store, Query, Route-Param,
    Reactive, msg, JSONata, boolean, Flow, Global, Env. Ein bestehender
    <code>disabledPath</code> wird automatisch als <code>state</code>-Binding übernommen.</p>
    <h4>Link-Modus</h4>
    <ul>
        <li><b>Button (kein Link)</b> — normaler Button; Aktion läuft über den
        Output-Port (Standardverhalten).</li>
        <li><b>URL (Hyperlink)</b> — rendert einen echten Link; das Feld
        „URL / Route" gibt das Ziel an (externe oder interne Adresse).</li>
        <li><b>Navigate (In-App-Route)</b> — navigiert clientseitig zur angegebenen
        Route und meldet den Klick zusätzlich an den Flow.</li>
    </ul>
    <p>Das Feld „URL / Route" (P122: URL/Pfad-Binding, ADR 0012) erscheint nur in
    den Modi <i>URL</i> und <i>Navigate</i>.</p>
    <p><a href="https://github.com/ollixx/node-red-contrib-webapp/blob/develop/docs/nodes/display/ui-button.md">Ausführliche Doku</a></p>
</script>
