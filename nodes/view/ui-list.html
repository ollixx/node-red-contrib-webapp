<script type="text/javascript" src="resources/node-red-contrib-webapp/lib/editor-common.js"></script>
<script type="text/javascript">
    (function () {
        const common = window.WebappEditorCommon;
        // P172 (ADR 0015): ui-list base-field applicability.
        // - `visible` applicable: boolean-state binding, blends the list in/out.
        // - `disabled` applicable: locks row interaction (itemClick/itemSelect);
        //   without active events it is a no-op — the hint explains this.
        // - `color` applicable: non-variant node; active value typedInput; a
        //   literal colour round-trips as a binding object.
        // - `size` N/A (Erweitert): density is controlled via `displayType`
        //   (default/divided/compact) — a size field is meaningless here.
        const BASE_FIELDS = {
            visible: true,
            disabled: true,
            color: true,
            size: false,
            variant: false,
            advanced: ["size"],
            i18nNode: "ui-list",
            hints: {
                disabled: "Ohne aktive Events (itemClick/itemSelect) hat disabled keinen sichtbaren Effekt.",
                size: "Die Dichte wird über Display-Typ (Plain/Divided/Grouped/Actionable) gesteuert, nicht über Size."
            }
        };
        common.registerNodeTypeWithEvents("ui-list", {
            category: "webapp view",
            color: "#f4efcf",
            defaults: {
                name: { value: "" },
                app: { value: "" },
                mount: { value: "", required: true },
                // P171 (ADR 0012): `items` is a STRUCTURAL array source (the list
                // renders its rows ITSELF — NOT a repeats case). It persists the
                // binding OBJECT; there is no matching #node-input-items element so
                // Node-RED auto-save cannot clobber it. The typedInput lives on
                // #node-input-itemsBinding. The legacy `itemsPath` plain state path
                // is kept for migration only (the unused `items:null` default is gone).
                items: { value: null },
                itemsBinding: { value: "" },
                // P180 (ADR 0021): semantic intent enum. Default "plain" (back-compat
                // with old "default"). Migration in oneditprepare maps old → new.
                displayType: { value: "plain" },
                // P180: ordered (boolean, default false) — ul↔ol, backend-neutral.
                ordered: { value: false },
                // P171: node-wide value display (none/secondary/badge) + badge colour.
                displayValue: { value: "none" },
                badgeVariant: { value: "neutral" },
                // P208: item-field mapping — WHICH raw-entity field is the label/value/
                // id/icon of a row. Visible defaults match the historical hard-coded
                // names, so shaped-item lists ({id,label,value,icon}) are unaffected.
                labelField: { value: "label" },
                valueField: { value: "value" },
                idField: { value: "id" },
                iconField: { value: "icon" },
                // P173: single-select. `selectable` is a plain boolean checkbox.
                // `selectedId` is the two-way binding OBJECT (mirror of ui-tabs
                // `activeTab`); there is no #node-input-selectedId element so Node-RED
                // auto-save cannot clobber it — the typedInput lives on the
                // #node-input-selectedIdBinding carrier. Legacy `selectedIdPath` is a
                // plain state path kept for migration only.
                selectable: { value: false },
                selectedId: { value: null },
                selectedIdBinding: { value: "" },
                events: { value: "[]" },
                outputs: { value: 0 },
                // P172 (ADR 0015): base fields. `visible`/`color`/`disabled` persist
                // the binding OBJECT; there are no matching #node-input-visible /
                // #node-input-color / #node-input-disabled elements so Node-RED
                // auto-save cannot clobber them — the typedInputs live on the
                // *Binding carrier inputs.
                visible: { value: null },
                visibleBinding: { value: "" },
                disabled: { value: null },
                disabledBinding: { value: "" },
                color: { value: null },
                colorBinding: { value: "" },
                order: { value: "", validate: function (value) { return value == null || value === "" || RED.validators.number()(value); } },
                row: { value: "", validate: function (value) { return value == null || value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                col: { value: "", validate: function (value) { return value == null || value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                colSize: { value: "", validate: function (value) { return value == null || value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                rowSize: { value: "", validate: function (value) { return value == null || value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                layoutX: { value: "", validate: function (value) { return value == null || value === "" || RED.validators.number()(value); } },
                layoutY: { value: "", validate: function (value) { return value == null || value === "" || RED.validators.number()(value); } }
            },
            // P229 (ADR 0038): migration-only legacy fields — injected as hidden
            // defaults at registration (see editor-common withMigrationDefaults);
            // migrated to the canonical binding on open, deleted on save.
            migrationFields: ["itemsPath", "selectedIdPath"],
            inputs: 1,
            outputs: 0,
            outputLabels: function (index) {
                try {
                    const events = JSON.parse(this.events || "[]");
                    return events[index] || "";
                }
                catch (_e) {
                    return "";
                }
            },
            icon: "font-awesome/fa-list",
            label: common.labelWithName("ui-list"),
            onadd: function () {
                if (!this.name) {
                    this.name = common.getNextNameDefault("ui-list", "List");
                }
            },
            oneditprepare: function () {
                common.installReferenceSelectors({ mount: true }).call(this);
                // P172: the shared base-field group ("Allgemein") — visible/disabled/
                // color/size with node-local applicability (BASE_FIELDS).
                common.installBaseFields(BASE_FIELDS).call(this);
                common.installLayoutChildPropRows().call(this);

                // P171 (ADR 0012 / structural category): `items` typedInput — the
                // RESTRICTED set: scalar literals (str/num/bool/date) are EXCLUDED
                // (they cannot yield a valid array model); allowed is json (a static
                // array literal) + every binding kind that can resolve to an array/
                // object (store/query/routeParam/reactive/msg/jsonata/flow/global/env).
                // Migration: a legacy `itemsPath` plain string opens as a state
                // binding (leading `state.` stripped); a stored `items` binding wins.
                const storedItems = common.parseBindingValue(this.items);
                const itemsBinding = storedItems
                    ? storedItems
                    : (this.itemsPath
                        ? { kind: "state", path: this.itemsPath.indexOf("state.") === 0 ? this.itemsPath.slice("state.".length) : this.itemsPath }
                        : undefined);
                const itemsEditor = common.readValueBinding(itemsBinding, "");
                const itemsDefaultType = itemsEditor.type !== "str" ? itemsEditor.type : "json";
                const itemsInput = $("#node-input-itemsBinding");
                itemsInput.typedInput({
                    default: itemsDefaultType,
                    types: common.valueBindingTypes({ category: "structural" })
                });
                itemsInput.typedInput("type", itemsEditor.type !== "str" || itemsBinding ? itemsEditor.type : "json");
                itemsInput.typedInput("value", itemsEditor.value);

                // P180 (ADR 0021): load-shim — migrate old displayType values to the
                // new semantic intent vocabulary before setting the SelectBox.
                // Old "default" → "plain", old "compact" → "plain" (compact was
                // density, not a look; density is a future modifier).
                const rawDisplayType = this.displayType || "plain";
                const migratedDisplayType = rawDisplayType === "default" ? "plain"
                    : rawDisplayType === "compact" ? "plain"
                    : rawDisplayType;
                $("#node-input-displayType").val(migratedDisplayType);

                // P180: ordered checkbox.
                $("#node-input-ordered").prop("checked", this.ordered === true);

                // P171: bind the stored displayValue / badgeVariant and toggle the
                // badgeVariant row visibility (only when displayValue = badge).
                $("#node-input-displayValue").val(this.displayValue || "none");
                $("#node-input-badgeVariant").val(this.badgeVariant || "neutral");
                const syncBadgeRow = function () {
                    if ($("#node-input-displayValue").val() === "badge") {
                        $("#node-list-badge-variant-row").show();
                    }
                    else {
                        $("#node-list-badge-variant-row").hide();
                    }
                };
                $("#node-input-displayValue").on("change", syncBadgeRow);
                syncBadgeRow();

                // P173 (ADR 0012 / value category): single-select. `selectable` is a
                // plain checkbox; `selectedId` is the TWO-WAY value typedInput (full
                // canonical set, default type `str` = a row id) — it reads the selected
                // id from the bound Store/state AND the itemSelect event carries the
                // chosen id for the wired write-back loop (mirror of ui-tabs activeTab).
                // Migration: a legacy `selectedIdPath` plain string opens as a state
                // binding; a stored `selectedId` binding wins.
                $("#node-input-selectable").prop("checked", this.selectable === true);
                const storedSelected = common.parseBindingValue(this.selectedId);
                const selectedBinding = storedSelected
                    ? storedSelected
                    : (this.selectedIdPath ? { kind: "state", path: this.selectedIdPath } : undefined);
                const selectedEditor = common.readValueBinding(selectedBinding, "");
                const selectedInput = $("#node-input-selectedIdBinding");
                selectedInput.typedInput({
                    default: selectedEditor.type,
                    types: common.valueBindingTypes({ category: "value", currentKind: selectedEditor.type })
                });
                selectedInput.typedInput("type", selectedEditor.type);
                selectedInput.typedInput("value", selectedEditor.value);
                // The selectedId row is only relevant when selectable is on.
                const syncSelectableRow = function () {
                    if ($("#node-input-selectable").is(":checked")) {
                        $("#node-list-selected-id-row").show();
                    }
                    else {
                        $("#node-list-selected-id-row").hide();
                    }
                };
                $("#node-input-selectable").on("change", syncSelectableRow);
                syncSelectableRow();
            },
            oneditsave: function () {
                // P172: persist the applicable base fields as binding objects.
                common.applyBaseFields(BASE_FIELDS).call(this);
                // P171: persist items as a binding object; clear the legacy path.
                this.items = common.applyValueBinding(
                    $("#node-input-itemsBinding").typedInput("type"),
                    $("#node-input-itemsBinding").typedInput("value")
                );
                common.dropLegacyFields(this, ["itemsPath"]);
                // P180: persist the migrated displayType and ordered.
                this.displayType = $("#node-input-displayType").val();
                this.ordered = $("#node-input-ordered").is(":checked");
                this.displayValue = $("#node-input-displayValue").val();
                this.badgeVariant = $("#node-input-badgeVariant").val();
                // P208: persist the item-field mapping (flat field names). Empty input
                // falls back to the historical default so a blanked field never breaks
                // an existing shaped-item list.
                this.labelField = $("#node-input-labelField").val() || "label";
                this.valueField = $("#node-input-valueField").val() || "value";
                this.idField = $("#node-input-idField").val() || "id";
                this.iconField = $("#node-input-iconField").val() || "icon";
                // P173: persist selectable + selectedId binding object; clear the
                // legacy path.
                this.selectable = $("#node-input-selectable").is(":checked");
                this.selectedId = common.applyValueBinding(
                    $("#node-input-selectedIdBinding").typedInput("type"),
                    $("#node-input-selectedIdBinding").typedInput("value")
                );
                common.dropLegacyFields(this, ["selectedIdPath"]);
            }
        }, ["itemClick", "itemSelect"]);
    })();
</script>
<script type="text/html" data-template-name="ui-list">
    <div class="form-row"><label for="node-input-name" data-i18n="node-red:common.label.name">Name</label><input type="text" id="node-input-name"></div>
    <hr style="margin: 8px 0;">
    <div class="form-row"><label for="node-input-mount" data-i18n="ui-list.label.mount">Parent Slot</label><select id="node-input-mount"></select></div>
    <!-- P171 (ADR 0012 / structural category): Items binding (structural array source) — typedInput managed in oneditprepare/oneditsave. -->
    <div class="form-row"><label for="node-input-itemsBinding" data-i18n="ui-list.label.items">Items</label><input type="text" id="node-input-itemsBinding"></div>
    <!-- P180 (ADR 0021): displayType = semantic intent enum (plain/divided/grouped/actionable).
         Default "plain" (back-compat with old "default"). Migration shim in oneditprepare. -->
    <div class="form-row"><label for="node-input-displayType" data-i18n="ui-list.label.displayType">Display Type</label>
        <select id="node-input-displayType">
            <option value="plain" data-i18n="ui-list.option.displayType.plain">Plain (Default)</option>
            <option value="divided" data-i18n="ui-list.option.displayType.divided">Divided (with separators)</option>
            <option value="grouped" data-i18n="ui-list.option.displayType.grouped">Grouped (bordered / list-group)</option>
            <option value="actionable" data-i18n="ui-list.option.displayType.actionable">Actionable (hover / click affordance)</option>
        </select>
    </div>
    <!-- P180: ordered — switches ul↔ol. Backend-neutral. -->
    <div class="form-row">
        <label for="node-input-ordered" style="width: auto;"><input type="checkbox" id="node-input-ordered" style="display:inline-block; width:auto; vertical-align:top;"> <span data-i18n="ui-list.label.ordered">Ordered list (ol)</span></label>
    </div>
    <div class="form-row"><label for="node-input-displayValue" data-i18n="ui-list.label.displayValue">Value-Anzeige</label>
        <select id="node-input-displayValue">
            <option value="none" data-i18n="ui-list.option.displayValue.none">Nicht anzeigen (Default)</option>
            <option value="secondary" data-i18n="ui-list.option.displayValue.secondary">Sekundär (Text)</option>
            <option value="badge" data-i18n="ui-list.option.displayValue.badge">Badge</option>
        </select>
    </div>
    <div class="form-row" id="node-list-badge-variant-row"><label for="node-input-badgeVariant" data-i18n="ui-list.label.badgeVariant">Badge Variant</label>
        <select id="node-input-badgeVariant">
            <option value="neutral" data-i18n="ui-list.option.badgeVariant.neutral">Neutral (Default)</option>
            <option value="primary" data-i18n="ui-list.option.badgeVariant.primary">Primary</option>
            <option value="info" data-i18n="ui-list.option.badgeVariant.info">Info</option>
            <option value="success" data-i18n="ui-list.option.badgeVariant.success">Success</option>
            <option value="warning" data-i18n="ui-list.option.badgeVariant.warning">Warning</option>
            <option value="danger" data-i18n="ui-list.option.badgeVariant.danger">Danger</option>
        </select>
    </div>
    <!-- P208: item-field mapping — WHICH raw-entity field is the label/value/id/icon
         of a row. Defaults (label/value/id/icon) reproduce the historical hard-coded
         behaviour, so shaped-item lists are unaffected. Flat field names only. -->
    <hr style="margin: 8px 0;">
    <div class="form-row"><label for="node-input-labelField" data-i18n="ui-list.label.labelField">Label Field</label><input type="text" id="node-input-labelField" placeholder="label" data-i18n="[placeholder]ui-list.placeholder.labelField"></div>
    <div class="form-row"><label for="node-input-valueField" data-i18n="ui-list.label.valueField">Value Field</label><input type="text" id="node-input-valueField" placeholder="value" data-i18n="[placeholder]ui-list.placeholder.valueField"></div>
    <div class="form-row"><label for="node-input-idField" data-i18n="ui-list.label.idField">Id Field</label><input type="text" id="node-input-idField" placeholder="id" data-i18n="[placeholder]ui-list.placeholder.idField"></div>
    <div class="form-row"><label for="node-input-iconField" data-i18n="ui-list.label.iconField">Icon Field</label><input type="text" id="node-input-iconField" placeholder="icon" data-i18n="[placeholder]ui-list.placeholder.iconField"></div>
    <!-- P173: single-select — selectable checkbox + two-way selectedId typedInput. -->
    <hr style="margin: 8px 0;">
    <div class="form-row">
        <label for="node-input-selectable" style="width: auto;"><input type="checkbox" id="node-input-selectable" style="display:inline-block; width:auto; vertical-align:top;"> <span data-i18n="ui-list.label.selectable">Auswählbar (Single-Select)</span></label>
    </div>
    <div class="form-row" id="node-list-selected-id-row"><label for="node-input-selectedIdBinding" data-i18n="ui-list.label.selectedId">Ausgewählt (id)</label><input type="text" id="node-input-selectedIdBinding"></div>
    <input type="hidden" id="node-input-events">
    <input type="hidden" id="node-input-outputs">
    <div class="form-row"><label data-i18n="ui-list.label.events">Events</label></div>
    <div id="node-input-events-container"></div>
</script>
<!-- P269 (ADR 0042): help + labels are locale-migrated. Help lives in
     nodes/view/locales/{en-US,de}/ui-list.html; form-row labels carry data-i18n
     keys resolved from nodes/view/locales/{en-US,de}/ui-list.json. No inline
     data-help-name block here. -->
