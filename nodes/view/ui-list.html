<script type="text/javascript" src="resources/node-red-contrib-webapp/lib/editor-common.js"></script>
<script type="text/javascript">
    (function () {
        const common = window.WebappEditorCommon;
        // P172 (ADR 0015): ui-list base-field applicability.
        // - `visible` applicable: boolean-state binding, blends the list in/out.
        // - `disabled` applicable: locks row interaction (itemClick/itemSelect);
        //   without active events it is a no-op — the hint explains this.
        // - `color` applicable: non-variant node; active value typedInput; a
        //   literal colour round-trips as a binding object.
        // - `size` N/A (Erweitert): density is controlled via `displayType`
        //   (default/divided/compact) — a size field is meaningless here.
        const BASE_FIELDS = {
            visible: true,
            disabled: true,
            color: true,
            size: false,
            variant: false,
            advanced: ["size"],
            hints: {
                disabled: "Ohne aktive Events (itemClick/itemSelect) hat disabled keinen sichtbaren Effekt.",
                size: "Die Dichte wird über Display-Typ (Default/Divided/Compact) gesteuert, nicht über Size."
            }
        };
        common.registerNodeTypeWithEvents("ui-list", {
            category: "webapp view",
            color: "#f4efcf",
            defaults: {
                name: { value: "" },
                parent: { value: "" },
                mount: { value: "", required: true },
                // P171 (ADR 0012): `items` is a STRUCTURAL array source (the list
                // renders its rows ITSELF — NOT a repeats case). It persists the
                // binding OBJECT; there is no matching #node-input-items element so
                // Node-RED auto-save cannot clobber it. The typedInput lives on
                // #node-input-itemsBinding. The legacy `itemsPath` plain state path
                // is kept for migration only (the unused `items:null` default is gone).
                items: { value: null },
                itemsBinding: { value: "" },
                itemsPath: { value: "" },
                displayType: { value: "default" },
                // P171: node-wide value display (none/secondary/badge) + badge colour.
                displayValue: { value: "none" },
                badgeVariant: { value: "neutral" },
                // P173: single-select. `selectable` is a plain boolean checkbox.
                // `selectedId` is the two-way binding OBJECT (mirror of ui-tabs
                // `activeTab`); there is no #node-input-selectedId element so Node-RED
                // auto-save cannot clobber it — the typedInput lives on the
                // #node-input-selectedIdBinding carrier. Legacy `selectedIdPath` is a
                // plain state path kept for migration only.
                selectable: { value: false },
                selectedId: { value: null },
                selectedIdBinding: { value: "" },
                selectedIdPath: { value: "" },
                events: { value: "[]" },
                outputs: { value: 0 },
                // P172 (ADR 0015): base fields. `visible`/`color`/`disabled` persist
                // the binding OBJECT; there are no matching #node-input-visible /
                // #node-input-color / #node-input-disabled elements so Node-RED
                // auto-save cannot clobber them — the typedInputs live on the
                // *Binding carrier inputs.
                visible: { value: null },
                visibleBinding: { value: "" },
                disabled: { value: null },
                disabledBinding: { value: "" },
                color: { value: null },
                colorBinding: { value: "" },
                order: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                row: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                col: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                colSize: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                rowSize: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                layoutX: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                layoutY: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } }
            },
            inputs: 1,
            outputs: 0,
            outputLabels: function (index) {
                try {
                    const events = JSON.parse(this.events || "[]");
                    return events[index] || "";
                }
                catch (_e) {
                    return "";
                }
            },
            icon: "font-awesome/fa-list",
            label: common.labelWithName("ui-list"),
            onadd: function () {
                if (!this.name) {
                    this.name = common.getNextNameDefault("ui-list", "List");
                }
            },
            oneditprepare: function () {
                common.installReferenceSelectors({ mount: true }).call(this);
                // P172: the shared base-field group ("Allgemein") — visible/disabled/
                // color/size with node-local applicability (BASE_FIELDS).
                common.installBaseFields(BASE_FIELDS).call(this);
                common.installLayoutChildPropRows().call(this);

                // P171 (ADR 0012 / structural category): `items` typedInput — the
                // RESTRICTED set: scalar literals (str/num/bool/date) are EXCLUDED
                // (they cannot yield a valid array model); allowed is json (a static
                // array literal) + every binding kind that can resolve to an array/
                // object (store/query/routeParam/reactive/msg/jsonata/flow/global/env).
                // Migration: a legacy `itemsPath` plain string opens as a state
                // binding (leading `state.` stripped); a stored `items` binding wins.
                const storedItems = common.parseBindingValue(this.items);
                const itemsBinding = storedItems
                    ? storedItems
                    : (this.itemsPath
                        ? { kind: "state", path: this.itemsPath.indexOf("state.") === 0 ? this.itemsPath.slice("state.".length) : this.itemsPath }
                        : undefined);
                const itemsEditor = common.readValueBinding(itemsBinding, "");
                const itemsDefaultType = itemsEditor.type !== "str" ? itemsEditor.type : "json";
                const itemsInput = $("#node-input-itemsBinding");
                itemsInput.typedInput({
                    default: itemsDefaultType,
                    types: common.valueBindingTypes({ category: "structural" })
                });
                itemsInput.typedInput("type", itemsEditor.type !== "str" || itemsBinding ? itemsEditor.type : "json");
                itemsInput.typedInput("value", itemsEditor.value);

                // P171: bind the stored displayValue / badgeVariant and toggle the
                // badgeVariant row visibility (only when displayValue = badge).
                $("#node-input-displayValue").val(this.displayValue || "none");
                $("#node-input-badgeVariant").val(this.badgeVariant || "neutral");
                const syncBadgeRow = function () {
                    if ($("#node-input-displayValue").val() === "badge") {
                        $("#node-list-badge-variant-row").show();
                    }
                    else {
                        $("#node-list-badge-variant-row").hide();
                    }
                };
                $("#node-input-displayValue").on("change", syncBadgeRow);
                syncBadgeRow();

                // P173 (ADR 0012 / value category): single-select. `selectable` is a
                // plain checkbox; `selectedId` is the TWO-WAY value typedInput (full
                // canonical set, default type `str` = a row id) — it reads the selected
                // id from the bound Store/state AND the itemSelect event carries the
                // chosen id for the wired write-back loop (mirror of ui-tabs activeTab).
                // Migration: a legacy `selectedIdPath` plain string opens as a state
                // binding; a stored `selectedId` binding wins.
                $("#node-input-selectable").prop("checked", this.selectable === true);
                const storedSelected = common.parseBindingValue(this.selectedId);
                const selectedBinding = storedSelected
                    ? storedSelected
                    : (this.selectedIdPath ? { kind: "state", path: this.selectedIdPath } : undefined);
                const selectedEditor = common.readValueBinding(selectedBinding, "");
                const selectedInput = $("#node-input-selectedIdBinding");
                selectedInput.typedInput({
                    default: selectedEditor.type,
                    types: common.valueBindingTypes({ category: "value" })
                });
                selectedInput.typedInput("type", selectedEditor.type);
                selectedInput.typedInput("value", selectedEditor.value);
                // The selectedId row is only relevant when selectable is on.
                const syncSelectableRow = function () {
                    if ($("#node-input-selectable").is(":checked")) {
                        $("#node-list-selected-id-row").show();
                    }
                    else {
                        $("#node-list-selected-id-row").hide();
                    }
                };
                $("#node-input-selectable").on("change", syncSelectableRow);
                syncSelectableRow();
            },
            oneditsave: function () {
                // P172: persist the applicable base fields as binding objects.
                common.applyBaseFields(BASE_FIELDS).call(this);
                // P171: persist items as a binding object; clear the legacy path.
                this.items = common.applyValueBinding(
                    $("#node-input-itemsBinding").typedInput("type"),
                    $("#node-input-itemsBinding").typedInput("value")
                );
                this.itemsPath = "";
                this.displayValue = $("#node-input-displayValue").val();
                this.badgeVariant = $("#node-input-badgeVariant").val();
                // P173: persist selectable + selectedId binding object; clear the
                // legacy path.
                this.selectable = $("#node-input-selectable").is(":checked");
                this.selectedId = common.applyValueBinding(
                    $("#node-input-selectedIdBinding").typedInput("type"),
                    $("#node-input-selectedIdBinding").typedInput("value")
                );
                this.selectedIdPath = "";
            }
        }, ["itemClick", "itemSelect"]);
    })();
</script>
<script type="text/html" data-template-name="ui-list">
    <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
    <hr style="margin: 8px 0;">
    <div class="form-row"><label for="node-input-mount">Parent Slot</label><select id="node-input-mount"></select></div>
    <!-- P171 (ADR 0012 / structural category): Items binding (structural array source) — typedInput managed in oneditprepare/oneditsave. -->
    <div class="form-row"><label for="node-input-itemsBinding">Items</label><input type="text" id="node-input-itemsBinding"></div>
    <div class="form-row"><label for="node-input-displayType">Display Type</label>
        <select id="node-input-displayType">
            <option value="default">Default</option>
            <option value="divided">Divided</option>
            <option value="compact">Compact</option>
        </select>
    </div>
    <div class="form-row"><label for="node-input-displayValue">Value-Anzeige</label>
        <select id="node-input-displayValue">
            <option value="none">Nicht anzeigen (Default)</option>
            <option value="secondary">Sekundär (Text)</option>
            <option value="badge">Badge</option>
        </select>
    </div>
    <div class="form-row" id="node-list-badge-variant-row"><label for="node-input-badgeVariant">Badge Variant</label>
        <select id="node-input-badgeVariant">
            <option value="neutral">Neutral (Default)</option>
            <option value="primary">Primary</option>
            <option value="info">Info</option>
            <option value="success">Success</option>
            <option value="warning">Warning</option>
            <option value="danger">Danger</option>
        </select>
    </div>
    <!-- P173: single-select — selectable checkbox + two-way selectedId typedInput. -->
    <hr style="margin: 8px 0;">
    <div class="form-row">
        <label for="node-input-selectable" style="width: auto;"><input type="checkbox" id="node-input-selectable" style="display:inline-block; width:auto; vertical-align:top;"> Auswählbar (Single-Select)</label>
    </div>
    <div class="form-row" id="node-list-selected-id-row"><label for="node-input-selectedIdBinding">Ausgewählt (id)</label><input type="text" id="node-input-selectedIdBinding"></div>
    <input type="hidden" id="node-input-events">
    <input type="hidden" id="node-input-outputs">
    <div class="form-row"><label>Events</label></div>
    <div id="node-input-events-container"></div>
</script>
<script type="text/html" data-help-name="ui-list">
<p>Rendert eine strukturierte Liste an einem Mount-Ziel. Die Elemente kommen aus dem
<code>items</code>-Binding (statisches Array oder dynamisch aus State/Query/Store/Kontext).</p>
<h4>Basis-Felder (Allgemein, P172)</h4>
<p><b>Visible</b> (Boolean-Zustand-Binding, leer = sichtbar) — blendet die gesamte Liste ein/aus.
<b>Disabled</b> (Boolean-Zustand-Binding) — sperrt die Zeilen-Interaktion (itemClick/itemSelect);
ohne aktive Events hat disabled keinen sichtbaren Effekt.
<b>Color</b> (bindbare Farbe, non-variant) — allgemeine Listenfarbe.
<b>Size</b> ist N/A — die Dichte wird über Display-Typ (Default/Divided/Compact) gesteuert.</p>
<h4>Items (P171)</h4>
<p>Bindbare, <strong>strukturelle</strong> Quelle der Listenelemente (ein Array) — nur Typen,
die ein valides Modell liefern: <code>json</code> (statisches Array-Literal) sowie
Store, Query, Route-Param, Reactive, msg, JSONata, Flow, Global, Env. Skalar-Literale
(string/number/boolean) sind <b>ausgeblendet</b>. Ein bestehender <code>itemsPath</code>
wird automatisch als <code>state</code>-Binding übernommen.</p>
<h4>Item-Schema — der Vertrag</h4>
<p>Jedes Element ist ein <strong>String</strong> (Kurzform → <code>{label:&lt;string&gt;}</code>)
<strong>oder</strong> ein Objekt <code>{ id?, label, value?, icon? }</code>:</p>
<ul>
<li><code>label</code> — <strong>Pflicht</strong> (Objektform); fehlt es, zeigt <em>diese</em>
Zeile <code>"?"</code>. Die String-Kurzform setzt genau dieses Feld.</li>
<li><code>id</code> — Identität: <code>rowId</code> im Event und Render-Key. Ohne <code>id</code>
= Array-Index.</li>
<li><code>value</code> (String|Number) — Anwendungswert: <strong>stets im Event</strong>
(<code>row.value</code>). Die Anzeige steuert <code>displayValue</code>
(<code>none</code>/<code>secondary</code>/<code>badge</code>) — bei <code>badge</code> als Badge
in <code>badgeVariant</code>.</li>
<li><code>icon</code> — führendes Icon (Icon-Name).</li>
</ul>
<p>Gemischte Arrays (Strings + Objekte) rendern. <strong>Kein implizites Mapping</strong> —
Zusatzfelder werden ignoriert; bringe deine Daten vorher in diese Form. Nicht-Array-Wurzel
→ leere Liste (kein Crash).</p>
<h4>Single-Select (P173)</h4>
<p><b>Auswählbar</b> (<code>selectable</code>, Checkbox, Default aus) schaltet Single-Select ein:
ein Klick auf eine Zeile markiert sie sichtbar als ausgewählt. Bei aus ist die Liste rein
anzeigend/klickbar, ohne Auswahl-Zustand.</p>
<p><b>Ausgewählt (id)</b> (<code>selectedId</code>, nur relevant bei „Auswählbar") ist ein
<strong>zweiseitiges</strong> Binding auf die <code>id</code> der ausgewählten Zeile — analog
<code>activeTab</code> bei ui-tabs: liest die Auswahl aus dem gebundenen Store/State <strong>und</strong>
das <code>itemSelect</code>-Event trägt die gewählte id für den Write-Back (verdrahte
<code>itemSelect</code> → ui-store <code>set</code>; die Store-Änderung re-rendert via SSE und
markiert die Zeile). Eine ungültige/leere id markiert <em>keine</em> Zeile. Eine stabile
<code>id</code> je Item ist dringend empfohlen — ohne <code>id</code> dient der Array-Index als
<code>rowId</code> (instabil beim Umsortieren). Mehrfachauswahl (Multi-Select) ist nicht abgedeckt.</p>
<h4>Events</h4>
<p><code>itemClick</code> erzeugt einen Output-Port; der Klick emittiert
<code>params: { rowId, row }</code> (plus <code>clientId</code>/<code>sourceId</code>/<code>appId</code>) —
<code>rowId</code> = <code>id</code> (sonst Index), <code>row</code> = das ganze Element inkl.
<code>value</code>. <code>itemClick</code> feuert bei <em>jedem</em> Klick.</p>
<p><code>itemSelect</code> feuert <strong>nur</strong> bei <code>selectable</code> <strong>und</strong>
Auswahlwechsel (gleiche Payload <code>{ rowId, row }</code>). Ohne <code>selectable</code> ist es
wirkungslos. So unterscheidet es sich von <code>itemClick</code>.</p>
<p>Doku: <a href="https://github.com/ollixx/node-red-contrib-webapp/blob/develop/docs/nodes/display/ui-list.md" target="_blank">ui-list</a>.</p>
</script>
