<script type="text/javascript" src="resources/node-red-contrib-webapp/lib/editor-common.js"></script>
<script type="text/javascript">
    (function () {
        const common = window.WebappEditorCommon;

        // P222 (ADR 0015): common base fields. See the applicability table in
        // docs/nodes/concepts/editor.md. `omit` drops a field the node already
        // owns a dedicated control for (avoids duplicate #node-input carrier ids).
        const BASE_FIELDS = {
            visible: true,
            disabled: false,
            color: true,
            size: false,
            variant: false,
            advanced: ["size"],
            omit: ["visible"],
            i18nNode: "ui-empty-state",
            hints: {
                disabled: "Ein Empty-State hat keinen interaktiven Zustand.",
                size: "Dieser Knoten hat keine Größen-Stufen."
            }
        };
        common.registerNodeType("ui-empty-state", {
            category: "webapp view",
            color: "#f4efcf",
            defaults: {
                color: { value: null },
                colorBinding: { value: "" },
                name: { value: "" },
                app: { value: "" },
                mount: { value: "", required: true },
                visiblePath: { value: "", required: true },
                visible: { value: null },
                icon: { value: "" },
                title: { value: "" },
                message: { value: "" },
                action: { value: "" },
                actionLabel: { value: "" },
                order: { value: "", validate: function (value) { return value == null || value === "" || RED.validators.number()(value); } },
                row: { value: "", validate: function (value) { return value == null || value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                col: { value: "", validate: function (value) { return value == null || value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                colSize: { value: "", validate: function (value) { return value == null || value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                rowSize: { value: "", validate: function (value) { return value == null || value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                layoutX: { value: "", validate: function (value) { return value == null || value === "" || RED.validators.number()(value); } },
                layoutY: { value: "", validate: function (value) { return value == null || value === "" || RED.validators.number()(value); } }
            },
            inputs: 1,
            outputs: 0,
            icon: "font-awesome/fa-inbox",
            label: common.labelWithName("ui-empty-state"),
            onadd: function () {
                if (!this.name) {
                    this.name = common.getNextNameDefault("ui-empty-state", "Empty State");
                }
            },
            oneditsave: function () {
                common.applyBaseFields(BASE_FIELDS).call(this);
            },
            oneditprepare: function () {
                common.installReferenceSelectors({ mount: true }).call(this);
                common.installBaseFields(BASE_FIELDS).call(this);
                common.installLayoutChildPropRows().call(this);
            }
        });
    })();
</script>
<script type="text/html" data-template-name="ui-empty-state">
    <div class="form-row"><label for="node-input-name" data-i18n="node-red:common.label.name">Name</label><input type="text" id="node-input-name"></div>
    <hr style="margin: 8px 0;">
    <div class="form-row"><label for="node-input-mount" data-i18n="ui-empty-state.label.mount">Parent Slot</label><select id="node-input-mount"></select></div>
    <div class="form-row"><label for="node-input-visiblePath" data-i18n="ui-empty-state.label.visiblePath">Visible Path</label><input type="text" id="node-input-visiblePath"></div>
    <div class="form-row"><label for="node-input-icon" data-i18n="ui-empty-state.label.icon">Icon</label><input type="text" id="node-input-icon"></div>
    <div class="form-row"><label for="node-input-title" data-i18n="ui-empty-state.label.title">Title</label><input type="text" id="node-input-title"></div>
    <div class="form-row"><label for="node-input-message" data-i18n="ui-empty-state.label.message">Message</label><input type="text" id="node-input-message"></div>
    <div class="form-row"><label for="node-input-action" data-i18n="ui-empty-state.label.action">Action</label><input type="text" id="node-input-action"></div>
    <div class="form-row"><label for="node-input-actionLabel" data-i18n="ui-empty-state.label.actionLabel">Action Label</label><input type="text" id="node-input-actionLabel"></div>
</script>
