<script type="text/javascript" src="resources/node-red-contrib-webapp/lib/editor-common.js"></script>
<script type="text/javascript">
    (function () {
        const common = window.WebappEditorCommon;

        // P222 (ADR 0015): common base fields. See the applicability table in
        // docs/nodes/concepts/editor.md. `omit` drops a field the node already
        // owns a dedicated control for (avoids duplicate #node-input carrier ids).
        const BASE_FIELDS = {
            visible: true,
            disabled: true,
            color: false,
            size: false,
            variant: false,
            advanced: ["size"],
            omit: ["disabled"],
            // P268 (ADR 0042 §3): N/A hints live in the node's OWN locale catalog
            // (nodes/view/locales/<lang>/ui-datepicker.json -> `ui-datepicker.hints.<field>`).
            i18nNode: "ui-datepicker"
        };

        common.registerNodeType("ui-datepicker", {
            category: "webapp view",
            color: "#f4efcf",
            defaults: {
                visible: { value: null },
                visibleBinding: { value: "" },
                name: { value: "" },
                app: { value: "" },
                mount: { value: "", required: true },
                // P98: `label` persists the binding OBJECT; DOM-less widget lives on `labelBinding`.
                label: { value: { kind: "literal", value: "" } },
                labelBinding: { value: "" },
                // P98: `value` persists the binding OBJECT; DOM-less widget on `valueBinding`.
                // Legacy `valuePath` (pre-P98 plain state path) is migrated on first open.
                value: { value: null },
                valueBinding: { value: "" },
                // P130 (ADR 0012): `disabled` persists the binding OBJECT; there is no
                // matching #node-input-disabled element so Node-RED auto-save cannot
                // clobber it. The typedInput lives on #node-input-disabledBinding.
                disabled: { value: null },
                disabledBinding: { value: "" },
                // P204 (ADR 0027): `writeTo` — WRITE half (store/flow/global). A
                // datepicker renders an sl-input (text-like): it honours
                // writeTrigger (submit = Enter/blur, change = on pick). Legacy
                // storeId/path migrate to writeTo=store.
                writeTo: { value: null },
                writeToBinding: { value: "" },
                writeTrigger: { value: "submit" },

                mode: { value: "date" },
                min: { value: "" },
                max: { value: "" },
                // P149 (ADR 0012): `placeholder` persists the binding OBJECT; DOM-less widget lives on `placeholderBinding`.
                // Back-compat: legacy plain string placeholder is migrated on first open (load-shim below).
                placeholder: { value: null },
                placeholderBinding: { value: "" },
                order: { value: "", validate: function (value) { return value == null || value === "" || RED.validators.number()(value); } },
                row: { value: "", validate: function (value) { return value == null || value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                col: { value: "", validate: function (value) { return value == null || value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                colSize: { value: "", validate: function (value) { return value == null || value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                rowSize: { value: "", validate: function (value) { return value == null || value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                layoutX: { value: "", validate: function (value) { return value == null || value === "" || RED.validators.number()(value); } },
                layoutY: { value: "", validate: function (value) { return value == null || value === "" || RED.validators.number()(value); } }
            },
            // P229 (ADR 0038): migration-only legacy fields — injected as hidden
            // defaults at registration (see editor-common withMigrationDefaults);
            // migrated to `writeTo` on open, deleted on save, never written anew.
            migrationFields: ["storeId", "path", "valuePath"],
            inputs: 1,
            outputs: 1,
            outputLabels: function () { return "event"; },
            icon: "font-awesome/fa-calendar",
            label: common.labelWithName("ui-datepicker"),
            onadd: function () {
                if (!this.name) {
                    this.name = common.getNextNameDefault("ui-datepicker", "Datepicker");
                }
            },
            oneditprepare: function () {
                common.installReferenceSelectors({ mount: true }).call(this);
                common.installBaseFields(BASE_FIELDS).call(this);
                common.installLayoutChildPropRows().call(this);

                // P98 / P130: Label typedInput — canonical P113 helper.
                // Back-compat: stored label may be a plain string (pre-P98) or a binding object.
                var labelStored = common.parseBindingValue(this.label);
                var labelBinding = labelStored
                    ? labelStored
                    : (this.label && typeof this.label === "string" && this.label.trim().length > 0
                        ? { kind: "literal", value: this.label }
                        : undefined);
                var labelEditor = common.readValueBinding(labelBinding, "");
                var labelInput = $("#node-input-labelBinding");
                labelInput.typedInput({
                    default: labelEditor.type,
                    types: common.valueBindingTypes({ category: "value", currentKind: labelEditor.type })
                });
                labelInput.typedInput("type", labelEditor.type);
                labelInput.typedInput("value", labelEditor.value);

                // P98 / P130: Value typedInput — canonical P113 helper.
                // Migration: a legacy `valuePath` plain state path becomes a state binding.
                var storedValue = common.parseBindingValue(this.value);
                var valueBinding = storedValue
                    ? storedValue
                    : (this.valuePath ? { kind: "state", path: this.valuePath } : undefined);
                var valueEditor = common.readValueBinding(valueBinding, "");
                var valueInput = $("#node-input-valueBinding");
                valueInput.typedInput({
                    default: valueEditor.type,
                    types: common.valueBindingTypes({ category: "value", currentKind: valueEditor.type })
                });
                valueInput.typedInput("type", valueEditor.type);
                valueInput.typedInput("value", valueEditor.value);

                // P130 (ADR 0012 / boolean category): `disabled` typedInput — canonical P113 helper.
                // No legacy field to migrate (ui-datepicker had no dedicated disabled typedInput before P130).
                var storedDisabled = common.parseBindingValue(this.disabled);
                var disabledBinding = storedDisabled ? storedDisabled : undefined;
                var disabledEditor = common.readValueBinding(disabledBinding, "");
                // P181: use 'bool' default when no binding (avoids store fallback).
                var disabledType = disabledEditor.type !== "str" ? disabledEditor.type : "bool";
                var disabledInput = $("#node-input-disabledBinding");
                disabledInput.typedInput({
                    default: disabledType,
                    types: common.valueBindingTypes({ category: "boolean" })
                });
                disabledInput.typedInput("type", disabledType);
                disabledInput.typedInput("value", disabledEditor.value);
                disabledInput.data("base-field-originally-empty", !disabledBinding);

                // P149 (ADR 0012): Placeholder typedInput — canonical P113 helper.
                // Back-compat: stored placeholder may be a plain string (pre-P149) or a binding object.
                var placeholderStored = common.parseBindingValue(this.placeholder);
                var placeholderBinding = placeholderStored
                    ? placeholderStored
                    : (this.placeholder && typeof this.placeholder === "string" && this.placeholder.trim().length > 0
                        ? { kind: "literal", value: this.placeholder }
                        : undefined);
                var placeholderEditor = common.readValueBinding(placeholderBinding, "");
                var placeholderInput = $("#node-input-placeholderBinding");
                placeholderInput.typedInput({
                    default: placeholderEditor.type,
                    types: common.valueBindingTypes({ category: "value", currentKind: placeholderEditor.type })
                });
                placeholderInput.typedInput("type", placeholderEditor.type);
                placeholderInput.typedInput("value", placeholderEditor.value);

                // P204 (ADR 0027 / writable category): `writeTo` typedInput.
                common.installWriteToField.call(this);
            },
            oneditsave: function () {
                common.applyBaseFields(BASE_FIELDS).call(this);
                // P204: persist writeTo + writeTrigger; drop legacy storeId/path.
                common.saveWriteToField.call(this);

                // P130: persist label as binding object.
                this.label = common.applyValueBinding(
                    $("#node-input-labelBinding").typedInput("type"),
                    $("#node-input-labelBinding").typedInput("value")
                );

                // P130: persist value as binding object; clear legacy valuePath.
                this.value = common.applyValueBinding(
                    $("#node-input-valueBinding").typedInput("type"),
                    $("#node-input-valueBinding").typedInput("value")
                );
                common.dropLegacyFields(this, ["valuePath"]);
                // P130: persist disabled as binding object.
                // P181: preserve null when field was originally absent and untouched.
                var $disabledInput = $("#node-input-disabledBinding");
                var disabledResult = common.applyValueBinding(
                    $disabledInput.typedInput("type"),
                    $disabledInput.typedInput("value")
                );
                var disabledOriginEmpty = $disabledInput.data("base-field-originally-empty");
                var disabledIsBoolLiteral = disabledResult && disabledResult.kind === "literal"
                    && disabledResult.value === false;
                this.disabled = (disabledOriginEmpty && disabledIsBoolLiteral) ? null : disabledResult;

                // P149: persist placeholder as binding object.
                this.placeholder = common.applyValueBinding(
                    $("#node-input-placeholderBinding").typedInput("type"),
                    $("#node-input-placeholderBinding").typedInput("value")
                );
            }
        });
    })();
</script>
<!-- P268 (ADR 0042 §3): editor-label i18n. Form-row labels carry data-i18n keys
     per the convention `<node>.label.<field>` (options `<node>.option.<field>.<value>`,
     placeholders `[placeholder]<node>.placeholder.<field>`). Catalogs:
     nodes/view/locales/{en-US,de}/ui-datepicker.json. The literal texts stay as the en-US
     authoring reference; at edit time the catalog text replaces them. -->
<script type="text/html" data-template-name="ui-datepicker">
    <div class="form-row"><label for="node-input-name" data-i18n="node-red:common.label.name">Name</label><input type="text" id="node-input-name"></div>
    <hr style="margin: 8px 0;">
    <div class="form-row"><label for="node-input-mount" data-i18n="ui-datepicker.label.mount">Parent Slot</label><select id="node-input-mount"></select></div>
    <!-- P98 / P130: Label binding — typedInput managed in oneditprepare/oneditsave. -->
    <div class="form-row"><label for="node-input-labelBinding" data-i18n="ui-datepicker.label.labelBinding">Label</label><input type="text" id="node-input-labelBinding"></div>
    <!-- P98 / P130: Value binding — typedInput managed in oneditprepare/oneditsave. -->
    <div class="form-row"><label for="node-input-valueBinding" data-i18n="ui-datepicker.label.valueBinding">Value Path</label><input type="text" id="node-input-valueBinding"></div>
    <!-- P204 (ADR 0027 / writable category): writeTo target (WRITE) — Store/Flow/Global. -->
    <div class="form-row"><label for="node-input-writeToBinding" data-i18n="ui-datepicker.label.writeToBinding">Write To</label><input type="text" id="node-input-writeToBinding"></div>
    <div class="form-row"><label for="node-input-writeTrigger" data-i18n="ui-datepicker.label.writeTrigger">Write Trigger</label><select id="node-input-writeTrigger"><option value="submit" data-i18n="ui-datepicker.option.writeTrigger.submit">submit</option><option value="change" data-i18n="ui-datepicker.option.writeTrigger.change">change</option><option value="none" data-i18n="ui-datepicker.option.writeTrigger.none">none</option></select></div>
    <!-- P130 (ADR 0012 / boolean category): Disabled binding — typedInput managed in oneditprepare/oneditsave. -->
    <div class="form-row"><label for="node-input-disabledBinding" data-i18n="ui-datepicker.label.disabledBinding">Disabled</label><input type="text" id="node-input-disabledBinding"></div>
    <div class="form-row">
        <label for="node-input-mode" data-i18n="ui-datepicker.label.mode">Mode</label>
        <select id="node-input-mode">
            <option value="date" data-i18n="ui-datepicker.option.mode.date">Date</option>
            <option value="datetime" data-i18n="ui-datepicker.option.mode.datetime">Date &amp; Time</option>
            <option value="time" data-i18n="ui-datepicker.option.mode.time">Time</option>
        </select>
    </div>
    <div class="form-row"><label for="node-input-min" data-i18n="ui-datepicker.label.min">Min</label><input type="text" id="node-input-min" placeholder="YYYY-MM-DD" data-i18n="[placeholder]ui-datepicker.placeholder.min"></div>
    <div class="form-row"><label for="node-input-max" data-i18n="ui-datepicker.label.max">Max</label><input type="text" id="node-input-max" placeholder="YYYY-MM-DD" data-i18n="[placeholder]ui-datepicker.placeholder.max"></div>
    <!-- P149 (ADR 0012): Placeholder binding — typedInput managed in oneditprepare/oneditsave. -->
    <div class="form-row"><label for="node-input-placeholderBinding" data-i18n="ui-datepicker.label.placeholderBinding">Placeholder</label><input type="text" id="node-input-placeholderBinding"></div>
</script>
<!-- P268 (ADR 0042): help + labels are locale-migrated. Help lives in
     nodes/view/locales/{en-US,de}/ui-datepicker.html; form-row labels carry
     data-i18n keys resolved from nodes/view/locales/{en-US,de}/ui-datepicker.json.
     No inline data-help-name block here. -->
