<script type="text/javascript" src="resources/node-red-contrib-webapp/lib/editor-common.js"></script>
<script type="text/javascript">
    (function () {
        const common = window.WebappEditorCommon;

        common.registerNodeType("ui-datepicker", {
            category: "webapp view",
            color: "#f4efcf",
            defaults: {
                name: { value: "" },
                parent: { value: "" },
                mount: { value: "", required: true },
                // P98: `label` persists the binding OBJECT; DOM-less widget lives on `labelBinding`.
                label: { value: { kind: "literal", value: "" } },
                labelBinding: { value: "" },
                // P98: `value` persists the binding OBJECT; DOM-less widget on `valueBinding`.
                // Legacy `valuePath` (pre-P98 plain state path) is migrated on first open.
                value: { value: null },
                valueBinding: { value: "" },
                valuePath: { value: "" },
                // P130 (ADR 0012): `disabled` persists the binding OBJECT; there is no
                // matching #node-input-disabled element so Node-RED auto-save cannot
                // clobber it. The typedInput lives on #node-input-disabledBinding.
                disabled: { value: null },
                disabledBinding: { value: "" },
                mode: { value: "date" },
                min: { value: "" },
                max: { value: "" },
                placeholder: { value: "" },
                order: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                row: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                col: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                colSize: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                rowSize: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                layoutX: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                layoutY: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } }
            },
            inputs: 1,
            outputs: 1,
            outputLabels: function () { return "event"; },
            icon: "font-awesome/fa-calendar",
            label: common.labelWithName("ui-datepicker"),
            onadd: function () {
                if (!this.name) {
                    this.name = common.getNextNameDefault("ui-datepicker", "Datepicker");
                }
            },
            oneditprepare: function () {
                common.installReferenceSelectors({ mount: true }).call(this);
                common.installLayoutChildPropRows().call(this);

                // P98 / P130: Label typedInput — canonical P113 helper.
                // Back-compat: stored label may be a plain string (pre-P98) or a binding object.
                var labelStored = common.parseBindingValue(this.label);
                var labelBinding = labelStored
                    ? labelStored
                    : (this.label && typeof this.label === "string" && this.label.trim().length > 0
                        ? { kind: "literal", value: this.label }
                        : undefined);
                var labelEditor = common.readValueBinding(labelBinding, "");
                var labelInput = $("#node-input-labelBinding");
                labelInput.typedInput({
                    default: labelEditor.type,
                    types: common.valueBindingTypes({ category: "value" })
                });
                labelInput.typedInput("type", labelEditor.type);
                labelInput.typedInput("value", labelEditor.value);

                // P98 / P130: Value typedInput — canonical P113 helper.
                // Migration: a legacy `valuePath` plain state path becomes a state binding.
                var storedValue = common.parseBindingValue(this.value);
                var valueBinding = storedValue
                    ? storedValue
                    : (this.valuePath ? { kind: "state", path: this.valuePath } : undefined);
                var valueEditor = common.readValueBinding(valueBinding, "");
                var valueInput = $("#node-input-valueBinding");
                valueInput.typedInput({
                    default: valueEditor.type,
                    types: common.valueBindingTypes({ category: "value" })
                });
                valueInput.typedInput("type", valueEditor.type);
                valueInput.typedInput("value", valueEditor.value);

                // P130 (ADR 0012 / boolean category): `disabled` typedInput — canonical P113 helper.
                // No legacy field to migrate (ui-datepicker had no dedicated disabled typedInput before P130).
                var storedDisabled = common.parseBindingValue(this.disabled);
                var disabledBinding = storedDisabled ? storedDisabled : undefined;
                var disabledEditor = common.readValueBinding(disabledBinding, "");
                var disabledInput = $("#node-input-disabledBinding");
                disabledInput.typedInput({
                    default: disabledEditor.type,
                    types: common.valueBindingTypes({ category: "boolean" })
                });
                disabledInput.typedInput("type", disabledEditor.type);
                disabledInput.typedInput("value", disabledEditor.value);
            },
            oneditsave: function () {
                // P130: persist label as binding object.
                this.label = common.applyValueBinding(
                    $("#node-input-labelBinding").typedInput("type"),
                    $("#node-input-labelBinding").typedInput("value")
                );

                // P130: persist value as binding object; clear legacy valuePath.
                this.value = common.applyValueBinding(
                    $("#node-input-valueBinding").typedInput("type"),
                    $("#node-input-valueBinding").typedInput("value")
                );
                this.valuePath = "";

                // P130: persist disabled as binding object.
                this.disabled = common.applyValueBinding(
                    $("#node-input-disabledBinding").typedInput("type"),
                    $("#node-input-disabledBinding").typedInput("value")
                );
            }
        });
    })();
</script>
<script type="text/html" data-template-name="ui-datepicker">
    <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
    <hr style="margin: 8px 0;">
    <div class="form-row"><label for="node-input-mount">Parent Slot</label><select id="node-input-mount"></select></div>
    <!-- P98 / P130: Label binding — typedInput managed in oneditprepare/oneditsave. -->
    <div class="form-row"><label for="node-input-labelBinding">Label</label><input type="text" id="node-input-labelBinding"></div>
    <!-- P98 / P130: Value binding — typedInput managed in oneditprepare/oneditsave. -->
    <div class="form-row"><label for="node-input-valueBinding">Value Path</label><input type="text" id="node-input-valueBinding"></div>
    <!-- P130 (ADR 0012 / boolean category): Disabled binding — typedInput managed in oneditprepare/oneditsave. -->
    <div class="form-row"><label for="node-input-disabledBinding">Disabled</label><input type="text" id="node-input-disabledBinding"></div>
    <div class="form-row">
        <label for="node-input-mode">Mode</label>
        <select id="node-input-mode">
            <option value="date">Date</option>
            <option value="datetime">Date &amp; Time</option>
            <option value="time">Time</option>
        </select>
    </div>
    <div class="form-row"><label for="node-input-min">Min</label><input type="text" id="node-input-min" placeholder="YYYY-MM-DD"></div>
    <div class="form-row"><label for="node-input-max">Max</label><input type="text" id="node-input-max" placeholder="YYYY-MM-DD"></div>
    <div class="form-row"><label for="node-input-placeholder">Placeholder</label><input type="text" id="node-input-placeholder"></div>
</script>
<script type="text/html" data-help-name="ui-datepicker">
<p>Datums- und Uhrzeiteingabe mit konfigurierbarem Modus (date, datetime, time). Rendert ein <code>sl-input</code>-Element (type="date", "datetime-local" oder "time").</p>
<h3>Label</h3>
<p>Beschriftung des Datepickers — bindbar: alle Binding-Arten (ADR 0012): Store, Query,
Route-Param, Reactive, msg, JSONata, string/boolean/number/json/timestamp,
Flow, Global, Env.</p>
<h3>Value Path</h3>
<p>Bindbare Quelle des Datumswerts als ISO-8601-String — alle Binding-Arten werden unterstützt.</p>
<h3>Disabled (P130)</h3>
<p>Bindbare Bedingung zum Deaktivieren des Datepickers (sperrt Nutzerinteraktion).
Boolean-Zustand-Satz (ADR 0012): Store, Query, Route-Param, Reactive, msg,
JSONata, boolean, Flow, Global, Env.</p>
<h3>Mode</h3>
<p>Eingabe-Modus: <b>Date</b> = nur Datum (YYYY-MM-DD), <b>Date &amp; Time</b> = Datum und Uhrzeit (YYYY-MM-DDTHH:mm), <b>Time</b> = nur Uhrzeit (HH:mm).</p>
<h3>Events</h3>
<p>Bei Nutzerinteraktion sendet der Knoten <code>{ event: "change", params: { value: string } }</code> auf dem Output-Port (ISO-8601-String je nach Modus).</p>
<p><a href="https://github.com/ollixx/node-red-contrib-webapp/blob/develop/docs/nodes/input/ui-datepicker.md">Ausführliche Dokumentation</a></p>
</script>
