<script type="text/javascript" src="resources/node-red-contrib-webapp/lib/editor-common.js"></script>
<script type="text/javascript">
    (function () {
        const common = window.WebappEditorCommon;

        // P222 (ADR 0015): common base fields. See the applicability table in
        // docs/nodes/concepts/editor.md. `omit` drops a field the node already
        // owns a dedicated control for (avoids duplicate #node-input carrier ids).
        const BASE_FIELDS = {
            visible: true,
            disabled: true,
            color: true,
            size: false,
            variant: false,
            advanced: ["size"],
            omit: [],
            i18nNode: "ui-tabs",
            hints: {
                size: "Dieser Knoten hat keine Größen-Stufen."
            }
        };
        common.registerNodeType("ui-tabs", {
            category: "webapp view",
            color: "#f4efcf",
            defaults: {
                visible: { value: null },
                visibleBinding: { value: "" },
                disabled: { value: null },
                disabledBinding: { value: "" },
                color: { value: null },
                colorBinding: { value: "" },
                name: { value: "" },
                app: { value: "" },
                mount: { value: "", required: true },
                // P155 (ADR 0012): `activeTab` (two-way value typedInput) persists the
                // binding OBJECT; there is no matching #node-input-activeTab element so
                // Node-RED auto-save cannot clobber it. The typedInput lives on
                // #node-input-activeTabBinding. Legacy `activeTabPath` (pre-P155 plain
                // state path) is kept for migration only.
                activeTab: { value: null },
                activeTabBinding: { value: "" },
                events: { value: "" },
                order: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                row: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                col: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                colSize: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                rowSize: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                layoutX: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                layoutY: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } }
            },
            // P229 (ADR 0038): migration-only legacy fields — injected as hidden
            // defaults at registration (see editor-common withMigrationDefaults);
            // migrated to the canonical binding on open, deleted on save.
            migrationFields: ["activeTabPath"],
            inputs: 1,
            outputs: 1,
            outputLabels: function () { return "event"; },
            icon: "font-awesome/fa-folder",
            label: common.labelWithName("ui-tabs"),
            onadd: function () {
                if (!this.name) {
                    this.name = common.getNextNameDefault("ui-tabs", "Tabs");
                }
            },
            oneditprepare: function () {
                common.installReferenceSelectors({ mount: true }).call(this);
                common.installBaseFields(BASE_FIELDS).call(this);
                common.installLayoutChildPropRows().call(this);

                // P155 (ADR 0012 / value category): `activeTab` typedInput — full
                // canonical set with literal default type `str` (a tab id). This is the
                // TWO-WAY input value: it reads the active tab from the bound Store/state
                // AND the tab-change event carries the chosen tab id for the wired
                // write-back loop. Migration: a legacy `activeTabPath` plain string
                // becomes a state binding; a stored `activeTab` binding wins.
                const storedActive = common.parseBindingValue(this.activeTab);
                const activeBinding = storedActive
                    ? storedActive
                    : (this.activeTabPath ? { kind: "state", path: this.activeTabPath } : undefined);
                const activeEditor = common.readValueBinding(activeBinding, "");
                const activeInput = $("#node-input-activeTabBinding");
                activeInput.typedInput({
                    default: activeEditor.type,
                    types: common.valueBindingTypes({ category: "value", currentKind: activeEditor.type })
                });
                activeInput.typedInput("type", activeEditor.type);
                activeInput.typedInput("value", activeEditor.value);
            },
            oneditsave: function () {
                common.applyBaseFields(BASE_FIELDS).call(this);
                // P155: persist activeTab as a binding object; clear the legacy path.
                this.activeTab = common.applyValueBinding(
                    $("#node-input-activeTabBinding").typedInput("type"),
                    $("#node-input-activeTabBinding").typedInput("value")
                );
                common.dropLegacyFields(this, ["activeTabPath"]);
            }
        });
    })();
</script>
<script type="text/html" data-template-name="ui-tabs">
    <div class="form-row"><label for="node-input-name" data-i18n="node-red:common.label.name">Name</label><input type="text" id="node-input-name"></div>
    <hr style="margin: 8px 0;">
    <div class="form-row"><label for="node-input-mount" data-i18n="ui-tabs.label.mount">Parent Slot</label><select id="node-input-mount"></select></div>
    <!-- P155 (ADR 0012 / value category): Active Tab binding (two-way) — typedInput managed in oneditprepare/oneditsave. -->
    <div class="form-row"><label for="node-input-activeTabBinding" data-i18n="ui-tabs.label.activeTab">Active Tab</label><input type="text" id="node-input-activeTabBinding"></div>
    <div class="form-tips" style="margin-top: 4px;">
        <b>P168 (ADR 0018):</b> Tabs werden aus den gemounteten <code>ui-tab</code>-Kindern
        abgeleitet — es gibt <b>kein</b> Tabs-JSON-Feld mehr. Lege je Tab einen
        <code>ui-tab</code> an und mounte ihn in dieses <code>ui-tabs</code>
        („Mounten in ui-tabs heißt: werde ein Tab"). Die Tab-IDs müssen eindeutig
        sein; <b>Active Tab</b> trägt die ID des aktiven Tabs.
    </div>
</script>

     keys resolved from nodes/view/locales/{en-US,de}/ui-tabs.json. No inline
