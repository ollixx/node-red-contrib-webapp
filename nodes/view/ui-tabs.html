<script type="text/javascript" src="resources/node-red-contrib-webapp/lib/editor-common.js"></script>
<script type="text/javascript">
    (function () {
        const common = window.WebappEditorCommon;
        common.registerNodeType("ui-tabs", {
            category: "webapp view",
            color: "#f4efcf",
            defaults: {
                name: { value: "" },
                uiId: { value: "", required: true },
                parent: { value: "" },
                mount: { value: "", required: true },
                tabs: { value: "" },
                activeTabPath: { value: "" },
                events: { value: "" },
                order: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                row: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                col: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                colSize: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                rowSize: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                layoutX: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                layoutY: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } }
            },
            inputs: 1,
            outputs: 1,
            icon: "font-awesome/fa-folder",
            label: common.labelWithName("ui-tabs"),
            onadd: function () {
                if (!this.name) {
                    this.name = common.getNextNameDefault("ui-tabs", "Tabs");
                }
            },
            oneditprepare: function () {
                common.installReferenceSelectors({ mount: true }).call(this);
                common.installLayoutChildPropRows().call(this);
            }
        });
    })();
</script>
<script type="text/html" data-template-name="ui-tabs">
    <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
    <div class="form-row"><label for="node-input-uiId">Node ID</label><input type="text" id="node-input-uiId"></div>
    <div class="form-row"><label for="node-input-mount">Parent Slot</label><select id="node-input-mount"></select></div>
    <div class="form-row"><label for="node-input-tabs">Tabs (JSON array)</label><input type="text" id="node-input-tabs" placeholder='[{"id":"tab1","label":"Tab 1"}]'></div>
    <div class="form-row"><label for="node-input-activeTabPath">Active Tab Path</label><input type="text" id="node-input-activeTabPath"></div>
    <div class="form-row" data-layout-child-prop-row="order" style="display: none;"><label for="node-input-order">Order</label><input type="number" id="node-input-order"></div>
    <div class="form-row" data-layout-child-prop-row="row" style="display: none;"><label for="node-input-row">Row</label><input type="number" id="node-input-row"></div>
    <div class="form-row" data-layout-child-prop-row="col" style="display: none;"><label for="node-input-col">Col</label><input type="number" id="node-input-col"></div>
    <div class="form-row" data-layout-child-prop-row="colSize" style="display: none;"><label for="node-input-colSize">Col Size</label><input type="number" id="node-input-colSize"></div>
    <div class="form-row" data-layout-child-prop-row="rowSize" style="display: none;"><label for="node-input-rowSize">Row Size</label><input type="number" id="node-input-rowSize"></div>
    <div class="form-row" data-layout-child-prop-row="layoutX" style="display: none;"><label for="node-input-layoutX">X</label><input type="number" id="node-input-layoutX"></div>
    <div class="form-row" data-layout-child-prop-row="layoutY" style="display: none;"><label for="node-input-layoutY">Y</label><input type="number" id="node-input-layoutY"></div>
</script>
<script type="text/html" data-help-name="ui-tabs"><p>Tab bar with one slot per tab for switching between views.</p></script>
