<script type="text/html" data-help-name="ui-radio">
<p>A radio-button group — exactly one option at a time — bound to client state in
both directions: <b>Value</b> reads, <b>Write To</b> writes.</p>
<h3>Key fields</h3>
<ul>
    <li><b>Options</b> — one field, two types (the same helper as <code>ui-select</code>): <code>json</code> (validated object, string array or <code>{label,value}</code> array) or <code>store</code> (reactive from a store path).</li>
    <li><b>Orientation</b> — <code>vertical</code> (stacked) or <code>horizontal</code>.</li>
    <li><b>Value</b> / <b>Write To</b> — the READ / WRITE halves (ADR 0027); Write To takes <code>store</code>/<code>flow</code>/<code>global</code> only.</li>
    <li><b>Write Trigger</b> — no submit gesture: always writes on <code>change</code>; only <code>none</code> disables the write-back.</li>
</ul>
<h3>Inputs</h3>
<p>Has an input port. <code>msg.payload</code> (non-null) sets the selected value;
<code>msg.ui.patch</code> overwrites definition fields (<code>options</code>,
<code>orientation</code>, …); <code>msg.ui.component.op</code> supports
<code>show</code>/<code>hide</code>, <code>enable</code>/<code>disable</code>,
<code>reset</code>. Anything else passes through unchanged.</p>
<h3>Outputs / Events</h3>
<p><code>change</code> with <code>msg.ui.params.value</code>. There is no
<code>submit</code> event.</p>

</script>
