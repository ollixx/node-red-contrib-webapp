<script type="text/html" data-help-name="ui-slider">
<p>A numeric slider bound to client state in both directions:
<b>Value</b> reads, <b>Write To</b> writes.</p>
<h3>Key fields</h3>
<ul>
    <li><b>Min</b> / <b>Max</b> / <b>Step</b> — the range and the increment (step must be positive); empty leaves the backend defaults.</li>
    <li><b>Show Value</b> — display the current number next to the handle.</li>
    <li><b>Label</b> — optional caption (bindable).</li>
    <li><b>Value</b> / <b>Write To</b> — the READ / WRITE halves (ADR 0027); Write To takes <code>store</code>/<code>flow</code>/<code>global</code> only.</li>
    <li><b>Write Trigger</b> — no submit gesture: always writes on <code>change</code> (while dragging); only <code>none</code> disables the write-back.</li>
</ul>
<h3>Inputs</h3>
<p>Has an input port. <code>msg.payload</code> (non-null) sets the value, clipped to
<code>min</code>/<code>max</code>; <code>msg.ui.patch</code> overwrites definition
fields (<code>min</code>, <code>max</code>, <code>step</code>, …);
<code>msg.ui.component.op</code> supports <code>show</code>/<code>hide</code>,
<code>enable</code>/<code>disable</code>, <code>reset</code>. Anything else passes
through unchanged.</p>
<h3>Outputs / Events</h3>
<p><code>change</code> with <code>msg.ui.params.value</code> (the number). There is
no <code>submit</code> event.</p>
<h3>Full docs</h3>
<p><a href="https://github.com/ollixx/node-red-contrib-webapp/blob/develop/docs/guide/nodes/ui-slider.md" target="_blank">docs/guide/nodes/ui-slider.md</a></p>
</script>
