<script type="text/html" data-help-name="ui-divider">
<p>Renders a visual divider line between content areas — horizontal or vertical,
with an optional centred label.</p>
<h3>Key fields</h3>
<ul>
    <li><b>Orientation</b> — <code>horizontal</code> (default) separates stacked
        content; <code>vertical</code> separates side-by-side content.</li>
    <li><b>Label</b> — optional text shown centred on the line (e.g. "Or");
        fully bindable (literal, store, state, query, …).</li>
    <li><b>Color</b> — line colour (bindable); empty uses the theme default.
        <b>Visible</b> — render gate: <code>false</code> hides the divider.
        <i>Disabled</i> and <i>Size</i> do not apply to a divider.</li>
</ul>
<h3>Inputs</h3>
<p>This node has <b>no input port</b> and receives no messages. It is driven
entirely by its configuration; bound fields (Label, Color, Visible) update live
through their bindings.</p>
<h3>Outputs / Events</h3>
<p>None — the divider is purely presentational and emits no events.</p>
<h3>Full docs</h3>
<p><a href="https://github.com/ollixx/node-red-contrib-webapp/blob/develop/docs/guide/nodes/ui-divider.md" target="_blank">docs/guide/nodes/ui-divider.md</a></p>
</script>
