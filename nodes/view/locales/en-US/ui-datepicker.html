<script type="text/html" data-help-name="ui-datepicker">
<p>A date / date-and-time / time field bound to client state in both directions:
<b>Value Path</b> reads, <b>Write To</b> writes. The value is always an ISO-8601
string.</p>
<h3>Key fields</h3>
<ul>
    <li><b>Mode</b> — <code>date</code> (<code>YYYY-MM-DD</code>), <code>datetime</code> (<code>YYYY-MM-DDTHH:mm</code>) or <code>time</code> (<code>HH:mm</code>).</li>
    <li><b>Min</b> / <b>Max</b> — earliest / latest allowed date (<code>YYYY-MM-DD</code>); outside days are disabled.</li>
    <li><b>Placeholder</b> — shown while nothing is picked (bindable).</li>
    <li><b>Value Path</b> / <b>Write To</b> — the READ / WRITE halves (ADR 0027); Write To takes <code>store</code>/<code>flow</code>/<code>global</code> only.</li>
    <li><b>Write Trigger</b> — this control is text-like, so the trigger applies: <code>submit</code> = Enter/blur, <code>change</code> = every pick, <code>none</code> = no write-back.</li>
</ul>
<h3>Inputs</h3>
<p>Has an input port. <code>msg.payload</code> (non-null, ISO-8601 string) sets the
value; <code>msg.ui.patch</code> overwrites definition fields (<code>min</code>,
<code>max</code>, <code>mode</code>, …); <code>msg.ui.component.op</code> supports
<code>show</code>/<code>hide</code>, <code>enable</code>/<code>disable</code>,
<code>reset</code>. Anything else passes through unchanged.</p>
<h3>Outputs / Events</h3>
<p><code>change</code> with <code>msg.ui.params.value</code> — the new ISO-8601
string in the shape of the selected mode.</p>
<h3>Full docs</h3>
<p><a href="https://github.com/ollixx/node-red-contrib-webapp/blob/develop/docs/guide/nodes/ui-datepicker.md" target="_blank">docs/guide/nodes/ui-datepicker.md</a></p>
</script>
