<script type="text/html" data-help-name="ui-avatar">
<p>Shows a user picture, or falls back to initials, then a generic icon. Purely
presentational.</p>
<h3>Key fields</h3>
<ul>
    <li><b>Image</b> — the avatar image source, fully bindable: a <b>URL</b>
        (literal/state/query/…), an <b>Asset</b> (managed medium when
        <code>ui-app.mediaStoreUrl</code> is set), a <b>Store</b> value, etc.</li>
    <li><b>Fallback Initials</b> — bindable initials (e.g. <code>JD</code>) shown
        when no image resolves.</li>
    <li><b>Fallback Icon</b> — a backend-neutral icon shown when neither resolves.</li>
    <li><b>Size</b> (xs…xl), <b>Shape</b> (circle/square), <b>Variant</b> (colour
        role; emitted as <code>data-variant</code> — sl-avatar has no native variant).</li>
</ul>
<h3>Inputs</h3>
<p>Has an input port. <code>msg.payload</code> (non-null) overrides
<code>src</code> and pushes to all clients; <code>msg.ui.component.op</code>
<code>show</code>/<code>hide</code> toggle visibility; <code>msg.ui.patch</code>
overrides fields. Foreign messages pass through unchanged.</p>
<h3>Outputs / Events</h3>
<p>None — no output port; purely presentational.</p>
<h3>Full docs</h3>
<p><a href="https://github.com/ollixx/node-red-contrib-webapp/blob/develop/docs/guide/nodes/ui-avatar.md" target="_blank">docs/guide/nodes/ui-avatar.md</a></p>
</script>
