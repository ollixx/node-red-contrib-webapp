<script type="text/html" data-help-name="ui-accordion-section">
<p>Eine einzelne Sektion innerhalb eines <code>ui-accordion</code> (ADR 0018). Die
Sektionen eines <code>ui-accordion</code> werden aus seinen
<code>ui-accordion-section</code>-Kindern abgeleitet — es gibt kein
Sections-JSON-Feld.</p>
<h3>Wichtige Felder</h3>
<ul>
    <li><b>Parent Slot</b> — in ein <code>ui-accordion</code> mounten heißt „werde
        eine Sektion". Die Knoten-ID ist der Sektions-Schlüssel (der
        <code>openSection</code>-Wert) und muss innerhalb eines ui-accordion
        eindeutig sein.</li>
    <li><b>Label</b> — der Sektions-Titel/die Summary, voll bindbar (Default-Typ
        string).</li>
    <li><b>Icon</b> — optionaler Icon-Name neben dem Label.</li>
    <li><b>Inhalt</b> — mounte Kinder in den <code>content</code>-Slot dieses
        Knotens; sie bilden das aufklappbare Panel.</li>
</ul>
<h3>Eingang</h3>
<p>Keiner — <code>ui-accordion-section</code> hat keinen Eingangs-Port. Der
Sektions-Wechsel und die <code>sectionOpen</code>/<code>sectionClose</code>-Events
liegen beim Parent <code>ui-accordion</code>.</p>
<h3>Ausgänge / Events</h3>
<p>Keine — kein Output-Port; ein reiner Struktur-/Container-Knoten.</p>

</script>
