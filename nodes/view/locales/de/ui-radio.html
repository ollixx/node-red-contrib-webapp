<script type="text/html" data-help-name="ui-radio">
<p>Eine Radio-Gruppe — immer genau eine Option — zweiseitig an den Client-State
gebunden: <b>Value</b> liest, <b>Write To</b> schreibt.</p>
<h3>Wichtige Felder</h3>
<ul>
    <li><b>Options</b> — ein Feld, zwei Typen (derselbe Helfer wie bei <code>ui-select</code>): <code>json</code> (validiertes Objekt, String-Array oder <code>{label,value}</code>-Array) oder <code>store</code> (reaktiv aus einem Store-Pfad).</li>
    <li><b>Orientation</b> — <code>vertical</code> (untereinander) oder <code>horizontal</code>.</li>
    <li><b>Value</b> / <b>Write To</b> — die LESE- / SCHREIB-Hälfte (ADR 0027); Write To nimmt nur <code>store</code>/<code>flow</code>/<code>global</code>.</li>
    <li><b>Write Trigger</b> — keine Submit-Geste: schreibt immer bei <code>change</code>; nur <code>none</code> schaltet den Write-Back ab.</li>
</ul>
<h3>Eingang</h3>
<p>Hat einen Eingangs-Port. <code>msg.payload</code> (nicht null) setzt den gewählten
Wert; <code>msg.ui.patch</code> überschreibt Definitionsfelder (<code>options</code>,
<code>orientation</code>, …); <code>msg.ui.component.op</code> unterstützt
<code>show</code>/<code>hide</code>, <code>enable</code>/<code>disable</code>,
<code>reset</code>. Alles andere wird unverändert durchgereicht.</p>
<h3>Ausgänge / Events</h3>
<p><code>change</code> mit <code>msg.ui.params.value</code>. Ein <code>submit</code>-Event
gibt es nicht.</p>

</script>
