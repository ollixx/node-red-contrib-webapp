<script type="text/html" data-help-name="ui-breadcrumb">
<p>Ein hierarchischer Navigationspfad. Jedes Element — auch das aktive — emittiert
ein <code>click</code>-Event (<code>msg.ui.params.action</code>).</p>
<h3>Wichtige Felder</h3>
<ul>
    <li><b>Items</b> — ein JSON-Array oder ein Binding. String-Items nutzen den
        String als Label und Action; Objekt-Items sind
        <code>{ "label", "action"?, "active"? }</code>.</li>
    <li><b>Mode</b> — <i>Items / Binding</i> oder <i>Child Nodes (Slots)</i>, wo
        gemountete Kinder zu Items werden.</li>
    <li><b>Separator</b> — überschreibt das native <code>/</code>-Trennzeichen.</li>
</ul>
<h3>Eingang</h3>
<p>Hat einen Eingangs-Port. <code>msg.payload</code> ersetzt die Items-Liste;
<code>msg.ui.patch</code> überschreibt Felder; <code>msg.ui.component.op</code>
<code>show</code>/<code>hide</code> steuern die Sichtbarkeit. Fachfremde Messages
werden unverändert durchgereicht.</p>
<h3>Ausgänge / Events</h3>
<p><code>click</code> bei jedem Item-Klick (kein <code>navigate</code>-Event) —
<code>params.action</code> trägt die Action oder das Label des Items. Verdrahte
es an eine <code>ui-action</code> zum Navigieren.</p>
<h3>Vollständige Doku</h3>

</script>
