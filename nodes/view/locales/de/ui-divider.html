<script type="text/html" data-help-name="ui-divider">
<p>Rendert eine visuelle Trennlinie zwischen Inhaltsbereichen — horizontal oder
vertikal, optional mit einem mittigen Label.</p>
<h3>Wichtige Felder</h3>
<ul>
    <li><b>Orientation</b> — <code>horizontal</code> (Default) trennt gestapelte
        Inhalte; <code>vertical</code> trennt nebeneinanderliegende Bereiche.</li>
    <li><b>Label</b> — optionaler Text mittig auf der Linie (z.&nbsp;B. „Oder");
        voll bindbar (Literal, Store, State, Query, …).</li>
    <li><b>Color</b> — Linienfarbe (bindbar); leer nutzt den Theme-Default.
        <b>Visible</b> — Render-Gate: <code>false</code> blendet den Trenner aus.
        <i>Disabled</i> und <i>Size</i> sind für einen Trenner nicht anwendbar.</li>
</ul>
<h3>Eingang</h3>
<p>Dieser Knoten hat <b>keinen Eingangs-Port</b> und empfängt keine Nachrichten.
Er wird ausschließlich über seine Konfiguration gesteuert; gebundene Felder
(Label, Color, Visible) aktualisieren sich live über ihre Bindings.</p>
<h3>Ausgänge / Events</h3>
<p>Keine — der Trenner ist rein darstellend und emittiert keine Events.</p>

</script>
