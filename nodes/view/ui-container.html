<script type="text/javascript" src="resources/node-red-contrib-webapp/lib/editor-common.js"></script>
<script type="text/javascript">
    (function () {
        const common = window.WebappEditorCommon;
        common.registerNodeType("ui-container", {
            category: "webapp view",
            color: "#f4efcf",
            defaults: {
                name: { value: "" },
                uiId: { value: "", required: true },
                mount: { value: "", required: true },
                layoutId: { value: "", required: true },
                order: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } }
            },
            inputs: 0,
            outputs: 1,
            icon: "font-awesome/fa-folder-open-o",
            label: common.labelWithName("ui-container"),
            oneditprepare: function () {
                common.installReferenceSelectors({ mount: true }).call(this);
                common.installLayoutSelector({
                    valueSelector: "#node-input-layoutId",
                    presetSelector: "#node-input-layout-preset",
                    customSelector: "#node-input-layout-custom",
                    customRowSelector: "#node-ui-container-custom-layout-row",
                    getValue: function () {
                        return this.layoutId;
                    },
                    customPlaceholder: "Child-Layout auswaehlen"
                }).call(this);
            }
        });
    })();
</script>
<script type="text/html" data-template-name="ui-container">
    <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
    <div class="form-row"><label for="node-input-uiId">Node ID</label><input type="text" id="node-input-uiId"></div>
    <div class="form-row"><label for="node-input-mount">Parent Slot</label><select id="node-input-mount"></select></div>
    <div class="form-tips">Waehlt den Slot, in den dieser Container gemountet wird.</div>
    <input type="hidden" id="node-input-layoutId">
    <div class="form-row"><label for="node-input-layout-preset">Child Layout</label><select id="node-input-layout-preset"></select></div>
    <div class="form-row" id="node-ui-container-custom-layout-row" style="display: none;"><label for="node-input-layout-custom">Custom Layout</label><select id="node-input-layout-custom"></select></div>
    <div class="form-tips">Dieses Child-Layout wird innerhalb des Containers gerendert.</div>
    <div class="form-row"><label for="node-input-order">Order</label><input type="number" id="node-input-order"></div>
</script>
<script type="text/html"
    data-help-name="ui-container"><p>Mountet einen benannten Container und rendert darin ein Child-Layout.</p></script>
