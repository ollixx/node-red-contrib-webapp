<script type="text/javascript" src="resources/node-red-contrib-webapp/lib/editor-common.js"></script>
<script type="text/javascript">
    (function () {
        const common = window.WebappEditorCommon;

        // P222 (ADR 0015): common base fields. See the applicability table in
        // docs/nodes/concepts/editor.md. `omit` drops a field the node already
        // owns a dedicated control for (avoids duplicate #node-input carrier ids).
        const BASE_FIELDS = {
            visible: true,
            disabled: false,
            color: true,
            size: false,
            variant: false,
            advanced: ["size"],
            omit: [],
            i18nNode: "ui-container",
            hints: {
                disabled: "Ein Container ist kein Steuerelement.",
                size: "Dieser Knoten hat keine Größen-Stufen."
            }
        };
        common.registerNodeTypeWithEvents("ui-container", {
            category: "webapp view",
            color: "#f4efcf",
            defaults: {
                visible: { value: null },
                visibleBinding: { value: "" },
                color: { value: null },
                colorBinding: { value: "" },
                name: { value: "" },
                app: { value: "" },
                mount: { value: "", required: true },
                // P259 (ADR 0038): canonical bare reference name `layout` (was
                // `layoutId`); the legacy value migrates on open→save.
                layout: { value: "", required: true, validate: common.validateRefWithLegacy("layoutId") },
                variant: { value: "card" },
                order: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                row: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                col: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                colSize: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                rowSize: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                layoutX: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                layoutY: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                events: { value: "[]" },
                outputs: { value: 0 }
            },
            inputs: 1,
            outputs: 0,
            outputLabels: function (index) {
                try {
                    const events = JSON.parse(this.events || "[]");
                    return events[index] || "";
                }
                catch (_e) {
                    return "";
                }
            },
            icon: "font-awesome/fa-folder-open-o",
            label: common.labelWithName("ui-container"),
            onadd: function () {
                if (!this.name) {
                    this.name = common.getNextNameDefault("ui-container", "Container");
                }
            },
            oneditsave: function () {
                common.applyBaseFields(BASE_FIELDS).call(this);
            },
            oneditprepare: function () {
                common.installReferenceSelectors({ mount: true }).call(this);
                common.installBaseFields(BASE_FIELDS).call(this);
                common.installVariantSelectBox("container").call(this);
                common.installLayoutChildPropRows().call(this);
                common.installLayoutSelector({
                    valueSelector: "#node-input-layout",
                    presetSelector: "#node-input-layout-preset",
                    getValue: function () {
                        return this.layout || this.layoutId;
                    }
                }).call(this);
            }
        }, ["onShow", "onHide"]);
    })();
</script>
<script type="text/html" data-template-name="ui-container">
    <div class="form-row"><label for="node-input-name" data-i18n="node-red:common.label.name">Name</label><input type="text" id="node-input-name"></div>
    <hr style="margin: 8px 0;">
    <div class="form-row"><label for="node-input-mount" data-i18n="ui-container.label.mount">Parent Slot</label><select id="node-input-mount"></select></div>
    <input type="hidden" id="node-input-layout">
    <div class="form-row"><label for="node-input-layout-preset" data-i18n="ui-container.label.layout">Child Layout</label><select id="node-input-layout-preset"></select></div>
    <input type="hidden" id="node-input-events">
    <input type="hidden" id="node-input-outputs">
    <div class="form-row"><label data-i18n="ui-container.label.events">Events</label></div>
    <div id="node-input-events-container"></div>
</script>
<!-- P269 (ADR 0042): help + labels are locale-migrated. Help lives in
     nodes/view/locales/{en-US,de}/ui-container.html; form-row labels carry data-i18n
     keys resolved from nodes/view/locales/{en-US,de}/ui-container.json. No inline
     data-help-name block here. -->
