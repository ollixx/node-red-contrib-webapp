<script type="text/javascript" src="resources/node-red-contrib-webapp/lib/editor-common.js"></script>
<script type="text/javascript">
    (function () {
        const common = window.WebappEditorCommon;

        // ADR 0015 base fields for ui-alert: `visible` is applicable (declarative
        // visibility via a boolean-state typedInput — the field that was missing);
        // `disabled` is N/A (an alert has no interactive disabled state); `color`
        // is N/A (the alert's colour comes from its `severity`); `size` is N/A.
        const BASE_FIELDS = {
            visible: true,
            disabled: false,
            color: false,
            size: false,
            variant: false,
            i18nNode: "ui-alert",
            hints: {
                disabled: "Eine Alert hat keinen interaktiven Deaktiviert-Zustand.",
                color: "Die Farbe der Alert kommt aus der Severity.",
                size: "Eine Alert hat keine Größen-Stufen."
            }
        };

        // P113 (ADR 0012 / ADR 0010): message and title are display-value bindings
        // driven by the ONE canonical value-binding type set. Type list AND
        // (de)serialisation come from the shared helper — Store, Query, Route-Param,
        // Reactive, msg, JSONata, str, num, bool, json, date, Flow, Global, Env.
        function applyBindingTypedInput(selector, binding, _literalLabel, _pickerTitle) {
            const editor = common.readValueBinding(binding, "");
            const input = $(selector);
            input.typedInput({ default: editor.type, types: common.valueBindingTypes({ currentKind: editor.type }) });
            input.typedInput("type", editor.type);
            input.typedInput("value", editor.value);
        }

        function readBinding(selector) {
            const input = $(selector);
            return common.applyValueBinding(input.typedInput("type"), input.typedInput("value"));
        }

        // P100: icon select value → stored icon field value.
        // "custom" in the select is a sentinel that means "use the custom icon
        // name in #node-input-icon-custom-name". All well-known sentinel values
        // ("", "none", "auto") are preserved as-is. Any other value stored in the
        // node's `icon` field (i.e. a plain icon name like "bell") maps to "custom"
        // in the select + the name in the text input.
        // Sentinel values that are NOT custom icon names.
        const ICON_KNOWN_SELECT_VALUES = ["", "none", "auto", "custom"];

        function iconSelectValueFromStored(stored) {
            // Both "" (legacy default) and "none" (explicit no-icon) map to the
            // "Kein Icon" select option (value "none"). "auto" passes through.
            // Anything else is a custom icon name → "custom" sentinel in the select.
            if (!stored || stored === "" || stored === "none") {
                return "none";
            }
            if (stored === "auto") {
                return "auto";
            }
            return "custom";
        }

        function iconCustomNameFromStored(stored) {
            if (!stored || ICON_KNOWN_SELECT_VALUES.indexOf(stored) !== -1) {
                return "";
            }
            return stored;
        }

        function updateIconCustomRow() {
            const val = $("#node-input-icon").val();
            if (val === "custom") {
                $("#node-input-icon-custom-row").show();
            } else {
                $("#node-input-icon-custom-row").hide();
            }
        }

        common.registerNodeType("ui-alert", {
            category: "webapp view",
            color: "#f4efcf",
            defaults: {
                name: { value: "" },
                app: { value: "" },
                mount: { value: "", required: true },
                // `message`/`title` persist the binding OBJECT and have NO matching
                // `#node-input-*` element, so Node-RED's post-oneditsave defaults
                // auto-read cannot clobber them (mirrors ui-text's text/value split).
                // The typedInput widgets live on the separate *Binding fields below.
                message: { value: { kind: "literal", value: "" } },
                messageBinding: { value: "" },
                // Legacy field — declared (DOM-less) so a pre-P67 node's value is
                // loaded into oneditprepare for the messagePath→state back-compat.
                severity: { value: "info" },
                // P90: icon — "auto" (severity-derived), "none" (no icon), or a
                // plain icon name string. Default "" means the field is absent
                // (no icon shown), matching the legacy behaviour before P90.
                icon: { value: "" },
                title: { value: null },
                titleBinding: { value: "" },
                dismissible: { value: false },
                // P91: duration (positive integer, ms) and countdown (boolean).
                // duration "" means no auto-hide (absent). Must be >= 1 if set.
                duration: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                // P100: countdown requires duration to be set (cross-field validation).
                // Use this.duration (stored node value) as primary source so the
                // validator works both during deploy (no DOM panel open) and in the
                // live editor (where #node-input-duration may or may not be rendered yet).
                countdown: { value: false, validate: function (value) {
                    if (value === true || value === "true") {
                        // Prefer the live DOM value (editor panel open); fall back to
                        // the stored node property (deploy / out-of-panel validation).
                        const domEl = document.getElementById("node-input-duration");
                        const dur = domEl ? domEl.value : (this.duration !== undefined ? String(this.duration) : "");
                        return dur !== "" && dur !== null && dur !== undefined && Number(dur) >= 1;
                    }
                    return true;
                } },
                // ADR 0015: `visible` base field — persists the binding OBJECT; the
                // typedInput lives on the `visibleBinding` carrier (no #node-input-visible
                // element) so Node-RED auto-save cannot clobber it. Installed via
                // installBaseFields / applyBaseFields below.
                visible: { value: null },
                visibleBinding: { value: "" },
                order: { value: "", validate: function (value) { return value == null || value === "" || RED.validators.number()(value); } },
                row: { value: "", validate: function (value) { return value == null || value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                col: { value: "", validate: function (value) { return value == null || value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                colSize: { value: "", validate: function (value) { return value == null || value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                rowSize: { value: "", validate: function (value) { return value == null || value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                layoutX: { value: "", validate: function (value) { return value == null || value === "" || RED.validators.number()(value); } },
                layoutY: { value: "", validate: function (value) { return value == null || value === "" || RED.validators.number()(value); } }
            },
            // P229 (ADR 0038): migration-only legacy fields — injected as hidden
            // defaults at registration (see editor-common withMigrationDefaults);
            // migrated to the canonical binding on open, deleted on save.
            migrationFields: ["messagePath"],
            inputs: 1,
            outputs: 1,
            icon: "font-awesome/fa-exclamation-circle",
            label: common.labelWithName("ui-alert"),
            onadd: function () {
                if (!this.name) {
                    this.name = common.getNextNameDefault("ui-alert", "Alert");
                }
            },
            oneditprepare: function () {
                common.installReferenceSelectors({ mount: true }).call(this);
                // ADR 0015: the shared base-field group ("Allgemein") — `visible`
                // (applicable) + disabled/color/size (N/A with hints). This is the
                // visibility field the node was missing.
                common.installBaseFields(BASE_FIELDS).call(this);
                common.installLayoutChildPropRows().call(this);

                // Back-compat: a legacy messagePath maps to a state binding. A node
                // saved before P67 has no `message` binding, so Node-RED fills the
                // default empty literal { kind:"literal", value:"" } — that must NOT
                // mask the messagePath fallback, so prefer messagePath when the stored
                // message is an empty literal.
                const parsedMessage = common.parseBindingValue(this.message);
                const messageIsEmptyLiteral = !!parsedMessage && parsedMessage.kind === "literal"
                    && (parsedMessage.value === undefined || parsedMessage.value === null || parsedMessage.value === "");
                const messageBinding = (parsedMessage && !messageIsEmptyLiteral)
                    ? parsedMessage
                    : (this.messagePath ? { kind: "state", path: this.messagePath } : parsedMessage);
                applyBindingTypedInput("#node-input-messageBinding", messageBinding, "Message", "Store für Message auswählen");

                const titleBinding = typeof this.title === "string"
                    ? (this.title.length > 0 ? { kind: "literal", value: this.title } : undefined)
                    : common.parseBindingValue(this.title);
                applyBindingTypedInput("#node-input-titleBinding", titleBinding, "Title", "Store für Title auswählen");

                // P100: icon select — "custom" is the sentinel for a user-supplied icon name.
                // Populate the select and custom-name text input from the stored icon value.
                const storedIcon = this.icon || "";
                const selectVal = iconSelectValueFromStored(storedIcon);
                const customName = iconCustomNameFromStored(storedIcon);
                $("#node-input-icon").val(selectVal);
                $("#node-input-icon-custom-name").val(customName);
                updateIconCustomRow();
                $("#node-input-icon").on("change", updateIconCustomRow);

                // Wire the "Icon auswählen" button to the icon picker dialog.
                $("#node-input-icon-custom-btn").on("click", function (e) {
                    e.preventDefault();
                    common.openIconPickerDialog({
                        title: "Icon auswählen",
                        value: $("#node-input-icon-custom-name").val(),
                        onSelect: function (value) {
                            $("#node-input-icon-custom-name").val(value).trigger("change");
                        }
                    });
                });
            },
            oneditsave: function () {
                // ADR 0015: persist the applicable base fields (visible) as binding objects.
                common.applyBaseFields(BASE_FIELDS).call(this);

                this.message = readBinding("#node-input-messageBinding");
                common.dropLegacyFields(this, ["messagePath"]);
                const titleBinding = readBinding("#node-input-titleBinding");
                const isEmptyLiteral = titleBinding.kind === "literal"
                    && (titleBinding.value === undefined || titleBinding.value === null || titleBinding.value === "");
                this.title = isEmptyLiteral ? null : titleBinding;

                // P100: icon — resolve select value + optional custom name back to the
                // stored `icon` field. "custom" + name → name; otherwise use select value.
                const iconSelectVal = $("#node-input-icon").val() || "";
                if (iconSelectVal === "custom") {
                    this.icon = String($("#node-input-icon-custom-name").val() || "");
                } else {
                    this.icon = iconSelectVal;
                }
            }
        });
    })();
</script>
<script type="text/html" data-template-name="ui-alert">
    <div class="form-row"><label for="node-input-name" data-i18n="node-red:common.label.name">Name</label><input type="text" id="node-input-name"></div>
    <hr style="margin: 8px 0;">
    <div class="form-row"><label for="node-input-mount" data-i18n="ui-alert.label.mount">Parent Slot</label><select id="node-input-mount"></select></div>
    <!-- P100: Title above Message (acceptance #4) -->
    <div class="form-row"><label for="node-input-titleBinding" data-i18n="ui-alert.label.title">Title</label><input type="text" id="node-input-titleBinding"></div>
    <div class="form-row"><label for="node-input-messageBinding" data-i18n="ui-alert.label.message">Message</label><input type="text" id="node-input-messageBinding"></div>
    <!-- P100: separator after Message (acceptance #4) -->
    <hr style="margin: 8px 0;">
    <div class="form-row"><label for="node-input-severity" data-i18n="ui-alert.label.severity">Severity</label>
        <select id="node-input-severity">
            <option value="primary" data-i18n="ui-alert.option.severity.primary">Primary</option>
            <option value="info" data-i18n="ui-alert.option.severity.info">Info</option>
            <option value="success" data-i18n="ui-alert.option.severity.success">Success</option>
            <option value="warning" data-i18n="ui-alert.option.severity.warning">Warning</option>
            <option value="danger" data-i18n="ui-alert.option.severity.danger">Danger</option>
            <option value="neutral" data-i18n="ui-alert.option.severity.neutral">Neutral</option>
        </select>
    </div>
    <!-- P100: icon select — "custom" replaces the nonsensical double empty/"none" options (acceptance #5).
         selectOptionValues() filters empty-string options, so the visible sentinel for "no icon" uses "none".
         "custom" is the sentinel that reveals the icon-picker row. -->
    <div class="form-row"><label for="node-input-icon" data-i18n="ui-alert.label.icon">Icon</label>
        <select id="node-input-icon">
            <option value="none" data-i18n="ui-alert.option.icon.none">Kein Icon</option>
            <option value="auto" data-i18n="ui-alert.option.icon.auto">Automatisch (nach Severity)</option>
            <option value="custom" data-i18n="ui-alert.option.icon.custom">Custom …</option>
        </select>
    </div>
    <!-- P100: custom icon row — shown only when "Custom" is selected (acceptance #5) -->
    <div class="form-row" id="node-input-icon-custom-row" style="display:none; margin-left:105px;">
        <input type="text" id="node-input-icon-custom-name" placeholder="Icon-Name, z. B. bell" data-i18n="[placeholder]ui-alert.placeholder.iconCustomName" style="width:140px;">
        <button type="button" id="node-input-icon-custom-btn" class="red-ui-button" style="margin-left:6px;">Icon auswählen</button>
    </div>
    <div class="form-row"><label for="node-input-dismissible" data-i18n="ui-alert.label.dismissible">Dismissible</label><input type="checkbox" id="node-input-dismissible" style="width:auto"></div>
    <div class="form-row">
        <label for="node-input-duration" data-i18n="ui-alert.label.duration">Duration (ms)</label>
        <input type="number" id="node-input-duration" placeholder="leer = kein Auto-Hide" data-i18n="[placeholder]ui-alert.placeholder.duration" min="1" step="1" style="width:120px;">
        <input type="checkbox" id="node-input-countdown" style="width:auto; margin-left:8px;"> <label for="node-input-countdown" data-i18n="ui-alert.label.countdown" style="width:auto; margin-left:2px; font-weight:normal;">Countdown</label>
    </div>
</script>
<!-- P270 (ADR 0042): help + labels are locale-migrated. Help lives in
     nodes/view/locales/{en-US,de}/ui-alert.html; form-row labels carry data-i18n
     keys resolved from nodes/view/locales/{en-US,de}/ui-alert.json. No inline
     data-help-name block here. -->
