<script type="text/javascript" src="resources/node-red-contrib-webapp/lib/editor-common.js"></script>
<script type="text/javascript">
    (function () {
        const common = window.WebappEditorCommon;
        common.registerNodeType("ui-alert", {
            category: "webapp view",
            color: "#f4efcf",
            defaults: {
                name: { value: "" },
                parent: { value: "" },
                mount: { value: "", required: true },
                messagePath: { value: "" },
                message: { value: null },
                severity: { value: "info" },
                title: { value: "" },
                dismissible: { value: false },
                visible: { value: null },
                order: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                row: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                col: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                colSize: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                rowSize: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                layoutX: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                layoutY: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } }
            },
            inputs: 1,
            outputs: 1,
            icon: "font-awesome/fa-exclamation-circle",
            label: common.labelWithName("ui-alert"),
            onadd: function () {
                if (!this.name) {
                    this.name = common.getNextNameDefault("ui-alert", "Alert");
                }
            },
            oneditprepare: function () {
                common.installReferenceSelectors({ mount: true }).call(this);
                common.installLayoutChildPropRows().call(this);
            }
        });
    })();
</script>
<script type="text/html" data-template-name="ui-alert">
    <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
    <hr style="margin: 8px 0;">
    <div class="form-row"><label for="node-input-mount">Parent Slot</label><select id="node-input-mount"></select></div>
    <div class="form-row"><label for="node-input-messagePath">Message Path</label><input type="text" id="node-input-messagePath"></div>
    <div class="form-row"><label for="node-input-severity">Severity</label>
        <select id="node-input-severity">
            <option value="info">Info</option>
            <option value="warning">Warning</option>
            <option value="error">Error</option>
            <option value="success">Success</option>
        </select>
    </div>
    <div class="form-row"><label for="node-input-title">Title</label><input type="text" id="node-input-title"></div>
    <div class="form-row"><label for="node-input-dismissible">Dismissible</label><input type="checkbox" id="node-input-dismissible" style="width:auto"></div>
</script>
<script type="text/html" data-help-name="ui-alert"><p>Farbige Hinweisleiste für Info-, Warn-, Fehler- oder Erfolgsmeldungen.</p></script>
