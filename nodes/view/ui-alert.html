<script type="text/javascript" src="resources/node-red-contrib-webapp/lib/editor-common.js"></script>
<script type="text/javascript">
    (function () {
        const common = window.WebappEditorCommon;

        // P67: message and title are bindings driven by a typedInput (mirrors
        // ui-text). Both support literal/state/query/routeParam/msg/flow/global/
        // jsonata/env PLUS the new `store` type (filterable picker via P68).
        function applyBindingTypedInput(selector, binding, literalLabel, pickerTitle) {
            const editor = common.bindingValueForEditor(binding, "");
            const input = $(selector);
            const types = common.bindingTypedInputTypes({ literalLabel: literalLabel });
            // Override the store type's picker title for this field.
            for (let i = 0; i < types.length; i += 1) {
                if (types[i] && types[i].value === "store") {
                    types[i] = common.storeTypedInputType({ label: "Store", pickerTitle: pickerTitle });
                }
            }
            input.typedInput({ default: editor.type, types: types });
            input.typedInput("type", editor.type);
            input.typedInput("value", editor.value);
        }

        function readBinding(selector) {
            const input = $(selector);
            const type = input.typedInput("type");
            const value = input.typedInput("value");

            if (type === "literal") {
                return { kind: "literal", value: value };
            }

            // All dynamic types (state/query/routeParam/msg/flow/global/jsonata/
            // env/store) serialise as { kind, path }. For `store`, path is the
            // referenced ui-store id.
            return { kind: type, path: value };
        }

        common.registerNodeType("ui-alert", {
            category: "webapp view",
            color: "#f4efcf",
            defaults: {
                name: { value: "" },
                parent: { value: "" },
                mount: { value: "", required: true },
                // `message`/`title` persist the binding OBJECT and have NO matching
                // `#node-input-*` element, so Node-RED's post-oneditsave defaults
                // auto-read cannot clobber them (mirrors ui-text's text/value split).
                // The typedInput widgets live on the separate *Binding fields below.
                message: { value: { kind: "literal", value: "" } },
                messageBinding: { value: "" },
                // Legacy field — declared (DOM-less) so a pre-P67 node's value is
                // loaded into oneditprepare for the messagePath→state back-compat.
                messagePath: { value: "" },
                severity: { value: "info" },
                // P90: icon — "auto" (severity-derived), "none" (no icon), or a
                // plain icon name string. Default "" means the field is absent
                // (no icon shown), matching the legacy behaviour before P90.
                icon: { value: "" },
                title: { value: null },
                titleBinding: { value: "" },
                dismissible: { value: false },
                // P91: duration (positive integer, ms) and countdown (boolean).
                // duration "" means no auto-hide (absent). Must be >= 1 if set.
                duration: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                countdown: { value: false },
                visible: { value: null },
                order: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                row: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                col: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                colSize: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                rowSize: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                layoutX: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                layoutY: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } }
            },
            inputs: 1,
            outputs: 1,
            icon: "font-awesome/fa-exclamation-circle",
            label: common.labelWithName("ui-alert"),
            onadd: function () {
                if (!this.name) {
                    this.name = common.getNextNameDefault("ui-alert", "Alert");
                }
            },
            oneditprepare: function () {
                common.installReferenceSelectors({ mount: true }).call(this);
                common.installLayoutChildPropRows().call(this);

                // Back-compat: a legacy messagePath maps to a state binding. A node
                // saved before P67 has no `message` binding, so Node-RED fills the
                // default empty literal { kind:"literal", value:"" } — that must NOT
                // mask the messagePath fallback, so prefer messagePath when the stored
                // message is an empty literal.
                const parsedMessage = common.parseBindingValue(this.message);
                const messageIsEmptyLiteral = !!parsedMessage && parsedMessage.kind === "literal"
                    && (parsedMessage.value === undefined || parsedMessage.value === null || parsedMessage.value === "");
                const messageBinding = (parsedMessage && !messageIsEmptyLiteral)
                    ? parsedMessage
                    : (this.messagePath ? { kind: "state", path: this.messagePath } : parsedMessage);
                applyBindingTypedInput("#node-input-messageBinding", messageBinding, "Message", "Store für Message auswählen");

                const titleBinding = typeof this.title === "string"
                    ? (this.title.length > 0 ? { kind: "literal", value: this.title } : undefined)
                    : common.parseBindingValue(this.title);
                applyBindingTypedInput("#node-input-titleBinding", titleBinding, "Title", "Store für Title auswählen");
            },
            oneditsave: function () {
                this.message = readBinding("#node-input-messageBinding");
                this.messagePath = "";

                const titleBinding = readBinding("#node-input-titleBinding");
                const isEmptyLiteral = titleBinding.kind === "literal"
                    && (titleBinding.value === undefined || titleBinding.value === null || titleBinding.value === "");
                this.title = isEmptyLiteral ? null : titleBinding;
            }
        });
    })();
</script>
<script type="text/html" data-template-name="ui-alert">
    <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
    <hr style="margin: 8px 0;">
    <div class="form-row"><label for="node-input-mount">Parent Slot</label><select id="node-input-mount"></select></div>
    <div class="form-row"><label for="node-input-messageBinding">Message</label><input type="text" id="node-input-messageBinding"></div>
    <div class="form-row"><label for="node-input-severity">Severity</label>
        <select id="node-input-severity">
            <option value="primary">Primary</option>
            <option value="info">Info</option>
            <option value="success">Success</option>
            <option value="warning">Warning</option>
            <option value="danger">Danger</option>
            <option value="neutral">Neutral</option>
        </select>
    </div>
    <div class="form-row"><label for="node-input-icon">Icon</label>
        <select id="node-input-icon">
            <option value="">Kein Icon</option>
            <option value="auto">Automatisch (nach Severity)</option>
            <option value="none">Kein Icon (explizit)</option>
            <option value="info-circle">info-circle</option>
            <option value="check-circle">check-circle</option>
            <option value="exclamation-triangle">exclamation-triangle</option>
            <option value="x-circle">x-circle</option>
            <option value="circle">circle</option>
            <option value="bell">bell</option>
            <option value="star">star</option>
        </select>
    </div>
    <div class="form-row"><label for="node-input-titleBinding">Title</label><input type="text" id="node-input-titleBinding"></div>
    <div class="form-row"><label for="node-input-dismissible">Dismissible</label><input type="checkbox" id="node-input-dismissible" style="width:auto"></div>
    <div class="form-row">
        <label for="node-input-duration">Duration (ms)</label>
        <input type="number" id="node-input-duration" placeholder="leer = kein Auto-Hide" min="1" step="1" style="width:120px;">
        <input type="checkbox" id="node-input-countdown" style="width:auto; margin-left:8px;"> <label for="node-input-countdown" style="width:auto; margin-left:2px; font-weight:normal;">Countdown</label>
    </div>
</script>
<script type="text/html" data-help-name="ui-alert">
<p>Farbige Hinweisleiste für Info-, Warn-, Fehler- oder Erfolgsmeldungen. Message und Title sind vollständig bindbar; der Knoten hat einen Input-Port für Push-Updates und einen Output-Port für das Dismiss-Ereignis.</p>
<h3>Message- und Title-Bindung</h3>
<p>Message und Title sind voll bindbar (wie ui-text): literal/state/query/routeParam/msg/flow/global/jsonata/env sowie <b>Store</b>.</p>
<ul>
  <li><b>Store</b> — referenziert einen ui-store-Knoten derselben App; der Wert wird zur Laufzeit über dessen statePath aufgelöst. Über die Liste filter-/durchsuchbar auswählen.</li>
  <li><b>msg</b> — Text kommt aus der eingehenden Node-RED-Message (wiring-first).</li>
</ul>
<h3>Icon</h3>
<p><b>Automatisch (nach Severity)</b> — wählt passend zur Severity ein Bootstrap-Icon: info-circle (primary/info), check-circle (success), exclamation-triangle (warning), x-circle (danger), circle (neutral).</p>
<p><b>Kein Icon</b> (leer oder explizit) — die Alert wird ohne Icon gerendert.</p>
<p>Ein beliebiger Icon-Name aus dem registrierten Shoelace-Icon-Set kann eingetragen werden.</p>
<h3>Duration und Countdown</h3>
<p><b>Duration</b> (positiver Integer, Millisekunden) — die Alert blendet sich nach der angegebenen Zeit automatisch aus. Leer lassen = kein Auto-Hide.</p>
<p><b>Countdown</b> — zeigt einen Fortschrittsbalken, der die verbleibende Zeit anzeigt. Nur sinnvoll in Kombination mit einer Duration.</p>
<p><em>Hinweis (backend-neutral):</em> Das Shoelace-Backend unterstützt Duration und Countdown nativ über die <code>duration</code>- und <code>countdown="ltr"</code>-Attribute. Andere Backends ohne native Unterstützung können einen JavaScript-Fallback einsetzen (Timeout-basiertes Auto-Hide; CSS-Animation für den Countdown — analog dem Bootstrap-Doku-Beispiel). Das Feld ist bewusst offen für weitere Backends definiert.</p>
<p>Ausführliche Dokumentation: <a href="https://github.com/ollixx/node-red-contrib-webapp/blob/develop/docs/nodes/feedback/ui-alert.md" target="_blank">ui-alert.md</a></p>
</script>
