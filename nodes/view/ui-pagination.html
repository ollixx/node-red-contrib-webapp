<script type="text/javascript" src="resources/node-red-contrib-webapp/lib/editor-common.js"></script>
<script type="text/javascript">
    (function () {
        const common = window.WebappEditorCommon;

        // P222 (ADR 0015): common base fields. See the applicability table in
        // docs/nodes/concepts/editor.md. `omit` drops a field the node already
        // owns a dedicated control for (avoids duplicate #node-input carrier ids).
        const BASE_FIELDS = {
            visible: true,
            disabled: true,
            color: true,
            size: false,
            variant: false,
            advanced: ["size"],
            omit: [],
            i18nNode: "ui-pagination",
            hints: {
                size: "Dieser Knoten hat keine Größen-Stufen."
            }
        };
        common.registerNodeType("ui-pagination", {
            category: "webapp view",
            color: "#f4efcf",
            defaults: {
                visible: { value: null },
                visibleBinding: { value: "" },
                disabled: { value: null },
                disabledBinding: { value: "" },
                color: { value: null },
                colorBinding: { value: "" },
                name: { value: "" },
                app: { value: "" },
                mount: { value: "", required: true },
                // P154 (ADR 0012): `total` (read-only) and `currentPage` (two-way)
                // persist the binding OBJECT; there is no matching #node-input-total /
                // #node-input-currentPage element so Node-RED auto-save cannot clobber
                // them. The typedInputs live on #node-input-totalBinding /
                // #node-input-currentPageBinding. Legacy `totalPath` / `currentPagePath`
                // (pre-P154 plain state paths) are kept for migration only.
                total: { value: null },
                currentPage: { value: null },
                totalBinding: { value: "" },
                currentPageBinding: { value: "" },
                pageSize: { value: "" },
                // P252: `showInfo` toggles the info-text region ("Seite X von Y")
                // rendered below the prev/next controls. Plain boolean checkbox.
                showInfo: { value: false },
                events: { value: "" },
                order: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                row: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                col: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                colSize: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                rowSize: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                layoutX: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                layoutY: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } }
            },
            // P229 (ADR 0038): migration-only legacy fields — injected as hidden
            // defaults at registration (see editor-common withMigrationDefaults);
            // migrated to the canonical binding on open, deleted on save.
            migrationFields: ["totalPath", "currentPagePath"],
            inputs: 1,
            outputs: 1,
            outputLabels: function () { return "event"; },
            icon: "font-awesome/fa-ellipsis-h",
            label: common.labelWithName("ui-pagination"),
            onadd: function () {
                if (!this.name) {
                    this.name = common.getNextNameDefault("ui-pagination", "Pagination");
                }
            },
            oneditprepare: function () {
                common.installReferenceSelectors({ mount: true }).call(this);
                common.installBaseFields(BASE_FIELDS).call(this);
                common.installLayoutChildPropRows().call(this);

                // P154 (ADR 0012 / value category): `currentPage` typedInput — full
                // canonical set with literal default type `num` (a 1-based page index).
                // This is the TWO-WAY input value: it reads the live page from the
                // bound Store/state AND the change-event carries the new page for the
                // wired write-back loop. Migration: a legacy `currentPagePath` plain
                // string becomes a state binding; a stored `currentPage` binding wins.
                const storedCurrent = common.parseBindingValue(this.currentPage);
                const currentBinding = storedCurrent
                    ? storedCurrent
                    : (this.currentPagePath ? { kind: "state", path: this.currentPagePath } : undefined);
                const currentEditor = common.readValueBinding(currentBinding, "");
                const currentDefaultType = currentEditor.type !== "str" ? currentEditor.type : "num";
                const currentInput = $("#node-input-currentPageBinding");
                currentInput.typedInput({
                    default: currentDefaultType,
                    types: common.valueBindingTypes({ category: "value", currentKind: currentEditor.type })
                });
                currentInput.typedInput("type", currentEditor.type !== "str" || currentBinding ? currentEditor.type : "num");
                currentInput.typedInput("value", currentEditor.value);

                // P154 (ADR 0012 / value category): `total` typedInput — full canonical
                // set with literal default type `num` (the total page count). READ-ONLY
                // source. Migration: a legacy `totalPath` plain string becomes a state
                // binding; a stored `total` binding wins.
                const storedTotal = common.parseBindingValue(this.total);
                const totalBinding = storedTotal
                    ? storedTotal
                    : (this.totalPath ? { kind: "state", path: this.totalPath } : undefined);
                const totalEditor = common.readValueBinding(totalBinding, "");
                const totalDefaultType = totalEditor.type !== "str" ? totalEditor.type : "num";
                const totalInput = $("#node-input-totalBinding");
                totalInput.typedInput({
                    default: totalDefaultType,
                    types: common.valueBindingTypes({ category: "value", currentKind: totalEditor.type })
                });
                totalInput.typedInput("type", totalEditor.type !== "str" || totalBinding ? totalEditor.type : "num");
                totalInput.typedInput("value", totalEditor.value);
            },
            oneditsave: function () {
                common.applyBaseFields(BASE_FIELDS).call(this);
                // P154: persist currentPage/total as binding objects; clear legacy paths.
                this.currentPage = common.applyValueBinding(
                    $("#node-input-currentPageBinding").typedInput("type"),
                    $("#node-input-currentPageBinding").typedInput("value")
                );
                common.dropLegacyFields(this, ["currentPagePath"]);
                this.total = common.applyValueBinding(
                    $("#node-input-totalBinding").typedInput("type"),
                    $("#node-input-totalBinding").typedInput("value")
                );
                common.dropLegacyFields(this, ["totalPath"]);
            }
        });
    })();
</script>
<script type="text/html" data-template-name="ui-pagination">
    <div class="form-row"><label for="node-input-name" data-i18n="node-red:common.label.name">Name</label><input type="text" id="node-input-name"></div>
    <hr style="margin: 8px 0;">
    <div class="form-row"><label for="node-input-mount" data-i18n="ui-pagination.label.mount">Parent Slot</label><select id="node-input-mount"></select></div>
    <!-- P154 (ADR 0012 / value category): Current Page binding (two-way) — typedInput managed in oneditprepare/oneditsave. -->
    <div class="form-row"><label for="node-input-currentPageBinding" data-i18n="ui-pagination.label.currentPage">Current Page</label><input type="text" id="node-input-currentPageBinding"></div>
    <!-- P154 (ADR 0012 / value category): Total (page count) binding (read-only) — typedInput managed in oneditprepare/oneditsave. -->
    <div class="form-row"><label for="node-input-totalBinding" data-i18n="ui-pagination.label.total">Total</label><input type="text" id="node-input-totalBinding"></div>
    <div class="form-row"><label for="node-input-pageSize" data-i18n="ui-pagination.label.pageSize">Page Size</label><input type="number" id="node-input-pageSize" placeholder="10" data-i18n="[placeholder]ui-pagination.placeholder.pageSize"></div>
    <!-- P252: showInfo — toggles the "Seite X von Y" info-text region below the controls. -->
    <div class="form-row"><label for="node-input-showInfo" data-i18n="ui-pagination.label.showInfo">Info-Zeile</label><input type="checkbox" id="node-input-showInfo" style="width:auto"></div>
</script>
<!-- P271 (ADR 0042): help + labels are locale-migrated. Help lives in
     nodes/view/locales/{en-US,de}/ui-pagination.html; form-row labels carry
     data-i18n keys resolved from nodes/view/locales/{en-US,de}/ui-pagination.json.
     No inline data-help-name block here. -->
