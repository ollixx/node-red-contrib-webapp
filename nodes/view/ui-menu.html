<script type="text/javascript" src="resources/node-red-contrib-webapp/lib/editor-common.js"></script>
<script type="text/javascript">
    (function () {
        const common = window.WebappEditorCommon;

        // P222 (ADR 0015): common base fields. See the applicability table in
        // docs/nodes/concepts/editor.md. `omit` drops a field the node already
        // owns a dedicated control for (avoids duplicate #node-input carrier ids).
        const BASE_FIELDS = {
            visible: true,
            disabled: true,
            color: true,
            size: false,
            variant: false,
            advanced: ["size"],
            omit: [],
            hints: {
                size: "Dieser Knoten hat keine Größen-Stufen."
            }
        };
        common.registerNodeType("ui-menu", {
            category: "webapp view",
            color: "#f4efcf",
            defaults: {
                visible: { value: null },
                visibleBinding: { value: "" },
                disabled: { value: null },
                disabledBinding: { value: "" },
                color: { value: null },
                colorBinding: { value: "" },
                name: { value: "" },
                app: { value: "" },
                mount: { value: "", required: true },
                displayType: { value: "sidebar" },
                // P157 (ADR 0012): `items` (structural array source) and `activeRoute`
                // (read-only active route) persist the binding OBJECT; there is no
                // matching #node-input-items / #node-input-activeRoute element so
                // Node-RED auto-save cannot clobber them. The typedInputs live on
                // #node-input-itemsBinding / #node-input-activeRouteBinding. Legacy
                // `itemsPath` / `activeRoutePath` plain state paths are kept for
                // migration only.
                items: { value: null },
                activeRoute: { value: null },
                itemsBinding: { value: "" },
                activeRouteBinding: { value: "" },
                order: { value: "", validate: function (value) { return value == null || value === "" || RED.validators.number()(value); } },
                row: { value: "", validate: function (value) { return value == null || value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                col: { value: "", validate: function (value) { return value == null || value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                colSize: { value: "", validate: function (value) { return value == null || value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                rowSize: { value: "", validate: function (value) { return value == null || value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                layoutX: { value: "", validate: function (value) { return value == null || value === "" || RED.validators.number()(value); } },
                layoutY: { value: "", validate: function (value) { return value == null || value === "" || RED.validators.number()(value); } }
            },
            // P229 (ADR 0038): migration-only legacy fields — injected as hidden
            // defaults at registration (see editor-common withMigrationDefaults);
            // migrated to the canonical binding on open, deleted on save.
            migrationFields: ["itemsPath", "activeRoutePath"],
            inputs: 1,
            outputs: 1,
            icon: "font-awesome/fa-bars",
            label: common.labelWithName("ui-menu"),
            onadd: function () {
                if (!this.name) {
                    this.name = common.getNextNameDefault("ui-menu", "Menu");
                }
            },
            oneditprepare: function () {
                common.installReferenceSelectors({ mount: true }).call(this);
                common.installBaseFields(BASE_FIELDS).call(this);
                common.installLayoutChildPropRows().call(this);

                // P157 (ADR 0012 / value category): `items` typedInput — full
                // canonical value set with a JSON-literal default type (the menu
                // items array). STRUCTURAL array source: a Store/Query/Reactive
                // binding reads the items reactively; the json type holds a static
                // array literal. Migration: a legacy `itemsPath` plain string opens
                // as a `state` binding; a stored `items` binding object wins.
                const storedItems = common.parseBindingValue(this.items);
                const itemsBinding = storedItems
                    ? storedItems
                    : (this.itemsPath ? { kind: "state", path: this.itemsPath } : undefined);
                const itemsEditor = common.readValueBinding(itemsBinding, "");
                const itemsDefaultType = itemsEditor.type !== "str" ? itemsEditor.type : "json";
                const itemsInput = $("#node-input-itemsBinding");
                itemsInput.typedInput({
                    default: itemsDefaultType,
                    types: common.valueBindingTypes({ category: "value", currentKind: itemsEditor.type })
                });
                itemsInput.typedInput("type", itemsEditor.type !== "str" || itemsBinding ? itemsEditor.type : "json");
                itemsInput.typedInput("value", itemsEditor.value);

                // P157 (ADR 0012 / value category): `activeRoute` typedInput — full
                // canonical value set (read-only display value; typically routeParam/
                // store). Migration: a legacy `activeRoutePath` plain string opens as
                // a `state` binding; a stored `activeRoute` binding object wins.
                const storedActive = common.parseBindingValue(this.activeRoute);
                const activeBinding = storedActive
                    ? storedActive
                    : (this.activeRoutePath ? { kind: "state", path: this.activeRoutePath } : undefined);
                const activeEditor = common.readValueBinding(activeBinding, "");
                const activeInput = $("#node-input-activeRouteBinding");
                activeInput.typedInput({
                    default: activeEditor.type,
                    types: common.valueBindingTypes({ category: "value", currentKind: activeEditor.type })
                });
                activeInput.typedInput("type", activeEditor.type);
                activeInput.typedInput("value", activeEditor.value);
            },
            oneditsave: function () {
                common.applyBaseFields(BASE_FIELDS).call(this);
                // P157: persist items/activeRoute as binding objects; clear legacy paths.
                this.items = common.applyValueBinding(
                    $("#node-input-itemsBinding").typedInput("type"),
                    $("#node-input-itemsBinding").typedInput("value")
                );
                common.dropLegacyFields(this, ["itemsPath"]);
                this.activeRoute = common.applyValueBinding(
                    $("#node-input-activeRouteBinding").typedInput("type"),
                    $("#node-input-activeRouteBinding").typedInput("value")
                );
                common.dropLegacyFields(this, ["activeRoutePath"]);
            }
        });
    })();
</script>
<script type="text/html" data-template-name="ui-menu">
    <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
    <hr style="margin: 8px 0;">
    <div class="form-row"><label for="node-input-mount">Parent Slot</label><select id="node-input-mount"></select></div>
    <div class="form-row"><label for="node-input-displayType">Display Type</label>
        <select id="node-input-displayType">
            <option value="sidebar">Sidebar</option>
            <option value="topbar">Topbar</option>
        </select>
    </div>
    <!-- P157 (ADR 0012 / value category): Items binding (structural array source) — typedInput managed in oneditprepare/oneditsave. -->
    <div class="form-row"><label for="node-input-itemsBinding">Items</label><input type="text" id="node-input-itemsBinding"></div>
    <!-- P157 (ADR 0012 / value category): Active Route binding (read-only) — typedInput managed in oneditprepare/oneditsave. -->
    <div class="form-row"><label for="node-input-activeRouteBinding">Active Route</label><input type="text" id="node-input-activeRouteBinding"></div>
</script>
<script type="text/html" data-help-name="ui-menu">
<p>Navigationsmenü (Sidebar oder Topbar). Klicks auf navigierbare Items (mit <code>route</code>/<code>path</code>) emittieren ein <code>navigate</code>-Event auf dem Output-Port.</p>
<h4>Items (P157)</h4>
<p>Bindbare, <strong>strukturelle</strong> Quelle der Menü-Einträge (ein Array) — voller
kanonischer Satz (ADR 0012): Store, Query, Route-Param, Reactive, msg, JSONata, json (statisches
Array-Literal), Flow, Global, Env. Das Menü rendert seine Einträge selbst (kein Slot-pro-Item).
Jedes Item: <code>{ "label": …, "route"?: …, "href"?: …, "path"?: …, "icon"?: … }</code>.
Default-Typ: <code>json</code>. Ein bestehender <code>itemsPath</code> wird automatisch als
<code>state</code>-Binding übernommen.</p>
<h4>Active Route (P157)</h4>
<p>Bindbare, <strong>lesende</strong> Quelle der aktiven Route — gleicher kanonischer Satz;
das passende Item wird hervorgehoben. Ein bestehender <code>activeRoutePath</code> wird
automatisch als <code>state</code>-Binding übernommen.</p>
<p>Doku: <a href="https://github.com/ollixx/node-red-contrib-webapp/blob/develop/docs/nodes/navigation/ui-menu.md" target="_blank">ui-menu</a>.</p>
</script>
