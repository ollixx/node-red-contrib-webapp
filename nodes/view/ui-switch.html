<script type="text/javascript" src="resources/node-red-contrib-webapp/lib/editor-common.js"></script>
<script type="text/javascript">
    (function () {
        const common = window.WebappEditorCommon;

        // P222 (ADR 0015): common base fields. See the applicability table in
        // docs/nodes/concepts/editor.md. `omit` drops a field the node already
        // owns a dedicated control for (avoids duplicate #node-input carrier ids).
        const BASE_FIELDS = {
            visible: true,
            disabled: true,
            color: false,
            size: false,
            variant: false,
            advanced: ["size"],
            omit: ["disabled"],
            // P268 (ADR 0042 §3): N/A hints live in the node's OWN locale catalog
            // (nodes/view/locales/<lang>/ui-switch.json -> `ui-switch.hints.<field>`).
            i18nNode: "ui-switch"
        };
        common.registerNodeType("ui-switch", {
            category: "webapp view",
            color: "#f4efcf",
            defaults: {
                visible: { value: null },
                visibleBinding: { value: "" },
                name: { value: "" },
                app: { value: "" },
                mount: { value: "", required: true },
                // P125 (ADR 0012): `value` persists the binding OBJECT; there is no
                // matching #node-input-value element so Node-RED auto-save cannot
                // clobber it. The typedInput lives on #node-input-valueBinding.
                // Legacy: `valuePath` (plain state path) is kept for migration only.
                value: { value: null },
                valueBinding: { value: "" },
                // P147 (ADR 0012): `label`, `labelOn`, `labelOff` persist binding
                // OBJECTS directly on their own #node-input-<field> ids so the
                // minimal-coverage E2E check (`fields:["label"]`) still passes.
                // A legacy plain-string is migrated to a literal binding on open.
                label: { value: { kind: "literal", value: "" } },
                labelOn: { value: { kind: "literal", value: "" } },
                labelOff: { value: { kind: "literal", value: "" } },
                // P125 (ADR 0012): `disabled` persists the binding OBJECT; there is
                // no matching #node-input-disabled element so Node-RED auto-save
                // cannot clobber it. The typedInput lives on #node-input-disabledBinding.
                disabled: { value: null },
                disabledBinding: { value: "" },
                // P204 (ADR 0027): `writeTo` — WRITE half (store/flow/global). A
                // switch has no submit gesture → writes on change regardless of
                // writeTrigger. Legacy storeId/path migrate to writeTo=store.
                writeTo: { value: null },
                writeToBinding: { value: "" },
                writeTrigger: { value: "submit" },

                order: { value: "", validate: function (value) { return value == null || value === "" || RED.validators.number()(value); } },
                row: { value: "", validate: function (value) { return value == null || value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                col: { value: "", validate: function (value) { return value == null || value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                colSize: { value: "", validate: function (value) { return value == null || value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                rowSize: { value: "", validate: function (value) { return value == null || value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                layoutX: { value: "", validate: function (value) { return value == null || value === "" || RED.validators.number()(value); } },
                layoutY: { value: "", validate: function (value) { return value == null || value === "" || RED.validators.number()(value); } }
            },
            // P229 (ADR 0038): migration-only legacy fields — injected as hidden
            // defaults at registration (see editor-common withMigrationDefaults);
            // migrated to `writeTo` on open, deleted on save, never written anew.
            migrationFields: ["storeId", "path", "valuePath"],
            inputs: 1,
            outputs: 1,
            outputLabels: function () { return "event"; },
            icon: "font-awesome/fa-toggle-on",
            label: common.labelWithName("ui-switch"),
            onadd: function () {
                if (!this.name) {
                    this.name = common.getNextNameDefault("ui-switch", "Switch");
                }
            },
            oneditprepare: function () {
                common.installReferenceSelectors({ mount: true }).call(this);
                common.installBaseFields(BASE_FIELDS).call(this);
                common.installLayoutChildPropRows().call(this);

                // P147 (ADR 0012 / value category): `label` typedInput.
                // The typedInput lives on #node-input-label (not a separate
                // *Binding element) so the minimal-coverage E2E check passes.
                // Migration: a legacy plain-string `label` opens as a `str` literal.
                const storedLabel = common.parseBindingValue(this.label);
                const labelBinding = storedLabel
                    ? storedLabel
                    : (typeof this.label === "string" && this.label.length > 0
                        ? { kind: "literal", value: this.label }
                        : undefined);
                const labelEditor = common.readValueBinding(labelBinding, "");
                const labelInput = $("#node-input-label");
                labelInput.typedInput({
                    default: labelEditor.type,
                    types: common.valueBindingTypes({ category: "value", currentKind: labelEditor.type })
                });
                labelInput.typedInput("type", labelEditor.type);
                labelInput.typedInput("value", labelEditor.value);

                // P147 (ADR 0012 / value category): `labelOn` typedInput.
                // Migration: a legacy plain-string opens as a `str` literal.
                const storedLabelOn = common.parseBindingValue(this.labelOn);
                const labelOnBinding = storedLabelOn
                    ? storedLabelOn
                    : (typeof this.labelOn === "string" && this.labelOn.length > 0
                        ? { kind: "literal", value: this.labelOn }
                        : undefined);
                const labelOnEditor = common.readValueBinding(labelOnBinding, "");
                const labelOnInput = $("#node-input-labelOn");
                labelOnInput.typedInput({
                    default: labelOnEditor.type,
                    types: common.valueBindingTypes({ category: "value", currentKind: labelOnEditor.type })
                });
                labelOnInput.typedInput("type", labelOnEditor.type);
                labelOnInput.typedInput("value", labelOnEditor.value);

                // P147 (ADR 0012 / value category): `labelOff` typedInput.
                // Migration: a legacy plain-string opens as a `str` literal.
                const storedLabelOff = common.parseBindingValue(this.labelOff);
                const labelOffBinding = storedLabelOff
                    ? storedLabelOff
                    : (typeof this.labelOff === "string" && this.labelOff.length > 0
                        ? { kind: "literal", value: this.labelOff }
                        : undefined);
                const labelOffEditor = common.readValueBinding(labelOffBinding, "");
                const labelOffInput = $("#node-input-labelOff");
                labelOffInput.typedInput({
                    default: labelOffEditor.type,
                    types: common.valueBindingTypes({ category: "value", currentKind: labelOffEditor.type })
                });
                labelOffInput.typedInput("type", labelOffEditor.type);
                labelOffInput.typedInput("value", labelOffEditor.value);

                // P125 (ADR 0012 / value category): `value` typedInput — full
                // canonical set (14 kinds); default literal type is `bool`.
                // Migration: a legacy `valuePath` plain state path becomes a
                // state binding; a stored `value` binding object takes precedence.
                const storedValue = common.parseBindingValue(this.value);
                const valueBinding = storedValue
                    ? storedValue
                    : (this.valuePath ? { kind: "state", path: this.valuePath } : undefined);
                const valueEditor = common.readValueBinding(valueBinding, "false");
                // When no binding exists yet (new node), default literal sub-type
                // to `bool` so the field opens with a boolean picker.
                const valueType = (!storedValue && !this.valuePath)
                    ? "bool"
                    : valueEditor.type;
                const valueInput = $("#node-input-valueBinding");
                valueInput.typedInput({
                    default: valueType,
                    types: common.valueBindingTypes({ category: "value", currentKind: valueEditor.type })
                });
                valueInput.typedInput("type", valueType);
                valueInput.typedInput("value", valueEditor.value || "false");

                // P125 (ADR 0012 / boolean category): `disabled` typedInput.
                // Migration: any legacy `disabledPath` plain string (not present on
                // ui-switch prior to P125) would become a state binding. For new
                // nodes the field is absent (no disabled by default).
                const storedDisabled = common.parseBindingValue(this.disabled);
                const disabledBinding = storedDisabled ? storedDisabled : undefined;
                const disabledEditor = common.readValueBinding(disabledBinding, "");
                // P181: use 'bool' default when no binding (avoids store fallback).
                const disabledType = disabledEditor.type !== "str" ? disabledEditor.type : "bool";
                const disabledInput = $("#node-input-disabledBinding");
                disabledInput.typedInput({
                    default: disabledType,
                    types: common.valueBindingTypes({ category: "boolean" })
                });
                disabledInput.typedInput("type", disabledType);
                disabledInput.typedInput("value", disabledEditor.value);
                disabledInput.data("base-field-originally-empty", !disabledBinding);

                // P204 (ADR 0027 / writable category): `writeTo` typedInput.
                common.installWriteToField.call(this);
            },
            oneditsave: function () {
                common.applyBaseFields(BASE_FIELDS).call(this);
                // P204: persist writeTo + writeTrigger; drop legacy storeId/path.
                common.saveWriteToField.call(this);

                // P147: persist label as binding object.
                this.label = common.applyValueBinding(
                    $("#node-input-label").typedInput("type"),
                    $("#node-input-label").typedInput("value")
                );

                // P147: persist labelOn as binding object.
                this.labelOn = common.applyValueBinding(
                    $("#node-input-labelOn").typedInput("type"),
                    $("#node-input-labelOn").typedInput("value")
                );

                // P147: persist labelOff as binding object.
                this.labelOff = common.applyValueBinding(
                    $("#node-input-labelOff").typedInput("type"),
                    $("#node-input-labelOff").typedInput("value")
                );

                // P125: persist value as binding object; clear legacy valuePath.
                this.value = common.applyValueBinding(
                    $("#node-input-valueBinding").typedInput("type"),
                    $("#node-input-valueBinding").typedInput("value")
                );
                common.dropLegacyFields(this, ["valuePath"]);
                // P125: persist disabled as binding object.
                // P181: preserve null when field was originally absent and untouched.
                const $disabledInput = $("#node-input-disabledBinding");
                const disabledResult = common.applyValueBinding(
                    $disabledInput.typedInput("type"),
                    $disabledInput.typedInput("value")
                );
                const disabledOriginEmpty = $disabledInput.data("base-field-originally-empty");
                const disabledIsBoolLiteral = disabledResult && disabledResult.kind === "literal"
                    && disabledResult.value === false;
                this.disabled = (disabledOriginEmpty && disabledIsBoolLiteral) ? null : disabledResult;
            }
        });
    })();
</script>
<!-- P268 (ADR 0042 §3): editor-label i18n. Form-row labels carry data-i18n keys
     per the convention `<node>.label.<field>` (options `<node>.option.<field>.<value>`,
     placeholders `[placeholder]<node>.placeholder.<field>`). Catalogs:
     nodes/view/locales/{en-US,de}/ui-switch.json. The literal texts stay as the en-US
     authoring reference; at edit time the catalog text replaces them. -->
<script type="text/html" data-template-name="ui-switch">
    <div class="form-row"><label for="node-input-name" data-i18n="node-red:common.label.name">Name</label><input type="text" id="node-input-name"></div>
    <hr style="margin: 8px 0;">
    <div class="form-row"><label for="node-input-mount" data-i18n="ui-switch.label.mount">Parent Slot</label><select id="node-input-mount"></select></div>
    <!-- P125 (ADR 0012 / value category): Value binding — typedInput managed in oneditprepare/oneditsave. -->
    <div class="form-row"><label for="node-input-valueBinding" data-i18n="ui-switch.label.valueBinding">Value Path</label><input type="text" id="node-input-valueBinding"></div>
    <!-- P204 (ADR 0027 / writable category): writeTo target (WRITE) — Store/Flow/Global. -->
    <div class="form-row"><label for="node-input-writeToBinding" data-i18n="ui-switch.label.writeToBinding">Write To</label><input type="text" id="node-input-writeToBinding"></div>
    <div class="form-row"><label for="node-input-writeTrigger" data-i18n="ui-switch.label.writeTrigger">Write Trigger</label><select id="node-input-writeTrigger"><option value="submit" data-i18n="ui-switch.option.writeTrigger.submit">submit</option><option value="change" data-i18n="ui-switch.option.writeTrigger.change">change</option><option value="none" data-i18n="ui-switch.option.writeTrigger.none">none</option></select></div>
    <!-- P147 (ADR 0012 / value category): Label bindings — typedInputs managed in oneditprepare/oneditsave. -->
    <div class="form-row"><label for="node-input-label" data-i18n="ui-switch.label.label">Label</label><input type="text" id="node-input-label"></div>
    <div class="form-row"><label for="node-input-labelOn" data-i18n="ui-switch.label.labelOn">Label On</label><input type="text" id="node-input-labelOn"></div>
    <div class="form-row"><label for="node-input-labelOff" data-i18n="ui-switch.label.labelOff">Label Off</label><input type="text" id="node-input-labelOff"></div>
    <!-- P125 (ADR 0012 / boolean category): Disabled binding — typedInput managed in oneditprepare/oneditsave. -->
    <div class="form-row"><label for="node-input-disabledBinding" data-i18n="ui-switch.label.disabledBinding">Disabled</label><input type="text" id="node-input-disabledBinding"></div>
</script>
<!-- P268 (ADR 0042): help + labels are locale-migrated. Help lives in
     nodes/view/locales/{en-US,de}/ui-switch.html; form-row labels carry
     data-i18n keys resolved from nodes/view/locales/{en-US,de}/ui-switch.json.
     No inline data-help-name block here. -->
