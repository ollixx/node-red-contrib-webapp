<script type="text/javascript" src="resources/node-red-contrib-webapp/lib/editor-common.js"></script>
<script type="text/javascript">
    (function () {
        const common = window.WebappEditorCommon;

        // P222 (ADR 0015): common base fields. See the applicability table in
        // docs/nodes/concepts/editor.md. `omit` drops a field the node already
        // owns a dedicated control for (avoids duplicate #node-input carrier ids).
        const BASE_FIELDS = {
            visible: true,
            disabled: true,
            color: false,
            size: false,
            variant: false,
            advanced: [],
            omit: ["disabled","size"],
            hints: {
                color: "Ein Formularfeld hat keine allgemeine Farbe (Zustandsfarben kommen aus Validierung/Variant)."
            }
        };
        common.registerNodeType("ui-textarea", {
            category: "webapp view",
            color: "#f4efcf",
            defaults: {
                visible: { value: null },
                visibleBinding: { value: "" },
                name: { value: "" },
                app: { value: "" },
                mount: { value: "", required: true },
                // P148 (ADR 0012): `label` persists the binding OBJECT; the
                // typedInput lives directly on #node-input-label so the
                // minimal-coverage E2E check still passes (fields:["label"]).
                // A legacy plain-string `label` is migrated on open.
                // Required: the typedInput must carry a non-empty value.
                label: {
                    value: { kind: "literal", value: "" },
                    required: true,
                    validate: function () {
                        var el = $("#node-input-label");
                        if (el.length && typeof el.typedInput === "function") {
                            var v = el.typedInput("value");
                            return v !== undefined && v !== null && String(v).length > 0;
                        }
                        // Pre-open (no typedInput yet): trust the persisted binding.
                        var b = this.label;
                        if (b && typeof b === "object") {
                            return b.value !== undefined && b.value !== null && String(b.value).length > 0
                                ? true
                                : (typeof b.path === "string" && b.path.length > 0);
                        }
                        return typeof b === "string" && b.length > 0;
                    },
                    serialize: function () {
                        var el = $("#node-input-label");
                        if (el.length && typeof el.typedInput === "function") {
                            var v = el.typedInput("value");
                            return common.applyValueBinding(el.typedInput("type"), v || "");
                        }
                        // Pre-open (no typedInput yet): trust the persisted binding.
                        var b = this.label;
                        return b && typeof b === "object" ? b : { kind: "literal", value: b || "" };
                    }
                },
                // P128 (ADR 0012): `value` persists the binding OBJECT; there is no
                // matching #node-input-value element so Node-RED auto-save cannot
                // clobber it. The typedInput lives on #node-input-valueBinding.
                // Legacy `valuePath` (pre-P128 plain state path) is kept for migration only.
                value: { value: null },
                valueBinding: { value: "" },
                // P148 (ADR 0012): `placeholder` persists the binding OBJECT; the
                // typedInput lives directly on #node-input-placeholder.
                // A legacy plain-string `placeholder` is migrated on open.
                placeholder: { value: null },
                // P229 (ADR 0038): `lines` = visible text-line count (field HEIGHT).
                // Renamed from the overloaded `rows` — `rows` now means only the
                // ui-table DATA binding. A legacy `rows` migrates on open.
                lines: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                maxLength: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                size: { value: "" },
                // P128 (ADR 0012 / boolean category): `disabled` persists the binding
                // OBJECT; there is no matching #node-input-disabled element so
                // Node-RED auto-save cannot clobber it. The typedInput lives on
                // #node-input-disabledBinding.
                disabled: { value: null },
                disabledBinding: { value: "" },
                // P204 (ADR 0027): `writeTo` — WRITE half (store/flow/global). A
                // textarea is text-like: it honours writeTrigger (submit = blur,
                // change = every keystroke). Legacy storeId/path migrate to
                // writeTo=store.
                writeTo: { value: null },
                writeToBinding: { value: "" },
                writeTrigger: { value: "submit" },

                order: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                row: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                col: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                colSize: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                rowSize: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                layoutX: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                layoutY: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } }
            },
            // P229 (ADR 0038): migration-only legacy fields — injected as hidden
            // defaults at registration (see editor-common withMigrationDefaults);
            // migrated to `writeTo` on open, deleted on save, never written anew.
            migrationFields: ["storeId", "path", "valuePath", "rows"],
            inputs: 1,
            outputs: 1,
            outputLabels: function () { return "event"; },
            icon: "font-awesome/fa-align-left",
            label: common.labelWithName("ui-textarea"),
            onadd: function () {
                if (!this.name) {
                    this.name = common.getNextNameDefault("ui-textarea", "Textarea");
                }
            },
            oneditprepare: function () {
                common.installReferenceSelectors({ mount: true }).call(this);
                common.installBaseFields(BASE_FIELDS).call(this);
                common.installSizeSelectBox().call(this);
                common.installLayoutChildPropRows().call(this);

                // P229 (ADR 0038): `rows` → `lines` migration. Node-RED seeded
                // #node-input-lines from `lines` before this hook; a legacy node
                // (lines empty, rows set) seeds the field from the old value.
                if ((this.lines === undefined || this.lines === null || this.lines === "")
                    && this.rows !== undefined && this.rows !== null && this.rows !== "") {
                    $("#node-input-lines").val(this.rows);
                }

                // P148 (ADR 0012 / display category): `label` typedInput.
                // The typedInput lives on #node-input-label (not a separate
                // *Binding element) so the convention `fields:["label"]` is satisfied.
                // Migration: a legacy plain-string `label` opens as a `str` literal.
                const storedLabel = common.parseBindingValue(this.label);
                const labelBinding = storedLabel
                    ? storedLabel
                    : (typeof this.label === "string" && this.label.length > 0
                        ? { kind: "literal", value: this.label }
                        : undefined);
                const labelEditor = common.readValueBinding(labelBinding, "");
                const labelInput = $("#node-input-label");
                labelInput.typedInput({
                    default: labelEditor.type,
                    types: common.valueBindingTypes({ category: "display", currentKind: labelEditor.type })
                });
                labelInput.typedInput("type", labelEditor.type);
                labelInput.typedInput("value", labelEditor.value);

                // P148 (ADR 0012 / display category): `placeholder` typedInput.
                // The typedInput lives on #node-input-placeholder.
                // Migration: a legacy plain-string `placeholder` opens as a `str` literal.
                const storedPlaceholder = common.parseBindingValue(this.placeholder);
                const placeholderBinding = storedPlaceholder
                    ? storedPlaceholder
                    : (typeof this.placeholder === "string" && this.placeholder.length > 0
                        ? { kind: "literal", value: this.placeholder }
                        : undefined);
                const placeholderEditor = common.readValueBinding(placeholderBinding, "");
                const placeholderInput = $("#node-input-placeholder");
                placeholderInput.typedInput({
                    default: placeholderEditor.type,
                    types: common.valueBindingTypes({ category: "display", currentKind: placeholderEditor.type })
                });
                placeholderInput.typedInput("type", placeholderEditor.type);
                placeholderInput.typedInput("value", placeholderEditor.value);

                // P128 (ADR 0012 / value/display category): `value` typedInput — full
                // canonical set. Migration: a legacy `valuePath` plain string becomes a
                // state binding; a stored `value` binding object takes precedence.
                const storedValue = common.parseBindingValue(this.value);
                const valueBinding = storedValue
                    ? storedValue
                    : (this.valuePath ? { kind: "state", path: this.valuePath } : undefined);
                const valueEditor = common.readValueBinding(valueBinding, "");
                const valueInput = $("#node-input-valueBinding");
                valueInput.typedInput({
                    default: valueEditor.type,
                    types: common.valueBindingTypes({ category: "value", currentKind: valueEditor.type })
                });
                valueInput.typedInput("type", valueEditor.type);
                valueInput.typedInput("value", valueEditor.value);

                // P128 (ADR 0012 / boolean category): `disabled` typedInput.
                // No legacy to migrate (new field).
                const storedDisabled = common.parseBindingValue(this.disabled);
                const disabledBinding = storedDisabled ? storedDisabled : undefined;
                const disabledEditor = common.readValueBinding(disabledBinding, "");
                // P181: use 'bool' default when no binding (avoids store fallback).
                const disabledType = disabledEditor.type !== "str" ? disabledEditor.type : "bool";
                const disabledInput = $("#node-input-disabledBinding");
                disabledInput.typedInput({
                    default: disabledType,
                    types: common.valueBindingTypes({ category: "boolean" })
                });
                disabledInput.typedInput("type", disabledType);
                disabledInput.typedInput("value", disabledEditor.value);
                disabledInput.data("base-field-originally-empty", !disabledBinding);

                // P204 (ADR 0027 / writable category): `writeTo` typedInput.
                common.installWriteToField.call(this);
            },
            oneditsave: function () {
                common.applyBaseFields(BASE_FIELDS).call(this);
                // P204: persist writeTo + writeTrigger; drop legacy storeId/path.
                common.saveWriteToField.call(this);

                // P229: `lines` is auto-copied from #node-input-lines by Node-RED
                // after this hook; the migrated legacy `rows` is deleted so the
                // saved node exports without it.
                common.dropLegacyFields(this, ["rows"]);

                // P148: persist label as binding object.
                this.label = common.applyValueBinding(
                    $("#node-input-label").typedInput("type"),
                    $("#node-input-label").typedInput("value")
                );

                // P148: persist placeholder as binding object.
                this.placeholder = common.applyValueBinding(
                    $("#node-input-placeholder").typedInput("type"),
                    $("#node-input-placeholder").typedInput("value")
                );

                // P128: persist value as binding object; clear legacy valuePath.
                this.value = common.applyValueBinding(
                    $("#node-input-valueBinding").typedInput("type"),
                    $("#node-input-valueBinding").typedInput("value")
                );
                common.dropLegacyFields(this, ["valuePath"]);
                // P128: persist disabled as binding object.
                // P181: preserve null when field was originally absent and untouched.
                const $disabledInput = $("#node-input-disabledBinding");
                const disabledResult = common.applyValueBinding(
                    $disabledInput.typedInput("type"),
                    $disabledInput.typedInput("value")
                );
                const disabledOriginEmpty = $disabledInput.data("base-field-originally-empty");
                const disabledIsBoolLiteral = disabledResult && disabledResult.kind === "literal"
                    && disabledResult.value === false;
                this.disabled = (disabledOriginEmpty && disabledIsBoolLiteral) ? null : disabledResult;
            }
        });
    })();
</script>
<script type="text/html" data-template-name="ui-textarea">
    <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
    <hr style="margin: 8px 0;">
    <div class="form-row"><label for="node-input-mount">Parent Slot</label><select id="node-input-mount"></select></div>
    <!-- P148 (ADR 0012 / display category): Label binding — typedInput managed in oneditprepare/oneditsave. -->
    <div class="form-row"><label for="node-input-label">Label</label><input type="text" id="node-input-label"></div>
    <!-- P128 (ADR 0012 / value/display category): Value binding — typedInput managed in oneditprepare/oneditsave. -->
    <div class="form-row"><label for="node-input-valueBinding">Value</label><input type="text" id="node-input-valueBinding"></div>
    <!-- P204 (ADR 0027 / writable category): writeTo target (WRITE) — Store/Flow/Global. -->
    <div class="form-row"><label for="node-input-writeToBinding">Write To</label><input type="text" id="node-input-writeToBinding"></div>
    <div class="form-row"><label for="node-input-writeTrigger">Write Trigger</label><select id="node-input-writeTrigger"><option value="submit">submit</option><option value="change">change</option><option value="none">none</option></select></div>
    <!-- P148 (ADR 0012 / display category): Placeholder binding — typedInput managed in oneditprepare/oneditsave. -->
    <div class="form-row"><label for="node-input-placeholder">Placeholder</label><input type="text" id="node-input-placeholder"></div>
    <div class="form-row"><label for="node-input-lines">Lines</label><input type="number" id="node-input-lines" min="1"></div>
    <div class="form-row"><label for="node-input-maxLength">Max Length</label><input type="number" id="node-input-maxLength" min="1"></div>
    <!-- P128 (ADR 0012 / boolean category): Disabled binding — typedInput managed in oneditprepare/oneditsave. -->
    <div class="form-row"><label for="node-input-disabledBinding">Disabled</label><input type="text" id="node-input-disabledBinding"></div>
</script>
<script type="text/html" data-help-name="ui-textarea">
    <p>Mehrzeiliges Texteingabefeld mit optionalem Zähler und maximaler Länge.</p>
    <h4>Label (P148)</h4>
    <p>Bindbares Label — kanonischer Display-Satz (ADR 0012): Store, Query, Route-Param, Reactive,
    msg, JSONata, string, number, boolean, json, timestamp, Flow, Global, Env.
    Ein bestehender Plaintext-<code>label</code> wird automatisch als <code>str</code>-Literal übernommen.</p>
    <h4>Placeholder (P148)</h4>
    <p>Bindbarer Platzhaltertext — kanonischer Display-Satz (ADR 0012).
    Ein bestehender Plaintext-<code>placeholder</code> wird automatisch als <code>str</code>-Literal übernommen.</p>
    <h4>Value (P128)</h4>
    <p>Bindbare Quelle des Feldwerts (Anzeige/Initialwert) — voller kanonischer Satz (ADR 0012):
    Store, Query, Route-Param, Reactive, msg, JSONata, string, number, boolean, json, timestamp,
    Flow, Global, Env. Ein bestehender <code>valuePath</code> wird automatisch als
    <code>state</code>-Binding übernommen.</p>
    <h4>Write To (Schreiben, P204 / ADR 0027)</h4>
    <p>Ziel, in das die Runtime den Text schreibt — nur <b>schreibbare</b> Kinds
    (<code>Store</code>/<code>Flow</code>/<code>Global</code>). Eine Textarea ist text-artig und
    honoriert den <code>Write Trigger</code>: <code>submit</code> schreibt beim Verlassen des
    Feldes (Blur), <code>change</code> bei jeder Eingabe.</p>
    <h4>Disabled (P128)</h4>
    <p>Bindbar über den Boolean-Zustand-Satz (ADR 0012): Store, Query, Route-Param, Reactive,
    msg, JSONata, boolean, Flow, Global, Env. Ein Store-Binding deaktiviert die Textarea live,
    sobald der Wert truthy ist.</p>
    <h4>Events</h4>
    <p>Emittiert <code>{ event: "change", params: { value } }</code> bei jeder Eingabe.</p>
    <p><a href="https://github.com/ollixx/node-red-contrib-webapp/blob/develop/docs/nodes/input/ui-textarea.md">Ausführliche Doku</a></p>
</script>
