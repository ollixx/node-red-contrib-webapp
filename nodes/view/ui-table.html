<script type="text/javascript" src="resources/node-red-contrib-webapp/lib/editor-common.js"></script>
<script type="text/javascript">
    (function () {
        const common = window.WebappEditorCommon;
        common.registerNodeType("ui-table", {
            category: "webapp view",
            color: "#f4efcf",
            defaults: {
                name: { value: "" },
                uiId: { value: "", required: true },
                mount: { value: "", required: true },
                columns: { value: "", validate: common.required },
                rowsPath: { value: "", required: true },
                rows: { value: null },
                selectAction: { value: "" },
                order: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } }
            },
            inputs: 0,
            outputs: 1,
            icon: "font-awesome/fa-table",
            label: common.labelWithName("ui-table"),
            oneditprepare: common.installReferenceSelectors({ mount: true, action: "#node-input-selectAction" })
        });
    })();
</script>
<script type="text/html" data-template-name="ui-table">
    <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
    <div class="form-row"><label for="node-input-uiId">Node ID</label><input type="text" id="node-input-uiId"></div>
    <div class="form-row"><label for="node-input-mount">Parent Slot</label><select id="node-input-mount"></select></div>
    <div class="form-tips">Waehlt den Slot, in den diese Tabelle gemountet wird.</div>
    <div class="form-row"><label for="node-input-columns">Columns</label><input type="text" id="node-input-columns" placeholder="name,email,status"></div>
    <div class="form-row"><label for="node-input-rowsPath">Rows Path</label><input type="text" id="node-input-rowsPath"></div>
    <div class="form-row"><label for="node-input-selectAction">Select Action</label><select id="node-input-selectAction"></select></div>
    <div class="form-row"><label for="node-input-order">Order</label><input type="number" id="node-input-order"></div>
</script>
<script type="text/html" data-help-name="ui-table"><p>Mountet eine Tabelle mit Query-Binding.</p></script>
