<script type="text/javascript" src="resources/node-red-contrib-webapp/lib/editor-common.js"></script>
<script type="text/javascript">
    (function () {
        const common = window.WebappEditorCommon;

        // P222 (ADR 0015): common base fields. See the applicability table in
        // docs/nodes/concepts/editor.md. `omit` drops a field the node already
        // owns a dedicated control for (avoids duplicate #node-input carrier ids).
        const BASE_FIELDS = {
            visible: true,
            disabled: true,
            color: true,
            size: false,
            variant: false,
            advanced: ["size"],
            omit: [],
            hints: {
                size: "Dieser Knoten hat keine Größen-Stufen."
            }
        };
        common.registerNodeTypeWithEvents("ui-table", {
            category: "webapp view",
            color: "#f4efcf",
            defaults: {
                visible: { value: null },
                visibleBinding: { value: "" },
                disabled: { value: null },
                disabledBinding: { value: "" },
                color: { value: null },
                colorBinding: { value: "" },
                name: { value: "" },
                app: { value: "" },
                mount: { value: "", required: true },
                columns: { value: "", validate: common.required },
                // P158 (ADR 0012): `rows` is the canonical STRUCTURAL array DATA
                // SOURCE (the table renders its rows ITSELF; a data source, NOT a
                // repeats case). It persists the binding OBJECT; there is no
                // matching #node-input-rows element so Node-RED auto-save cannot
                // clobber it. The typedInput lives on #node-input-rowsBinding.
                // Legacy `rowsPath` plain path is kept for migration only.
                // `columns` (schema) stays separate (Collections).
                rows: { value: null },
                rowsBinding: { value: "" },
                rowsPath: { value: "" },
                selectAction: { value: "" },
                footer: { value: false },
                events: { value: "[]" },
                outputs: { value: 0 },
                order: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                row: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                col: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                colSize: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                rowSize: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                layoutX: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                layoutY: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } }
            },
            inputs: 1,
            outputs: 0,
            outputLabels: function (index) {
                try {
                    const events = JSON.parse(this.events || "[]");
                    return events[index] || "";
                }
                catch (_e) {
                    return "";
                }
            },
            icon: "font-awesome/fa-table",
            label: common.labelWithName("ui-table"),
            onadd: function () {
                if (!this.name) {
                    this.name = common.getNextNameDefault("ui-table", "Table");
                }
            },
            oneditprepare: function () {
                common.installReferenceSelectors({ mount: true }).call(this);
                common.installBaseFields(BASE_FIELDS).call(this);
                common.installLayoutChildPropRows().call(this);

                // P158 (ADR 0012 / value category): `rows` typedInput — full
                // canonical value set with a JSON-literal default type (a static
                // rows array). STRUCTURAL array DATA SOURCE: a Store/Query/Reactive
                // binding reads the rows reactively; the json type holds a static
                // array literal. Migration: a legacy `rowsPath` plain string opens
                // as a `state` binding; a stored `rows` binding object wins.
                const storedRows = common.parseBindingValue(this.rows);
                const rowsBinding = storedRows
                    ? storedRows
                    : (this.rowsPath ? { kind: "state", path: this.rowsPath } : undefined);
                const rowsEditor = common.readValueBinding(rowsBinding, "");
                const rowsDefaultType = rowsEditor.type !== "str" ? rowsEditor.type : "json";
                const rowsInput = $("#node-input-rowsBinding");
                rowsInput.typedInput({
                    default: rowsDefaultType,
                    types: common.valueBindingTypes({ category: "value", currentKind: rowsEditor.type })
                });
                rowsInput.typedInput("type", rowsEditor.type !== "str" || rowsBinding ? rowsEditor.type : "json");
                rowsInput.typedInput("value", rowsEditor.value);
            },
            oneditsave: function () {
                common.applyBaseFields(BASE_FIELDS).call(this);
                // P158: persist rows as a binding object; clear the legacy path.
                this.rows = common.applyValueBinding(
                    $("#node-input-rowsBinding").typedInput("type"),
                    $("#node-input-rowsBinding").typedInput("value")
                );
                this.rowsPath = "";
            }
        }, ["rowSelect", "rowAction", "checkboxChange", "cellSelect"]);
    })();
</script>
<script type="text/html" data-template-name="ui-table">
    <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
    <hr style="margin: 8px 0;">
    <div class="form-row"><label for="node-input-mount">Parent Slot</label><select id="node-input-mount"></select></div>
    <div class="form-row"><label for="node-input-columns">Columns</label><input type="text" id="node-input-columns" placeholder="name,email,status"></div>
    <!-- P158 (ADR 0012 / value category): Rows binding (structural array data source) — typedInput managed in oneditprepare/oneditsave. -->
    <div class="form-row"><label for="node-input-rowsBinding">Rows</label><input type="text" id="node-input-rowsBinding"></div>
    <div class="form-row">
        <label for="node-input-footer" style="width:auto; margin-right:8px;">Footer Slot</label>
        <input type="checkbox" id="node-input-footer" style="width:auto; margin:0;">
    </div>
    <input type="hidden" id="node-input-events">
    <input type="hidden" id="node-input-outputs">
    <div class="form-row"><label>Events</label></div>
    <div id="node-input-events-container"></div>
</script>
<script type="text/html" data-help-name="ui-table">
<p>Mountet eine Tabelle mit bindbarer Daten-Quelle und konfigurierbaren Zeilen-Events.</p>
<h4>Rows (P158)</h4>
<p>Bindbare, <strong>strukturelle</strong> Daten-Quelle der Tabellenzeilen (ein Array von
Zeilen-Objekten) — voller kanonischer Satz (ADR 0012): Store, Query, Route-Param, Reactive,
msg, JSONata, json (statisches Array-Literal), Flow, Global, Env. Die Tabelle rendert ihre
Zeilen selbst. Default-Typ: <code>json</code>. Ein bestehender <code>rowsPath</code> wird
automatisch als <code>state</code>-Binding übernommen. <code>columns</code> (Schema) bleibt
separat.</p>
</script>
