<script type="text/javascript" src="resources/node-red-contrib-webapp/lib/editor-common.js"></script>
<script type="text/javascript">
    (function () {
        const common = window.WebappEditorCommon;

        // P113 (ADR 0012 / ADR 0010): `image` and `initials` are display-value
        // bindings driven by the ONE canonical value-binding type set (Store, Query,
        // Route-Param, Reactive, msg, JSONata, str, num, bool, json, date, Flow,
        // Global, Env). `image` additionally offers the `asset` type (managed
        // media-store), serialized as a literal `asset:<id>`. Back-compat: an old
        // `srcPath` (plain state path) is migrated to a state binding on first open.
        function applyImageTypedInput(selector, binding) {
            const input = $(selector);
            const types = common.valueBindingTypes({ includeAsset: true });
            input.typedInput({ default: "str", types: types });
            if (binding && binding.kind === "literal" && typeof binding.value === "string" && binding.value.indexOf("asset:") === 0) {
                input.typedInput("type", "asset");
                input.typedInput("value", binding.value.slice("asset:".length));
            } else {
                const editor = common.readValueBinding(binding, "");
                input.typedInput("type", editor.type);
                input.typedInput("value", editor.value);
            }
        }

        function readImageBinding(selector) {
            const input = $(selector);
            const type = input.typedInput("type");
            const value = input.typedInput("value");
            if (type === "asset") {
                return { kind: "literal", value: value ? "asset:" + value : "" };
            }
            return common.applyValueBinding(type, value);
        }

        function applyInitialsTypedInput(selector, binding) {
            const input = $(selector);
            const editor = common.readValueBinding(binding, "");
            input.typedInput({ default: "str", types: common.valueBindingTypes() });
            input.typedInput("type", editor.type);
            input.typedInput("value", editor.value);
        }

        function readInitialsBinding(selector) {
            const input = $(selector);
            return common.applyValueBinding(input.typedInput("type"), input.typedInput("value"));
        }

        common.registerNodeType("ui-avatar", {
            category: "webapp view",
            color: "#f4efcf",
            defaults: {
                name: { value: "" },
                parent: { value: "" },
                mount: { value: "", required: true },
                // P94: `src` persists the binding OBJECT (renamed to `image` in UI).
                // DOM-less; the typedInput widget lives on `imageBinding`.
                src: { value: { kind: "literal", value: "" } },
                imageBinding: { value: "" },
                // Legacy field (pre-P94 plain state path) — DOM-less, read for back-compat.
                srcPath: { value: "" },
                // P94: `initials` persists the binding OBJECT.
                // DOM-less; the typedInput widget lives on `initialsBinding`.
                initials: { value: null },
                initialsBinding: { value: "" },
                icon: { value: "" },
                // P93: alt removed — sl-avatar uses label attr for a11y, not alt.
                size: { value: "md" },
                shape: { value: "circle" },
                // P94: semantic colour role. Shoelace sl-avatar has no native variant;
                // the serializer emits data-variant instead.
                variant: { value: "" },
                order: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                row: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                col: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                colSize: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                rowSize: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                layoutX: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                layoutY: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } }
            },
            inputs: 1,
            outputs: 0,
            icon: "font-awesome/fa-user-circle",
            label: common.labelWithName("ui-avatar"),
            onadd: function () {
                if (!this.name) {
                    this.name = common.getNextNameDefault("ui-avatar", "Avatar");
                }
            },
            oneditprepare: function () {
                common.installReferenceSelectors({ mount: true }).call(this);
                common.installLayoutChildPropRows().call(this);
                common.installIconField("#node-input-icon", { title: "Avatar-Icon auswählen" });

                // P94: Image typedInput — restore persisted binding; back-compat: legacy srcPath.
                const parsedSrc = common.parseBindingValue(this.src);
                const srcIsEmptyLiteral = !!parsedSrc && parsedSrc.kind === "literal"
                    && (parsedSrc.value === undefined || parsedSrc.value === null || parsedSrc.value === "");
                const imageBinding = (parsedSrc && !srcIsEmptyLiteral)
                    ? parsedSrc
                    : (this.srcPath ? { kind: "state", path: this.srcPath } : parsedSrc);
                applyImageTypedInput("#node-input-imageBinding", imageBinding);

                // P94: Initials typedInput — restore persisted binding; back-compat: plain string.
                let initialsBinding;
                if (this.initials && typeof this.initials === "object" && typeof this.initials.kind === "string") {
                    initialsBinding = common.parseBindingValue(this.initials);
                } else if (typeof this.initials === "string" && this.initials.trim().length > 0) {
                    initialsBinding = { kind: "literal", value: this.initials };
                } else {
                    initialsBinding = undefined;
                }
                applyInitialsTypedInput("#node-input-initialsBinding", initialsBinding);
            },
            oneditsave: function () {
                this.src = readImageBinding("#node-input-imageBinding");
                this.srcPath = "";
                this.initials = readInitialsBinding("#node-input-initialsBinding");
            }
        });
    })();
</script>
<script type="text/html" data-template-name="ui-avatar">
    <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
    <hr style="margin: 8px 0;">
    <div class="form-row"><label for="node-input-mount">Parent Slot</label><select id="node-input-mount"></select></div>
    <div class="form-row"><label for="node-input-imageBinding">Image</label><input type="text" id="node-input-imageBinding"></div>
    <div class="form-row"><label for="node-input-initialsBinding">Fallback Initials</label><input type="text" id="node-input-initialsBinding"></div>
    <div class="form-row"><label for="node-input-icon">Fallback Icon</label><input type="text" id="node-input-icon" placeholder="z. B. person oder lucide:user"></div>
    <div class="form-row"><label for="node-input-size">Size</label>
        <select id="node-input-size">
            <option value="xs">XSmall</option>
            <option value="sm">Small</option>
            <option value="md">Medium (Default)</option>
            <option value="lg">Large</option>
            <option value="xl">XLarge</option>
        </select>
    </div>
    <div class="form-row"><label for="node-input-shape">Shape</label>
        <select id="node-input-shape">
            <option value="circle">Circle (Default)</option>
            <option value="square">Square</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-variant">Variant</label>
        <select id="node-input-variant">
            <option value="">None (Default)</option>
            <option value="primary">Primary</option>
            <option value="neutral">Neutral</option>
            <option value="success">Success</option>
            <option value="info">Info</option>
            <option value="warning">Warning</option>
            <option value="danger">Danger</option>
        </select>
        <span style="margin-left:8px; color:#888; font-size:0.85em;" title="Das Shoelace-Backend unterstützt Variant bei sl-avatar nicht nativ; der Wert wird als data-variant-Attribut ausgegeben (Bootstrap-Adapter oder eigenes CSS).">ℹ</span>
    </div>
</script>
<script type="text/html" data-help-name="ui-avatar">
<p>Zeigt ein Benutzer-Bild oder Initialen mit Fallback.</p>
<h3>Image (Bild)</h3>
<p>Das Avatar-Bild (<code>Image</code>) ist voll bindbar: <b>URL</b> (literal), state/query/routeParam/msg/flow/global/jsonata/env, <b>Store</b> sowie <b>Asset</b> (verwaltetes Medium aus dem Media-Store, wenn <code>ui-app.mediaStoreUrl</code> konfiguriert ist).</p>
<h3>Fallback-Kette</h3>
<ol>
  <li><b>Image</b> gesetzt und lädt erfolgreich → Bild anzeigen.</li>
  <li><b>Fallback Initials</b> gesetzt → Initialen anzeigen (z.B. <code>JD</code>).</li>
  <li>Sonst: <b>Fallback Icon</b> (falls gesetzt), andernfalls Standard-Nutzer-Icon.</li>
</ol>
<h3>Variant</h3>
<p>Semantische Farbrolle: <code>primary</code>, <code>neutral</code>, <code>success</code>, <code>info</code>, <code>warning</code>, <code>danger</code>.</p>
<p><em>Hinweis:</em> Das Shoelace-Backend (<code>sl-avatar</code>) unterstützt Variant nicht nativ — der Wert wird als <code>data-variant</code>-Attribut ausgegeben. Bootstrap-Adapter oder eigenes CSS können dieses Attribut auswerten.</p>
<p><a href="https://github.com/ollixx/node-red-contrib-webapp/blob/develop/docs/nodes/display/ui-avatar.md">Ausführliche Dokumentation</a></p>
</script>
