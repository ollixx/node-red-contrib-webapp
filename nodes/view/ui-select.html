<script type="text/javascript" src="resources/node-red-contrib-webapp/lib/editor-common.js"></script>
<script type="text/javascript">
    (function () {
        const common = window.WebappEditorCommon;

        // P222 (ADR 0015): common base fields. See the applicability table in
        // docs/nodes/concepts/editor.md. `omit` drops a field the node already
        // owns a dedicated control for (avoids duplicate #node-input carrier ids).
        const BASE_FIELDS = {
            visible: true,
            disabled: true,
            color: false,
            size: false,
            variant: false,
            advanced: [],
            omit: ["disabled","size"],
            // P268 (ADR 0042 §3): N/A hints live in the node's OWN locale catalog
            // (nodes/view/locales/<lang>/ui-select.json -> `ui-select.hints.<field>`).
            i18nNode: "ui-select"
        };
        common.registerNodeType("ui-select", {
            category: "webapp view",
            color: "#f4efcf",
            defaults: {
                visible: { value: null },
                visibleBinding: { value: "" },
                name: { value: "" },
                app: { value: "" },
                mount: { value: "", required: true },
                // P133 (ADR 0012): `label` persists the binding OBJECT (literal
                // string or dynamic binding); the typedInput lives on
                // #node-input-labelBinding. A legacy plain-string `label` migrates.
                // Required: the labelBinding typedInput must carry a non-empty value
                // (a literal text or any dynamic binding source).
                label: {
                    value: "",
                    required: true,
                    validate: function () {
                        var el = $("#node-input-labelBinding");
                        if (el.length && typeof el.typedInput === "function") {
                            var v = el.typedInput("value");
                            return v !== undefined && v !== null && String(v).length > 0;
                        }
                        // Pre-open (no typedInput yet): trust the persisted binding.
                        var b = this.label;
                        if (b && typeof b === "object") {
                            return b.value !== undefined && b.value !== null && String(b.value).length > 0
                                ? true
                                : (typeof b.path === "string" && b.path.length > 0);
                        }
                        return typeof b === "string" && b.length > 0;
                    }
                },
                labelBinding: { value: "" },
                // P124 (ADR 0012): `value` persists the binding OBJECT; there is no
                // matching #node-input-value element so Node-RED auto-save cannot
                // clobber it. The typedInput lives on #node-input-valueBinding.
                // Legacy: `valuePath` (plain state path) is kept for migration only.
                value: { value: null },
                valueBinding: { value: "" },
                // P133 (ADR 0012): single Options field — `options` persists the
                // binding OBJECT (json literal | store). The typedInput lives on
                // #node-input-optionsField. Legacy `optionsJson`/`optionsBinding`
                // strings are kept for migration only.
                options: { value: null },
                optionsField: { value: "" },
                optionsBinding: { value: "" },
                // P133 (ADR 0012): `placeholder` persists the binding OBJECT; the
                // typedInput lives on #node-input-placeholderBinding.
                placeholder: { value: null },
                placeholderBinding: { value: "" },
                multiple: { value: false },
                // P133: `searchable` removed.
                size: { value: "" },
                // P124 (ADR 0012): `disabled` persists the binding OBJECT; there is
                // no matching #node-input-disabled element so Node-RED auto-save cannot
                // clobber it. The typedInput lives on #node-input-disabledBinding.
                disabled: { value: null },
                disabledBinding: { value: "" },
                // P204 (ADR 0027): `writeTo` persists the WRITE half of the value
                // binding (store/flow/global). The typedInput lives on
                // #node-input-writeToBinding. A select has no submit gesture, so it
                // writes on `change` regardless of writeTrigger. Legacy storeId/path
                // migrate to a writeTo=store binding on open and are then dropped.
                writeTo: { value: null },
                writeToBinding: { value: "" },
                writeTrigger: { value: "submit" },

                order: { value: "", validate: function (value) { return value == null || value === "" || RED.validators.number()(value); } },
                row: { value: "", validate: function (value) { return value == null || value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                col: { value: "", validate: function (value) { return value == null || value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                colSize: { value: "", validate: function (value) { return value == null || value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                rowSize: { value: "", validate: function (value) { return value == null || value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                layoutX: { value: "", validate: function (value) { return value == null || value === "" || RED.validators.number()(value); } },
                layoutY: { value: "", validate: function (value) { return value == null || value === "" || RED.validators.number()(value); } }
            },
            // P229 (ADR 0038): migration-only legacy fields — injected as hidden
            // defaults at registration (see editor-common withMigrationDefaults);
            // migrated to `writeTo` on open, deleted on save, never written anew.
            migrationFields: ["storeId", "path", "valuePath", "optionsJson"],
            inputs: 1,
            outputs: 1,
            outputLabels: function () { return "event"; },
            icon: "font-awesome/fa-list",
            label: common.labelWithName("ui-select"),
            onadd: function () {
                if (!this.name) {
                    this.name = common.getNextNameDefault("ui-select", "Select");
                }
            },
            oneditprepare: function () {
                common.installReferenceSelectors({ mount: true }).call(this);
                common.installBaseFields(BASE_FIELDS).call(this);
                common.installSizeSelectBox().call(this);
                common.installLayoutChildPropRows().call(this);

                // P133 (ADR 0012 / value category): `label` typedInput — full set.
                // Migration: a legacy plain-string `label` opens as a `str` literal.
                const storedLabel = common.parseBindingValue(this.label);
                const labelBinding = storedLabel
                    ? storedLabel
                    : (typeof this.label === "string" && this.label.length > 0 ? { kind: "literal", value: this.label } : undefined);
                const labelEditor = common.readValueBinding(labelBinding, "");
                const labelInput = $("#node-input-labelBinding");
                labelInput.typedInput({
                    default: labelEditor.type,
                    types: common.valueBindingTypes({ category: "value", currentKind: labelEditor.type })
                });
                labelInput.typedInput("type", labelEditor.type);
                labelInput.typedInput("value", labelEditor.value);

                // P133 (ADR 0012 / value category): `placeholder` typedInput.
                const storedPlaceholder = common.parseBindingValue(this.placeholder);
                const placeholderBinding = storedPlaceholder
                    ? storedPlaceholder
                    : (typeof this.placeholder === "string" && this.placeholder.length > 0 ? { kind: "literal", value: this.placeholder } : undefined);
                const placeholderEditor = common.readValueBinding(placeholderBinding, "");
                const placeholderInput = $("#node-input-placeholderBinding");
                placeholderInput.typedInput({
                    default: placeholderEditor.type,
                    types: common.valueBindingTypes({ category: "value", currentKind: placeholderEditor.type })
                });
                placeholderInput.typedInput("type", placeholderEditor.type);
                placeholderInput.typedInput("value", placeholderEditor.value);

                // P133/P136 (ADR 0012): single shared Options typedInput — json |
                // store, with legacy optionsJson / optionsBinding migration + JSON
                // validation. The same helper backs ui-radio (one source of truth).
                this._saveSelectOptions = common.installOptionsField("#node-input-optionsField", {
                    options: this.options,
                    optionsJson: this.optionsJson,
                    optionsBinding: this.optionsBinding
                });

                // P124 (ADR 0012 / value category): `value` typedInput — full set.
                // Migration: a legacy `valuePath` plain state path becomes a
                // state binding; a stored `value` binding object takes precedence.
                const storedValue = common.parseBindingValue(this.value);
                const valueBinding = storedValue
                    ? storedValue
                    : (this.valuePath ? { kind: "state", path: this.valuePath } : undefined);
                const valueEditor = common.readValueBinding(valueBinding, "");
                const valueInput = $("#node-input-valueBinding");
                valueInput.typedInput({
                    default: valueEditor.type,
                    types: common.valueBindingTypes({ category: "value", currentKind: valueEditor.type })
                });
                valueInput.typedInput("type", valueEditor.type);
                valueInput.typedInput("value", valueEditor.value);

                // P124 (ADR 0012 / boolean category): `disabled` typedInput.
                const storedDisabled = common.parseBindingValue(this.disabled);
                const disabledBinding = storedDisabled ? storedDisabled : undefined;
                const disabledEditor = common.readValueBinding(disabledBinding, "");
                // P181: use 'bool' default when no binding (avoids store fallback).
                const disabledType = disabledEditor.type !== "str" ? disabledEditor.type : "bool";
                const disabledInput = $("#node-input-disabledBinding");
                disabledInput.typedInput({
                    default: disabledType,
                    types: common.valueBindingTypes({ category: "boolean" })
                });
                disabledInput.typedInput("type", disabledType);
                disabledInput.typedInput("value", disabledEditor.value);
                disabledInput.data("base-field-originally-empty", !disabledBinding);

                // P204 (ADR 0027 / writable category): `writeTo` typedInput —
                // Store/Flow/Global only. Legacy storeId+path migrate to a
                // writeTo=store binding; a stored writeTo object takes precedence.
                common.installWriteToField.call(this);
            },
            oneditsave: function () {
                common.applyBaseFields(BASE_FIELDS).call(this);
                // P204: persist writeTo + writeTrigger; drop legacy storeId/path.
                common.saveWriteToField.call(this);

                // P124: persist value as binding object; clear legacy valuePath.
                this.value = common.applyValueBinding(
                    $("#node-input-valueBinding").typedInput("type"),
                    $("#node-input-valueBinding").typedInput("value")
                );
                common.dropLegacyFields(this, ["valuePath"]);
                // P124: persist disabled as binding object.
                // P181: preserve null when field was originally absent and untouched.
                const $disabledInput = $("#node-input-disabledBinding");
                const disabledResult = common.applyValueBinding(
                    $disabledInput.typedInput("type"),
                    $disabledInput.typedInput("value")
                );
                const disabledOriginEmpty = $disabledInput.data("base-field-originally-empty");
                const disabledIsBoolLiteral = disabledResult && disabledResult.kind === "literal"
                    && disabledResult.value === false;
                this.disabled = (disabledOriginEmpty && disabledIsBoolLiteral) ? null : disabledResult;

                // P133: persist label as binding object.
                this.label = common.applyValueBinding(
                    $("#node-input-labelBinding").typedInput("type"),
                    $("#node-input-labelBinding").typedInput("value")
                );

                // P133: persist placeholder as binding object.
                this.placeholder = common.applyValueBinding(
                    $("#node-input-placeholderBinding").typedInput("type"),
                    $("#node-input-placeholderBinding").typedInput("value")
                );

                // P133: persist options as binding object (json literal | store);
                // clear the legacy options fields so they don't shadow the new one.
                this.options = this._saveSelectOptions ? this._saveSelectOptions() : null;
                common.dropLegacyFields(this, ["optionsJson"]);
                this.optionsBinding = "";
            }
        });
    })();
</script>
<!-- P268 (ADR 0042 §3): editor-label i18n. Form-row labels carry data-i18n keys
     per the convention `<node>.label.<field>` (options `<node>.option.<field>.<value>`,
     placeholders `[placeholder]<node>.placeholder.<field>`). Catalogs:
     nodes/view/locales/{en-US,de}/ui-select.json. The literal texts stay as the en-US
     authoring reference; at edit time the catalog text replaces them. -->
<script type="text/html" data-template-name="ui-select">
    <div class="form-row"><label for="node-input-name" data-i18n="node-red:common.label.name">Name</label><input type="text" id="node-input-name"></div>
    <hr style="margin: 8px 0;">
    <div class="form-row"><label for="node-input-mount" data-i18n="ui-select.label.mount">Parent Slot</label><select id="node-input-mount"></select></div>
    <!-- P133 (ADR 0012 / value category): Label binding — typedInput managed in oneditprepare/oneditsave. -->
    <div class="form-row"><label for="node-input-labelBinding" data-i18n="ui-select.label.labelBinding">Label</label><input type="text" id="node-input-labelBinding"></div>
    <!-- P124 (ADR 0012 / value category): Value binding — typedInput managed in oneditprepare/oneditsave. -->
    <div class="form-row"><label for="node-input-valueBinding" data-i18n="ui-select.label.valueBinding">Value</label><input type="text" id="node-input-valueBinding"></div>
    <!-- P204 (ADR 0027 / writable category): writeTo target (WRITE) — Store/Flow/Global; typedInput managed in oneditprepare/oneditsave. -->
    <div class="form-row"><label for="node-input-writeToBinding" data-i18n="ui-select.label.writeToBinding">Write To</label><input type="text" id="node-input-writeToBinding"></div>
    <div class="form-row"><label for="node-input-writeTrigger" data-i18n="ui-select.label.writeTrigger">Write Trigger</label><select id="node-input-writeTrigger"><option value="submit" data-i18n="ui-select.option.writeTrigger.submit">submit</option><option value="change" data-i18n="ui-select.option.writeTrigger.change">change</option><option value="none" data-i18n="ui-select.option.writeTrigger.none">none</option></select></div>
    <!-- P124 (ADR 0012 / boolean category): Disabled binding — typedInput managed in oneditprepare/oneditsave. -->
    <div class="form-row"><label for="node-input-disabledBinding" data-i18n="ui-select.label.disabledBinding">Disabled</label><input type="text" id="node-input-disabledBinding"></div>
    <!-- P133 (ADR 0012): single Options field — json (NR JSON editor) | store. -->
    <div class="form-row"><label for="node-input-optionsField" data-i18n="ui-select.label.optionsField">Options</label><input type="text" id="node-input-optionsField"></div>
    <!-- P133 (ADR 0012 / value category): Placeholder binding. -->
    <div class="form-row"><label for="node-input-placeholderBinding" data-i18n="ui-select.label.placeholderBinding">Placeholder</label><input type="text" id="node-input-placeholderBinding"></div>
    <div class="form-row"><label for="node-input-multiple" data-i18n="ui-select.label.multiple">Multiple</label><input type="checkbox" id="node-input-multiple" style="width:auto"></div>
</script>
<!-- P268 (ADR 0042): help + labels are locale-migrated. Help lives in
     nodes/view/locales/{en-US,de}/ui-select.html; form-row labels carry
     data-i18n keys resolved from nodes/view/locales/{en-US,de}/ui-select.json.
     No inline data-help-name block here. -->
