<script type="text/javascript" src="resources/node-red-contrib-webapp/lib/editor-common.js"></script>
<script type="text/javascript">
    (function () {
        const common = window.WebappEditorCommon;

        // P222 (ADR 0015): common base fields. See the applicability table in
        // docs/nodes/concepts/editor.md. `omit` drops a field the node already
        // owns a dedicated control for (avoids duplicate #node-input carrier ids).
        const BASE_FIELDS = {
            visible: true,
            disabled: true,
            color: false,
            size: false,
            variant: false,
            advanced: ["size"],
            omit: ["disabled"],
            // P268 (ADR 0042 §3): N/A hints live in the node's OWN locale catalog
            // (nodes/view/locales/<lang>/ui-radio.json -> `ui-radio.hints.<field>`).
            i18nNode: "ui-radio"
        };
        common.registerNodeType("ui-radio", {
            category: "webapp view",
            color: "#f4efcf",
            defaults: {
                visible: { value: null },
                visibleBinding: { value: "" },
                name: { value: "" },
                app: { value: "" },
                mount: { value: "", required: true },
                // P136 (ADR 0012): `label` persists the binding OBJECT (literal
                // string or dynamic binding); the typedInput lives on
                // #node-input-labelBinding. A legacy plain-string `label` migrates.
                // Required: the labelBinding typedInput must carry a non-empty value.
                label: {
                    value: "",
                    required: true,
                    validate: function () {
                        var el = $("#node-input-labelBinding");
                        if (el.length && typeof el.typedInput === "function") {
                            var v = el.typedInput("value");
                            return v !== undefined && v !== null && String(v).length > 0;
                        }
                        // Pre-open (no typedInput yet): trust the persisted binding.
                        var b = this.label;
                        if (b && typeof b === "object") {
                            return b.value !== undefined && b.value !== null && String(b.value).length > 0
                                ? true
                                : (typeof b.path === "string" && b.path.length > 0);
                        }
                        return typeof b === "string" && b.length > 0;
                    }
                },
                labelBinding: { value: "" },
                // P127 (ADR 0012): `value` persists the binding OBJECT; there is no
                // matching #node-input-value element so Node-RED auto-save cannot
                // clobber it. The typedInput lives on #node-input-valueBinding.
                // Legacy `valuePath` (pre-P127 plain state path) is kept for migration only.
                value: { value: null },
                valueBinding: { value: "" },
                // P136 (ADR 0012): single Options field — `options` persists the
                // binding OBJECT (json literal | store). The typedInput lives on
                // #node-input-optionsField. Legacy `optionsJson`/`optionsBinding`
                // strings are kept for migration only (shared helper with ui-select).
                options: { value: null },
                optionsField: { value: "" },
                optionsBinding: { value: "" },
                orientation: { value: "vertical" },
                // P127 (ADR 0012 / boolean category): `disabled` persists the binding
                // OBJECT; there is no matching #node-input-disabled element so
                // Node-RED auto-save cannot clobber it. The typedInput lives on
                // #node-input-disabledBinding.
                disabled: { value: null },
                disabledBinding: { value: "" },
                // P204 (ADR 0027): `writeTo` — WRITE half (store/flow/global). A
                // radio group has no submit gesture → writes on change regardless
                // of writeTrigger. Legacy storeId/path migrate to writeTo=store.
                writeTo: { value: null },
                writeToBinding: { value: "" },
                writeTrigger: { value: "submit" },

                order: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                row: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                col: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                colSize: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                rowSize: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                layoutX: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                layoutY: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } }
            },
            // P229 (ADR 0038): migration-only legacy fields — injected as hidden
            // defaults at registration (see editor-common withMigrationDefaults);
            // migrated to `writeTo` on open, deleted on save, never written anew.
            migrationFields: ["storeId", "path", "valuePath", "optionsJson"],
            inputs: 1,
            outputs: 1,
            outputLabels: function () { return "event"; },
            icon: "font-awesome/fa-dot-circle-o",
            label: common.labelWithName("ui-radio"),
            onadd: function () {
                if (!this.name) {
                    this.name = common.getNextNameDefault("ui-radio", "Radio");
                }
            },
            oneditprepare: function () {
                common.installReferenceSelectors({ mount: true }).call(this);
                common.installBaseFields(BASE_FIELDS).call(this);
                common.installLayoutChildPropRows().call(this);

                // P136 (ADR 0012 / value category): `label` typedInput — full set.
                // Migration: a legacy plain-string `label` opens as a `str` literal.
                const storedLabel = common.parseBindingValue(this.label);
                const labelBinding = storedLabel
                    ? storedLabel
                    : (typeof this.label === "string" && this.label.length > 0 ? { kind: "literal", value: this.label } : undefined);
                const labelEditor = common.readValueBinding(labelBinding, "");
                const labelInput = $("#node-input-labelBinding");
                labelInput.typedInput({
                    default: labelEditor.type,
                    types: common.valueBindingTypes({ category: "value", currentKind: labelEditor.type })
                });
                labelInput.typedInput("type", labelEditor.type);
                labelInput.typedInput("value", labelEditor.value);

                // P136 (ADR 0012): single shared Options typedInput — json | store,
                // with legacy optionsJson / optionsBinding migration + JSON
                // validation. The same helper backs ui-select (one source of truth).
                this._saveOptions = common.installOptionsField("#node-input-optionsField", {
                    options: this.options,
                    optionsJson: this.optionsJson,
                    optionsBinding: this.optionsBinding
                });

                // P127 (ADR 0012 / value/display category): `value` typedInput — full
                // canonical set. Migration: a legacy `valuePath` plain string becomes a
                // state binding; a stored `value` binding object takes precedence.
                const storedValue = common.parseBindingValue(this.value);
                const valueBinding = storedValue
                    ? storedValue
                    : (this.valuePath ? { kind: "state", path: this.valuePath } : undefined);
                const valueEditor = common.readValueBinding(valueBinding, "");
                const valueInput = $("#node-input-valueBinding");
                valueInput.typedInput({
                    default: valueEditor.type,
                    types: common.valueBindingTypes({ category: "value", currentKind: valueEditor.type })
                });
                valueInput.typedInput("type", valueEditor.type);
                valueInput.typedInput("value", valueEditor.value);

                // P127 (ADR 0012 / boolean category): `disabled` typedInput.
                // No legacy to migrate (new field).
                const storedDisabled = common.parseBindingValue(this.disabled);
                const disabledBinding = storedDisabled ? storedDisabled : undefined;
                const disabledEditor = common.readValueBinding(disabledBinding, "");
                // P181: use 'bool' default when no binding (avoids store fallback).
                const disabledType = disabledEditor.type !== "str" ? disabledEditor.type : "bool";
                const disabledInput = $("#node-input-disabledBinding");
                disabledInput.typedInput({
                    default: disabledType,
                    types: common.valueBindingTypes({ category: "boolean" })
                });
                disabledInput.typedInput("type", disabledType);
                disabledInput.typedInput("value", disabledEditor.value);
                disabledInput.data("base-field-originally-empty", !disabledBinding);

                // P204 (ADR 0027 / writable category): `writeTo` typedInput.
                common.installWriteToField.call(this);
            },
            oneditsave: function () {
                common.applyBaseFields(BASE_FIELDS).call(this);
                // P204: persist writeTo + writeTrigger; drop legacy storeId/path.
                common.saveWriteToField.call(this);

                // P127: persist value as binding object; clear legacy valuePath.
                this.value = common.applyValueBinding(
                    $("#node-input-valueBinding").typedInput("type"),
                    $("#node-input-valueBinding").typedInput("value")
                );
                common.dropLegacyFields(this, ["valuePath"]);
                // P127: persist disabled as binding object.
                // P181: preserve null when field was originally absent and untouched.
                const $disabledInput = $("#node-input-disabledBinding");
                const disabledResult = common.applyValueBinding(
                    $disabledInput.typedInput("type"),
                    $disabledInput.typedInput("value")
                );
                const disabledOriginEmpty = $disabledInput.data("base-field-originally-empty");
                const disabledIsBoolLiteral = disabledResult && disabledResult.kind === "literal"
                    && disabledResult.value === false;
                this.disabled = (disabledOriginEmpty && disabledIsBoolLiteral) ? null : disabledResult;

                // P136: persist label as binding object (literal string | binding).
                this.label = common.applyValueBinding(
                    $("#node-input-labelBinding").typedInput("type"),
                    $("#node-input-labelBinding").typedInput("value")
                );

                // P136: persist options as binding object (json literal | store);
                // clear the legacy options fields so they don't shadow the new one.
                this.options = this._saveOptions ? this._saveOptions() : null;
                common.dropLegacyFields(this, ["optionsJson"]);
                this.optionsBinding = "";
            }
        });
    })();
</script>
<!-- P268 (ADR 0042 §3): editor-label i18n. Form-row labels carry data-i18n keys
     per the convention `<node>.label.<field>` (options `<node>.option.<field>.<value>`,
     placeholders `[placeholder]<node>.placeholder.<field>`). Catalogs:
     nodes/view/locales/{en-US,de}/ui-radio.json. The literal texts stay as the en-US
     authoring reference; at edit time the catalog text replaces them. -->
<script type="text/html" data-template-name="ui-radio">
    <div class="form-row"><label for="node-input-name" data-i18n="node-red:common.label.name">Name</label><input type="text" id="node-input-name"></div>
    <hr style="margin: 8px 0;">
    <div class="form-row"><label for="node-input-mount" data-i18n="ui-radio.label.mount">Parent Slot</label><select id="node-input-mount"></select></div>
    <!-- P136 (ADR 0012 / value category): Label binding — typedInput managed in oneditprepare/oneditsave. -->
    <!-- Hidden input so NR auto-save can resolve the `label` default without clobbering the binding object. -->
    <input type="hidden" id="node-input-label">
    <div class="form-row"><label for="node-input-labelBinding" data-i18n="ui-radio.label.labelBinding">Label</label><input type="text" id="node-input-labelBinding"></div>
    <!-- P127 (ADR 0012 / value/display category): Value binding — typedInput managed in oneditprepare/oneditsave. -->
    <div class="form-row"><label for="node-input-valueBinding" data-i18n="ui-radio.label.valueBinding">Value</label><input type="text" id="node-input-valueBinding"></div>
    <!-- P204 (ADR 0027 / writable category): writeTo target (WRITE) — Store/Flow/Global. -->
    <div class="form-row"><label for="node-input-writeToBinding" data-i18n="ui-radio.label.writeToBinding">Write To</label><input type="text" id="node-input-writeToBinding"></div>
    <div class="form-row"><label for="node-input-writeTrigger" data-i18n="ui-radio.label.writeTrigger">Write Trigger</label><select id="node-input-writeTrigger"><option value="submit" data-i18n="ui-radio.option.writeTrigger.submit">submit</option><option value="change" data-i18n="ui-radio.option.writeTrigger.change">change</option><option value="none" data-i18n="ui-radio.option.writeTrigger.none">none</option></select></div>
    <!-- P136 (ADR 0012): single Options field — json (NR JSON editor) | store. Shared helper with ui-select. -->
    <div class="form-row"><label for="node-input-optionsField" data-i18n="ui-radio.label.optionsField">Options</label><input type="text" id="node-input-optionsField"></div>
    <div class="form-row"><label for="node-input-orientation" data-i18n="ui-radio.label.orientation">Orientation</label>
        <select id="node-input-orientation">
            <option value="vertical" data-i18n="ui-radio.option.orientation.vertical">vertical</option>
            <option value="horizontal" data-i18n="ui-radio.option.orientation.horizontal">horizontal</option>
        </select>
    </div>
    <!-- P127 (ADR 0012 / boolean category): Disabled binding — typedInput managed in oneditprepare/oneditsave. -->
    <div class="form-row"><label for="node-input-disabledBinding" data-i18n="ui-radio.label.disabledBinding">Disabled</label><input type="text" id="node-input-disabledBinding"></div>
</script>
<!-- P268 (ADR 0042): help + labels are locale-migrated. Help lives in
     nodes/view/locales/{en-US,de}/ui-radio.html; form-row labels carry
     data-i18n keys resolved from nodes/view/locales/{en-US,de}/ui-radio.json.
     No inline data-help-name block here. -->
