<script type="text/javascript" src="resources/node-red-contrib-webapp/lib/editor-common.js"></script>
<script type="text/javascript">
    (function () {
        const common = window.WebappEditorCommon;

        // P222 (ADR 0015): common base fields. See the applicability table in
        // docs/nodes/concepts/editor.md. `omit` drops a field the node already
        // owns a dedicated control for (avoids duplicate #node-input carrier ids).
        const BASE_FIELDS = {
            visible: true,
            disabled: false,
            color: true,
            size: false,
            variant: false,
            advanced: ["size"],
            omit: [],
            hints: {
                disabled: "Ein Stepper zeigt den Fortschritt und hat keinen Deaktiviert-Zustand.",
                size: "Dieser Knoten hat keine Größen-Stufen."
            }
        };
        common.registerNodeType("ui-stepper", {
            category: "webapp view",
            color: "#f4efcf",
            defaults: {
                visible: { value: null },
                visibleBinding: { value: "" },
                color: { value: null },
                colorBinding: { value: "" },
                name: { value: "" },
                app: { value: "" },
                mount: { value: "", required: true },
                steps: { value: "" },
                // P156 (ADR 0012): `activeStep` (two-way value typedInput) persists the
                // binding OBJECT; there is no matching #node-input-activeStep element so
                // Node-RED auto-save cannot clobber it. The typedInput lives on
                // #node-input-activeStepBinding. Legacy `activeStepPath` (pre-P156 plain
                // state path) is kept for migration only.
                activeStep: { value: null },
                activeStepBinding: { value: "" },
                orientation: { value: "horizontal" },
                events: { value: "" },
                order: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                row: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                col: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                colSize: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                rowSize: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                layoutX: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                layoutY: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } }
            },
            // P229 (ADR 0038): migration-only legacy fields — injected as hidden
            // defaults at registration (see editor-common withMigrationDefaults);
            // migrated to the canonical binding on open, deleted on save.
            migrationFields: ["activeStepPath"],
            inputs: 1,
            outputs: 1,
            outputLabels: function () { return "event"; },
            icon: "font-awesome/fa-step-forward",
            label: common.labelWithName("ui-stepper"),
            onadd: function () {
                if (!this.name) {
                    this.name = common.getNextNameDefault("ui-stepper", "Stepper");
                }
            },
            oneditprepare: function () {
                common.installReferenceSelectors({ mount: true }).call(this);
                common.installBaseFields(BASE_FIELDS).call(this);
                common.installLayoutChildPropRows().call(this);

                // P156 (ADR 0012 / value category): `activeStep` typedInput — full
                // canonical set with literal default type `str` (a step id). This is the
                // TWO-WAY input value: it reads the active step from the bound Store/state
                // AND the step-change event carries the chosen step id for the wired
                // write-back loop. Migration: a legacy `activeStepPath` plain string
                // becomes a state binding; a stored `activeStep` binding wins.
                const storedActive = common.parseBindingValue(this.activeStep);
                const activeBinding = storedActive
                    ? storedActive
                    : (this.activeStepPath ? { kind: "state", path: this.activeStepPath } : undefined);
                const activeEditor = common.readValueBinding(activeBinding, "");
                const activeInput = $("#node-input-activeStepBinding");
                activeInput.typedInput({
                    default: activeEditor.type,
                    types: common.valueBindingTypes({ category: "value", currentKind: activeEditor.type })
                });
                activeInput.typedInput("type", activeEditor.type);
                activeInput.typedInput("value", activeEditor.value);
            },
            oneditsave: function () {
                common.applyBaseFields(BASE_FIELDS).call(this);
                // P156: persist activeStep as a binding object; clear the legacy path.
                this.activeStep = common.applyValueBinding(
                    $("#node-input-activeStepBinding").typedInput("type"),
                    $("#node-input-activeStepBinding").typedInput("value")
                );
                common.dropLegacyFields(this, ["activeStepPath"]);
            }
        });
    })();
</script>
<script type="text/html" data-template-name="ui-stepper">
    <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
    <hr style="margin: 8px 0;">
    <div class="form-row"><label for="node-input-mount">Parent Slot</label><select id="node-input-mount"></select></div>
    <div class="form-row"><label for="node-input-steps">Steps (JSON array)</label><input type="text" id="node-input-steps" placeholder='[{"id":"s1","label":"Step 1"},{"id":"s2","label":"Step 2"}]'></div>
    <!-- P156 (ADR 0012 / value category): Active Step binding (two-way) — typedInput managed in oneditprepare/oneditsave. -->
    <div class="form-row"><label for="node-input-activeStepBinding">Active Step</label><input type="text" id="node-input-activeStepBinding"></div>
    <div class="form-row"><label for="node-input-orientation">Orientation</label>
        <select id="node-input-orientation">
            <option value="horizontal">Horizontal</option>
            <option value="vertical">Vertical</option>
        </select>
    </div>
</script>
<script type="text/html" data-help-name="ui-stepper">
<p>Mehrschritt-Prozessanzeige für geführte Workflows. Emittiert beim Schrittwechsel ein Change-Event mit der gewählten Step-ID.</p>
<h4>Active Step (P156)</h4>
<p>Bindbare, <strong>zweiseitige</strong> Quelle des aktiven Schritts (Step-ID) — voller
kanonischer Satz (ADR 0012): Store, Query, Route-Param, Reactive, msg, JSONata, string,
number, boolean, json, timestamp, Flow, Global, Env. Liest den aktiven Schritt aus dem
gebundenen Store/State; der Schrittwechsel emittiert das Change-Event mit der neuen
Step-ID, das im Flow zurück in den Store geschrieben wird (Roundtrip). Default-Typ:
<code>string</code>. Ein bestehender <code>activeStepPath</code> wird automatisch als
<code>state</code>-Binding übernommen.</p>
<p>Doku: <a href="https://github.com/ollixx/node-red-contrib-webapp/blob/develop/docs/nodes/navigation/ui-stepper.md" target="_blank">ui-stepper</a>.</p>
</script>
