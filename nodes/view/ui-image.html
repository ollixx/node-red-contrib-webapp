<script type="text/javascript" src="resources/node-red-contrib-webapp/lib/editor-common.js"></script>
<script type="text/javascript">
    (function () {
        const common = window.WebappEditorCommon;
        common.registerNodeType("ui-image", {
            category: "webapp view",
            color: "#f4efcf",
            defaults: {
                name: { value: "" },
                parent: { value: "" },
                mount: { value: "", required: true },
                srcPath: { value: "" },
                src: { value: null },
                alt: { value: "" },
                fallback: { value: "" },
                width: { value: "" },
                height: { value: "" },
                order: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                row: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                col: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                colSize: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                rowSize: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                layoutX: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                layoutY: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } }
            },
            inputs: 1,
            outputs: 0,
            icon: "font-awesome/fa-image",
            label: common.labelWithName("ui-image"),
            onadd: function () {
                if (!this.name) {
                    this.name = common.getNextNameDefault("ui-image", "Image");
                }
            },
            oneditprepare: function () {
                common.installReferenceSelectors({ mount: true }).call(this);
                common.installLayoutChildPropRows().call(this);
            }
        });
    })();
</script>
<script type="text/html" data-template-name="ui-image">
    <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
    <hr style="margin: 8px 0;">
    <div class="form-row"><label for="node-input-mount">Parent Slot</label><select id="node-input-mount"></select></div>
    <div class="form-row"><label for="node-input-srcPath">Src Path</label><input type="text" id="node-input-srcPath" placeholder="state.path.to.src"></div>
    <div class="form-row"><label for="node-input-alt">Alt Text</label><input type="text" id="node-input-alt"></div>
    <div class="form-row"><label for="node-input-fallback">Fallback URL</label><input type="text" id="node-input-fallback" placeholder="https://..."></div>
    <div class="form-row"><label for="node-input-width">Width</label><input type="text" id="node-input-width" placeholder="e.g. 200 or 100%"></div>
    <div class="form-row"><label for="node-input-height">Height</label><input type="text" id="node-input-height" placeholder="e.g. 150"></div>
</script>
<script type="text/html" data-help-name="ui-image"><p>Zeigt ein Bild mit optionaler Src-Bindung, Alt-Text und Fallback-URL.</p></script>
