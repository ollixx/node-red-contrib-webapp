<script type="text/javascript" src="resources/node-red-contrib-webapp/lib/editor-common.js"></script>
<script type="text/javascript">
    (function () {
        const common = window.WebappEditorCommon;

        // P222 (ADR 0015): common base fields. See the applicability table in
        // docs/nodes/concepts/editor.md. `omit` drops a field the node already
        // owns a dedicated control for (avoids duplicate #node-input carrier ids).
        const BASE_FIELDS = {
            visible: true,
            disabled: false,
            color: false,
            size: false,
            variant: true,
            advanced: ["size"],
            omit: [],
            i18nNode: "ui-badge",
            hints: {
                disabled: "Ein Badge hat keinen interaktiven Zustand.",
                size: "Dieser Knoten hat keine Größen-Stufen."
            }
        };
        common.registerNodeType("ui-badge", {
            category: "webapp view",
            color: "#f4efcf",
            defaults: {
                visible: { value: null },
                visibleBinding: { value: "" },
                name: { value: "" },
                app: { value: "" },
                mount: { value: "", required: true },
                // P153 (ADR 0012): `value` persists the binding OBJECT; there is no
                // matching #node-input-value element so Node-RED auto-save cannot
                // clobber it. The typedInput lives on #node-input-valueBinding.
                // Legacy `valuePath` (pre-P153 plain state path) is kept for migration only.
                value: { value: null },
                valueBinding: { value: "" },
                // P92: displayType is now shape (square/rounded/pill).
                displayType: { value: "rounded" },
                // P92: variant (renamed from severity).
                variant: { value: "neutral" },
                // P92: severity kept as back-compat for old flows that saved it.
                severity: { value: "" },
                // P92: pulsating (maps to Shoelace `pulse` attr).
                pulsating: { value: false },
                // P103: size removed — no longer a badge field.
                order: { value: "", validate: function (value) { return value == null || value === "" || RED.validators.number()(value); } },
                row: { value: "", validate: function (value) { return value == null || value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                col: { value: "", validate: function (value) { return value == null || value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                colSize: { value: "", validate: function (value) { return value == null || value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                rowSize: { value: "", validate: function (value) { return value == null || value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                layoutX: { value: "", validate: function (value) { return value == null || value === "" || RED.validators.number()(value); } },
                layoutY: { value: "", validate: function (value) { return value == null || value === "" || RED.validators.number()(value); } }
            },
            // P229 (ADR 0038): migration-only legacy fields — injected as hidden
            // defaults at registration (see editor-common withMigrationDefaults);
            // migrated to the canonical binding on open, deleted on save.
            migrationFields: ["valuePath"],
            inputs: 1,
            outputs: 0,
            icon: "font-awesome/fa-circle",
            label: common.labelWithName("ui-badge"),
            onadd: function () {
                if (!this.name) {
                    this.name = common.getNextNameDefault("ui-badge", "Badge");
                }
            },
            oneditprepare: function () {
                common.installReferenceSelectors({ mount: true }).call(this);
                common.installBaseFields(BASE_FIELDS).call(this);
                common.installLayoutChildPropRows().call(this);

                // P153 (ADR 0012 / value/display category): `value` typedInput — full
                // canonical set with literal default type `str` (badge shows text/count).
                // Migration: a legacy `valuePath` plain string becomes a state binding;
                // a stored `value` binding object takes precedence.
                const storedValue = common.parseBindingValue(this.value);
                const valueBinding = storedValue
                    ? storedValue
                    : (this.valuePath ? { kind: "state", path: this.valuePath } : undefined);
                const valueEditor = common.readValueBinding(valueBinding, "");
                const valueInput = $("#node-input-valueBinding");
                valueInput.typedInput({
                    default: valueEditor.type,
                    types: common.valueBindingTypes({ category: "value", currentKind: valueEditor.type })
                });
                valueInput.typedInput("type", valueEditor.type);
                valueInput.typedInput("value", valueEditor.value);
            },
            oneditsave: function () {
                common.applyBaseFields(BASE_FIELDS).call(this);
                // P153: persist value as binding object; clear legacy valuePath.
                this.value = common.applyValueBinding(
                    $("#node-input-valueBinding").typedInput("type"),
                    $("#node-input-valueBinding").typedInput("value")
                );
                common.dropLegacyFields(this, ["valuePath"]);
            }
        });
    })();
</script>
<script type="text/html" data-template-name="ui-badge">
    <div class="form-row"><label for="node-input-name" data-i18n="node-red:common.label.name">Name</label><input type="text" id="node-input-name"></div>
    <hr style="margin: 8px 0;">
    <div class="form-row"><label for="node-input-mount" data-i18n="ui-badge.label.mount">Parent Slot</label><select id="node-input-mount"></select></div>
    <!-- P153 (ADR 0012 / value/display category): Value binding — typedInput managed in oneditprepare/oneditsave. -->
    <div class="form-row"><label for="node-input-valueBinding" data-i18n="ui-badge.label.value">Value</label><input type="text" id="node-input-valueBinding"></div>
    <div class="form-row">
        <label for="node-input-displayType" data-i18n="ui-badge.label.displayType">Display Type</label>
        <select id="node-input-displayType">
            <option value="rounded" data-i18n="ui-badge.option.displayType.rounded">Rounded (Default)</option>
            <option value="pill" data-i18n="ui-badge.option.displayType.pill">Pill</option>
            <option value="square" data-i18n="ui-badge.option.displayType.square">Square</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-variant" data-i18n="ui-badge.label.variant">Variant</label>
        <select id="node-input-variant">
            <option value="neutral" data-i18n="ui-badge.option.variant.neutral">Neutral (Default)</option>
            <option value="primary" data-i18n="ui-badge.option.variant.primary">Primary</option>
            <option value="info" data-i18n="ui-badge.option.variant.info">Info</option>
            <option value="success" data-i18n="ui-badge.option.variant.success">Success</option>
            <option value="warning" data-i18n="ui-badge.option.variant.warning">Warning</option>
            <option value="danger" data-i18n="ui-badge.option.variant.danger">Danger</option>
        </select>
    </div>
    <div class="form-row">
        <label>&nbsp;</label>
        <input type="checkbox" id="node-input-pulsating" style="width:auto; margin-right:8px;">
        <label for="node-input-pulsating" data-i18n="ui-badge.label.pulsating" style="width:auto; font-weight:normal;">Pulsating</label>
        <span style="margin-left:8px; color:#888; font-size:0.85em;" title="Das Shoelace-Backend unterstützt Pulsieren nativ (pulse-Attribut). Andere Backends können einen CSS-Animationsfallback einsetzen.">ℹ</span>
    </div>
</script>
