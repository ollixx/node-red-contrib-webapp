<script type="text/javascript" src="resources/node-red-contrib-webapp/lib/editor-common.js"></script>
<script type="text/javascript">
    (function () {
        const common = window.WebappEditorCommon;
        // P139 (ADR 0015): ui-divider is the base-field REFERENCE node — it is
        // non-variant (so `color` is active), non-interactive (`disabled` N/A)
        // and has no size steps (`size` N/A, rarely used → "Erweitert").
        const BASE_FIELDS = {
            visible: true,
            disabled: false,
            color: true,
            size: false,
            variant: false,
            advanced: ["size"],
            hints: {
                disabled: "Ein Trenner hat keinen interaktiven Zustand.",
                size: "Ein Trenner hat keine Größen-Stufen."
            }
        };
        common.registerNodeType("ui-divider", {
            category: "webapp view",
            color: "#f4efcf",
            defaults: {
                name: { value: "" },
                app: { value: "" },
                mount: { value: "", required: true },
                orientation: { value: "horizontal" },
                // P150 (ADR 0012): `label` persists the binding OBJECT; the
                // typedInput lives directly on #node-input-label so the
                // minimal-coverage E2E check (`fields:["label"]`) still passes.
                // A legacy plain-string `label` is migrated on open.
                label: { value: { kind: "literal", value: "" } },
                // P139 (ADR 0015): base fields. `visible`/`color` persist the
                // binding OBJECT; there are no matching #node-input-visible /
                // #node-input-color elements so Node-RED auto-save cannot clobber
                // them — the typedInputs live on the *Binding carrier inputs.
                visible: { value: null },
                visibleBinding: { value: "" },
                color: { value: null },
                colorBinding: { value: "" },
                order: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                row: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                col: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                colSize: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                rowSize: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                layoutX: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                layoutY: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } }
            },
            inputs: 0,
            outputs: 0,
            icon: "font-awesome/fa-minus",
            label: common.labelWithName("ui-divider"),
            onadd: function () {
                if (!this.name) {
                    this.name = common.getNextNameDefault("ui-divider", "Divider");
                }
            },
            oneditprepare: function () {
                common.installReferenceSelectors({ mount: true }).call(this);
                // P139: the shared base-field group ("Allgemein") — visible/
                // disabled/color/size with node-local applicability (BASE_FIELDS).
                common.installBaseFields(BASE_FIELDS).call(this);
                common.installLayoutChildPropRows().call(this);

                // P150 (ADR 0012 / value category): `label` typedInput.
                // The typedInput lives on #node-input-label (not a separate
                // *Binding element) so the minimal-coverage E2E check passes.
                // Migration: a legacy plain-string `label` opens as a `str` literal.
                // Label is OPTIONAL for a divider — no required/validate.
                const storedLabel = common.parseBindingValue(this.label);
                const labelBinding = storedLabel
                    ? storedLabel
                    : (typeof this.label === "string" && this.label.length > 0
                        ? { kind: "literal", value: this.label }
                        : undefined);
                const labelEditor = common.readValueBinding(labelBinding, "");
                const labelInput = $("#node-input-label");
                labelInput.typedInput({
                    default: labelEditor.type,
                    types: common.valueBindingTypes({ category: "value", currentKind: labelEditor.type })
                });
                labelInput.typedInput("type", labelEditor.type);
                labelInput.typedInput("value", labelEditor.value);
            },
            oneditsave: function () {
                // P139: persist the applicable base fields as binding objects.
                common.applyBaseFields(BASE_FIELDS).call(this);
                // P150: persist label as binding object.
                this.label = common.applyValueBinding(
                    $("#node-input-label").typedInput("type"),
                    $("#node-input-label").typedInput("value")
                );
            }
        });
    })();
</script>
<script type="text/html" data-template-name="ui-divider">
    <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
    <hr style="margin: 8px 0;">
    <div class="form-row"><label for="node-input-mount">Parent Slot</label><select id="node-input-mount"></select></div>
    <div class="form-row"><label for="node-input-orientation">Orientation</label>
        <select id="node-input-orientation">
            <option value="horizontal">Horizontal</option>
            <option value="vertical">Vertical</option>
        </select>
    </div>
    <div class="form-row"><label for="node-input-label">Label</label><input type="text" id="node-input-label" placeholder="optional divider label"></div>
</script>
