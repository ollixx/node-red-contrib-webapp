<script type="text/javascript" src="resources/node-red-contrib-webapp/lib/editor-common.js"></script>
<script type="text/javascript">
    (function () {
        const common = window.WebappEditorCommon;
        common.registerNodeType("ui-input", {
            category: "webapp view",
            color: "#f4efcf",
            defaults: {
                name: { value: "" },
                parent: { value: "" },
                mount: { value: "", required: true },
                // P145 (ADR 0012): `label` persists the binding OBJECT; the
                // typedInput lives directly on #node-input-label so the
                // minimal-coverage E2E check still passes.
                // A legacy plain-string `label` is migrated on open.
                // Required: the typedInput must carry a non-empty value.
                label: {
                    value: { kind: "literal", value: "" },
                    required: true,
                    validate: function () {
                        var el = $("#node-input-label");
                        if (el.length && typeof el.typedInput === "function") {
                            var v = el.typedInput("value");
                            return v !== undefined && v !== null && String(v).length > 0;
                        }
                        // Pre-open (no typedInput yet): trust the persisted binding.
                        var b = this.label;
                        if (b && typeof b === "object") {
                            return b.value !== undefined && b.value !== null && String(b.value).length > 0
                                ? true
                                : (typeof b.path === "string" && b.path.length > 0);
                        }
                        return typeof b === "string" && b.length > 0;
                    },
                    serialize: function () {
                        var el = $("#node-input-label");
                        if (el.length && typeof el.typedInput === "function") {
                            var v = el.typedInput("value");
                            return common.applyValueBinding(el.typedInput("type"), v || "");
                        }
                        // Pre-open (no typedInput yet): trust the persisted binding.
                        var b = this.label;
                        return b && typeof b === "object" ? b : { kind: "literal", value: b || "" };
                    }
                },
                // P123 (ADR 0012): `value` persists the binding OBJECT; there is no
                // matching #node-input-value element so Node-RED auto-save cannot
                // clobber it. The typedInput lives on #node-input-valueBinding.
                // Legacy `valuePath` (pre-P123 plain state path) is kept for migration only.
                valuePath: { value: "" },
                value: { value: null },
                valueBinding: { value: "" },
                storeId: { value: "" },
                path: { value: "" },
                inputType: { value: "text", required: true },
                variant: { value: "default" },
                size: { value: "" },
                // P123 (ADR 0012 / boolean category): `disabled` persists the binding
                // OBJECT; there is no matching #node-input-disabled element so
                // Node-RED auto-save cannot clobber it. The typedInput lives on
                // #node-input-disabledBinding.
                disabled: { value: null },
                disabledBinding: { value: "" },
                order: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                row: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                col: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                colSize: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                rowSize: { value: "", validate: function (value) { return value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                layoutX: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } },
                layoutY: { value: "", validate: function (value) { return value === "" || RED.validators.number()(value); } }
            },
            inputs: 1,
            outputs: 1,
            outputLabels: function () { return "event"; },
            icon: "font-awesome/fa-i-cursor",
            label: common.labelWithName("ui-input"),
            onadd: function () {
                if (!this.name) {
                    this.name = common.getNextNameDefault("ui-input", "Input");
                }
            },
            oneditprepare: function () {
                common.installReferenceSelectors({ mount: true, store: true }).call(this);
                common.installVariantSelectBox("input").call(this);
                common.installSizeSelectBox().call(this);
                common.installLayoutChildPropRows().call(this);

                // P145 (ADR 0012 / value category): `label` typedInput.
                // The typedInput lives on #node-input-label (not a separate
                // *Binding element) so the convention `fields:["label"]` is satisfied.
                // Migration: a legacy plain-string `label` opens as a `str` literal.
                const storedLabel = common.parseBindingValue(this.label);
                const labelBinding = storedLabel
                    ? storedLabel
                    : (typeof this.label === "string" && this.label.length > 0
                        ? { kind: "literal", value: this.label }
                        : undefined);
                const labelEditor = common.readValueBinding(labelBinding, "");
                const labelInput = $("#node-input-label");
                labelInput.typedInput({
                    default: labelEditor.type,
                    types: common.valueBindingTypes({ category: "display", currentKind: labelEditor.type })
                });
                labelInput.typedInput("type", labelEditor.type);
                labelInput.typedInput("value", labelEditor.value);

                // P123 (ADR 0012 / value/display category): `value` typedInput — full
                // canonical set. Migration: a legacy `valuePath` plain string becomes a
                // state binding; a stored `value` binding object takes precedence.
                const storedValue = common.parseBindingValue(this.value);
                const valueBinding = storedValue
                    ? storedValue
                    : (this.valuePath ? { kind: "state", path: this.valuePath } : undefined);
                const valueEditor = common.readValueBinding(valueBinding, "");
                const valueInput = $("#node-input-valueBinding");
                valueInput.typedInput({
                    default: valueEditor.type,
                    types: common.valueBindingTypes({ category: "value", currentKind: valueEditor.type })
                });
                valueInput.typedInput("type", valueEditor.type);
                valueInput.typedInput("value", valueEditor.value);

                // P123 (ADR 0012 / boolean category): `disabled` typedInput.
                // No legacy to migrate (new field).
                const storedDisabled = common.parseBindingValue(this.disabled);
                const disabledBinding = storedDisabled ? storedDisabled : undefined;
                const disabledEditor = common.readValueBinding(disabledBinding, "");
                // P181: use 'bool' default when no binding (avoids store fallback).
                const disabledType = disabledEditor.type !== "str" ? disabledEditor.type : "bool";
                const disabledInput = $("#node-input-disabledBinding");
                disabledInput.typedInput({
                    default: disabledType,
                    types: common.valueBindingTypes({ category: "boolean" })
                });
                disabledInput.typedInput("type", disabledType);
                disabledInput.typedInput("value", disabledEditor.value);
                disabledInput.data("base-field-originally-empty", !disabledBinding);
            },
            oneditsave: function () {
                // P145: persist label as binding object.
                this.label = common.applyValueBinding(
                    $("#node-input-label").typedInput("type"),
                    $("#node-input-label").typedInput("value")
                );

                // P123: persist value as binding object; clear legacy valuePath.
                this.value = common.applyValueBinding(
                    $("#node-input-valueBinding").typedInput("type"),
                    $("#node-input-valueBinding").typedInput("value")
                );
                this.valuePath = "";

                // P123: persist disabled as binding object.
                // P181: preserve null when field was originally absent and untouched.
                const $disabledInput = $("#node-input-disabledBinding");
                const disabledResult = common.applyValueBinding(
                    $disabledInput.typedInput("type"),
                    $disabledInput.typedInput("value")
                );
                const disabledOriginEmpty = $disabledInput.data("base-field-originally-empty");
                const disabledIsBoolLiteral = disabledResult && disabledResult.kind === "literal"
                    && disabledResult.value === false;
                this.disabled = (disabledOriginEmpty && disabledIsBoolLiteral) ? null : disabledResult;
            }
        });
    })();
</script>
<script type="text/html" data-template-name="ui-input">
    <div class="form-row"><label for="node-input-name">Name</label><input type="text" id="node-input-name"></div>
    <hr style="margin: 8px 0;">
    <div class="form-row"><label for="node-input-mount">Parent Slot</label><select id="node-input-mount"></select></div>
    <div class="form-row"><label for="node-input-label">Label</label><input type="text" id="node-input-label"></div>
    <!-- P123 (ADR 0012 / value/display category): Value binding — typedInput managed in oneditprepare/oneditsave. -->
    <div class="form-row"><label for="node-input-valueBinding">Value Path</label><input type="text" id="node-input-valueBinding"></div>
    <div class="form-row"><label for="node-input-storeId">Store ID</label><select id="node-input-storeId"></select></div>
    <div class="form-row"><label for="node-input-path">Store Path</label><input type="text" id="node-input-path"></div>
    <div class="form-row"><label for="node-input-inputType">Input Type</label><select id="node-input-inputType"><option value="text">text</option><option value="email">email</option><option value="number">number</option></select></div>
    <!-- P123 (ADR 0012 / boolean category): Disabled binding — typedInput managed in oneditprepare/oneditsave. -->
    <div class="form-row"><label for="node-input-disabledBinding">Disabled</label><input type="text" id="node-input-disabledBinding"></div>
</script>
<script type="text/html" data-help-name="ui-input">
    <p>Mountet ein einzeiliges Eingabefeld und bindet seinen Wert an den Client-State.</p>
    <h4>Value (P123)</h4>
    <p>Bindbare Quelle des Feldwerts (Anzeige/Initialwert) — voller kanonischer Satz (ADR 0012):
    Store, Query, Route-Param, Reactive, msg, JSONata, string, number, boolean, json, timestamp,
    Flow, Global, Env. Ein bestehender <code>valuePath</code> wird automatisch als
    <code>state</code>-Binding übernommen.</p>
    <h4>Store-Binding</h4>
    <p>Wenn <code>Store ID</code> und <code>Store Path</code> gesetzt sind, schreibt der Knoten
    Nutzeränderungen direkt in den Store zurück.</p>
    <h4>Disabled (P123)</h4>
    <p>Bindbar über den Boolean-Zustand-Satz (ADR 0012): Store, Query, Route-Param, Reactive,
    msg, JSONata, boolean, Flow, Global, Env. Ein Store-Binding deaktiviert das Feld live,
    sobald der Wert truthy ist.</p>
    <h4>Events</h4>
    <p>Emittiert <code>{ event: "change", params: { value } }</code> bei jeder Eingabe und
    <code>{ event: "submit", params: { value } }</code> bei Enter/Submit.</p>
    <p><a href="https://github.com/ollixx/node-red-contrib-webapp/blob/develop/docs/nodes/input/ui-input.md">Ausführliche Doku</a></p>
</script>
