<script type="text/javascript" src="resources/node-red-contrib-webapp/lib/editor-common.js"></script>
<script type="text/javascript">
    (function () {
        const common = window.WebappEditorCommon;

        // P222 (ADR 0015): common base fields. See the applicability table in
        // docs/nodes/concepts/editor.md. `omit` drops a field the node already
        // owns a dedicated control for (avoids duplicate #node-input carrier ids).
        const BASE_FIELDS = {
            visible: true,
            disabled: true,
            color: false,
            size: false,
            variant: false,
            advanced: [],
            omit: ["disabled","size"],
            // P268 (ADR 0042 §3): N/A hints live in the node's OWN locale catalog
            // (nodes/view/locales/<lang>/ui-input.json → `ui-input.hints.<field>`).
            i18nNode: "ui-input"
        };
        common.registerNodeType("ui-input", {
            category: "webapp view",
            color: "#f4efcf",
            defaults: {
                visible: { value: null },
                visibleBinding: { value: "" },
                name: { value: "" },
                app: { value: "" },
                mount: { value: "", required: true },
                // P145 (ADR 0012): `label` persists the binding OBJECT; the
                // typedInput lives directly on #node-input-label so the
                // minimal-coverage E2E check still passes.
                // A legacy plain-string `label` is migrated on open.
                // Required: the typedInput must carry a non-empty value.
                label: {
                    value: { kind: "literal", value: "" },
                    required: true,
                    validate: function () {
                        var el = $("#node-input-label");
                        if (el.length && typeof el.typedInput === "function") {
                            var v = el.typedInput("value");
                            return v !== undefined && v !== null && String(v).length > 0;
                        }
                        // Pre-open (no typedInput yet): trust the persisted binding.
                        var b = this.label;
                        if (b && typeof b === "object") {
                            return b.value !== undefined && b.value !== null && String(b.value).length > 0
                                ? true
                                : (typeof b.path === "string" && b.path.length > 0);
                        }
                        return typeof b === "string" && b.length > 0;
                    },
                    serialize: function () {
                        var el = $("#node-input-label");
                        if (el.length && typeof el.typedInput === "function") {
                            var v = el.typedInput("value");
                            return common.applyValueBinding(el.typedInput("type"), v || "");
                        }
                        // Pre-open (no typedInput yet): trust the persisted binding.
                        var b = this.label;
                        return b && typeof b === "object" ? b : { kind: "literal", value: b || "" };
                    }
                },
                // P123 (ADR 0012): `value` persists the binding OBJECT; there is no
                // matching #node-input-value element so Node-RED auto-save cannot
                // clobber it. The typedInput lives on #node-input-valueBinding.
                // Legacy `valuePath` (pre-P123 plain state path) is kept for migration only.
                value: { value: null },
                valueBinding: { value: "" },
                // P203 (ADR 0027): `writeTo` persists the WRITE half of the value
                // binding — the target the runtime writes the user's edit into on
                // the `writeTrigger` event. It replaces the dead storeId/path pair.
                // Restricted to the writable kinds (store/flow/global). The
                // typedInput lives on #node-input-writeToBinding. Legacy
                // storeId/path are migrated to a writeTo=store binding on open and
                // then dropped (not re-serialised) — see migrationFields below.
                writeTo: { value: null },
                writeToBinding: { value: "" },
                writeTrigger: { value: "submit" },
                inputType: { value: "text", required: true },
                variant: { value: "default" },
                size: { value: "" },
                // P123 (ADR 0012 / boolean category): `disabled` persists the binding
                // OBJECT; there is no matching #node-input-disabled element so
                // Node-RED auto-save cannot clobber it. The typedInput lives on
                // #node-input-disabledBinding.
                disabled: { value: null },
                disabledBinding: { value: "" },
                order: { value: "", validate: function (value) { return value == null || value === "" || RED.validators.number()(value); } },
                row: { value: "", validate: function (value) { return value == null || value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                col: { value: "", validate: function (value) { return value == null || value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                colSize: { value: "", validate: function (value) { return value == null || value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                rowSize: { value: "", validate: function (value) { return value == null || value === "" || (RED.validators.number()(value) && Number(value) >= 1); } },
                layoutX: { value: "", validate: function (value) { return value == null || value === "" || RED.validators.number()(value); } },
                layoutY: { value: "", validate: function (value) { return value == null || value === "" || RED.validators.number()(value); } }
            },
            // P229 (ADR 0038): migration-only legacy fields — injected as hidden
            // defaults at registration so a legacy flow still imports/re-exports
            // them until the open-time migration runs; never written anew.
            migrationFields: ["storeId", "path", "valuePath"],
            inputs: 1,
            outputs: 1,
            outputLabels: function () { return "event"; },
            icon: "font-awesome/fa-i-cursor",
            label: common.labelWithName("ui-input"),
            onadd: function () {
                if (!this.name) {
                    this.name = common.getNextNameDefault("ui-input", "Input");
                }
            },
            oneditprepare: function () {
                common.installReferenceSelectors({ mount: true }).call(this);
                common.installBaseFields(BASE_FIELDS).call(this);
                common.installVariantSelectBox("input").call(this);
                common.installSizeSelectBox().call(this);
                common.installLayoutChildPropRows().call(this);

                // P145 (ADR 0012 / value category): `label` typedInput.
                // The typedInput lives on #node-input-label (not a separate
                // *Binding element) so the convention `fields:["label"]` is satisfied.
                // Migration: a legacy plain-string `label` opens as a `str` literal.
                const storedLabel = common.parseBindingValue(this.label);
                const labelBinding = storedLabel
                    ? storedLabel
                    : (typeof this.label === "string" && this.label.length > 0
                        ? { kind: "literal", value: this.label }
                        : undefined);
                const labelEditor = common.readValueBinding(labelBinding, "");
                const labelInput = $("#node-input-label");
                labelInput.typedInput({
                    default: labelEditor.type,
                    types: common.valueBindingTypes({ category: "display", currentKind: labelEditor.type })
                });
                labelInput.typedInput("type", labelEditor.type);
                labelInput.typedInput("value", labelEditor.value);

                // P123 (ADR 0012 / value/display category): `value` typedInput — full
                // canonical set. Migration: a legacy `valuePath` plain string becomes a
                // state binding; a stored `value` binding object takes precedence.
                const storedValue = common.parseBindingValue(this.value);
                const valueBinding = storedValue
                    ? storedValue
                    : (this.valuePath ? { kind: "state", path: this.valuePath } : undefined);
                const valueEditor = common.readValueBinding(valueBinding, "");
                const valueInput = $("#node-input-valueBinding");
                valueInput.typedInput({
                    default: valueEditor.type,
                    types: common.valueBindingTypes({ category: "value", currentKind: valueEditor.type })
                });
                valueInput.typedInput("type", valueEditor.type);
                valueInput.typedInput("value", valueEditor.value);

                // P203 (ADR 0027 / writable category): `writeTo` typedInput —
                // the WRITE half. Store/Flow/Global only. Migration: a legacy
                // `storeId`+`path` pair opens as
                // writeTo={kind:"store", path:<storeId>, subPath:{kind:"literal", value:<path>}};
                // a stored `writeTo` binding object takes precedence.
                const storedWriteTo = common.parseBindingValue(this.writeTo);
                const writeToBinding = storedWriteTo
                    ? storedWriteTo
                    : (this.storeId
                        ? {
                            kind: "store",
                            path: this.storeId,
                            subPath: this.path ? { kind: "literal", value: this.path } : undefined
                        }
                        : undefined);
                const writeToEditor = common.readValueBinding(writeToBinding, "");
                // Restrict the default type to a writable kind (never a stray str).
                const writeToType = ["store", "flow", "global"].indexOf(writeToEditor.type) !== -1
                    ? writeToEditor.type
                    : "store";
                const writeToInput = $("#node-input-writeToBinding");
                writeToInput.typedInput({
                    default: writeToType,
                    types: common.valueBindingTypes({ category: "writable" })
                });
                writeToInput.typedInput("type", writeToType);
                writeToInput.typedInput("value", writeToEditor.value);
                writeToInput.data("base-field-originally-empty", !writeToBinding);

                // P203/P206: writeTrigger select (none|change|submit, default submit).
                $("#node-input-writeTrigger").val(this.writeTrigger || "submit");

                // P123 (ADR 0012 / boolean category): `disabled` typedInput.
                // No legacy to migrate (new field).
                const storedDisabled = common.parseBindingValue(this.disabled);
                const disabledBinding = storedDisabled ? storedDisabled : undefined;
                const disabledEditor = common.readValueBinding(disabledBinding, "");
                // P181: use 'bool' default when no binding (avoids store fallback).
                const disabledType = disabledEditor.type !== "str" ? disabledEditor.type : "bool";
                const disabledInput = $("#node-input-disabledBinding");
                disabledInput.typedInput({
                    default: disabledType,
                    types: common.valueBindingTypes({ category: "boolean" })
                });
                disabledInput.typedInput("type", disabledType);
                disabledInput.typedInput("value", disabledEditor.value);
                disabledInput.data("base-field-originally-empty", !disabledBinding);
            },
            oneditsave: function () {
                common.applyBaseFields(BASE_FIELDS).call(this);
                // P145: persist label as binding object.
                this.label = common.applyValueBinding(
                    $("#node-input-label").typedInput("type"),
                    $("#node-input-label").typedInput("value")
                );

                // P123: persist value as binding object; clear legacy valuePath.
                this.value = common.applyValueBinding(
                    $("#node-input-valueBinding").typedInput("type"),
                    $("#node-input-valueBinding").typedInput("value")
                );
                common.dropLegacyFields(this, ["valuePath"]);
                // P203 (ADR 0027): persist writeTo as a binding object (or null when
                // the field was left empty), then drop the legacy storeId/path pair
                // so the migrated node never re-serialises them.
                const $writeToInput = $("#node-input-writeToBinding");
                const writeToType = $writeToInput.typedInput("type");
                const writeToValue = $writeToInput.typedInput("value");
                const writeToOriginEmpty = $writeToInput.data("base-field-originally-empty");
                const writeToResult = common.applyValueBinding(writeToType, writeToValue);
                // An empty writable target (no store id / no context key) is "no
                // write-back": persist null, not a hollow binding.
                const writeToHasTarget = writeToResult
                    && ((writeToResult.kind === "store" && writeToResult.path)
                        || ((writeToResult.kind === "flow" || writeToResult.kind === "global") && writeToResult.path));
                this.writeTo = (writeToOriginEmpty && !writeToHasTarget) ? null : (writeToHasTarget ? writeToResult : null);
                this.writeTrigger = $("#node-input-writeTrigger").val() || "submit";
                // P229 (ADR 0038): delete (not blank) so the saved node exports
                // WITHOUT the dead pre-ADR-0027 pair.
                common.dropLegacyFields(this, ["storeId", "path"]);

                // P123: persist disabled as binding object.
                // P181: preserve null when field was originally absent and untouched.
                const $disabledInput = $("#node-input-disabledBinding");
                const disabledResult = common.applyValueBinding(
                    $disabledInput.typedInput("type"),
                    $disabledInput.typedInput("value")
                );
                const disabledOriginEmpty = $disabledInput.data("base-field-originally-empty");
                const disabledIsBoolLiteral = disabledResult && disabledResult.kind === "literal"
                    && disabledResult.value === false;
                this.disabled = (disabledOriginEmpty && disabledIsBoolLiteral) ? null : disabledResult;
            }
        });
    })();
</script>
<!-- P268 (ADR 0042 §3): editor-label i18n. Form-row labels carry data-i18n keys
     per the convention `<node>.label.<field>` (options `<node>.option.<field>.<value>`).
     Catalogs: nodes/view/locales/{en-US,de}/ui-input.json. The literal texts stay
     as the en-US authoring reference; at edit time the catalog text replaces them. -->
<script type="text/html" data-template-name="ui-input">
    <div class="form-row"><label for="node-input-name" data-i18n="node-red:common.label.name">Name</label><input type="text" id="node-input-name"></div>
    <hr style="margin: 8px 0;">
    <div class="form-row"><label for="node-input-mount" data-i18n="ui-input.label.mount">Parent Slot</label><select id="node-input-mount"></select></div>
    <div class="form-row"><label for="node-input-label" data-i18n="ui-input.label.label">Label</label><input type="text" id="node-input-label"></div>
    <!-- P123 (ADR 0012 / value/display category): Value binding (READ) — typedInput managed in oneditprepare/oneditsave. -->
    <div class="form-row"><label for="node-input-valueBinding" data-i18n="ui-input.label.valueBinding">Value</label><input type="text" id="node-input-valueBinding"></div>
    <!-- P203 (ADR 0027 / writable category): writeTo target (WRITE) — Store/Flow/Global; typedInput managed in oneditprepare/oneditsave. -->
    <div class="form-row"><label for="node-input-writeToBinding" data-i18n="ui-input.label.writeToBinding">Write To</label><input type="text" id="node-input-writeToBinding"></div>
    <div class="form-row"><label for="node-input-writeTrigger" data-i18n="ui-input.label.writeTrigger">Write Trigger</label><select id="node-input-writeTrigger"><option value="submit" data-i18n="ui-input.option.writeTrigger.submit">submit</option><option value="change" data-i18n="ui-input.option.writeTrigger.change">change</option><option value="none" data-i18n="ui-input.option.writeTrigger.none">none</option></select></div>
    <div class="form-row"><label for="node-input-inputType" data-i18n="ui-input.label.inputType">Input Type</label><select id="node-input-inputType"><option value="text" data-i18n="ui-input.option.inputType.text">text</option><option value="email" data-i18n="ui-input.option.inputType.email">email</option><option value="number" data-i18n="ui-input.option.inputType.number">number</option></select></div>
    <!-- P123 (ADR 0012 / boolean category): Disabled binding — typedInput managed in oneditprepare/oneditsave. -->
    <div class="form-row"><label for="node-input-disabledBinding" data-i18n="ui-input.label.disabledBinding">Disabled</label><input type="text" id="node-input-disabledBinding"></div>
</script>
<!-- P268 (ADR 0042): help + labels are locale-migrated. Help lives in
     nodes/view/locales/{en-US,de}/ui-input.html; form-row labels carry
     data-i18n keys resolved from nodes/view/locales/{en-US,de}/ui-input.json.
     No inline data-help-name block here. -->
